<script>
/* ============================================================
   QUESTION TEMPLATE  (from Paper_Reading_Notes.xlsx)
   ============================================================ */
const LOCAL=window.LITNOTES_CONFIG||null;            // set when served by the self-hosted server
const AIN=(LOCAL&&LOCAL.ai&&LOCAL.ai.label)||'Claude';
function unavailable(what){return LOCAL?(what==='ai'?'The Ask feature is off. Set ANTHROPIC_API_KEY or OLLAMA_URL on the server to turn it on.':'PDF uploads are not available on this server.'):(what==='ai'?'Ask Claude is available when you open the app in Claude while signed in.':'PDF uploads are available when you open the app in Claude while signed in.')}
const DEFAULT_SECTIONS = [
  {id:'pass1', title:'Pass 1 · Triage', color:'#1F4E79', desc:'10–15 min: abstract, end of intro, headings, conclusion only. Then decide Core / Background / Skip.'},
  {id:'pass2', title:'Pass 2 · Argument', color:'#375623', desc:'About 1 hour: theory, data, methods, main results.'},
  {id:'pass3', title:'Pass 3 · Critique', color:'#7F3F00', desc:'Only for Core papers. Robustness, limitations, over-reaching conclusions.'},
  {id:'research', title:'My Research', color:'#4B2C6F', desc:"Always fill this, even for Background papers. If you can't, you haven't read it for research yet."}
];
const DEFAULT_QUESTIONS = [
 {id:'q1',section:'pass1',text:'What question does the paper answer?',where:'1) Abstract — usually its 2nd or 3rd sentence.\n2) The last 1–2 paragraphs of the Introduction.\nScan for: \'This paper…\', \'We examine / investigate…\', \'The aim of this study…\', \'We ask whether…\'.',how:'1) Find the sentence that states the aim.\n2) Rewrite it as ONE question in your own words.\n3) Make it specific: who, which outcome, which cause or factor.\nStart with: \'Does … affect …?\' or \'How / Why does … ?\'',ex:'Does introducing free school meals increase daily attendance among primary pupils in rural Kenya?\n(Not just \'school meals and attendance\' — it names the cause, the outcome, the group and the place.)',avoid:'Copying the title, or writing a topic instead of a question (\'road safety in Africa\'). If you can\'t phrase it as a question, read the end of the introduction again.'},
 {id:'q2',section:'pass1',text:'Where, when, and at what unit?',where:'Abstract; the first paragraph of the Methods/Data section; table notes; sometimes a map or \'Study area\' subsection.\nScan for: \'study area\', \'participants\', \'sample\', \'data were collected in…\', years like \'2015–2018\'.',how:'Answer three things on one line, separated by ·\n1) WHERE: country / region / setting.\n2) WHEN: the years the data were collected (not the publication year).\n3) UNIT: who or what one row of data is (a person, household, school, district…), and how many.',ex:'Northern Uganda · data collected 2016–2018 (paper published 2021) · 1,200 households in 60 villages, interviewed once a year.',avoid:'Writing the publication year as the study period — data are often several years older than the paper, which matters when you compare studies.'},
 {id:'q3',section:'pass1',text:'Main findings',where:'Abstract (last sentences); the first paragraph of the Conclusion; the \'Results\' summary.\nScan for: \'We find…\', \'Results show…\', \'The main finding…\', \'significantly\', \'increased / reduced by…\'.',how:'Write 2–3 bullets, one finding each.\n1) Give the direction (up / down / no effect) and the size if there is a number.\n2) Add who it applies to, if the paper says.\n3) Include a \'no effect\' finding if there is one — those matter too.\nStart each bullet with: \'X raised / lowered / did not change Y…\'',ex:'• Savings groups raised household savings by about a third after two years.\n• No effect on starting a new business.\n• Effects were larger where groups met weekly than monthly.',avoid:'Copying the abstract word for word. If you can\'t say the finding in your own words, you haven\'t understood it yet — mark it for Q24.'},
 {id:'q4',section:'pass1',text:'What do the authors claim is new?',where:'Introduction — usually the paragraph that begins \'We contribute to…\' or \'This paper adds to…\'; the literature review\'s last paragraph.\nScan for: \'contribute\', \'first study\', \'unlike previous studies\', \'fills a gap\', \'to our knowledge\'.',how:'List 1–3 claimed contributions, numbered.\nFor each, note what is new: a new place, new data, new method, new group, or a different answer.\nIf they argue against a named earlier study, write its name — it is a good reference to chase (Q22).',ex:'1) First study of this policy outside Asia.\n2) Uses hospital records instead of self-reports.\n3) Argues against Smith (2015), who found no effect, saying Smith\'s sample was too small.',avoid:'Accepting \'first study\' claims without a thought. Note it as THEIR claim (\'they say…\'); you can check it later against other papers.'},
 {id:'q5',section:'pass1',text:'Verdict: Core / Background / Skip — why?',where:'Your own judgement after Pass 1 (Q1–Q4). Compare the paper with your own research question.',how:'Pick one:\n• CORE — close to your topic AND you will rely on it: read fully (all passes).\n• BACKGROUND — useful context: finish Pass 2, skip the critique.\n• SKIP — not relevant: one line why, then move on.\nThen give ONE reason.\nStart with: \'Core because…\' / \'Background because…\' / \'Skip because…\'',choices:['Core','Background','Skip'],choiceKey:'verdict',ex:'Core — same outcome (road injuries) in a similar setting (West African city), and its design is one I could copy.',avoid:'Marking everything as Core. Most papers are Background — being selective is what saves you time.'},
 {id:'q6',section:'pass2',text:'Theory: what mechanism or framework explains the relationship?',where:'Literature review / \'Theoretical framework\' / \'Conceptual framework\' section; the hypotheses; the Discussion, where authors explain WHY their results came out as they did.\nScan for: \'theory\', \'mechanism\', \'because\', \'we hypothesise\', \'channel\', \'pathway\'.',how:'1) Name each theory or mechanism (e.g. \'social learning\', \'cost barrier\').\n2) Explain each in ONE plain sentence: how does the cause lead to the effect?\n3) Note which one the authors favour, and the evidence they give.\nStart with: \'X leads to Y because…\'',ex:'Social learning: people copy what their neighbours do. Cost barrier: the programme makes the service cheaper. The authors favour social learning, because households that did NOT join the programme also changed.',avoid:'Only writing the theory\'s name (\'they use the Health Belief Model\'). The name alone won\'t help you later — write what it says in one sentence.'},
 {id:'q7',section:'pass2',text:'Key concepts: how are they defined and grouped?',where:'Introduction and literature review (definitions); Methods/Data section, where the main concepts become variables; footnotes; the appendix or codebook.\nScan for: \'we define\', \'refers to\', \'is measured as\', \'we classify\', \'categories\'.',how:'For each key concept:\n1) Copy the paper\'s definition, in short.\n2) Note whether different types are analysed separately or lumped together.\n3) Compare with how others define it — differences explain why studies disagree.\nStart with: \'[Concept] = …\'',ex:'\'Informal work\' = any job without a written contract or social security. Street vendors and domestic workers are analysed separately; transport workers are lumped into \'other services\'. Narrower than the ILO definition, which includes unregistered firms.',avoid:'Assuming a word means the same in every paper. \'Youth\', \'informal\', \'injury\' and \'poverty\' are defined differently from study to study.'},
 {id:'q8',section:'pass2',text:'Outcome: what is being explained, and how is it measured?',where:'Methods/Data section — look for \'dependent variable\', \'outcome\', \'measures\'; the questionnaire or interview guide (often in the appendix); the notes under the main results table.',how:'Write on one line, separated by ·\n1) WHAT is being explained (the outcome).\n2) SOURCE: survey, interviews, records, observation, existing dataset.\n3) HOW it is coded: yes/no, a count, a scale, themes.\n4) One weakness of the measure (missing cases, self-report, overlap).',ex:'Road traffic injuries · hospital records 2015–2020 · counted per district per month · injuries and deaths reported separately · minor injuries are probably under-recorded because not everyone goes to hospital.',avoid:'Writing only the concept (\'injuries\') without saying how it was measured. Two papers studying \'injuries\' can measure completely different things.'},
 {id:'q9',section:'pass2',text:'Main explanatory factor',where:'Methods section; the hypotheses; the first column of the main results table; the sentence that introduces the model or comparison.\nScan for: \'treatment\', \'exposure\', \'independent variable\', \'we compare\', \'the effect of\'.',how:'1) Name the main factor that varies or is compared (a policy, an intervention, a group, an exposure, a context).\n2) Say what it is compared WITH.\n3) Write it so a non-specialist would understand.\nStart with: \'They compare … with …\'',ex:'Whether a district introduced a helmet law in 2017 (yes/no), compared with districts that did not.',avoid:'Listing every variable in the table. Focus on the ONE factor the paper is about; the others are just controls.'},
 {id:'q10',section:'pass2',text:'Method: how do they build their argument or show cause and effect?',where:'\'Methods\' / \'Research design\' / \'Empirical strategy\' section; the sampling description; the paragraph explaining why the design is credible.\nScan for: \'design\', \'sample\', \'randomly\', \'compare\', \'interviews\', \'case study\', \'identify\', \'assumption\'.',how:'1) Name the design in plain words (experiment, survey, before-and-after comparison, case study, interviews, mixed methods…).\n2) Who or what was sampled, and how many.\n3) Why the authors think their answer is credible.\n4) One way it could fail.\nStart with: \'They compare… Credible if… Could fail if…\'',ex:'Before-and-after comparison of districts with and without the law (difference-in-differences), 48 districts. Credible if both groups followed the same trend before the law — they show this in a figure. Could fail if the law came first to districts that were already improving.',avoid:'Only writing the technical label (\'DiD\', \'thematic analysis\'). Always add the plain-words version and the weak point — that is what you\'ll need when you critique it.'},
 {id:'q11',section:'pass2',text:'Data sources',where:'Methods/Data section; \'Source:\' lines under tables and figures; the appendix; acknowledgements (they often name the funder or data provider).',how:'For each data source:\n1) Its name (and year/round).\n2) What it provides for this paper.\n3) Whether you could get it too (public, on request, private).\nOne line per source.',ex:'• Demographic and Health Survey 2018 — vaccination records for 2,400 children; free after registration.\n• 40 interviews with nurses — not public.',avoid:'Skipping this question. Knowing which datasets exist for your topic is one of the most useful things a literature review gives you.'},
 {id:'q12',section:'pass2',text:'Key results in plain words',where:'The main results table or figure and the paragraphs that describe it; for qualitative work, the main themes with their quotes.\nScan for: \'Table 2 shows…\', percentages, \'percentage points\', \'odds\', \'coefficient\', \'significant\', \'theme\'.',how:'1) Find the headline number (or theme).\n2) Translate it into plain words.\n3) Compare it with a baseline: from what to what?\n4) Say how certain it is (statistically significant? sample size?).\nStart with: \'X changed Y from … to …\'',ex:'Children in the programme were 8 percentage points more likely to be fully vaccinated — from 60% to 68%, which is about 13% higher. Statistically significant, based on 2,400 children.',avoid:'Copying a coefficient (0.083***) without saying what it means. If you can\'t translate it, ask about it (Q24).'},
 {id:'q13',section:'pass2',text:'Measured vs interpreted',where:'Compare the Results section (what was actually measured) with the Discussion/Conclusion (what the authors say it means).',how:'Make two short lists:\n• MEASURED: what the data directly show.\n• INFERRED: what the authors conclude but did not observe.\nThe gap between the two is often where a paper is weakest.',ex:'Measured: fewer road injuries after the helmet law.\nInferred: that riders wore helmets more often — helmet use itself was never observed.',avoid:'Treating the authors\' explanation as a finding. \'They found X\' and \'they think X explains it\' are different.'},
 {id:'q14',section:'pass3',text:'Robustness and credibility checks',where:'\'Robustness\', \'Sensitivity analysis\' or \'Additional analyses\' section; the appendix; for qualitative work, \'triangulation\', \'validation\', \'member checking\'.',how:'1) List the checks they ran (other samples, other measures, other models, removing outliers…).\n2) Note which results stayed the same.\n3) Note any check where the result got weaker or disappeared — that is the important one.',ex:'Results hold when the capital city is dropped, with a second injury dataset and with rainfall as a control. The effect halves when only the last two years are used — so it may be fading.',avoid:'Writing \'results are robust\' because the authors say so. Look for the check where the result changed.'},
 {id:'q15',section:'pass3',text:'Limitations the authors admit',where:'A \'Limitations\' paragraph — usually near the end of the Discussion or just before the Conclusion.\nScan for: \'limitation\', \'caution\', \'cannot rule out\', \'future research should\'.',how:'List the limitations the AUTHORS admit, one short line each.\nNote for each whether it could change the main finding or just narrow it.',ex:'• Income is self-reported.\n• Only urban schools — results may not apply to rural areas.\n• Another reform happened in the same year, so effects could overlap.',avoid:'Mixing in your own criticisms — keep those for Q16, so you know later which limitations the authors accepted.'},
 {id:'q16',section:'pass3',text:'Limitations I see',where:'Your own critical reading. Re-check Q8 (measurement), Q10 (method), Q13 (measured vs inferred) and Q15.',how:'Write 1–3 problems the authors did NOT mention. Common ones to check:\n• Who is missing from the sample?\n• Could something else explain the result?\n• Is the measure reliable (self-report, missing data)?\n• Is the follow-up long enough?\nFor each, say why it matters.',ex:'1) The clinics that joined may already have been better run — so the effect could be partly about the clinics, not the programme.\n2) Only 6 months of follow-up — the effect may fade.',avoid:'Vague criticism like \'the sample is small\'. Say WHY it matters for the conclusion.'},
 {id:'q17',section:'pass3',text:'Do conclusions go beyond the evidence?',where:'Compare the Conclusion / Policy recommendations with what the results (Q12) actually show.',how:'1) Write Yes or No.\n2) If yes, quote or describe the claim that goes too far.\n3) Say what the evidence would actually support.\nStart with: \'Yes — they claim… but the study only shows…\'',ex:'Yes — they recommend a national roll-out, but the study covered only two towns and six months.',avoid:'Skipping this because the paper is published. Over-reaching policy recommendations are very common.'},
 {id:'q18',section:'research',text:'Which part of my framework does this inform?',where:'Your own thinking. Compare the paper with your conceptual framework or causal chain (you can write it in the project\'s Settings → Details).',how:'1) Name the part of your framework this paper speaks to (a link, a variable, a context).\n2) Say what it adds: supports it, challenges it, or adds a missing step.\nStart with: \'This informs the link between … and …: …\'',showChain:true,ex:'The \'enforcement → behaviour change\' link: enforcement raised helmet use, but only near police checkpoints — so my framework needs a step about where enforcement happens.',avoid:'Leaving this empty for Background papers. Even one line linking the paper to your own work makes it much easier to use later.'},
 {id:'q19',section:'research',text:'Support or threat to my contribution?',where:'Compare their question (Q1), their contribution (Q4) and their concepts (Q7) with your own research question.',how:'Choose Support or Threat, then one sentence why.\n• Support: it backs up your argument or leaves your gap open.\n• Threat: it already answers your question, or finds the opposite.\nA threat is useful — you must explain how your work differs.',choices:['Supports','Threatens','Mixed','Neutral'],choiceKey:'support',ex:'Support — same mechanism, but studied in East Africa, so the question is still open for francophone West Africa.',avoid:'Ignoring threatening papers. Reviewers will know them; your work is stronger if you address them directly.'},
 {id:'q20',section:'research',text:'Gap: what is left for me?',where:'Their Conclusion (\'future research should…\'); their limitations (Q15–Q16); differences in definitions (Q7), places (Q2) or methods (Q10) between papers.',how:'Write ONE sentence you could put in your own literature review, starting with \'However…\'.\nGood gaps are specific: a place, a group, a method, a time or a measure no one has covered yet.',ex:'However, no study has examined how helmet laws affect moto-taxi riders in francophone West African cities, where enforcement is informal.',avoid:'Gaps that are too broad (\'more research is needed\'). Name exactly what is missing.'},
 {id:'q21',section:'research',text:'What can I borrow?',where:'Methods, Data and Appendix sections — instruments, scales, coding schemes, models, and how they handled problems.',how:'List anything you could reuse, and where to find it:\n• a questionnaire or scale\n• a way of defining or coding a concept\n• a dataset\n• a method or check\nAlways note the page or appendix, so you can cite it.',ex:'Their 12-item trust-in-police scale (Appendix B, p. 31) and the way they coded interview themes in two rounds (p. 9).',avoid:'Borrowing without noting the source and page — you will need to cite it.'},
 {id:'q22',section:'research',text:'References to chase',where:'Reference list; the literature review; the sentences that say \'unlike X…\' or \'following X…\'.',how:'List 2–5 references worth reading next, with one reason each:\n• the source of a key method or scale\n• a study that found the opposite\n• a review article\n• the classic paper everyone cites',ex:'• Okafor (2019) — original source of the trust scale.\n• Mensah & Ali (2021) — same question, opposite finding.\n• WHO (2018) — the global road-safety report everyone cites.',avoid:'Copying long lists of references. Pick only the ones you will actually read, with a reason.'},
 {id:'q23',section:'research',text:'Key facts or quotes (with page)',where:'Anywhere — especially the abstract, results and conclusion. Tip: in the PDF reader, select the text and choose Add quote, so the citation and page are added for you.',how:'Copy only a few key facts or short quotes you might cite word for word.\nAlways keep the page number.\nAdd a few words on why it is useful.',ex:'“Only 38 percent of respondents reported wearing a helmet on every trip” (Author, 2022, p. 14) — good opening statistic for my introduction.',avoid:'Quoting long passages. In a literature review you mostly paraphrase; keep quotes for striking facts or exact definitions.'},
 {id:'q24',section:'research',text:"What I didn't understand",where:'Anywhere you got stuck while reading.',how:'Write down each term, method or step you didn\'t follow, as a short question.\nThen: look it up, ask your supervisor or a colleague, or use Ask in this app.\nCome back and add the answer once you understand it.',ex:'• What do \'clustered standard errors\' mean, and why cluster by district?\n• Why did they drop the 2019 survey round?',avoid:'Pretending you understood. Listing what you didn\'t understand is normal and is how you learn the methods of your field.'}
];

 (panel with fixed effects, IV, diff-in-diff…) + their argument for why the variation is 'outside' the conflict. Any mineral/period where they admit it may fail?"],q11:['Data sources',"Data section; table/figure notes ('Source:'); acknowledgements",'Name each dataset + what it provides. Could I get it too?'],q12:['Key numbers in plain words',"Main results tables + the results text ('a one standard deviation increase…'); summary statistics table for the baseline average",'Coefficient → what it means (e.g. +0.4 percentage points) → compared to the average (e.g. +26%). Note significance (stars).'],q14:['Robustness checks',"'Robustness' section; Appendix; footnotes in results",'List checks done (other standard errors, dropping minerals/periods, lags, controls…). What did NOT change the results?'],q18:['Which link in my chain does this inform?','Your own thinking — compare with your causal chain (set in the project).','Name the link(s) and what the paper says about them'],q20:['Gap: what is left for me?',"Conclusion ('future research'); their limitations (Q15–16); how they group minerals (Q7)","One sentence you could put in your own paper: 'However, X has not…'"]};

terature review; Methods/Data section where the main concepts or variables are defined; footnotes','List the key concepts or categories and how each is defined. Are different types analysed SEPARATELY or lumped together? Does the definition match how others use it?','\'Informal work\' = any job without a written contract or social security. Street vendors and domestic workers are analysed separately; transport workers are lumped into \'other services\'.'],q8:['Methods/Data section (\'outcome\', \'dependent variable\', \'measures\'); survey questions or interview guide; codebook citations','Source (survey, interviews, records, observation, existing dataset…) · what exactly is measured or observed · how it is coded (yes/no, count, scale, themes) · do categories overlap?','Road traffic injuries from hospital records, 2015–2020 · counted per district per month · injuries and deaths reported separately · minor injuries are probably under-recorded.'],q9:['Methods section; hypotheses; the model or comparison and the sentences that explain it','What varies or is compared (a policy, an intervention, a group, an exposure, a context…)? Write it in plain words.','Whether a district introduced a new policy in 2017 (yes/no), compared with districts that did not.'],q10:['\'Methods\' / \'Research design\' / \'Empirical strategy\' section; sampling description','Design (experiment, survey, panel, case study, interviews, ethnography, mixed methods…) and sample. Why do they think the result is causal or credible? Where might that fail?','Before-and-after comparison of districts with and without the policy (difference-in-differences). Credible if both groups followed the same trend beforehand, which they show in a figure. Could fail if the policy went first to districts that were already improving.'],q11:['Methods/Data section; table/figure notes (\'Source:\'); appendix; acknowledgements','Name each source (dataset, survey, interviews, documents) + what it provides. Could I get or use it too?','National Demographic and Health Survey 2018 (health outcomes; free after registration) · 40 interviews with nurses (not public).'],q12:['Main results tables or figures + the results text; for qualitative work, the main themes and quotes','The main numbers or themes → what they mean in plain words → compared to a baseline, average or other group where possible. How certain are they (significance, sample size, saturation)?','Children in the programme were 8 percentage points more likely to be fully vaccinated (from 60% to 68%, about +13%). Statistically significant, 2,400 children.'],q13:["Results discussion: sentences with 'suggests', 'we interpret', 'likely', 'consistent with'",'What did they actually MEASURE? What do they only INFER (story about why)? Keep these apart.','Measured: fewer injuries after the law. Inferred only: that people wore helmets more — helmet use itself was never observed.'],q14:['\'Robustness\' / \'Sensitivity\' section; Appendix; for qualitative work, triangulation or validation','Checks done (other samples or models, sensitivity tests, triangulation, member checking…). What did NOT change the results?','Results hold when the capital city is dropped, with a second data source and with extra controls. The effect halves in the shorter time window.'],q15:["Conclusion; footnotes; phrases 'one might argue', 'a caveat', 'we cannot', 'future research'",'List them in your words','Income is self-reported; only urban schools; another reform happened in the same year.'],q16:['Your own thinking. Check: measurement, missing data, reporting bias, overlapping categories, alternative explanations, can results generalise?',"At least 2. Ask: 'What else could explain this result?'",'1) The clinics that joined may already have been better run. 2) Only 6 months of follow-up — the effect may fade.'],q17:['Compare the Conclusion/Recommendations section with the actual results','Yes/No + where they over-reach','Yes — they recommend a national roll-out, but the study covered only two towns.'],q18:['Your own thinking — compare with your conceptual framework or causal chain (set in the project).','Name the part(s) and what the paper says about them','The \'enforcement → behaviour change\' link: enforcement raised compliance, but only near checkpoints.'],q19:['Compare their Q1, Q4 and Q7 with your project','Pick one, then one sentence: does it leave room for my study or already do it?','Supports — same mechanism, but in another country, so my setting is still open.'],q20:['Conclusion (\'future research\'); their limitations (Q15–16); how they define key concepts (Q7)','One sentence you could put in your own paper: \'However, X has not…\'','However, no study has examined how this policy affects women-led households in francophone West Africa.'],q21:['Data, Methods, Robustness sections','Data source, questionnaire or instrument, concept definition, unit of analysis, method or model, a check — and cite the paper for it','Their 12-item trust scale (Appendix B) and the way they coded interview themes.'],q22:['Intro + literature review citations; reference list at the end','Only the 2–5 most relevant. Note why each matters.','Okafor (2019) — original source of the trust scale. Mensah and Ali (2021) — same question, opposite finding.'],q23:['Anywhere — often footnotes and the context section','Short, with page number. Cite the ORIGINAL source if the paper is quoting someone else.','“Only 38 percent of respondents reported doing this every time” (Author, 2022, p. 14).'],q24:['Anywhere',"Terms, methods, steps you couldn't follow. Bring these to your supervisor, a colleague or your next reading session.",'What \'clustered standard errors\' means; why they dropped the 2019 survey round.']};
function migrateTemplate(pid){
  const p=S.docs[pid]; if(!p||p.kind!=='project'||(p._qv||0)>=4)return;
  let changed=false;
  if(p.template&&p.template.questions){
    const D=Object.fromEntries(DEFAULT_QUESTIONS.map(q=>[q.id,q]));
    p.template.questions.forEach(q=>{const o=OLD_Q[q.id];if(!o)return;
      if(q.text===o[0]){q.text=D[q.id].text;changed=true}
      if(q.where===o[1]){q.where=D[q.id].where;changed=true}
      if(q.how===o[2]){q.how=D[q.id].how;changed=true}});
    p.template.questions.forEach(q=>{const d=D[q.id],o=OLD_Q2[q.id];if(!d)return;
      if(o){if(q.where===o[0]){q.where=d.where;changed=true}if(q.how===o[1]){q.how=d.how;changed=true}if(q.ex===o[2]){q.ex=d.ex;changed=true}}
      if(q.text===d.text){if(q.ex===undefined&&d.ex){q.ex=d.ex;changed=true}if(q.avoid===undefined&&d.avoid){q.avoid=d.avoid;changed=true}}});
  }
  if(p.template&&p.template.sections){const s2=p.template.sections.find(z=>z.id==='pass2');if(s2&&s2.desc==='About 1 hour: theory, data, methods, main results tables.'){s2.desc='About 1 hour: theory, data, methods, main results.';changed=true}}
  if(p.chain===OLD_CHAIN){p.chain='';changed=true}
  p._qv=4; delete p._genericQ; if(changed)save(pid);
}

function defaultTemplate(){return {sections:JSON.parse(JSON.stringify(DEFAULT_SECTIONS)),questions:JSON.parse(JSON.stringify(DEFAULT_QUESTIONS))};}

const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const REF_TYPES={
  journal:{label:'Journal article',fields:['journal','volume','issue','pages','articleNo','doi','url'],req:['journal','volume'],date:'year'},
  book:{label:'Book (whole book)',fields:['editors','edition','publisher','doi','url'],req:['publisher'],date:'year'},
  chapter:{label:'Chapter in an edited book',fields:['editors','bookTitle','edition','pages','publisher','doi','url'],req:['editors','bookTitle','pages','publisher'],date:'year'},
  report:{label:'Report (government, NGO, organisation)',fields:['reportNo','publisher','doi','url'],req:['url'],date:'full'},
  conference:{label:'Conference paper / presentation',fields:['presType','conference','location','url'],req:['conference','location'],date:'range'},
  thesis:{label:'Thesis or dissertation',fields:['degree','institution','published','database','url'],req:['institution'],date:'year'},
  web:{label:'Webpage / online document',fields:['site','url','retrieved'],req:['url'],date:'full'}
};
const REF_FIELDS={
  journal:{label:'Journal name',ph:'e.g. Accident Analysis & Prevention',hint:'Full journal name, as printed (title case).'},
  volume:{label:'Volume',ph:'e.g. 152'},
  issue:{label:'Issue',ph:'e.g. 3'},
  pages:{label:'Pages',ph:'e.g. 105–118'},
  articleNo:{label:'Article number',ph:'e.g. 105981',hint:'Use instead of pages for online-only articles.'},
  doi:{label:'DOI',ph:'e.g. 10.1016/j.aap.2021.105981',hint:'Paste it in any form; it is formatted as https://doi.org/…'},
  url:{label:'URL',ph:'https://…',hint:'APA uses the URL only when there is no DOI.'},
  edition:{label:'Edition',ph:'e.g. 2  (leave empty for 1st)'},
  publisher:{label:'Publisher',ph:'e.g. Routledge',hint:'Left out automatically when it is the same as the author.'},
  bookTitle:{label:'Book title',ph:'Title of the edited book'},
  reportNo:{label:'Report number',ph:'e.g. Report No. 123'},
  presType:{label:'Type',options:['Paper presentation','Poster presentation','Conference session','Keynote address']},
  conference:{label:'Conference name',ph:'e.g. Transport Research Arena 2024'},
  location:{label:'Location',ph:'e.g. Dublin, Ireland'},
  degree:{label:'Degree type',options:["Doctoral dissertation","Master's thesis","Bachelor's thesis"]},
  institution:{label:'University / institution',ph:'e.g. University of Buea'},
  published:{label:'Published in a database or archive',check:true},
  database:{label:'Database or archive name',ph:'e.g. ProQuest Dissertations and Theses Global'},
  site:{label:'Website name',ph:'e.g. World Health Organization',hint:'Left out automatically when it is the same as the author.'},
  retrieved:{label:'Retrieved on (only for pages designed to change)',type:'date'}
};
function newRef(){return {type:'journal',authors:[{family:'',given:'',org:false}],editors:[],year:'',month:'',day:'',dayEnd:'',title:'',presType:'Paper presentation',degree:"Doctoral dissertation",published:true}}
const trim=s=>(s||'').trim();
const endDot=s=>{s=trim(s);return !s?'':/[.?!]$/.test(s)?s:s+'.'};
function initials(given){
  return trim(given).split(/\s+/).filter(Boolean).map(tok=>tok.split('-').map(p=>{p=p.replace(/\./g,'');return p?p[0].toUpperCase()+'.':''}).filter(Boolean).join('-')).join(' ');
}
const validPeople=list=>(list||[]).filter(a=>trim(a.family));
function personRef(a){if(a.org)return trim(a.family);const i=initials(a.given);return trim(a.family)+(i?', '+i:'')}
function personEd(a){if(a.org)return trim(a.family);const i=initials(a.given);return (i?i+' ':'')+trim(a.family)}
function joinApa(arr,amp){
  if(arr.length===0)return '';
  if(arr.length===1)return arr[0];
  if(arr.length===2)return amp==='ref'?`${arr[0]}, & ${arr[1]}`:`${arr[0]} & ${arr[1]}`;
  return arr.slice(0,-1).join(', ')+', & '+arr[arr.length-1];
}
function authorList(list){
  const p=validPeople(list).map(personRef);
  if(p.length>=21) return p.slice(0,19).join(', ')+', . . . '+p[p.length-1];
  return joinApa(p,'ref');
}
function doiUrl(d){d=trim(d);if(!d)return '';d=d.replace(/^(https?:\/\/)?(dx\.)?doi\.org\//i,'').replace(/^doi:\s*/i,'');return 'https://doi.org/'+d}
const dash=s=>trim(s).replace(/\s*[-–—]+\s*/g,'–');
function ordinal(n){const v=parseInt(n,10);if(!v)return trim(n);const s=['th','st','nd','rd'],m=v%100;return v+(s[(m-20)%10]||s[m]||s[0])}
function edition(e){e=trim(e);if(!e||/^1(st)?$/i.test(e))return '';if(/^\d+$/.test(e))return ordinal(e)+' ed.';return e.replace(/\s*edition$/i,' ed.')}
function refDate(r){
  const y=trim(r.year)||'n.d.';
  const kind=(REF_TYPES[r.type]||{}).date;
  const m=parseInt(r.month,10);
  if((kind==='full'||kind==='range')&&m&&y!=='n.d.'){
    let s=`${y}, ${MONTHS[m-1]}`;
    if(trim(r.day)) s+=' '+trim(r.day)+(kind==='range'&&trim(r.dayEnd)?'–'+trim(r.dayEnd):'');
    return s;
  }
  return y;
}
const H=s=>esc(s);
const I=s=>s?`<i>${esc(s)}</i>`:'';
function sameAsAuthor(r,name){const a=validPeople(r.authors);return a.length===1&&a[0].org&&trim(a[0].family).toLowerCase()===trim(name).toLowerCase()}
function link(r){const d=doiUrl(r.doi);if(d)return H(d);return trim(r.url)?H(trim(r.url)):''}
/* returns HTML with <i> for italics */
function apaHTML(r){
  if(!r)return '';
  const t=REF_TYPES[r.type]?r.type:'journal';
  const edOnly=t==='book'&&!validPeople(r.authors).length&&validPeople(r.editors).length;
  const auth=edOnly?authorList(r.editors)+` (${validPeople(r.editors).length>1?'Eds.':'Ed.'})`:authorList(r.authors);
  const date=`(${H(refDate(r))}).`;
  const italicTitle=['book','report','conference','thesis','web'].includes(t);
  let titlePart='';
  // title + bracketed / parenthetical descriptors
  if(t==='journal'||t==='chapter'){ titlePart=H(endDot(r.title)); }
  else if(t==='book'){ const ed=edition(r.edition); titlePart=I(trim(r.title))+(ed?` (${H(ed)})`:'')+'.'; }
  else if(t==='report'){ titlePart=I(trim(r.title))+(trim(r.reportNo)?` (${H(trim(r.reportNo))})`:'')+'.'; }
  else if(t==='conference'){ titlePart=I(trim(r.title))+` [${H(r.presType||'Paper presentation')}].`; }
  else if(t==='thesis'){ const deg=r.degree||'Doctoral dissertation';const inst=trim(r.institution);
    const label=r.published===false?'Unpublished '+deg.charAt(0).toLowerCase()+deg.slice(1):deg;
    titlePart=I(trim(r.title))+` [${H(label)}${inst?', '+H(inst):''}].`; }
  else if(t==='web'){ titlePart=I(trim(r.title))+'.'; }
  if(t!=='journal'&&t!=='chapter'&&!trim(r.title)) titlePart='';
  // source
  let src='';
  if(t==='journal'){
    const j=trim(r.journal),v=trim(r.volume),i=trim(r.issue),pg=trim(r.pages)?dash(r.pages):(trim(r.articleNo)?'Article '+trim(r.articleNo):'');
    let s=j?I(j):'';
    if(v) s+=(s?', ':'')+I(v)+(i?`(${H(i)})`:'');
    else if(i) s+=(s?', ':'')+`(${H(i)})`;
    if(pg) s+=(s?', ':'')+H(pg);
    src=s?s+'.':'';
  }else if(t==='book'){
    const p=trim(r.publisher); src=p&&!sameAsAuthor(r,p)?H(endDot(p)):'';
  }else if(t==='chapter'){
    const eds=validPeople(r.editors);
    const edStr=eds.length?`In ${H(joinApa(eds.map(personEd),'in'))} (${eds.length>1?'Eds.':'Ed.'}), `:'In ';
    const ed=edition(r.edition);const pg=trim(r.pages);
    const paren=[ed,pg?(pg.match(/[-–—]/)?'pp. ':'p. ')+dash(pg):''].filter(Boolean).join(', ');
    src=edStr+I(trim(r.bookTitle))+(paren?` (${H(paren)})`:'')+'.';
    const p=trim(r.publisher); if(p) src+=' '+H(endDot(p));
  }else if(t==='report'){
    const p=trim(r.publisher); src=p&&!sameAsAuthor(r,p)?H(endDot(p)):'';
  }else if(t==='conference'){
    src=[trim(r.conference),trim(r.location)].filter(Boolean).map(H).join(', '); src=src?src+'.':'';
  }else if(t==='thesis'){
    src=r.published!==false&&trim(r.database)?H(endDot(r.database)):'';
  }else if(t==='web'){
    const s=trim(r.site); src=s&&!sameAsAuthor(r,s)?H(endDot(s)):'';
  }
  // link
  let lk=link(r);
  if(t==='web'&&trim(r.retrieved)&&trim(r.url)){ const d=new Date(r.retrieved+'T00:00:00'); lk=`Retrieved ${MONTHS[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}, from ${H(trim(r.url))}`; }
  // assemble (no author → title moves to the front)
  const parts=[];
  if(auth){ parts.push(H(endDot(auth)),date,titlePart); }
  else { parts.push(titlePart||'[Untitled].',date); }
  parts.push(src,lk);
  return parts.filter(Boolean).join(' ').replace(/\s+/g,' ').trim();
}
const apaText=r=>{const d=document.createElement('div');d.innerHTML=apaHTML(r);return d.textContent};
const apaMd=r=>apaHTML(r).replace(/<i>(.*?)<\/i>/g,'*$1*').replace(/<[^>]+>/g,'').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'");
function shortTitle(r){const w=trim(r.title).split(/\s+/);return w.slice(0,4).join(' ')+(w.length>4?'…':'')}
function inText(r){
  if(!r)return {paren:'',narr:''};
  const a=validPeople(r.authors).length||r.type!=='book'?validPeople(r.authors):validPeople(r.editors), y=trim(r.year)||'n.d.';
  let p,n;
  if(!a.length){const st=shortTitle(r);const q=['journal','chapter'].includes(r.type)?`"${st}"`:`<i>${esc(st)}</i>`;p=n=q}
  else if(a.length===1){p=n=esc(trim(a[0].family))}
  else if(a.length===2){p=`${esc(trim(a[0].family))} &amp; ${esc(trim(a[1].family))}`;n=`${esc(trim(a[0].family))} and ${esc(trim(a[1].family))}`}
  else {p=n=`${esc(trim(a[0].family))} et al.`}
  return {paren:`(${p}, ${esc(y)})`,narr:`${n} (${esc(y)})`};
}
function missingFields(r){
  const miss=[];
  if(!validPeople(r.authors).length&&!(r.type==='book'&&validPeople(r.editors).length)) miss.push('author (or leave empty only if there truly is none)');
  validPeople(r.authors).concat(validPeople(r.editors)).filter(a=>!a.org&&!trim(a.given)).forEach(a=>miss.push('first name(s) of '+trim(a.family)));
  if(!trim(r.year)) miss.push('year (otherwise shown as n.d.)');
  if(!trim(r.title)) miss.push('title');
  (REF_TYPES[r.type]||REF_TYPES.journal).req.forEach(f=>{
    if(f==='editors'){ if(!validPeople(r.editors).length) miss.push('editor(s)'); }
    else if(f==='url'&&r.type==='report'){ if(!trim(r.url)&&!trim(r.doi)) miss.push('DOI or URL'); }
    else if(!trim(r[f])) miss.push(REF_FIELDS[f].label.toLowerCase());
  });
  if(r.type==='journal'&&!trim(r.pages)&&!trim(r.articleNo)) miss.push('pages or article number');
  if(r.type==='journal'&&!trim(r.doi)&&!trim(r.url)) miss.push('DOI (if the article has one)');
  if(r.type==='thesis'&&r.published!==false&&!trim(r.database)&&!trim(r.url)) miss.push('database or URL');
  return miss;
}
function sentenceCase(s){
  let first=true;
  return (s||'').split(/(\s+)/).map(w=>{
    if(/^\s+$/.test(w)||!w)return w;
    let out=w;
    const isAcr=/^[A-Z0-9][A-Z0-9\-&]+[,:;.?!]?$/.test(w)&&/[A-Z]/.test(w.replace(/^[A-Z]/,''));
    if(!isAcr) out=first?w.charAt(0).toUpperCase()+w.slice(1).toLowerCase():w.toLowerCase();
    first=/[:?!]$/.test(w)||/^[-–—]$/.test(w);
    return out;
  }).join('');
}
/* sync the short display fields used across the app */
function syncFromRef(x){
  const r=x.ref; if(!r)return;
  x.title=trim(r.title);
  const a=validPeople(r.authors);
  x.authors=!a.length?'':a.length===1?trim(a[0].family):a.length===2?`${trim(a[0].family)} & ${trim(a[1].family)}`:`${trim(a[0].family)} et al.`;
  x.year=trim(r.year);
  x.citation=apaText(r);
}
function migrateRef(x){
  if(x.ref)return;
  x.ref=newRef(); x.ref.title=x.title||''; x.ref.year=x.year||'';
  if(trim(x.authors)) x.ref.authors=[{family:trim(x.authors),given:'',org:true}];
  x.oldCitation=x.citation||'';
}

/* ---------- PDF attachments (stored as artifact assets) ---------- */
const PDF_MAX=((window.LITNOTES_CONFIG&&window.LITNOTES_CONFIG.maxUploadMb)||20)*1024*1024;
let _assets, PDF_OK; const UP=new Set();
async function getAssets(){
  if(_assets!==undefined)return _assets;
  try{for(let i=0;i<30&&!(window.claude&&window.claude.use);i++)await new Promise(r=>setTimeout(r,100));_assets=window.claude?await window.claude.use('assets'):null}catch(e){_assets=null}
  PDF_OK=!!_assets; return _assets;
}
const fmtSize=b=>!b?'':b<1024*1024?Math.max(1,Math.round(b/1024))+' KB':(b/1024/1024).toFixed(1)+' MB';
const pdfUrl=p=>'/_blob/'+p.id;
function checkPdf(f){
  if(!f)return 'No file selected.';
  if(!(f.type==='application/pdf'||/\.pdf$/i.test(f.name)))return 'Please choose a PDF file.';
  if(f.size>PDF_MAX)return `This PDF is ${fmtSize(f.size)} — the limit is ${Math.round(PDF_MAX/1048576)} MB.`;
  return '';
}
function assetErr(e){
  return ({too_large:'This PDF is larger than 20 MB.',unsupported_type:'That file is not a valid PDF.',quota_or_state:'PDF storage is full — remove some PDFs and try again.',rate_limited:'Too many uploads at once — try again in a moment.',upstream_auth:'Please reload the page and try again.',not_granted:'PDF uploads are not available in this view.',capability_disabled:'PDF uploads are not available in this view.'})[e&&e.code]||'Upload failed — please try again.';
}
function refreshPdfUI(id){ if(V.view==='paper'&&V.paperId===id){if(V.split&&!(S.docs[id]&&S.docs[id].pdf)){V.split=false;persistView();renderMain();return}const b=$('#pdfBox');if(b)b.innerHTML=pdfBoxHTML(S.docs[id]);const t=$('#pdfTool');if(t)t.innerHTML=pdfToolHTML(S.docs[id])} renderSide(); }
async function attachPdf(id,file){
  const err=checkPdf(file); if(err){toast(err);return}
  const a=await getAssets(); if(!a){toast(unavailable('pdf'));return}
  UP.add(id); refreshPdfUI(id);
  try{
    let res;
    try{res=await a.upload(file,{type:'application/pdf'})}
    catch(e){if(e&&e.code==='store_unavailable'){await new Promise(r=>setTimeout(r,1200));res=await a.upload(file,{type:'application/pdf'})}else throw e}
    const x=S.docs[id]; if(!x){a.delete(res.id).catch(()=>{});return}
    const old=x.pdf;
    if(x.pdfOrig){a.delete(x.pdfOrig.id).catch(()=>{});delete x.pdfOrig}
    if((x.highlights||[]).length){x.highlights=[];x.hlDirty=false}
    x.pdf={id:res.id,name:file.name,size:res.sizeBytes||file.size,addedAt:Date.now()};
    save(id); toast(old?'PDF replaced':'PDF attached');
    if(old&&old.id&&old.id!==res.id) a.delete(old.id).catch(()=>{}); // replaced by the user's own action
  }catch(e){toast(assetErr(e))}
  finally{UP.delete(id);refreshPdfUI(id);if(V.view!=='paper')renderMain()}
}
async function removePdfAsset(x){ if(!x||!x.pdf)return; const a=await getAssets(); if(a){try{await a.delete(x.pdf.id)}catch(e){}if(x.pdfOrig){try{await a.delete(x.pdfOrig.id)}catch(e){}}} }

  if(!el)return;
  ['dragenter','dragover'].forEach(t=>el.addEventListener(t,e=>{e.preventDefault();el.classList.add('over')}));

    ov.querySelectorAll('[data-pk]').forEach(el=>{
      const h=()=>{const a=w[el.dataset.pk][+el.dataset.i];if(el.dataset.k==='org'){a.org=el.value==='1';draw();return}a[el.dataset.k]=el.value;preview()};
      el.addEventListener('input',h); if(el.tagName==='SELECT') el.addEventListener('change',h);
    });
    ov.querySelectorAll('[data-padd]').forEach(b=>b.onclick=()=>{const k=b.dataset.padd;w[k]=w[k]||[];w[k].push({family:'',given:'',org:false});draw();const ins=ov.querySelectorAll(`[data-pk="${k}"][data-k="family"]`);ins[ins.length-1].focus()});
    ov.querySelectorAll('[data-pdel]').forEach(b=>b.onclick=()=>{w[b.dataset.pdel].splice(+b.dataset.i,1);draw()});
    ov.querySelectorAll('[data-pmove]').forEach(b=>b.onclick=()=>{const L=w[b.dataset.pmove],i=+b.dataset.i;[L[i-1],L[i]]=[L[i],L[i-1]];draw()});
    const lq=ov.querySelector('#lookQ'); lq.addEventListener('input',()=>{lookQ=lq.value}); lq.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();runLookup()}});
    lq.addEventListener('paste',()=>setTimeout(()=>{lookQ=lq.value;if(doiFrom(lookQ)||isLink(lookQ))runLookup()},30));
    ov.querySelector('[data-lookup]').onclick=runLookup;
    ov.querySelector('[data-sc]').onclick=()=>{w.title=sentenceCase(w.title);ov.querySelector('[data-rf="title"]').value=w.title;preview()};
    const bindPdf=()=>{
      const z=ov.querySelector('#pdfZone'); if(!z)return;
      const setFile=f=>{const e=checkPdf(f);if(e){toast(e);return}pdfFile=f;fill=null;
        if(!trim(w.title)&&!validPeople(w.authors).length) runFill({file:f}); else {z.innerHTML=pdfZone();bindPdf()}};
      const fb=z.querySelector('[data-pdffill]'); if(fb) fb.onclick=()=>runFill(fb.dataset.pdffill==='new'?{file:pdfFile}:{url:pdfUrl(pdf.current)});
      const pk=z.querySelector('[data-pdfpick]'); if(pk){pk.onclick=()=>pickFile(setFile);bindDrop(pk,setFile)}
      const cl=z.querySelector('[data-pdfclear]'); if(cl) cl.onclick=()=>{pdfFile=null;z.innerHTML=pdfZone();bindPdf()};
    };
    bindPdf();
    ov.querySelector('[data-x]').onclick=()=>ov.remove();
    ov.querySelector('[data-ok]').onclick=()=>{
      const T=REF_TYPES[w.type];
      // keep only fields relevant to the chosen type (plus core ones)
      const keep=new Set(['type','authors','year','month','day','dayEnd','title',...T.fields]);
      Object.keys(w).forEach(k=>{if(!keep.has(k))delete w[k]});
      if(T.date==='year'){delete w.month;delete w.day;delete w.dayEnd}
      w.authors=(w.authors||[]).filter(a=>trim(a.family)); if(w.editors) w.editors=w.editors.filter(a=>trim(a.family));
      ov.remove(); onSave(w,pdfFile,webSnap&&(w.url||webSnap.url)?webSnap:null);
    };
  };
  draw();
}
async function copyRich(html,text,msg){
  try{
    if(window.ClipboardItem&&navigator.clipboard.write){
      await navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([html],{type:'text/html'}),'text/plain':new Blob([text],{type:'text/plain'})})]);
      toast(msg||'Copied with formatting');return;
    }
  }catch(e){}

}

/* ============================================================
   STORAGE  (account db when available, else this browser)
   ============================================================ */
const S = {mode:'loading', docs:{}, pending:new Set(), col:null, chains:{}, timers:{}};
const LKEY='litnotes.v1';
function lsGet(){try{return JSON.parse(localStorage.getItem(LKEY)||'{}')}catch(e){return {}}}
function lsSet(o){try{localStorage.setItem(LKEY,JSON.stringify(o));return true}catch(e){return false}}
const clone=o=>JSON.parse(JSON.stringify(o));
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,7);

function setStatus(){
  const el=document.getElementById('storeStatus'); if(!el)return;
  const pend=S.pending.size;
  let h;
  if(S.mode==='db') h=`<span class="dot ${pend?'warn':''}"></span>${LOCAL?'Saved on your server':'Synced to your account'}`;
  else if(S.mode==='local') h=`<span class="dot warn"></span>Saved in this browser only`;
  else if(S.mode==='loading') h=`<span class="dot warn"></span>Connecting…`;
  else h=`<span class="dot off"></span>Offline — back up your data`;
  setHTML(el,h);
}
async function initStore(){
  let db=null,user=null;
  const loadTimer=setTimeout(()=>{ if(S.mode==='loading'){ useLocal(); toast('Could not reach your account yet — using this browser.'); } },10000);
  try{
    for(let i=0;i<30&&!(window.claude&&typeof window.claude.use==='function');i++) await new Promise(r=>setTimeout(r,100));
    if(window.claude && typeof window.claude.use==='function'){
      [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    }
  }catch(e){db=null}
  let id=null;
  if(db&&user){try{id=await user.id()}catch(e){id=null}}
  if(!db||!id){clearTimeout(loadTimer);useLocal();return}
  S.col=db.collection('data/users/'+id);
  S.col.onSnapshot(snap=>{
    clearTimeout(loadTimer);
    if(S.mode!=='db'){
      // first contact: if we had fallen back to local, migrate local docs up
      const wasLocal=S.mode==='local'; S.mode='db';
      if(wasLocal){ const loc=lsGet(); Object.keys(loc).forEach(k=>{ if(!snap.docs.find(d=>d.id===k)){S.docs[k]=loc[k];queueWrite(k)} }); }
    }
    const seen=new Set();
    snap.docs.forEach(d=>{seen.add(d.id); if(!S.pending.has(d.id)) S.docs[d.id]=clone(d.data());});
    Object.keys(S.docs).forEach(k=>{ if(!seen.has(k)&&!S.pending.has(k)) delete S.docs[k]; });
    setStatus(); onData();
  },err=>{
    clearTimeout(loadTimer);
    if(S.mode==='loading'){useLocal()} else {S.mode='off';setStatus();toast('Lost connection to storage. Back up your data.')}
  });
}
function useLocal(){
  if(S.mode==='db')return;
  S.mode='local'; S.docs=Object.assign(lsGet(),S.docs); setStatus(); onData();
}
function queueWrite(id){
  S.pending.add(id); setStatus();
  const prev=S.chains[id]||Promise.resolve();
  S.chains[id]=prev.then(async()=>{
    const data=S.docs[id];
    try{
      if(S.mode==='db'&&S.col){
        const ref=S.col.doc(id);
        if(data) await ref.set(data); else await ref.delete();
      }else{
        const all=lsGet(); if(data) all[id]=data; else delete all[id];
        if(!lsSet(all)) throw {code:'local'};
      }
    }catch(e){
      if(e&&e.code==='unavailable'){ await new Promise(r=>setTimeout(r,800+Math.random()*800)); try{ const ref=S.col.doc(id); if(data) await ref.set(data); else await ref.delete(); }catch(e2){toast('Save failed — please back up your data.')} }
      else if(e&&e.code==='quota_exceeded') toast('Storage is full — delete some items or back up.');
      else toast('Save failed — please back up your data.');
    }
  }).finally(()=>{ if(S.chains[id]===p) {S.pending.delete(id); setStatus();} });
  const p=S.chains[id];
}
function save(id,delay){
  if(S.docs[id]) S.docs[id].updatedAt=Date.now();
  clearTimeout(S.timers[id]);
  S.pending.add(id); setStatus();
  if(delay){ S.timers[id]=setTimeout(()=>queueWrite(id),delay); } else queueWrite(id);
}
function remove(id){ delete S.docs[id]; clearTimeout(S.timers[id]); queueWrite(id); }

const projects=()=>Object.entries(S.docs).filter(([k,v])=>v&&v.kind==='project').map(([k,v])=>({id:k,...v})).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
const papersOf=pid=>Object.entries(S.docs).filter(([k,v])=>v&&v.kind==='paper'&&v.projectId===pid).map(([k,v])=>({id:k,...v})).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
const tpl=pid=>{if(S.docs[pid]&&S.docs[pid].kind==='project'&&(S.docs[pid]._qv||0)<4)migrateTemplate(pid);return (S.docs[pid]&&S.docs[pid].template)||defaultTemplate()};

function go(o){if(typeof CR!=='undefined'&&CR.full){CR.full=false;document.body.classList.remove('imfullon')}if(typeof IM!=='undefined'&&IM.full){IM.full=false;document.body.classList.remove('imfullon');if(document.fullscreenElement)document.exitFullscreen().catch(()=>{})}Object.assign(V,o);persistView();document.getElementById('side').classList.remove('show');closeSearch();const qi=document.getElementById('q');if(qi&&document.activeElement!==qi)qi.value='';render();window.scrollTo(0,0)}

function onData(){
  renderSide();
  if(V.view==='paper'){
    if(!S.docs[V.paperId]) {go({view:V.pid&&S.docs[V.pid]?'project':'home'});return}
    if(!document.getElementById('paperEditor')) renderMain();
    return; // never clobber an open editor
  }
  if(V.view==='draft'){
    if(!S.docs[V.draftId]){go({view:V.pid&&S.docs[V.pid]?'project':'home'});return}
    if(!document.getElementById('draftEditor')) renderMain(); else {const nb=$('#nbrowse');if(nb&&!nb.contains(document.activeElement)){const h=browserHTML();if(nb._html!==h){const st=(nb.querySelector('.nlist')||{}).scrollTop;nb.innerHTML=h;nb._html=h;const l=nb.querySelector('.nlist');if(l&&st)l.scrollTop=st}}}
    return;
  }
  if(V.view==='project'&&!S.docs[V.pid]){go({view:'home'});return}
  const m=$('#main'), a=document.activeElement;
  if(m&&a&&m.contains(a)&&(a.matches('input,textarea,select')||a.isContentEditable))return;   // don't disturb typing
  renderMain(true);
}

function answered(p,q){const a=(p.answers||{})[q.id];const c=q.choiceKey?(p[q.choiceKey]||''):'';return !!((a&&a.trim())||c)}
function progress(p,t){const qs=t.questions.filter(q=>!(p.verdict==='Skip'&&(q.section==='pass2'||q.section==='pass3')));const n=qs.filter(q=>answered(p,q)).length;return {n,total:qs.length,pct:qs.length?Math.round(n*100/qs.length):0}}

function modal(html,wide){
  const ov=document.createElement('div');ov.className='ov';
  ov.innerHTML=`<div class="modal ${wide?'wide':''}">${html}</div>`;
  // clicking outside closes the dialog — unless you have typed something in it, so nothing you wrote is lost
  ov.addEventListener('input',()=>{ov._dirty=true});
  ov.addEventListener('mousedown',e=>{if(e.target!==ov)return;if(ov._dirty){const m=ov.querySelector('.modal');m.classList.remove('nudge');void m.offsetWidth;m.classList.add('nudge');if(!ov._told){ov._told=true;toast('Your text is kept — use Cancel to close without saving')}return}ov.remove()});
  document.body.appendChild(ov);
  const f=ov.querySelector('input,textarea');if(f)setTimeout(()=>f.focus(),30);
  return ov;
}

  if(!ps.length) return `<section class="banner"><div><div class="eyebrow">Welcome</div><h1>Turn every paper into structured insight</h1><p>Create a project for your review, add the literature you read, and work through three guided reading passes. Reports and APA references are generated for you.</p><div class="row"><button class="btn pri" data-act="newProject">${ico('plus')}Create your first project</button></div></div><div class="ring">${ring(0,132,12,theme()!=='aurora')}<div class="v"><div><b>0%</b><small>questions answered</small></div></div></div></section>
  <div class="steps">
    <div><span class="num">1</span><b>Create a project</b><span>One project per review, chapter or thesis.</span></div>
    <div><span class="num">2</span><b>Add literature</b><span>Enter the reference details once — the APA 7 citation is built for you.</span></div>
    <div><span class="num">3</span><b>Read in passes</b><span>Triage, argument, critique, then link it to your own research.</span></div>
    <div><span class="num">4</span><b>Compare &amp; report</b><span>Read across papers, export notes and a reference list.</span></div>
  </div>`;
  let n=0,tot=0;all.forEach(x=>{const g=progress(x,tpl(x.projectId));n+=g.n;tot+=g.total});
  const pct=tot?Math.round(n*100/tot):0;
  const last=V.lastPaper&&S.docs[V.lastPaper]&&S.docs[V.lastPaper].kind==='paper'?{id:V.lastPaper,...S.docs[V.lastPaper]}:all.slice().sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0))[0];
  const core=all.filter(x=>x.verdict==='Core').length;
  const toDiscuss=all.filter(x=>trim((x.answers||{}).q24)).length;
  const cont=all.filter(x=>nextStage(x,tpl(x.projectId))).sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0)).slice(0,6);
  const lt=last?nextStage(last,tpl(last.projectId)):null;
  return `<section class="banner">
    <div><div class="eyebrow">${greeting()}</div>
    <h1>${last?'Pick up where you left off':'Your reading desk is ready'}</h1>
    <p>${last?`<b>${esc(paperTitle(last))}</b>${last.authors?' — '+esc(last.authors):''}. ${lt?`Next up: ${esc(lt.title)}.`:'All questions answered — time for the report.'}`:'Add your first paper to start taking structured notes.'}</p>
    <div class="row">${last?`<button class="btn pri" data-act="resume" data-id="${last.id}">${ico('play')}Resume reading</button>`:''}</div>
    <div class="minis">${[['star','Core papers',core],['help','Questions to discuss',toDiscuss]].map(([i,l,v])=>`<span>${ico(i)}<b>${v}</b> ${l.toLowerCase()}</span>`).join('')}</div></div>
    <div class="ring">${ring(pct,132,12,theme()!=='aurora')}<div class="v"><div><b>${pct}%</b><small>of reading questions answered</small></div></div></div>
  </section>
  <div class="sec-title"><h2>Continue reading</h2>${cont.length?`<button class="btn ghost sm" data-act="nav" data-v="library">View library ${ico('arrow')}</button>`:''}</div>
  ${cont.length?`<div class="tasks">${cont.map(taskCard).join('')}</div>`:`<div class="card muted">Nothing in progress. ${all.length?'Every paper is fully annotated — nice work.':'Add a paper to get started.'}</div>`}
  <div class="sec-title"><h2>Your projects</h2><button class="btn ghost sm" data-act="newProject">${ico('plus')}New project</button></div>
  <div class="pgrid">${ps.map(projectCard).join('')}</div>`;
}
function taskCard(x,inProject){
  const t=tpl(x.projectId), s=nextStage(x,t), g=progress(x,t), p=S.docs[x.projectId];
  return `<button class="task" style="--x:${s?secColor(s):'var(--success)'}" data-act="openPaper" data-id="${x.id}" data-stage="${s?s.id:''}">
    <div class="row" style="justify-content:space-between">${stageTag(s)}${x.verdict?`<span class="badge b-${x.verdict}">${x.verdict}</span>`:''}</div>
    <div class="t">${esc(paperTitle(x))}${x.pdf?'<span class="pdfmini">PDF</span>':''}</div>
    <div class="m">${esc([x.authors,x.year].filter(Boolean).join(' · ')||'No authors yet')}${inProject?'':' · '+esc(p?p.name:'')}</div>
    <div class="f"><div class="bar"><i style="width:${g.pct}%"></i></div><span>${g.n}/${g.total}</span><span class="go">Continue ${ico('arrow')}</span></div>
  </button>`;
}
function projectCard(p){
  const pp=papersOf(p.id), t=tpl(p.id);
  let n=0,tot=0;pp.forEach(x=>{const g=progress(x,t);n+=g.n;tot+=g.total});
  const pct=tot?Math.round(n*100/tot):0;
  return `<button class="pc" data-act="openProject" data-id="${p.id}">
    <div class="hd"><div class="av">${esc(initialsOf(p.name))}</div><div style="min-width:0"><div class="t">${esc(p.name||'Untitled project')}</div><div class="m muted" style="font-size:12.5px">Updated ${esc(ago(Math.max(p.updatedAt||p.createdAt||0,...pp.map(x=>x.updatedAt||0))))}</div></div></div>
    <div class="d">${esc(p.description||'No description yet.')}</div>
    <div class="nums"><span><b>${pp.length}</b>papers</span><span><b>${pp.filter(x=>x.verdict==='Core').length}</b>core</span><span><b>${pp.filter(x=>!nextStage(x,t)).length}</b>complete</span></div>
    <div class="row" style="gap:10px;flex-wrap:nowrap"><div class="bar"><i style="width:${pct}%"></i></div><span class="muted" style="font-size:12.5px">${pct}%</span></div>
  </button>`;
}

/* Library = research papers only. Course resources = everything that belongs to your courses. */
function libraryView(){return libraryPapersView()}
const RES_TABS=[['readings','Readings & slides','folder'],['sketches','Sketches','edit'],['reports','Reports','doc']];
function resourcesView(){
  const tab=V.resTab||'readings', cs=coursesAll(), f=V.libR||(V.libR={course:'all',unit:'all'});
  const head=`<div class="page-head"><div class="grow"><h1>Course resources</h1><p class="lede">${{readings:'Slides, compulsory and additional readings and links from your lectures.',sketches:'Drawings and handwritten notes from your sketch pad.',reports:'Reports of your lecture notes, reflection questions, important ideas and flashcards — for a course, a unit or one lecture.'}[tab]} Separate from your research library.</p></div></div>
    <div class="subtabs" role="tablist">${RES_TABS.map(([k,lab])=>`<button role="tab" class="${tab===k?'on':''}" aria-selected="${tab===k}" data-act="resTab" data-v="${k}">${lab}</button>`).join('')}</div>`;
  if(!cs.length)return head+`<div class="empty"><div class="ic">${ico('cap')}</div><div class="big">No courses yet</div><p>Create a course and its resources collect here.</p><button class="btn pri" data-act="newCourse">${ico('plus')}New course</button></div>`;
  if(tab==='sketches')return head+`<div class="stabbody">${libSketchesHTML()}</div>`;
  if(tab==='reports'){if(f.course!=='all'&&cs.some(c=>c.id===f.course)&&CR.cid!==f.course){CR.cid=f.course;CR.scope='course'}
    return head+`<div class="stabbody">${reportView().replace(/^<div class="page-head">[\s\S]*?<\/div><\/div>/,'')}</div>`}
  return head+`<div class="stabbody">${libReadingsHTML()}</div>`;
}
function libReadingsHTML(){
  const cs=coursesAll(); if(!cs.length)return `<p class="muted">No courses yet. Readings and slides you attach to lectures appear here.</p>`;
  const f=V.libR||(V.libR={course:'all',unit:'all'});
  const us=f.course!=='all'?unitsOf(f.course):[];
  const ls=lecturesOf().filter(l=>(f.course==='all'||l.courseId===f.course)&&(f.unit==='all'||(l.unitId||'')===f.unit)).slice().sort((a,b)=>(a.courseId||'').localeCompare(b.courseId||'')||(a.date||'').localeCompare(b.date||''));
  const filt=`<div class="row" style="margin-bottom:14px"><select class="inp" style="width:auto;border-radius:999px" data-libr="course"><option value="all">All courses</option>${cs.map(c=>`<option value="${c.id}" ${f.course===c.id?'selected':''}>${esc(courseLabel(c))}</option>`).join('')}</select>${us.length?`<select class="inp" style="width:auto;border-radius:999px" data-libr="unit"><option value="all">All units</option>${us.map(u=>`<option value="${u.id}" ${f.unit===u.id?'selected':''}>${esc(u.code||u.name)}</option>`).join('')}</select>`:''}</div>`;
  if(!ls.length)return filt+`<p class="muted">No lectures here yet.</p>`;
  return filt+ls.map(l=>{const c=S.docs[l.courseId]||{},u=unitOf(l.unitId),ms=materialsOf(l.id);
    return `<div class="card libl" style="--x:${ccol(c)}"><div class="row" style="flex-wrap:nowrap"><button class="link" data-act="openLecture" data-id="${l.id}" style="font-weight:700;font-size:15px">${esc(longDate(l.date))} · ${esc(l.topic||'Untitled lecture')}</button><span class="muted" style="font-size:13px">${esc(c.code||c.name||'')}${u?' · '+esc(u.code||u.name):''}</span><span class="spacer"></span><span class="muted" style="font-size:12.5px">${ms.length} file${ms.length===1?'':'s'}</span></div>
      <div class="libgrps">${MAT_GROUPS.map(([g,lab])=>{const xs=ms.filter(m=>matGroup(m)===g);return `<div class="mgrp"><div class="mgh"><span>${lab}</span><button class="btn sm ghost" data-act="${g==='links'?'matLink':'matAdd'}" data-v="${g==='slides'?'slides':'reading'}" data-g="${g}" data-l="${l.id}">${ico(g==='links'?'external':'upload')}${g==='links'?'Add':'Upload'}</button></div>${xs.map(m=>`<div class="matrow"><span class="pdfic ${m.type==='slides'?'sl':''}">${m.type==='slides'?'SL':m.url&&!m.pdf?'URL':'PDF'}</span><button class="link mname" data-act="sideMat" data-id="${m.id}" title="Open beside the lecture notes">${esc(m.name)}</button><button class="btn sm ghost icon" data-act="matPop" data-id="${m.id}" title="Open in its own window">${ico('external')}</button>${g==='compulsory'||g==='additional'?`<button class="btn sm ghost" data-act="matMove" data-id="${m.id}" title="Move to ${g==='compulsory'?'additional':'compulsory'} readings">⇄</button>`:''}<button class="btn sm ghost danger" data-act="matDel" data-id="${m.id}" aria-label="Remove">✕</button></div>`).join('')||'<div class="muted mnone">—</div>'}</div>`}).join('')}</div></div>`}).join('');
}
function libSketchesHTML(){
  const f=V.libR||{course:'all'}, sk=sketchesAll().filter(x=>f.course==='all'||x.courseId===f.course);
  return `<div class="row" style="margin-bottom:14px"><select class="inp" style="width:auto;border-radius:999px" data-libr="course"><option value="all">All courses</option>${coursesAll().map(c=>`<option value="${c.id}" ${f.course===c.id?'selected':''}>${esc(courseLabel(c))}</option>`).join('')}</select><span class="spacer"></span><button class="btn pri" data-act="sketchNew" ${f.course!=='all'?`data-c="${f.course}"`:''}>${ico('pen')}New sketch</button></div>`+(sk.length?`<div class="skgrid">${sk.map(x=>{const c=S.docs[x.courseId]||{},l=S.docs[x.lectureId];return `<div class="card skcard"><button class="skthumb" data-act="sketchOpen" data-id="${x.id}" title="Open and edit">${x.png?`<img src="/_blob/${x.png.id}" alt="${esc(x.name||'Sketch')}">`:ico('pen')}</button><div class="skmeta"><b>${esc(x.name||'Sketch')}</b><span class="muted">${esc([c.code||c.name,l&&l.topic].filter(Boolean).join(' · ')||'No lecture')} · ${esc(new Date(x.updatedAt||x.createdAt||Date.now()).toLocaleDateString())}</span></div><div class="row" style="gap:6px"><button class="btn sm" data-act="sketchOpen" data-id="${x.id}">${ico('edit')}Edit</button><button class="btn sm ghost danger" data-act="sketchDel" data-id="${x.id}">${ico('trash')}</button></div></div>`}).join('')}</div>`:`<div class="empty" style="padding:30px"><div class="ic">${ico('pen')}</div><p>No sketches yet. While taking lecture notes, click <b>Sketch</b> at the top right.</p></div>`);

const reportsSaved=()=>docsOf('report').sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));

  const rs=reportsSaved();

function libraryPapersView(){
  const all=allPapers();
  if(!all.length) return `<div class="page-head"><div class="grow"><h1>Library</h1><p class="lede">Every paper across all your projects.</p></div></div><div class="empty"><div class="ic">${ico('library')}</div><div class="big">Your library is empty</div><p>Papers you add to any project appear here.</p><button class="btn pri" data-act="quickAdd">${ico('plus')}Add paper</button></div>`;
  const f=V.lib||(V.lib={proj:'all',verdict:'All',sort:'recent'});
  let list=all.filter(x=>(f.proj==='all'||x.projectId===f.proj)&&(f.verdict==='All'||(f.verdict==='No verdict'?!x.verdict:x.verdict===f.verdict)));
  const key={recent:(a,b)=>(b.updatedAt||0)-(a.updatedAt||0),author:(a,b)=>(a.authors||'~').localeCompare(b.authors||'~'),year:(a,b)=>(b.year||'').localeCompare(a.year||''),progress:(a,b)=>progress(b,tpl(b.projectId)).pct-progress(a,tpl(a.projectId)).pct}[f.sort];
  list.sort(key);
  return `<div class="page-head"><div class="grow"><h1>Library</h1><p class="lede">Every paper across all your projects — ${all.length} in total.</p></div></div>
  <div class="row" style="margin:20px 0 14px">
    <select class="inp" style="width:auto;border-radius:999px" data-act="libProj"><option value="all">All projects</option>${projects().map(p=>`<option value="${p.id}" ${f.proj===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select>
    <div class="chips">${['All','Core','Background','Skip','No verdict'].map(k=>`<button class="chip ${f.verdict===k?'on':''}" data-act="libVerdict" data-v="${k}">${k}</button>`).join('')}</div>
    <span class="spacer"></span>
    <label class="help">Sort</label><select class="inp" style="width:auto;border-radius:999px" data-act="libSort">${[['recent','Recently edited'],['author','Author'],['year','Year (newest)'],['progress','Progress']].map(([k,l])=>`<option value="${k}" ${f.sort===k?'selected':''}>${l}</option>`).join('')}</select>
  </div>
  <table class="tbl"><thead><tr><th>Paper</th><th class="hide-s">Project</th><th>Next step</th><th class="hide-s">Verdict</th><th style="width:130px">Progress</th></tr></thead><tbody>
  ${list.map(x=>{const t=tpl(x.projectId),g=progress(x,t),s=nextStage(x,t);return `<tr data-act="openPaper" data-id="${x.id}"><td><div class="t">${esc(paperTitle(x))}${x.pdf?'<span class="pdfmini">PDF</span>':''}</div><div class="m">${esc([x.authors,x.year].filter(Boolean).join(' · ')||'—')}</div></td><td class="hide-s m">${esc((S.docs[x.projectId]||{}).name||'')}</td><td>${stageTag(s)}</td><td class="hide-s">${x.verdict?`<span class="badge b-${x.verdict}">${x.verdict}</span>`:'<span class="m">—</span>'}</td><td><div class="row" style="gap:8px;flex-wrap:nowrap"><div class="bar"><i style="width:${g.pct}%"></i></div><span class="m">${g.pct}%</span></div></td></tr>`}).join('')||`<tr><td colspan="5" class="m">No papers match these filters.</td></tr>`}
  </tbody></table>`;
}

/* ---------- Project ---------- */
function projectView(){
  const p=S.docs[V.pid], pp=papersOf(V.pid), t=tpl(V.pid);
  const tabs=[['lit','list',`Literature`],['cmp','compare','Compare'],['ask','spark','Ask'],['write','pen','Write'],['rep','report','Report'],['set','settings','Settings']];
  let body='';
  if(V.tab==='cmp') body=compareView(pp,t);
  else if(V.tab==='rep') body=projectReportView(p,pp,t);
  else if(V.tab==='set') body=settingsView(p,t);
  else if(V.tab==='write') body=writeTabHTML(p);
  else if(V.tab==='ask') body=pp.length?projectAskView(p,pp,t):`<div class="empty"><div class="ic">${ico('spark')}</div><div class="big">Nothing to ask about yet</div><p>Add literature and take some notes first.</p></div>`;
  else {
    const counts={All:pp.length};['Core','Background','Skip','No verdict'].forEach(k=>counts[k]=pp.filter(x=>k==='No verdict'?!x.verdict:x.verdict===k).length);
    const list=pp.filter(x=>V.filter==='All'||(V.filter==='No verdict'?!x.verdict:x.verdict===V.filter));
    const lv=litView(), grp=k=>list.filter(x=>litState(x,t)===k);
    const sec=(k,lab,help)=>{const xs=grp(k);return xs.length?`<section class="litsec"><div class="litsh"><h2>${lab}</h2><span class="muted">${xs.length}</span><span class="help" style="margin:0">${help}</span></div>${lv==='cards'?`<div class="tasks">${xs.map(x=>taskCard(x,true)).join('')}</div>`:`<div class="plist">${xs.map(x=>paperRowHTML(x,t)).join('')}</div>`}</section>`:''};
    body=pp.length?`<div class="littool"><div class="chips">${Object.keys(counts).map(k=>`<button class="chip ${V.filter===k?'on':''}" data-act="filter" data-v="${k}">${k==='All'?'All papers':k} <span style="opacity:.6">${counts[k]}</span></button>`).join('')}</div><span class="spacer"></span><span class="seg" role="group" aria-label="View"><button class="${lv==='list'?'on':''}" data-act="litView" data-v="list" title="List">${ico('list')}List</button><button class="${lv==='cards'?'on':''}" data-act="litView" data-v="cards" title="Cards">${ico('grid')}Cards</button></span></div>
      ${list.length?sec('reading','Reading now','Papers you have started')+sec('todo','Up next','Not started yet')+sec('done','Finished','All reading questions answered'):'<p class="muted">No papers match this filter.</p>'}`

    :`<div class="empty"><div class="ic">${ico('doc')}</div><div class="big">No literature yet</div><p>Add the first paper you are reading for this project.</p><button class="btn pri" data-act="newPaper">${ico('plus')}Add literature</button></div>`;
  }
  let n=0,tot=0;pp.forEach(x=>{const g=progress(x,t);n+=g.n;tot+=g.total});
  const st=k=>pp.filter(x=>litState(x,t)===k).length, dr=draftsOf(V.pid).length;
  return `<div class="crumbs"><button data-act="nav" data-v="projects">Projects</button>${ico('chev')}<span>${esc(p.name||'Untitled project')}</span></div>
  <div class="phead"><b class="nvav big" style="--c:${p.color||avColor(V.pid)}">${esc(initialsOf(p.name))}</b><div class="grow"><h1>${esc(p.name||'Untitled project')}</h1>${p.description?`<p class="lede">${esc(p.description)}</p>`:`<button class="link" data-act="tab" data-v="set" style="font-size:14px">Add your review question</button>`}</div></div>
  ${pp.length?`<div class="pstats"><div><b>${pp.length}</b><span>paper${pp.length===1?'':'s'}</span></div><div><b>${st('reading')}</b><span>reading now</span></div><div><b>${st('todo')}</b><span>up next</span></div><div><b>${st('done')}</b><span>finished</span></div><div><b>${tot?Math.round(n*100/tot):0}%</b><span>notes done</span></div><div><b>${dr}</b><span>draft${dr===1?'':'s'}</span></div></div>`:''}
  <div class="tabs" role="tablist">${tabs.map(([k,i,l])=>`<button class="tab ${V.tab===k?'on':''}" role="tab" aria-selected="${V.tab===k}" data-act="tab" data-v="${k}">${ico(i)}${l}</button>`).join('')}</div>
  ${body}`;
}
/* where a paper is in your reading */
function litState(x,t){if(!nextStage(x,t))return 'done';return progress(x,t).n?'reading':'todo'}
function litView(){try{return localStorage.getItem('litnotes.litview')||'list'}catch(e){return 'list'}}
function paperRowHTML(x,t){
  const s=nextStage(x,t), g=progress(x,t);
  return `<button class="prow" data-act="openPaper" data-id="${x.id}" data-stage="${s?s.id:''}" style="--x:${s?secColor(s):'var(--success)'}">
    <span class="prt"><b>${esc(paperTitle(x))}</b>${x.pdf?'<span class="pdfmini">PDF</span>':''}<span class="muted">${esc([x.authors,x.year,x.journal].filter(Boolean).join(' · ')||'No authors yet')}</span></span>
    <span class="prs">${s?stageTag(s):`<span class="tag" style="--x:var(--success)">Finished</span>`}${x.verdict?`<span class="badge b-${x.verdict}">${x.verdict}</span>`:''}</span>
    <span class="prp"><span class="bar"><i style="width:${g.pct}%"></i></span><span class="muted">${g.n}/${g.total}</span></span>${ico('chev')}</button>`;
}
function settingsView(p,t){
  const nab=abbrsOf(V.pid).length;
  const head=subtabsHTML('proj',[['details','Details'],['questions','Reading questions'],['synth','Themes & dimensions'],['abbr','Abbreviations']]);
  let b='';
  if(STAB.proj==='details') b=`<div class="card" style="max-width:760px"><h2 style="margin-bottom:14px">Project details</h2>
    <div class="field"><label>Project name</label><input class="inp" data-pf="name" value="${esc(p.name||'')}"></div>
    <div class="field"><label>Description / review question</label><textarea class="inp" data-pf="description" placeholder="What is this literature review about?">${esc(p.description||'')}</textarea></div>
    <div class="field" style="margin-bottom:0"><label>My conceptual framework / causal chain (shown with Q18)</label><textarea class="inp" data-pf="chain">${esc(p.chain||'')}</textarea></div>
  </div>

function hl(text,q){const i=text.toLowerCase().indexOf(q.toLowerCase());if(i<0)return esc(text.slice(0,120));const s=Math.max(0,i-40);return (s?'…':'')+esc(text.slice(s,i))+'<mark>'+esc(text.slice(i,i+q.length))+'</mark>'+esc(text.slice(i+q.length,i+q.length+80))}
function studySearch(q){
  const box=$('#sres'), ql=q.toLowerCase(), has=t=>String(t||'').toLowerCase().includes(ql);
  const cs=coursesAll().filter(c=>has(c.name)||has(c.code)).slice(0,5);
  const ls=lecturesOf().filter(l=>has(l.topic)||has(l.subtopic)||has(l.text)||has(l.cuesText)).slice(0,8);
  const ms=docsOf('material').filter(m=>has(m.name)).slice(0,8);
  const sk=sketchesAll().filter(x=>has(x.name)).slice(0,5);
  const as=assignmentsOf().filter(a=>has(a.title)).slice(0,5);
  const snip=l=>{const t=String(l.text||''),i=t.toLowerCase().indexOf(ql);return i<0?'':hl((i>40?'…':'')+t.slice(Math.max(0,i-40),i+80),q)};
  let h='';
  if(cs.length)h+=`<div class="h">Courses</div>`+cs.map(c=>`<button data-act="openCourse" data-id="${c.id}"><div class="t">${hl(courseLabel(c),q)}</div></button>`).join('');
  if(ls.length)h+=`<div class="h">Lectures</div>`+ls.map(l=>`<button data-act="openLecture" data-id="${l.id}"><div class="t">${hl(l.topic||'Untitled lecture',q)}</div><div class="s">${esc((S.docs[l.courseId]||{}).code||'')} · ${esc(longDate(l.date))}${snip(l)?' — '+snip(l):''}</div></button>`).join('');
  if(ms.length)h+=`<div class="h">Slides &amp; readings</div>`+ms.map(m=>`<button data-act="sideMat" data-id="${m.id}"><div class="t">${hl(m.name,q)}</div><div class="s">${esc(MAT_GROUPS.find(g=>g[0]===matGroup(m))[1])} · ${esc((S.docs[m.lectureId]||{}).topic||'')}</div></button>`).join('');
  if(sk.length)h+=`<div class="h">Sketches</div>`+sk.map(x=>`<button data-act="sketchOpen" data-id="${x.id}"><div class="t">${hl(x.name||'Sketch',q)}</div></button>`).join('');
  if(as.length)h+=`<div class="h">Assignments</div>`+as.map(a=>`<button data-act="openAssign" data-id="${a.id}"><div class="t">${hl(a.title||'Assignment',q)}</div></button>`).join('');
  box.innerHTML=h||`<div class="s" style="padding:10px 12px;color:var(--muted);font-size:13px">Nothing in your courses matches “${esc(q)}”.</div>`;
  box.classList.add('show');
}

  const maxPix=16e6, dpr=Math.min(window.devicePixelRatio||1,2,Math.sqrt(maxPix/(vp.width*vp.height)));
  const c=document.createElement('canvas'); c.width=Math.floor(vp.width*dpr); c.height=Math.floor(vp.height*dpr);
  p.task=page.render({canvas:c,canvasContext:c.getContext('2d'),viewport:vp,transform:dpr!==1?[dpr,0,0,dpr,0,0]:null});
  try{await p.task.promise}catch(e){if(p.busy===key)p.busy='';return}
  if(R.scale!==scale){p.busy='';return}
  p.el.querySelectorAll('canvas').forEach(o=>o.remove());
  p.el.insertBefore(c,p.el.firstChild);
  try{
    const tl=document.createElement('div'); tl.className='textLayer'; p.el.appendChild(tl);
    tl.style.setProperty('--scale-factor',scale); tl.style.setProperty('--total-scale-factor',scale); tl.style.setProperty('--user-unit','1');
    await new lib.TextLayer({textContentSource:page.streamTextContent(),container:tl,viewport:vp}).render();
    const was=p.scanned; p.scanned=!tl.textContent.replace(/\s/g,'').length; if(was!==p.scanned)updateScanHint();
  }catch(e){}
  p.el.dataset.done=key; p.busy='';
}

function bindViewerGestures(box){
  if(box._bound)return; box._bound=true;
  // mouse / pen drag with the hand tool
  let drag=null;
  box.addEventListener('pointerdown',e=>{
    if(R.tool!=='hand'||e.pointerType==='touch'||e.button!==0)return;
    if(e.target.closest('a,button'))return;
    drag={x:e.clientX,y:e.clientY,l:box.scrollLeft,t:box.scrollTop,id:e.pointerId};
    box.setPointerCapture(e.pointerId); box.classList.add('grabbing'); e.preventDefault();
  });
  box.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.id)return;box.scrollLeft=drag.l-(e.clientX-drag.x);box.scrollTop=drag.t-(e.clientY-drag.y)});
  const end=e=>{if(!drag)return;try{box.releasePointerCapture(drag.id)}catch(_){}drag=null;box.classList.remove('grabbing')};
  box.addEventListener('pointerup',end); box.addEventListener('pointercancel',end); box.addEventListener('lostpointercapture',end);
  // Ctrl + wheel and trackpad pinch (browsers send ctrlKey with pinch gestures)
  box.addEventListener('wheel',e=>{
    if(!e.ctrlKey&&!e.metaKey)return;
    e.preventDefault();
    const r=box.getBoundingClientRect();
    R.mode='custom'; layoutPages(R.scale*Math.exp(-e.deltaY*0.0025),{x:e.clientX-r.left,y:e.clientY-r.top});
  },{passive:false});
  // two-finger pinch on touch screens (one finger scrolls natively)
  let pinch=null;
  const dist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);
  box.addEventListener('touchstart',e=>{
    if(e.touches.length===2){const r=box.getBoundingClientRect();pinch={d:dist(e.touches),s:R.scale,x:(e.touches[0].clientX+e.touches[1].clientX)/2-r.left,y:(e.touches[0].clientY+e.touches[1].clientY)/2-r.top}}
  },{passive:true});
  box.addEventListener('touchmove',e=>{
    if(!pinch||e.touches.length!==2)return;
    e.preventDefault();
    const r=box.getBoundingClientRect();
    const mx=(e.touches[0].clientX+e.touches[1].clientX)/2-r.left, my=(e.touches[0].clientY+e.touches[1].clientY)/2-r.top;
    R.mode='custom'; layoutPages(pinch.s*dist(e.touches)/pinch.d,{x:mx,y:my});
    // two fingers also pan
    box.scrollLeft-=mx-pinch.x; box.scrollTop-=my-pinch.y; pinch.x=mx; pinch.y=my;
  },{passive:false});
  box.addEventListener('touchend',e=>{if(e.touches.length<2)pinch=null});
}
