/* ============================================================
   AUTO-FILL REFERENCE DETAILS FROM A PDF
   1) DOI found → CrossRef (self-hosted server)  2) else AI reads page 1  3) else PDF metadata
   ============================================================ */
const DOI_RE=/\b(10\.\d{4,9}\/[^\s"'<>]+)/i;
function cleanDoi(d){return d?d.replace(/[.,;:)\]}>]+$/,'').replace(/^doi:\s*/i,''):''}
async function pdfHead(src){
  const lib=await loadPdfjs();
  const data=src.file?await src.file.arrayBuffer():await (await fetch(src.url)).arrayBuffer();
  const doc=await lib.getDocument({data,isEvalSupported:false,...PDFJS_EXTRA}).promise;
  let text='';
  for(let i=1;i<=Math.min(4,doc.numPages);i++){
    const pg=await doc.getPage(i); const tc=await pg.getTextContent();
    text+=`\n[page ${i}]\n`+tc.items.map(it=>it.str+(it.hasEOL?'\n':' ')).join('');
  }
  let info={}; try{info=(await doc.getMetadata()).info||{}}catch(e){}
  doc.destroy&&doc.destroy();
  const m=(text+' '+(info.Subject||'')+' '+(info.Keywords||'')).match(DOI_RE);
  const isbn=(text.match(/ISBN(?:-1[03])?:?\s*((?:97[89][\s-]?)?(?:\d[\s-]?){9}[\dXx])/)||[])[1];
  return {text:text.replace(/[ \t]+/g,' ').trim(),info,doi:cleanDoi(m&&m[1]),isbn:isbn?isbn.replace(/[\s-]/g,'').toUpperCase():''};
}
function normRef(o){
  const r={};
  const t=String(o.type||'').toLowerCase();
  r.type=REF_TYPES[t]?t:'journal';
  const ppl=a=>(Array.isArray(a)?a:[]).map(p=>p&&typeof p==='object'?{family:trim(p.family||p.name),given:trim(p.given),org:!!p.org||(!p.given&&!!p.name&&!p.family)}:null).filter(p=>p&&p.family);
  const au=ppl(o.authors); if(au.length) r.authors=au;
  const ed=ppl(o.editors); if(ed.length) r.editors=ed;
  ['year','month','day','title','journal','volume','issue','pages','articleNo','doi','url','publisher','bookTitle','institution','degree','reportNo','conference','location','edition'].forEach(k=>{const v=o[k];if(v!=null&&String(v).trim())r[k]=String(v).trim()});
  if(r.month&&!/^(1[0-2]|[1-9])$/.test(r.month)){const i=MONTHS.findIndex(m=>m.toLowerCase().startsWith(String(r.month).toLowerCase().slice(0,3)));r.month=i>=0?String(i+1):''}
  if(r.degree&&!REF_FIELDS.degree.options.includes(r.degree)) r.degree=/doct|phd/i.test(r.degree)?'Doctoral dissertation':/master|msc|ma\b/i.test(r.degree)?"Master's thesis":"Bachelor's thesis";
  if(r.doi) r.doi=cleanDoi(r.doi.replace(/^https?:\/\/(dx\.)?doi\.org\//i,''));
  if(r.doi) delete r.url;
  return r;
}
/* read a book's front matter: title lines, "by …" or "Edited by …", "First published 2005 by Pluto Press", "© 2005" */
function bookFromText(text){
  const lines=String(text||'').split('\n').map(x=>x.replace(/\s+/g,' ').trim()).filter(x=>x&&!/^\[page \d+\]$/.test(x));
  if(lines.length<3)return null;
  const tc=w=>w.replace(/\b([A-Z])([A-Z'’-]+)\b/g,(m,a,b)=>a+b.toLowerCase()).replace(/-([a-z])/g,(m,c)=>'-'+c.toUpperCase());

  ['bold','italic','underline','insertUnorderedList','insertOrderedList'].forEach(c=>{const b=bar.querySelector(`[data-fmt="${c}"]`);let on=false;try{on=document.queryCommandState(c)}catch(e){}if(b)b.classList.toggle('on',on)});
}
/* paste from Word, Excel, Google Docs, PDFs and web pages: keep the structure, store the pictures */
async function insertPastedImages(ed,files,range){
  toast(files.length>1?`Adding ${files.length} pictures…`:'Adding the picture…');
  const ids=[]; for(const f of files){if(!/^image\/(png|jpeg|gif|webp)$/.test(f.type)){toast('Only PNG, JPG, GIF or WebP pictures can be pasted.');continue}const id=await uploadImageBlob(f);if(id)ids.push(id)}
  if(!ids.length)return;
  ed.focus(); if(range){const s=getSelection();s.removeAllRanges();s.addRange(range)}
  document.execCommand('insertHTML',false,ids.map(id=>`<p class="al-center"><img src="/_blob/${id}" class="img-m" alt="pasted picture"></p>`).join('')+'<p><br></p>');
  rteCommit(ed); toast(ids.length>1?`${ids.length} pictures added`:'Picture added — click it to resize or move it');
}
async function richPaste(ed,e){
  const cd=e.clipboardData||window.clipboardData; if(!cd)return;
  const plain=ed._plain; ed._plain=false;
  const html=cd.getData('text/html'), text=cd.getData('text/plain');
  const files=[...(cd.items||[])].filter(i=>i.kind==='file'&&/^image\//.test(i.type)).map(i=>i.getAsFile()).filter(Boolean);
  e.preventDefault();
  if(plain||(!html&&!files.length)){document.execCommand('insertText',false,text);return}
  const sel=getSelection(), range=sel.rangeCount?sel.getRangeAt(0).cloneRange():null;
  const tmp=document.createElement('div'); tmp.innerHTML=html||'';
  tmp.querySelectorAll('style,meta,link,script,title,xml').forEach(x=>x.remove());
  [...tmp.getElementsByTagName('*')].filter(x=>x.tagName.includes(':')&&!/^v:imagedata$/i.test(x.tagName)).forEach(x=>{if(!x.querySelector('img'))x.replaceWith(...x.childNodes)});
  const imgs=[...tmp.querySelectorAll('img')], textLen=trim(tmp.textContent||'').length;
  // a picture or a shape on its own (a Word shape, a chart, a screenshot, an image from a page)
  if(files.length&&(!html||(textLen<3&&!tmp.querySelector('table')))){await insertPastedImages(ed,files,range);return}
  let lost=0;
  if(imgs.length)toast('Adding the pictures…');
  for(const im of imgs){
    const src=im.getAttribute('src')||''; if(BLOB_RE.test(src))continue;
    let blob=null;
    try{if(/^data:image\//.test(src))blob=await (await fetch(src)).blob();else if(/^https?:/.test(src)){const r=await fetch(src);if(r.ok)blob=await r.blob()}}catch(err){}
    if(!blob&&files.length===1&&imgs.length===1)blob=files[0]; // Word gives the picture separately from its text
    if(blob&&/^image\/(png|jpeg|gif|webp)/.test(blob.type)){const id=await uploadImageBlob(blob);if(id){im.setAttribute('src','/_blob/'+id);im.className='img-m';continue}}
    lost++; im.remove();
  }
  const clean=cleanRich(tmp.innerHTML);
  ed.focus(); if(range){const s=getSelection();s.removeAllRanges();s.addRange(range)}
  if(trim(clean.replace(/<[^>]+>/g,''))||/<img|<table/.test(clean))document.execCommand('insertHTML',false,clean);else document.execCommand('insertText',false,text);
  rteCommit(ed);
  if(lost)toast(`${lost===1?'One picture or shape':lost+' pictures or shapes'} could not come along. Copy ${lost===1?'it':'each one'} on its own and paste it.`);
}
function bindRte(root){
  root.querySelectorAll('.rte').forEach(ed=>{
    ed.addEventListener('input',()=>rteCommit(ed));
    // Ctrl+Shift+V pastes plain text; a normal paste keeps tables, lists, headings, bold, pictures and shapes
    ed.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.shiftKey&&(e.key==='v'||e.key==='V'))ed._plain=true},true);
    ed.addEventListener('paste',e=>richPaste(ed,e));
    ed.addEventListener('drop',e=>{const dt=e.dataTransfer;if(!dt)return;const fs=[...dt.files||[]].filter(f=>/^image\//.test(f.type));
      if(fs.length){e.preventDefault();const r=document.caretRangeFromPoint?document.caretRangeFromPoint(e.clientX,e.clientY):null;if(r){const s=getSelection();s.removeAllRanges();s.addRange(r)}insertPastedImages(ed,fs);return}
      const t=dt.getData('text/plain');if(t){e.preventDefault();ed.focus();document.execCommand('insertText',false,t)}});
    ed.addEventListener('keydown',e=>{
      if(undoAutoCap(ed,e)){rteCommit(ed);return}
      if(e.key.length===1||e.key==='Enter'||e.key==='Delete'||e.key.startsWith('Arrow'))lastAuto=lastAuto&&e.key.length===1?lastAuto:null;
      const inLi=()=>{const s=getSelection();let n=s.anchorNode;while(n&&n!==ed){if(n.nodeName==='LI')return true;n=n.parentNode}return false};
      if(e.key==='Tab'&&inLi()){e.preventDefault();document.execCommand(e.shiftKey?'outdent':'indent');rteCommit(ed);return}
      if((e.ctrlKey||e.metaKey)&&e.shiftKey&&(e.code==='Digit8'||e.code==='Digit7')){e.preventDefault();ensureLine(ed);document.execCommand(e.code==='Digit8'?'insertUnorderedList':'insertOrderedList');rteCommit(ed);refreshRteState()}
    });
    ed.addEventListener('beforeinput',e=>{
      if(autoCap(ed,e)){rteCommit(ed);return}
      if(e.inputType==='insertText'&&e.data&&e.data!==' '&&lastAuto){/* typing on after the capital: Backspace now deletes normally */ setTimeout(()=>{lastAuto=null},0)}
      if(e.inputType!=='insertText'||e.data!==' ')return;
      const s=getSelection(); if(!s.isCollapsed)return;
      const n=s.anchorNode; if(!n||n.nodeType!==3)return;
      const before=n.nodeValue.slice(0,s.anchorOffset);
      const m=before.match(/^(-|\*|•|1[.)])$/); if(!m)return;
      // only at the start of a line
      let p=n; while(p.parentNode&&p.parentNode!==ed&&!/^(DIV|P|LI)$/.test(p.parentNode.nodeName)&&!p.previousSibling)p=p.parentNode;
      if(p.previousSibling&&p.previousSibling.nodeName!=='BR')return;
      let a=n; while(a&&a!==ed){if(a.nodeName==='LI')return;a=a.parentNode}
      e.preventDefault();
      const r=document.createRange(); r.setStart(n,0); r.setEnd(n,s.anchorOffset); s.removeAllRanges(); s.addRange(r);
      document.execCommand('delete');
      document.execCommand(/^1/.test(m[1])?'insertOrderedList':'insertUnorderedList');
      rteCommit(ed); refreshRteState();
    });
    ed.addEventListener('keyup',refreshRteState); ed.addEventListener('mouseup',refreshRteState);
    ed.addEventListener('focus',refreshRteState);
  });
  root.querySelectorAll('.rtebar button').forEach(b=>{
    b.addEventListener('mousedown',e=>e.preventDefault()); // keep the text selection
    b.addEventListener('click',()=>{
      const bf=b.closest('.rtebar').dataset.for, ed=bf==='__lec'?draftEd():document.querySelector(`.rte[data-ans="${bf}"]`); if(!ed)return;
      if(document.activeElement!==ed)ed.focus();
      try{document.execCommand('styleWithCSS',false,false)}catch(e){}
      if(b.dataset.block){document.execCommand('formatBlock',false,'<'+b.dataset.block+'>')}
      else if(b.dataset.fmt==='clear'){document.execCommand('removeFormat');unwrapMarksInSelection(ed)}
      else if(b.dataset.fmt){if(/List$/.test(b.dataset.fmt))ensureLine(ed);document.execCommand(b.dataset.fmt)}
      else if(b.dataset.hl==='none'){unwrapMarksInSelection(ed)}
      else if(b.dataset.hl){
        const sel=window.getSelection();
        if(!sel.rangeCount||sel.isCollapsed){toast('Select some text first, then pick a highlight colour');return}
        unwrapMarksInSelection(ed);
        const c=HL.find(h=>h[0]===b.dataset.hl)[1];
        try{document.execCommand('styleWithCSS',false,true)}catch(e){}
        document.execCommand('hiliteColor',false,c);
        try{document.execCommand('styleWithCSS',false,false)}catch(e){}
        normalizeMarks(ed);
      }
      rteCommit(ed); refreshRteState();
    });
  });
}
document.addEventListener('selectionchange',()=>{if(V.view==='paper')refreshRteState()});


/* ============================================================
   SYNTHESIS: dimensions, tags and codings
   project.dims  : custom dimensions added by the user (defaults below)
   project.tags  : [{id, dim, name}]
   paper.codes   : [{id, tag, qid, text|null, stance?, at}]   text = tagged passage, null = whole answer
   ============================================================ */
const DEFAULT_DIMS=[
  {id:'theme',name:'Themes',color:'#5b6bd6',hint:'Recurring topics across papers, e.g. enforcement, risk perception'},
  {id:'debate',name:'Debates',color:'#d97745',debate:true,hint:'Open questions the literature argues about; each note records which side it supports'},
  {id:'method',name:'Methods',color:'#2f9e7a',hint:'Designs and techniques, e.g. survey, panel data, RCT'},
  {id:'context',name:'Context',color:'#a855c7',hint:'Countries, regions, settings, populations'},
  {id:'concept',name:'Concepts & variables',color:'#0ea5e9',hint:'Key constructs and how they are measured'},
  {id:'gap',name:'Gaps',color:'#d64545',hint:'What is missing — material for your contribution'}
];
const STANCES=[['supports','Supports','#22a06b'],['challenges','Challenges','#d64545'],['mixed','Mixed','#c98a12']];
const dimsOf=pid=>DEFAULT_DIMS.concat(((S.docs[pid]||{}).dims)||[]);
const dimById=(pid,id)=>dimsOf(pid).find(d=>d.id===id);
const tagsOf=(pid,dim)=>(((S.docs[pid]||{}).tags)||[]).filter(t=>!dim||t.dim===dim);
const tagById=(pid,id)=>(((S.docs[pid]||{}).tags)||[]).find(t=>t.id===id);
function codingsFor(pid,tagId){
  const out=[];
  papersOf(pid).forEach(x=>(x.codes||[]).forEach(c=>{if(c.tag===tagId)out.push({x,c})}));
  return out;
}
function tagCount(pid,tagId){return codingsFor(pid,tagId).length}
function questionOf(pid,qid){return tpl(pid).questions.find(q=>q.id===qid)}
function codeBodyHTML(x,c,pid){
  if(c.text) return `<p class="excerpt">“${esc(c.text)}”</p>`;
  const q=questionOf(pid,c.qid); return q?`<div class="ans">${answerHTML(x,q)}</div>`:'';
}
function codeBodyText(x,c,pid){
  if(c.text) return c.text;
  const q=questionOf(pid,c.qid); return q?((x.answers||{})[q.id]||''):'';
}
const qLabel=(pid,qid)=>{const t=tpl(pid);const q=t.questions.find(z=>z.id===qid);return q?`Q${t.questions.indexOf(q)+1} ${q.text}`:''};
const cite=x=>inText(x.ref).paren.replace(/<[^>]+>/g,'').replace(/&amp;/g,'&');

/* ---------- chips under each answer ---------- */
function codesRowHTML(x,q){
  const pid=x.projectId, list=(x.codes||[]).filter(c=>c.qid===q.id);
  const chips=list.map(c=>{const t=tagById(pid,c.tag);if(!t)return '';const d=dimById(pid,t.dim)||{};const st=STANCES.find(s=>s[0]===c.stance);
    return `<span class="code-chip" style="--x:${d.color||'var(--accent)'}" title="${esc(d.name||'')}${c.text?' · passage: '+esc(c.text):' · whole answer'}"><i></i><b>${esc(t.name)}</b>${st?`<em style="--s:${st[2]}">${st[1]}</em>`:''}${c.text?`<span class="cx">“${esc(c.text.length>46?c.text.slice(0,44)+'…':c.text)}”</span>`:''}<button data-uncode="${c.id}" aria-label="Remove tag">×</button></span>`}).join('');
  return `<div class="codes" data-codes="${q.id}">${chips}<button class="btn sm ghost tagbtn" data-tagq="${q.id}" title="Tag the selected passage, or the whole answer if nothing is selected">${ico('tag')}Tag</button></div>`;
}
function refreshCodes(qid){
  const x=S.docs[V.paperId]; const el=document.querySelector(`[data-codes="${qid}"]`); if(!x||!el)return;
  const q=tpl(x.projectId).questions.find(z=>z.id===qid); el.outerHTML=codesRowHTML(x,q);
}
function selectionIn(ed){
  const s=getSelection(); if(!s.rangeCount||s.isCollapsed)return '';
  const r=s.getRangeAt(0); if(!ed.contains(r.commonAncestorContainer))return '';
  return s.toString().replace(/\s+/g,' ').trim();
}

/* ---------- the tag dialog ---------- */
function openTagDialog(qid,passage){
  const x=S.docs[V.paperId]; if(!x)return; const pid=x.projectId;
  let dim=(V.lastDim&&dimById(pid,V.lastDim))?V.lastDim:'theme', stance='supports', filter='';
  const ov=modal('',false);
  const draw=()=>{
    const d=dimById(pid,dim), tags=tagsOf(pid,dim).filter(t=>t.name.toLowerCase().includes(filter.toLowerCase()));
    const exact=tagsOf(pid,dim).some(t=>t.name.toLowerCase()===filter.trim().toLowerCase());
    ov.querySelector('.modal').innerHTML=`<h3>Tag ${passage?'this passage':'this answer'}</h3>
      <div class="hint" style="margin-bottom:12px"><b>${passage?'Passage':'Whole answer'} · ${esc(qLabel(pid,qid))}</b>${passage?esc(passage.length>220?passage.slice(0,218)+'…':passage):'Tip: select words in your note first to tag just that passage.'}</div>
      <div class="chips" style="margin-bottom:10px">${dimsOf(pid).map(z=>`<button class="chip ${z.id===dim?'on':''}" data-dim="${z.id}" style="${z.id===dim?`border-color:${z.color};color:${z.color}`:''}">${esc(z.name)}</button>`).join('')}</div>
      <p class="help" style="margin:0 0 8px">${esc(d.hint||'')}</p>
      <input class="inp" id="tagFind" placeholder="${d.debate?'Find or create a debate, e.g. Does enforcement change behaviour?':'Find or create a '+esc(d.name.toLowerCase().replace(/s$/,''))+'…'}" value="${esc(filter)}">
      <div class="taglist">${tags.map(t=>`<button class="tagopt" data-pick="${t.id}"><span>${esc(t.name)}</span><small>${tagCount(pid,t.id)} note${tagCount(pid,t.id)===1?'':'s'}</small></button>`).join('')}
        ${filter.trim()&&!exact?`<button class="tagopt new" data-create="1">${ico('plus')}<span>Create “${esc(filter.trim())}”</span></button>`:''}
        ${!tags.length&&!filter.trim()?`<div class="help" style="padding:8px 2px">No ${esc(d.name.toLowerCase())} yet — type one above.</div>`:''}</div>
      ${d.debate?`<div class="field" style="margin:12px 0 0"><label>This note…</label><div class="choice">${STANCES.map(([k,l,c])=>`<button class="${stance===k?'on':''}" data-stance="${k}" style="${stance===k?`background:${c};border-color:${c}`:''}">${l}</button>`).join('')}</div></div>`:''}
      <div class="mfoot"><button class="btn" data-x>Close</button></div>`;
    const f=ov.querySelector('#tagFind'); f.focus(); f.setSelectionRange(f.value.length,f.value.length);
    f.oninput=()=>{filter=f.value;draw()};
    f.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();const first=ov.querySelector('[data-pick],[data-create]');if(first)first.click()}};
    ov.querySelectorAll('[data-dim]').forEach(b=>b.onclick=()=>{dim=b.dataset.dim;V.lastDim=dim;filter='';draw()});
    ov.querySelectorAll('[data-stance]').forEach(b=>b.onclick=()=>{stance=b.dataset.stance;draw()});
    ov.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>apply(b.dataset.pick));
    const cr=ov.querySelector('[data-create]'); if(cr) cr.onclick=()=>{
      const p=S.docs[pid]; p.tags=p.tags||[]; const t={id:uid('tag_'),dim,name:filter.trim()}; p.tags.push(t); save(pid); apply(t.id);
    };
    ov.querySelector('[data-x]').onclick=()=>ov.remove();
  };
  const apply=tagId=>{
    const d=dimById(pid,dim); x.codes=x.codes||[];
    const dup=x.codes.find(c=>c.tag===tagId&&c.qid===qid&&(c.text||'')===(passage||''));
    if(dup){if(d.debate){dup.stance=stance;save(V.paperId);refreshCodes(qid)}toast('Already tagged');ov.remove();return}
    x.codes.push({id:uid('c'),tag:tagId,qid,text:passage||null,stance:d.debate?stance:undefined,at:Date.now()});
    save(V.paperId); refreshCodes(qid); ov.remove(); toast(`Tagged: ${tagById(pid,tagId).name}`);
  };
  draw();
}

});

/* ============================================================
   SYNTHESIS REPORTS
   ============================================================ */
function layoutOptions(pid){
  return [['paper','By paper'],['question','By question'],...dimsOf(pid).map(d=>['dim:'+d.id,'By '+d.name.toLowerCase()]),...dimsOf(pid).filter(d=>!d.debate).slice(0,1).map(d=>['matrix:'+d.id,'Matrix: papers × '+d.name.toLowerCase()]),['matrix:debate','Matrix: papers × debates']];
}
function sortedTags(pid,dim){return tagsOf(pid,dim).map(t=>({t,n:tagCount(pid,t.id)})).filter(o=>o.n).sort((a,b)=>b.n-a.n||a.t.name.localeCompare(b.t.name))}
function dimReportHTML(p,pp,dimId){
  const pid=V.pid,d=dimById(pid,dimId); if(!d)return '';
  const tags=sortedTags(pid,dimId);
  if(!tags.length)return `<h2>${esc(d.name)}</h2><p class="na">No notes are tagged with ${esc(d.name.toLowerCase())} yet. Use the Tag button under any answer while taking notes.</p>`;
  let html=`<h2>${esc(d.name)}</h2><p class="meta">${tags.length} ${esc(d.name.toLowerCase())} · ${tags.reduce((a,o)=>a+o.n,0)} tagged notes</p>`;
  const item=({x,c})=>`<div class="syn-item"><h4>${esc(cite(x))} <span style="font-weight:400;color:#6b6f76">· ${esc(paperTitle(x))} · ${esc(qLabel(pid,c.qid))}</span></h4>${codeBodyHTML(x,c,pid)}</div>`;
  tags.forEach(({t})=>{
    const rows=codingsFor(pid,t.id);
    html+=`<h3>${esc(t.name)} <span style="font-weight:400;color:#6b6f76;font-size:15px">(${new Set(rows.map(r=>r.x.id)).size} paper${new Set(rows.map(r=>r.x.id)).size===1?'':'s'})</span></h3>`;
    if(d.debate){
      STANCES.forEach(([k,l,col])=>{const g=rows.filter(r=>(r.c.stance||'mixed')===k);if(!g.length)return;html+=`<h4 style="color:${col};text-transform:uppercase;letter-spacing:.06em;font-size:12.5px;margin-top:14px">${l} (${g.length})</h4>`+g.map(item).join('')});
    }else html+=rows.map(item).join('');
  });
  return html;
}
function matrixHTML(p,pp,dimId){
  const pid=V.pid,d=dimById(pid,dimId); const tags=sortedTags(pid,dimId).map(o=>o.t);
  if(!tags.length)return `<h2>${esc(d.name)} matrix</h2><p class="na">Nothing tagged with ${esc(d.name.toLowerCase())} yet.</p>`;

const CH_COLORS=['#5b6bd6','#e07a5f','#2f9e7a','#d4a017','#a855c7','#0ea5e9','#d64545','#64748b'];
function parseChartData(txt){
  const lines=String(txt||'').split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  if(lines.length<2)return null;
  const split=l=>l.split(/\t|;|,(?=(?:[^"]*"[^"]*")*[^"]*$)/).map(x=>x.trim().replace(/^"|"$/g,''));
  const head=split(lines[0]); const series=head.slice(1).map(n=>({name:n||'Series',values:[]})); const labels=[];

      if(da>0.25){const m=a+da/2;g.fillStyle='#fff';g.font=`600 26px ${font}`;g.textAlign='center';g.fillText(Math.round(v/tot*100)+'%',cx+Math.cos(m)*r*0.62,cy+Math.sin(m)*r*0.62+9)}a+=da});
    g.textAlign='left'; g.font=`26px ${font}`;
    data.labels.forEach((l,i)=>{const y=top+40+i*44;g.fillStyle=CH_COLORS[i%CH_COLORS.length];g.fillRect(W*0.68,y-20,26,26);g.fillStyle='#111827';g.fillText(`${l} (${s.values[i]})`,W*0.68+40,y)});

  let max=Math.max(0,...all), min=Math.min(0,...all); if(max===min)max=min+1;
  const step=(()=>{const raw=(max-min)/5,p=Math.pow(10,Math.floor(Math.log10(raw)));return [1,2,2.5,5,10].map(m=>m*p).find(m=>m>=raw)})();

/* ============================================================

   project.abbrs        : [{short, full}]
   project.abbrIgnore   : ['PDF', …]   things that look like abbreviations but are not to be listed
   ============================================================ */
const abbrsOf=pid=>(((S.docs[pid]||{}).abbrs)||[]).slice().sort((a,b)=>a.short.localeCompare(b.short,undefined,{sensitivity:'base'}));

const ABBR_STOP=new Set(['of','and','the','for','in','on','to','at','by','with','a','an','de','des','du','la','le','les','et','en','d','l','&']);
function initialsMatch(words,abbr){
  const letters=abbr.replace(/s$/,'').replace(/[^A-Za-z0-9]/g,'').toLowerCase();
  const parts=words.flatMap(w=>w.split(/[-–\/]/)).filter(w=>w&&!ABBR_STOP.has(w.toLowerCase()));
  const ini=parts.map(w=>w[0].toLowerCase()).join('');
  if(ini===letters)return true;
  // allow a word to give two letters (e.g. "Moto-Taxi" → MT, "UNICEF"-style blends): letters must appear in order, every word used
  let i=0; for(const w of parts){const lw=w.toLowerCase();if(lw[0]!==letters[i])return false;i++;let j=1;while(i<letters.length&&j<lw.length&&lw[j]===letters[i]&&parts.indexOf(w)===parts.length-1){i++;j++}}
  return i===letters.length&&parts.length>=2;
}
/* "World Health Organization (WHO)" and "WHO (World Health Organization)" */
function singular(short,full){

  const f=full.replace(/ies$/,'y').replace(/(ss|us|is)$/,'$1').replace(/([^s])s$/,'$1');
  return {short:short.slice(0,-1),full:f};

function findDefinitions(text){

  const out=new Map();
  (String(text||'').match(/\b[A-Z][A-Za-z0-9&]*(?:-[A-Z0-9]+)?\b/g)||[]).forEach(t=>{
    const caps=(t.match(/[A-Z]/g)||[]).length; if(caps<2||t.length>12)return;
    if(/^[A-Z][a-z]+[A-Z][a-z]+$/.test(t))return;                 // CamelCase names (McDonald)
    const base=/^[A-Z0-9&-]+s$/.test(t)&&t.length>3?t.slice(0,-1):t;  // plural: RTIs → RTI
    out.set(base,(out.get(base)||0)+1);
  });
  return out;
}
function projectTexts(pid){
  const texts=[];
  papersOf(pid).forEach(x=>Object.values(x.answers||{}).forEach(a=>texts.push(a)));
  draftsOf(pid).forEach(d=>texts.push(d.text||''));
  if((S.docs[pid]||{}).kind==='course')lecturesOf(pid).forEach(l=>texts.push(l.text||'',l.cuesText||''));
  return texts.join('\n');
}
function undefinedAbbrs(pid){
  const defined=new Set(abbrsOf(pid).map(a=>a.short)), ign=abbrIgnored(pid);
  return [...abbrTokens(projectTexts(pid)).entries()].filter(([t])=>!defined.has(t)&&!ign.has(t)).sort((a,b)=>b[1]-a[1]).map(([short,n])=>({short,n}));
}
function upsertAbbr(pid,short,full){
  short=trim(short); full=trim(full); if(!short||!full)return false;
  if(/^[A-Z0-9&-]{2,}s$/.test(short)){const d=singular(short,full);short=d.short;full=d.full}
  const p=S.docs[pid]; p.abbrs=p.abbrs||[];
  const ex=p.abbrs.find(a=>a.short===short); if(ex)ex.full=full; else p.abbrs.push({short,full});
  p.abbrIgnore=(p.abbrIgnore||[]).filter(x=>x!==short);
  save(pid); return true;
}
const curPid=()=>V.view==='lecture'?(S.docs[V.lectureId]||{}).courseId:V.view==='draft'?(S.docs[V.draftId]||{}).projectId:V.view==='paper'?(S.docs[V.paperId]||{}).projectId:V.pid;

/* ============================================================
   PDF HIGHLIGHTS & QUOTES
   paper.highlights : [{id, page, color, rects:[[x1,y1,x2,y2] in PDF points], text, at}]
   paper.hlDirty    : highlights changed since they were last written into the PDF file
   paper.pdfOrig    : the untouched PDF once a highlighted copy has been saved (paper.pdf is then the copy)
   Quotes live in the notes as  “text” (Author, Year, p. 5)
   ============================================================ */
const HLC=[['yellow','#ffd60a',[1,0.84,0.04]],['green','#4fd65a',[0.31,0.84,0.35]],['blue','#4aa8ff',[0.29,0.66,1]],['pink','#ff6fb5',[1,0.44,0.71]]];
const vpPt=(vp,x,y)=>{const [a,b,c,d,e,f]=vp.transform;return [a*x+c*y+e,b*x+d*y+f]};
const pdfPt=(vp,x,y)=>{const [a,b,c,d,e,f]=vp.transform,det=a*d-b*c;return [(d*(x-e)-c*(y-f))/det,(a*(y-f)-b*(x-e))/det]};
const hlHex=c=>(HLC.find(z=>z[0]===c)||HLC[0])[1];
const PDFLIB_URL=(LOCAL&&LOCAL.pdflibUrl)||'https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js';
let _pdflib=null;
function loadPdfLib(){
  if(window.PDFLib)return Promise.resolve(window.PDFLib);
  if(_pdflib)return _pdflib;
  _pdflib=new Promise((res,rej)=>{const s=document.createElement('script');s.src=PDFLIB_URL;s.onload=()=>window.PDFLib?res(window.PDFLib):rej(new Error('pdf-lib'));s.onerror=()=>{_pdflib=null;rej(new Error('pdf-lib'))};document.head.appendChild(s)});
  return _pdflib;
}
const curPaper=()=>{const id=readerId();return id&&S.docs[id]?S.docs[id]:null};
const citeCore=x=>cite(x).replace(/^\(|\)$/g,'');
const pageStr=pg=>{pg=String(pg||'').trim();if(/^(paras?|pp?|sec(tion)?|ch(apter)?|slides?|table|figure|fig)\.?\s/i.test(pg)||/^¶/.test(pg))return pg;return /[–-]/.test(pg)?'pp. '+pg.replace(/\s*[-–]\s*/,'–'):'p. '+pg};
const quoteText=(x,text,pg)=>`“${text}” (${citeCore(x)}${String(pg||'').trim()?', '+pageStr(pg):''})`;

/* printed page number: the PDF's own page labels, else the first page in the reference */
function printedPage(x,n){
  if(x&&x.pageOffset!=null&&n-x.pageOffset>=1)return String(n-x.pageOffset);
  const lab=R.labels&&R.labels[n-1];
  if(lab&&/^[0-9ivxlcdm]+$/i.test(lab.trim()))return lab.trim();
  const m=String((x.ref||{}).pages||'').match(/(\d+)\s*[-–]\s*(\d+)/);
  if(m&&R.doc){const a=+m[1],b=+m[2],len=b-a+1;if(len===R.doc.numPages)return String(a+n-1);if(len===R.doc.numPages-1&&n>1)return String(a+n-2)}
  return String(n);
}
function cleanSelText(t){
  return String(t||'').replace(/([a-z])-\s*\n\s*([a-z])/g,'$1$2').replace(/\s+/g,' ').replace(/^[\s“"']+|[\s”"']+$/g,'').trim();
}

/* ---------- drawing highlights over the pages ---------- */
function hlLayer(p){let l=p.el.querySelector('.hlLayer');if(!l){l=document.createElement('div');l.className='hlLayer';p.el.appendChild(l)}return l}
function drawHighlights(n){
  const x=curPaper(); if(!x||!R.pages.length)return;
  const pages=n?[R.pages[n-1]]:R.pages;
  pages.forEach(p=>{
    if(!p||!p.vp1)return;
    const l=hlLayer(p);
    l.innerHTML=(x.highlights||[]).filter(h=>h.page===p.n).map(h=>h.rects.map(r=>{
      const [a,b]=vpPt(p.vp1,r[0],r[1]),[c,d]=vpPt(p.vp1,r[2],r[3]); const L=Math.min(a,c),T=Math.min(b,d),W=Math.abs(c-a),H=Math.abs(d-b);
      return `<i data-hl="${h.id}" style="left:${L/p.w*100}%;top:${T/p.h*100}%;width:${W/p.w*100}%;height:${H/p.h*100}%;background:${hlHex(h.color)}"></i>`}).join('')).join('');
  });
}

/* ---------- reading the selection ---------- */
function selectionInPdf(){
  const s=getSelection(); if(!s||s.isCollapsed||!s.rangeCount)return null;
  const r=s.getRangeAt(0), box=$('#rpages'); if(!box||!box.contains(r.commonAncestorContainer))return null;
  const text=cleanSelText(s.toString()); if(text.length<2)return null;
  const byPage={};
  const all=[...r.getClientRects()].filter(c=>c.width>1&&c.height>2);
  const hs=all.map(c=>c.height).sort((a,b)=>a-b), med=hs[Math.floor(hs.length/2)]||12;
  all.filter(c=>c.height<med*2.6).forEach(c=>{
    const el=document.elementsFromPoint(c.left+c.width/2,c.top+c.height/2).find(e=>e.classList&&e.classList.contains('pg'))
      ||R.pages.map(p=>p.el).find(pe=>{const b=pe.getBoundingClientRect();return c.top+c.height/2>=b.top&&c.top+c.height/2<=b.bottom});
    if(!el)return; const p=R.pages[+el.dataset.n-1]; if(!p||!p.vp1)return;
    const b=el.getBoundingClientRect(), k=b.width/p.w;
    const x1=(c.left-b.left)/k, x2=(c.right-b.left)/k, y1=(c.top-b.top)/k, y2=(c.bottom-b.top)/k;
    (byPage[p.n]=byPage[p.n]||[]).push([x1,y1,x2,y2]);
  });
  const pages=Object.keys(byPage).map(Number).sort((a,b)=>a-b); if(!pages.length)return null;
  // merge rectangles on the same line, then convert to PDF points
  const out={};
  pages.forEach(n=>{
    const rs=byPage[n].sort((a,b)=>a[1]-b[1]||a[0]-b[0]), lines=[];
    rs.forEach(q=>{const L=lines.find(l=>Math.abs((l[1]+l[3])/2-(q[1]+q[3])/2)<Math.min(l[3]-l[1],q[3]-q[1])*.5&&q[0]<=l[2]+6&&q[2]>=l[0]-6);
      if(L){L[0]=Math.min(L[0],q[0]);L[1]=Math.min(L[1],q[1]);L[2]=Math.max(L[2],q[2]);L[3]=Math.max(L[3],q[3])}else lines.push(q.slice())});
    const vp=R.pages[n-1].vp1;
    out[n]=lines.map(([a,b,c,d])=>{const [px1,py1]=pdfPt(vp,a,b),[px2,py2]=pdfPt(vp,c,d);return [Math.min(px1,px2),Math.min(py1,py2),Math.max(px1,px2),Math.max(py1,py2)].map(v=>Math.round(v*100)/100)});
  });
  const last=all[all.length-1]||r.getBoundingClientRect();
  return {text,byPage:out,pages,anchor:{x:last.right,y:last.bottom,top:(all[0]||last).top}};
}

async function saveHighlightsToPdf(id){
  const x=S.docs[id]; if(!x||!x.pdf)return;
  const bar=$('#hlsave'); if(bar)bar.innerHTML=`<span class="spin"></span><span>Saving the highlighted PDF…</span>`;
  try{
    const a=await getAssets(); if(!a)throw new Error('assets');
    const orig=x.pdfOrig||x.pdf;
    const [PDFLib,buf]=await Promise.all([loadPdfLib(),fetch(pdfUrl(orig)).then(r=>{if(!r.ok)throw new Error('fetch');return r.arrayBuffer()})]);
    const {PDFDocument,PDFName,PDFHexString,PDFString,PDFNumber}=PDFLib;
    const doc=await PDFDocument.load(buf,{ignoreEncryption:true,updateMetadata:false});
    const ctx=doc.context, pages=doc.getPages();
    (x.highlights||[]).forEach(h=>{
      const page=pages[h.page-1]; if(!page||!h.rects.length)return;
      const col=(HLC.find(z=>z[0]===h.color)||HLC[0])[2];
      const bb=[Math.min(...h.rects.map(r=>r[0])),Math.min(...h.rects.map(r=>r[1])),Math.max(...h.rects.map(r=>r[2])),Math.max(...h.rects.map(r=>r[3]))];
      const quads=h.rects.flatMap(([x1,y1,x2,y2])=>[x1,y2,x2,y2,x1,y1,x2,y1]);
      const ops=`/GS0 gs ${col.map(v=>v.toFixed(3)).join(' ')} rg `+h.rects.map(([x1,y1,x2,y2])=>`${(x1-bb[0]).toFixed(2)} ${(y1-bb[1]).toFixed(2)} ${(x2-x1).toFixed(2)} ${(y2-y1).toFixed(2)} re`).join(' ')+' f';
      const gs=ctx.obj({Type:'ExtGState',BM:'Multiply',ca:1,CA:1});
      const ap=ctx.stream(ops,{Type:'XObject',Subtype:'Form',BBox:[0,0,bb[2]-bb[0],bb[3]-bb[1]],Matrix:[1,0,0,1,bb[0],bb[1]],Resources:{ExtGState:{GS0:gs}}});
      const annot=ctx.obj({Type:'Annot',Subtype:'Highlight',Rect:bb,QuadPoints:quads,C:col,CA:1,F:4,
        Contents:PDFHexString.fromText(h.text.slice(0,2000)),T:PDFHexString.fromText('Literature Notes'),NM:PDFString.of(h.id),M:PDFString.fromDate(new Date(h.at||Date.now())),
        AP:{N:ctx.register(ap)}});
      page.node.addAnnot(ctx.register(annot));
    });
    const bytes=await doc.save();
    const name=(orig.name||'paper.pdf').replace(/(\.pdf)?$/i,'')+'.pdf';
    const file=new File([bytes],name,{type:'application/pdf'});
    let res;
    try{res=await a.upload(file,{type:'application/pdf'})}catch(e){if(e&&e.code==='store_unavailable'){await new Promise(r=>setTimeout(r,1200));res=await a.upload(file,{type:'application/pdf'})}else throw e}
    const x2=S.docs[id]; if(!x2){a.delete(res.id).catch(()=>{});return}
    const prev=x2.pdfOrig?x2.pdf:null;
    if(!x2.pdfOrig)x2.pdfOrig=x2.pdf;
    x2.pdf={id:res.id,name,size:res.sizeBytes||bytes.length,addedAt:Date.now(),highlights:(x2.highlights||[]).length};
    x2.hlDirty=false; save(id);
    if(prev&&prev.id&&prev.id!==res.id&&prev.id!==x2.pdfOrig.id)a.delete(prev.id).catch(()=>{});
    delete TEXT[res.id];
    updateHlBar(); refreshPdfBox(id);
    const link=document.querySelector('#reader a[target="_blank"]'); if(link)link.href=pdfUrl(x2.pdf);
    toast('Saved — the PDF now opens with your highlights');
  }catch(e){
    console.warn(e); toast(e&&e.code?assetErr(e):'Could not save the highlighted PDF — try again'); updateHlBar();
  }
}

function quotesOf(x){
  const core=citeCore(x), out=[], seen=new Set();
  const re=/“([^”]{2,})”\s*\(([^()]+?)(?:,\s*((?:pp?|paras?)\.\s*[^)]+))?\)/g;

const AREA_ICON='<svg class="i" viewBox="0 0 24 24"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/><path d="M8 10h8M8 14h5"/></svg>';

async function ocrAvailable(){
  if(LOCAL&&LOCAL.ocr)return 'server';
  const smp=await getSample(); if(!smp||typeof smp.limits!=='function')return '';
  try{const l=await smp.limits();return l&&l.images?'claude':''}catch(e){return ''}
}
async function ocrImage(blob){
  const how=await ocrAvailable();
  if(how==='server'){
    const r=await fetch('/api/ocr?psm=6',{method:'POST',headers:{'Content-Type':'image/png'},body:blob});
    const j=await r.json().catch(()=>({})); if(!r.ok)throw Object.assign(new Error(j.message||'ocr'),{code:j.code||'ocr_failed'});
    return j.text||'';
  }
  if(how==='claude'){
    const smp=await getSample();
    const r=await smp('This image is a cropped passage from a scanned academic paper. Transcribe its text exactly as printed, in reading order. Join lines that belong to the same paragraph, and rejoin words split by a hyphen at a line break. Do not add, explain, summarise or correct anything. Reply with the text only.',{images:[blob],modelTier:'quick',cache:false});
    return (r&&r.text||'').trim();
  }
  throw Object.assign(new Error('no ocr'),{code:'no_ocr'});
}
/* render the boxed part of a page sharply (about 300 dpi) and return a PNG */
async function cropPage(n,[x1,y1,x2,y2]){
  const p=R.pages[n-1], page=await R.doc.getPage(n);
  const sc=Math.max(1,Math.min(300/72,Math.sqrt(36e6/(p.w*p.h))));
  const vp=page.getViewport({scale:sc});
  const c=document.createElement('canvas'); c.width=Math.ceil(vp.width); c.height=Math.ceil(vp.height);
  await page.render({canvas:c,canvasContext:c.getContext('2d'),viewport:vp}).promise;
  const pad=4, sx=Math.max(0,Math.floor(x1*sc)-pad), sy=Math.max(0,Math.floor(y1*sc)-pad);
  const w=Math.min(c.width-sx,Math.ceil((x2-x1)*sc)+pad*2), h=Math.min(c.height-sy,Math.ceil((y2-y1)*sc)+pad*2);
  const o=document.createElement('canvas'); o.width=w; o.height=h;
  const g=o.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,w,h); g.drawImage(c,sx,sy,w,h,0,0,w,h);
  c.width=c.height=0;
  return await new Promise(res=>o.toBlob(res,'image/png'));
}
async function readArea(n,r1){
  const p=R.pages[n-1]; if(!p||!p.vp1)return;
  const [ax,ay]=pdfPt(p.vp1,r1[0],r1[1]),[bx,by]=pdfPt(p.vp1,r1[2],r1[3]);
  const pdfRect=[Math.min(ax,bx),Math.min(ay,by),Math.max(ax,bx),Math.max(ay,by)].map(v=>Math.round(v*100)/100);
  const b=p.el.getBoundingClientRect(), k=b.width/p.w;
  const anchor={x:b.left+r1[2]*k,y:b.top+r1[3]*k,top:b.top+r1[1]*k};
  const info={text:'',byPage:{[n]:[pdfRect]},pages:[n],anchor,ocr:true,loading:true,tok:Math.random()};
  showPop(info);
  try{
    const blob=await cropPage(n,r1);
    const text=cleanSelText(await ocrImage(blob));
    if(!POP||POP.tok!==info.tok)return;   // closed meanwhile
    showPop({...info,loading:false,text:text||''});
    if(!text)toast('No text found in that area — try a slightly larger box');
  }catch(e){
    hidePop();
    toast(e&&e.code==='no_ocr'?(LOCAL?'Text recognition is not installed on this server — update the app to get it':'Reading scanned pages needs Claude access for this page — reload and choose Allow'):(e&&e.code?sampleErr(e)!=='Something went wrong — please try again.'?sampleErr(e):'Could not read the text in that area — try again':'Could not read the text in that area — try again'));
  }
}
function bindArea(box){
  if(box._abound)return; box._abound=true;
  let st=null;
  box.addEventListener('pointerdown',e=>{
    if(R.tool!=='area'||e.button!==0)return;
    const el=e.target.closest('.pg'); if(!el)return;
    e.preventDefault();
    const b=el.getBoundingClientRect();
    const d=document.createElement('div'); d.className='areabox'; el.appendChild(d);
    st={el,b,x:e.clientX-b.left,y:e.clientY-b.top,d,id:e.pointerId};
    box.setPointerCapture(e.pointerId);
    Object.assign(d.style,{left:st.x+'px',top:st.y+'px',width:'0px',height:'0px'});
  });
  box.addEventListener('pointermove',e=>{
    if(!st||e.pointerId!==st.id)return;
    const x=Math.min(Math.max(e.clientX-st.b.left,0),st.b.width), y=Math.min(Math.max(e.clientY-st.b.top,0),st.b.height);
    Object.assign(st.d.style,{left:Math.min(x,st.x)+'px',top:Math.min(y,st.y)+'px',width:Math.abs(x-st.x)+'px',height:Math.abs(y-st.y)+'px'});
  });
  const end=e=>{
    if(!st||e.pointerId!==st.id)return;
    const s0=st; st=null; try{box.releasePointerCapture(e.pointerId)}catch(_){}
    const L=parseFloat(s0.d.style.left),T=parseFloat(s0.d.style.top),W=parseFloat(s0.d.style.width),H=parseFloat(s0.d.style.height);
    setTimeout(()=>s0.d.remove(),e.type==='pointerup'&&W>10&&H>8?1200:0);
    if(e.type!=='pointerup'||W<=10||H<=8)return;
    const n=+s0.el.dataset.n, p=R.pages[n-1], k=s0.b.width/p.w;
    readArea(n,[L/k,T/k,(L+W)/k,(T+H)/k]);
  };
  box.addEventListener('pointerup',end); box.addEventListener('pointercancel',end);
}

/* ============================================================
   IDEAS — quick thoughts while reading, kept in one notebook
   doc: {kind:'idea', text, tags:[], paperId, projectId, page, createdAt}
   ============================================================ */
const IDEA_TAGS=['Theme','Concept','Method','Gap','Doubt','Curious','Question','To do'];
const IDEA_COL={Theme:'#7c5cff',Concept:'#2f8cff',Method:'#13a89e',Gap:'#e0703a',Doubt:'#d64545',Curious:'#c25bd6',Question:'#c99a06','To do':'#5b6b84'};
const ideaColor=t=>IDEA_COL[t]||'#6b7280';
/* types that get a name: which theme, which concept… (linked to the project's tags of the same kind) */
const IDEA_NAMED={Theme:'theme',Concept:'concept',Method:'method',Gap:null};
function ideaNames(type,pid,study){
  const set=new Map();
  ideasAll().filter(i=>isStudyIdea(i)===!!study).forEach(i=>{const n=i.named&&i.named[type];if(n)set.set(n.toLowerCase(),n)});
  const dim=IDEA_NAMED[type]; if(dim&&pid&&typeof tagsOf==='function')tagsOf(pid,dim).forEach(t=>{if(!set.has(t.name.toLowerCase()))set.set(t.name.toLowerCase(),t.name)});
  return [...set.values()].sort((a,b)=>a.localeCompare(b));
}
const ideaLabel=(i,t)=>i.named&&i.named[t]?`${t}: ${i.named[t]}`:t;
const isStudyIdea=i=>!!(i&&(i.lectureId||i.courseId));
const ideasAll=()=>Object.entries(S.docs).filter(([k,v])=>v&&v.kind==='idea').map(([k,v])=>({id:k,...v})).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
/* which ideas a document in Write may use */
function ideaInDraft(i){
  const d=S.docs[V.draftId]||{}, a=d.assignmentId&&S.docs[d.assignmentId], cid=a&&a.courseId;
  if(isStudyIdea(i))return !!cid&&i.courseId===cid;
  return d.projectId?(i.projectId===d.projectId||!i.projectId):!i.projectId;
}
function ideaTagList(){const set=new Set(IDEA_TAGS);ideasAll().forEach(i=>(i.tags||[]).forEach(t=>set.add(t)));return [...set]}
function ideaSource(i){if(!i.paperId&&i.lectureId&&S.docs[i.lectureId]){const l=S.docs[i.lectureId],c=S.docs[l.courseId]||{};return {lecture:true,lectureId:i.lectureId,cite:`${c.code||c.name||'Lecture'}, ${longDate(l.date)}`}}const x=i.paperId&&S.docs[i.paperId];if(!x)return null;return {x:{id:i.paperId,...x},cite:citeCore({id:i.paperId,...x})+(i.page?', '+pageStr(i.page):'')}}

/* the page currently on screen in the reader, as a printed page number */
function readerPage(x){
  if(!R.pages||!R.pages.length||!$('#rpages'))return '';
  const box=$('#rpages').getBoundingClientRect(); let best=null,bd=1e9;
  R.pages.forEach(p=>{if(!p.el)return;const r=p.el.getBoundingClientRect();const d=Math.abs(r.top+r.height/2-(box.top+box.height/2));if(d<bd){bd=d;best=p}});
  return best?printedPage(x,best.n):'';
}

/* ============================================================
   DOI / LINK LOOKUP and WEB SOURCES
   - DOI → CrossRef (server, or CrossRef directly)
   - link → the page's own citation details (self-hosted server fetches it)
   - link to a PDF, or a page that offers its PDF → the PDF is attached
   - web pages are kept as a clean, readable copy: paper.web = {url,title,site,html,text,fetchedAt}
   ============================================================ */
function doiFrom(q){
  let s=String(q||'').trim(); try{s=decodeURIComponent(s)}catch(e){}
  const m=s.match(DOI_RE); return m?cleanDoi(m[1].replace(/[?#].*$/,'').replace(/\/(full|abstract|pdf|epdf|html)$/i,'')):'';
}
const isLink=q=>/^https?:\/\/\S+\.\S+/i.test(String(q||'').trim())||/^www\.\S+\.\S+/i.test(String(q||'').trim());
const normLink=q=>{q=String(q||'').trim();return /^www\./i.test(q)?'https://'+q:q};
function crossrefToRefClient(m){
  const first=a=>Array.isArray(a)?(a[0]||''):(a||'');
  const dec=s=>{const d=document.createElement('textarea');d.innerHTML=String(s||'').replace(/<[^>]+>/g,'');return d.value.trim()};
  const t=m.type||'', container=dec(first(m['container-title']));
  let type='journal';
  if(['book','monograph','edited-book','reference-book'].includes(t))type='book';
  else if(['book-chapter','book-section','book-part','reference-entry'].includes(t))type='chapter';
  else if(['report','report-component','posted-content'].includes(t))type='report';
  else if(t==='proceedings-article')type=container?'chapter':'conference';
  else if(t==='dissertation')type='thesis';
  const people=l=>(l||[]).map(a=>a.family?{family:a.family,given:a.given||'',org:false}:a.name?{family:a.name,given:'',org:true}:null).filter(Boolean);
  const dp=((m['published-print']||m['published-online']||m.issued||{})['date-parts']||[[]])[0]||[];
  const ref={type,authors:people(m.author),editors:people(m.editor),year:dp[0]?String(dp[0]):'',month:dp[1]?String(dp[1]):'',day:dp[2]?String(dp[2]):'',
    title:dec(first(m.title))+(first(m.subtitle)?': '+dec(first(m.subtitle)):''),doi:m.DOI||'',publisher:dec(m.publisher)};
  if(type==='journal')Object.assign(ref,{journal:container,volume:m.volume||'',issue:m.issue||'',pages:m.page||'',articleNo:m['article-number']||''});
  if(type==='chapter')Object.assign(ref,{bookTitle:container,pages:m.page||''});
  return ref;
}
async function doiLookup(doi){

  let root=[...d.querySelectorAll('article,main,[role="main"],[itemprop="articleBody"],.article-body,.entry-content,.post-content')].sort((a,b)=>plen(b)-plen(a))[0];
  if(!root||plen(root)<400){

    d.querySelectorAll('p').forEach(p=>{const L=p.textContent.trim().length;if(L<40)return;const a=p.parentElement,b=a&&a.parentElement;if(a)score.set(a,(score.get(a)||0)+L);if(b)score.set(b,(score.get(b)||0)+L/2)});

  const h=out.querySelector('h2'); if(h&&title&&h.textContent.trim().toLowerCase()===title.toLowerCase())h.remove();

  }

    if(doi){const patch=await doiLookup(doi);return {patch,source:'crossref',doi}}

  const isWebSource=!pw.doi&&patch.type!=='journal';

  return {patch,source,doi:pw.doi,pdfFile,web:isWebSource||!pdfFile?web:null};
}

function slotsAll(){
  const out=[];
  coursesAll().forEach(c=>{
    (c.schedule||[]).forEach(s=>out.push({...s,courseId:c.id,unitId:null}));
    unitsOf(c.id).forEach(u=>(u.schedule||[]).forEach(s=>out.push({...s,courseId:c.id,unitId:u.id})));
  });
  return out.filter(s=>hm2min(s.start)!=null&&(s.date||(s.day!==''&&s.day!=null))).map(s=>({...s,day:s.date?new Date(s.date+'T12:00:00').getDay():+s.day}));
}
/* a class time is a date (once) or a date that repeats weekly; old rows with only a weekday repeat all term */
function slotOn(s,iso){
  const c=S.docs[s.courseId]||{};
  if(s.date){
    if(s.repeat!=='weekly')return iso===s.date;
    if(iso<s.date||(s.until&&iso>s.until)||(!s.until&&!inTerm(c,iso)))return false;
    return daysBetween(s.date,iso)%7===0;
  }
  return new Date(iso+'T12:00:00').getDay()===s.day&&inTerm(c,iso);
}
const shortDate=iso=>new Date(iso+'T12:00:00').toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'});
function slotLabel(s){
  if(!s.date)return `${DAYS_S[+s.day]} ${s.start}–${s.end||''}`;
  if(s.repeat==='weekly')return `${DAYS_S[new Date(s.date+'T12:00:00').getDay()]}s ${s.start}–${s.end||''}, from ${shortDate(s.date)}${s.until?' to '+shortDate(s.until):''}`;
  return `${shortDate(s.date)} ${s.start}–${s.end||''}`;
}
/* upcoming class times of a course (or unit), soonest first */
function upcomingSlots(slots,n){
  const t=todayISO(), out=[];
  for(let i=0;i<180&&out.length<n;i++){const d=addDays(t,i);slots.filter(s=>slotOn(s,d)).sort((a,b)=>hm2min(a.start)-hm2min(b.start)).forEach(s=>{if(i===0&&(hm2min(s.end)||hm2min(s.start)+60)<=hm2min(nowHM()))return;if(out.length<n)out.push({s,date:d})})}
  return out;
}
const inTerm=(c,iso)=>(!c.termStart||iso>=c.termStart)&&(!c.termEnd||iso<=c.termEnd);
function classesOn(iso){
  return slotsAll().filter(s=>slotOn(s,iso)).sort((a,b)=>hm2min(a.start)-hm2min(b.start));
}
function nextClass(){
  const t=todayISO(), now=hm2min(nowHM());
  for(let i=0;i<120;i++){
    const iso=addDays(t,i);
    const list=classesOn(iso);
    for(const s of list){
      const st=hm2min(s.start), en=hm2min(s.end)||st+60;
      if(i===0&&en<=now)continue;
      return {slot:s,date:iso,state:i===0&&st<=now?'now':i===0?'today':'later'};
    }
  }
  return null;
}
function clashes(occ){
  const sl=occ||weekOcc(0), out=[];
  for(let i=0;i<sl.length;i++)for(let j=i+1;j<sl.length;j++){const a=sl[i],b=sl[j];if(a.date!==b.date)continue;const a1=hm2min(a.start),a2=hm2min(a.end)||a1+60,b1=hm2min(b.start),b2=hm2min(b.end)||b1+60;if(a1<b2&&b1<a2)out.push([a,b])}
  return out;
}
const weekStart=off=>{const d=new Date(todayISO()+'T12:00:00');d.setDate(d.getDate()-((d.getDay()+6)%7)+7*(off||0));return isoOf(d)};
function weekOcc(off){const m=weekStart(off),out=[];for(let i=0;i<7;i++){const d=addDays(m,i);slotsAll().forEach(s=>{if(slotOn(s,d))out.push({...s,date:d})})}return out}
const slotName=s=>{const c=S.docs[s.courseId]||{},u=unitOf(s.unitId);return (c.code||c.name||'Course')+(u?' · '+(u.code||u.name):'')};

/* ---------- small marks found in lecture notes ---------- */
const MARKS=[['q','help','Question to ask','#2f8cff'],['imp','star','Important','#d9a400'],['rev','repeat','Review later','#13a89e']];
function hashStr(s){let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return 'k'+(h>>>0).toString(36)}
function marksOf(l,kind){
  const t=document.createElement('template'); t.innerHTML=(l.html||'')+(l.cues||'');
  return [...t.content.querySelectorAll('span.mk-'+kind)].map(e=>e.textContent.trim()).filter(Boolean);
}
function cardsOf(l){
  const out=[];
  String((l.text||'')+'\n'+(l.cuesText||'')).split(/\n/).forEach(line=>{const m=line.match(/^\s*(?:[-•*]\s*)?(.{1,160}?)\s*::\s*(.{1,600})$/);if(m&&trim(m[1])&&trim(m[2]))out.push({front:trim(m[1]),back:trim(m[2])})});
  (l.fc||[]).forEach(k=>{if(trim(k.front)&&trim(k.back))out.push({front:k.front,back:k.back,id:k.id})});
  return out;
}
/* important ideas: words marked ⭐ in the notes, plus ideas and reflections typed in the panel */
function importantOf(l){return [...marksOf(l,'imp').map(t=>({text:t,marked:true})),...(l.important||[]).map(x=>({...x}))]
}
const SR_STEPS=[1,3,7,14,30,60];
function srState(l,bag,key){const o=(l[bag]||{})[key];return o||{s:0,n:addDays(l.date||todayISO(),1)}}
function srAdvance(lid,bag,key,good){
  const l=S.docs[lid]; if(!l)return; l[bag]=l[bag]||{};
  const o=l[bag][key]||{s:0}; const s=good?Math.min((o.s||0)+1,SR_STEPS.length):0;
  l[bag][key]={s,n:addDays(todayISO(),good?SR_STEPS[Math.min(s,SR_STEPS.length)-1]||60:1)}; save(lid);
}
function dueReviews(cid){
  const t=todayISO(), out=[];
  lecturesOf(cid).forEach(l=>{
    marksOf(l,'rev').forEach(txt=>{const key=hashStr(txt),st=srState(l,'rev',key);if(st.n<=t&&st.s<SR_STEPS.length)out.push({type:'point',l,key,text:txt,st})});
    cardsOf(l).forEach(c=>{const key=hashStr(c.front+'::'+c.back),st=srState(l,'cards',key);if(st.n<=t&&st.s<SR_STEPS.length)out.push({type:'card',l,key,card:c,st})});
  });
  return out;
}

  const draw=()=>{
    const todays=lecturesOf(cid,units.length?(uSel||undefined):undefined).filter(l=>l.date===todayISO()&&!l.missed);
    const prev=lecturesOf(cid,uSel||null).filter(l=>!l.missed&&!todays.some(t=>t.id===l.id)&&l.date<=todayISO()).slice(0,5);

    ${prev.length?`<div class="field"><label>Continue a previous note</label><div class="contlist">${prev.map(l=>`<button class="controw" data-cont="${l.id}"><b>${esc(l.topic||'Untitled lecture')}</b>${l.subtopic?`<span>${esc(l.subtopic)}</span>`:''}<em>${esc(longDate(l.date))}</em></button>`).join('')}</div><div class="help">Continuing adds today's date inside that note, so the topic stays in one place.</div></div><div class="ordiv"><span>or</span></div>`:''}

function attendance(c,unitId){
  const ls=lecturesOf(c.id,unitId===undefined?undefined:unitId);
  const slots=slotsAll().filter(s=>s.courseId===c.id&&(unitId===undefined||unitId==='all'||(s.unitId||null)===(unitId||null)));
  if(!slots.length)return null;
  const t=todayISO(), first=[c.termStart,...slots.map(s=>s.date)].filter(Boolean).sort()[0]; if(!first)return null;
  const end=c.termEnd&&c.termEnd<t?c.termEnd:t, missing=[];let held=0;
  for(let d=first;d<=end;d=addDays(d,1)){slots.filter(s=>slotOn(s,d)).forEach(s=>{if(d===t&&hm2min(s.end||s.start)>hm2min(nowHM()))return;held++;const has=ls.some(l=>!(l.planned&&!trim(l.text||''))&&(l.date===d||(l.sessions||[]).includes(d))&&(unitId!==undefined||(l.unitId||null)===(s.unitId||null)));if(!has)missing.push({date:d,slot:s})})}
  return {held,attended:held-missing.length,missing};
}

/* calendar file for phones / Google Calendar */
function icsExport(){
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Literature Notes//Courses//EN','CALSCALE:GREGORIAN'];
  const dt=(iso,hm)=>iso.replace(/-/g,'')+(hm?'T'+hm.replace(':','')+'00':'');
  const tx=s=>String(s||'').replace(/[\\;,]/g,m=>'\\'+m).replace(/\n/g,'\\n');
  const stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
  const ev=(uidv,start,end,summary,loc,extra)=>{L.push('BEGIN:VEVENT','UID:'+uidv+'@literature-notes','DTSTAMP:'+stamp,...(start.length===8?['DTSTART;VALUE=DATE:'+start]:['DTSTART:'+start,'DTEND:'+end]),'SUMMARY:'+tx(summary),...(loc?['LOCATION:'+tx(loc)]:[]),...(extra||[]),'END:VEVENT')};
  coursesAll().forEach(c=>{
    const term0=c.termStart||todayISO();
    slotsAll().filter(s=>s.courseId===c.id).forEach((s,i)=>{let d=s.date||term0;if(!s.date)for(let k=0;k<7&&new Date(d+'T12:00:00').getDay()!==s.day;k++)d=addDays(d,1);
      const weekly=!s.date||s.repeat==='weekly', until=s.until||c.termEnd;
      ev(`class-${c.id}-${s.unitId||'c'}-${i}-${d}`,dt(d,s.start),dt(d,s.end||s.start),slotName(s),s.room,weekly?[until?'RRULE:FREQ=WEEKLY;UNTIL='+dt(until)+'T235959':'RRULE:FREQ=WEEKLY;COUNT=15']:[])});
  });
  assignmentsOf().forEach(a=>{if(!a.due)return;const c=S.docs[a.courseId]||{};const alarm=['BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+tx('Due soon: '+(a.title||'Assignment')),'TRIGGER:-P2D','END:VALARM'];
    ev('assign-'+a.id,a.dueTime?dt(a.due,a.dueTime):dt(a.due),a.dueTime?dt(a.due,a.dueTime):'','Due: '+(a.title||'Assignment')+' ('+(c.code||c.name||'')+')','',alarm)});
  eventsOf().forEach(e=>{if(!e.date)return;const c=S.docs[e.courseId]||{};const end=e.time?(()=>{const m=hm2min(e.time)+120;return pad2(Math.floor(m/60)%24)+':'+pad2(m%60)})():'';
    ev('event-'+e.id,e.time?dt(e.date,e.time):dt(e.date),e.time?dt(e.date,end):'',(e.type?e.type[0].toUpperCase()+e.type.slice(1)+': ':'')+e.title+' ('+(c.code||c.name||'')+')',e.room,['BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+tx(e.title),'TRIGGER:-P1D','END:VALARM'])});
  L.push('END:VCALENDAR');
  offerDownload('my-courses.ics',new Blob([L.join('\r\n')],{type:'text/calendar'}),L.join('\n'));
}

function timerStart(cid,mins){ST.run={start:Date.now(),courseId:cid,mins:mins||0};try{localStorage.setItem('litnotes.timer',JSON.stringify(ST.run))}catch(e){};drawTimer();toast(mins?`Focus for ${mins} minutes — you've got this`:'Study timer started')}

}

}

const EXPORT_CSS=`.crd{display:inline-block;font-size:9pt;color:#6b7280;margin-bottom:2pt}.crd b{font-size:9pt;color:#6b7280;margin-right:3pt}.crlh .sub{margin:0;color:#4b5563}.crqa{border:1px solid #e5e7eb;padding:6pt 10pt;margin:0 0 6pt}.crqa p{margin:0}.crqa .q span{color:#6b7280;margin-right:6pt}.crqa .a{margin-top:3pt;color:#374151}.crqa .a.open{font-style:italic;color:#9ca3af}.crfc div{margin:0 0 4pt}.crfc dt{font-weight:bold;display:inline}.crfc dt:after{content:' — '}.crfc dd{display:inline;margin:0}.crtoc{background:#f3f4f6;padding:8pt 12pt}.crsum{border-left:3px solid #f6e49b;padding-left:10pt}section.crlec{border-top:1px solid #e5e7eb;padding-top:10pt;margin-top:14pt}body{font-family:Calibri,Arial,sans-serif;font-size:11.5pt;line-height:1.45;color:#1f2328;max-width:780px;margin:30px auto;padding:0 20px}h1{font-size:20pt;margin:0 0 4pt}h2{font-size:15pt;margin:18pt 0 4pt;border-bottom:1px solid #ccc;padding-bottom:3pt}h3{font-size:12.5pt;margin:12pt 0 3pt}.meta{color:#666;font-size:10pt;margin:0 0 8pt}table{border-collapse:collapse;width:100%;margin:6pt 0}td,th{border:1px solid #bbb;padding:4pt 6pt;text-align:left;vertical-align:top}th{background:#f1f1f1}.mk-q{background:#dcecff}.mk-imp{background:#fff1b8}.mk-rev{background:#d6f4ef}mark{background:#fff59d}img{max-width:100%}.al-center{text-align:center}.al-right{text-align:right}.al-justify{text-align:justify}hr.pb{page-break-after:always;border:0}@media print{body{margin:0}}`;
async function exportDoc(title,body,fmt,extraCss){

async function findChapters(m,onProgress){
  const lib=await loadPdfjs(); const data=await (await fetch(pdfUrl(m.pdf))).arrayBuffer();
  const doc=await lib.getDocument({data,isEvalSupported:false,...PDFJS_EXTRA}).promise;

  for(let i=1;i<=N;i++){const pg=await doc.getPage(i);const tc=await pg.getTextContent();pages.push(tc.items.map(it=>it.str+(it.hasEOL?'\n':' ')).join(''));if(onProgress&&i%10===0)onProgress(i,N)}

  // printed page numbers: a short number line near the top or bottom of the page
  const offs={}; pages.forEach((t,i)=>{const L=lines(t);[...L.slice(0,3),...L.slice(-3)].forEach(x=>{const mm=x.match(/^(\d{1,4})$|^(\d{1,4})\s{0,3}\S.{0,60}$|^.{0,60}\S\s{0,3}(\d{1,4})$/);const v=mm&&+(mm[1]||mm[2]||mm[3]);if(v&&v<=N&&i+1-v>=0)offs[i+1-v]=(offs[i+1-v]||0)+1})});
  const best=Object.entries(offs).sort((a,b)=>b[1]-a[1])[0]; const offset=best&&best[1]>=Math.max(4,N*0.15)?+best[0]:null;
  // the contents list
  const ti=pages.findIndex((t,i)=>i<30&&/^\s*(table of )?contents\b/im.test(t));
  const entries=[];
  if(ti>=0){
    let L=[];for(let i=ti;i<Math.min(ti+4,N);i++){const ls=lines(pages[i]);if(i>ti&&!ls.some(x=>/^\d{1,2}\.\s+\S/.test(x)))break;L=L.concat(ls)}
    let cur=null;
    const push=()=>{if(!cur)return;const ls=cur.lines;let k=-1;for(let q=ls.length-1;q>=0;q--){const x=ls[q].replace(/\s+\d{1,4}$/,'');if(chPeople(x).length&&x.split(/\s+/).length<=12&&!/[:?‘’“”]/.test(x)&&!/\b(of|the|in|and the|for|from|on|to|a)\s/.test(' '+x.toLowerCase().replace(/\band\b/g,'')+' ')){k=q;break}}
      const tl=k>=0?ls.slice(0,k):ls; cur.authors=k>=0?chPeople(ls[k].replace(/\s+\d{1,4}$/,'')):[];
      cur.title=[cur.title].concat(tl).join(' ').replace(/\s+/g,' ').replace(/\s+([ivxlc]+|\d{1,4})$/i,'').replace(/[\s.]+$/,'').trim(); delete cur.lines;
      if(cur.title)entries.push(cur); cur=null};
    for(const x of L){
      if(/^(table of )?contents$/i.test(x)||/^part\s+[ivxlc\d]+\b/i.test(x)||/^[ivxlc]+$/i.test(x)||/^\d{1,4}$/.test(x)||/^[A-Z][A-Z ,'’-]{6,}$/.test(x)||/\d{1,2}\/\d{1,2}\/\d{2}/.test(x)||/\bpre\s+[ivxlc]+$/i.test(x)){continue}
      const num=x.match(/^(\d{1,2})\.?\s+(\S.*)$/), named=x.match(/^(Introduction|Foreword|Preface|Conclusion|Afterword|Epilogue|Prologue|Acknowledgements|Contributors|Index)\b:?\s*(.*)$/i);
      if(num||named){push();cur={num:num?+num[1]:null,title:(num?num[2]:x).replace(/\s+\d{1,4}$/,''),lines:[],front:!!named&&!/^(introduction|conclusion|epilogue|afterword|prologue)/i.test(x)};continue}
      if(cur&&x.length<160)cur.lines.push(x);
    }
    push();
  }
  // where each chapter starts: the first page after the contents whose top carries the title
  const norm=t=>t.toLowerCase().replace(/[^\p{L}\d ]+/gu,' ').replace(/\s+/g,' ').trim();
  let from=Math.max(ti+1,1);
  entries.forEach(e=>{

  });

/* "Leftwich_A._2011._Theorizing_the_State._In_P._Burnell_V._Randall_eds._Politics_in_the_Developing_World._Oxford_..._pp._223-240.pdf" → a reference */
function refFromFilename(fn){
  let t=String(fn||'').replace(/\.pdf$/i,'').replace(/[_+]+/g,' ').replace(/\s+/g,' ').trim().replace(/^(read|reading|required|compulsory|optional|week\s*\d+|wk\s*\d+)\b[\s:.-]*/i,'');
  const m=t.match(/^((?:[A-Z][\p{L}'’-]+,?\s+(?:[A-Z]\.\s*){1,3}(?:,|&|and)?\s*)+)\(?((?:1[89]|20)\d{2}[a-z]?)\)?\.?\s+(.+)$/u);
  if(!m)return null;
  const authors=[...m[1].matchAll(/([A-Z][\p{L}'’-]+),?\s+((?:[A-Z]\.\s*){1,3})/gu)].map(a=>({family:a[1],given:a[2].trim(),org:false}));
  let rest=m[3].trim(), r={authors,year:m[2]};
  const inb=rest.match(/^(.+?)\.?\s+In:?\s+(.+)$/);
  if(inb){
    r.type='chapter'; r.title=inb[1].trim();
    let b=inb[2]; const pp=b.match(/\bpp?\.?\s*(\d+\s*[-–]\s*\d+)/); if(pp){r.pages=pp[1].replace(/\s*[-–]\s*/,'–');b=b.slice(0,pp.index)}
    const ed=b.match(/^(.+?)\(?\beds?\.?\)?\.?\s+(.+)$/);
    if(ed){r.editors=[...ed[1].matchAll(/((?:[A-Z]\.\s*){1,3})\s*([A-Z][\p{L}'’-]+)/gu)].map(a=>({family:a[2],given:a[1].trim(),org:false}));b=ed[2]}
    const parts=b.split(/\.\s+/).map(x=>x.trim()).filter(Boolean);
    if(parts.length){r.bookTitle=parts[0].replace(/\.$/,'');const pub=parts.slice(1).join('. ').replace(/^[A-Z][a-z]+\s+(?=[A-Z])/,'');if(pub)r.publisher=pub.replace(/[.,\s]+$/,'')}
  }else{r.type='journal';r.title=rest.split(/\.\s+/)[0].replace(/\.$/,'').trim()}
  if(!r.title||r.title.length<3||!authors.length)return null;
  return r;
}

/* ============================================================

  const w=flNum(img,'w',img.offsetWidth), h=img.getAttribute('data-h')?flNum(img,'h',0):img.offsetHeight*(w/(img.offsetWidth||w)||1);
  const x=flNum(img,'x',0), y=flNum(img,'y',0), r=flNum(img,'r',0);
  return {ed,er,w,h:h||img.offsetHeight,x,y,r,cx:er.left+ed.clientLeft+x+w/2-ed.scrollLeft,cy:er.top+ed.clientTop+y+(h||img.offsetHeight)/2-ed.scrollTop};
}
function flPlace(){
  if(!FL)return; if(!document.contains(FL.img)){flDeselect();return}
  const g=flGeom(FL.img), f=FL.frame;
  f.style.width=g.w+'px'; f.style.height=g.h+'px'; f.style.left=(g.cx-g.w/2)+'px'; f.style.top=(g.cy-g.h/2)+'px'; f.style.transform=`rotate(${g.r}deg)`;
  if(FL.bar){FL.bar.style.left=Math.max(8,Math.min(innerWidth-FL.bar.offsetWidth-8,g.cx-FL.bar.offsetWidth/2))+'px';const top=g.cy-Math.max(g.w,g.h)/2-FL.bar.offsetHeight-26;FL.bar.style.top=(top<8?g.cy+Math.max(g.w,g.h)/2+18:top)+'px'}
  const rl=f.querySelector('.flrot-l'); if(rl)rl.textContent=Math.round(g.r)+'°';
}
function flSelect(img){
  if(FL&&FL.img===img){flPlace();return}
  flDeselect(); hideFloat();
  const ed=flEditorOf(img); if(!ed)return;
  const frame=document.createElement('div'); frame.className='flframe';
  frame.innerHTML=['nw','n','ne','e','se','s','sw','w'].map(k=>`<i class="flh h-${k}" data-h="${k}"></i>`).join('')+'<i class="flrot" data-h="rot" title="Drag to rotate (hold Shift for 15° steps)"></i><span class="flrot-l"></span>';
  document.body.appendChild(frame);
  const doc=richDoc()||{}, id=(img.getAttribute('src')||'').split('/').pop(), fig=(doc.figs||{})[id];
  const bar=document.createElement('div'); bar.className='floatbar flbar';
  bar.innerHTML=`<button data-fl="inline" title="Put it back in line with the text">In line</button><span class="sep"></span><button data-fl="r-15" title="Rotate left 15°">⟲</button><button data-fl="r15" title="Rotate right 15°">⟳</button><button data-fl="r0" title="No rotation">0°</button><button data-fl="ratio" title="Restore the original proportions">1:1</button><span class="sep"></span><button data-fl="front" title="Bring to front">Front</button><button data-fl="back" title="Send behind other objects">Back</button><button data-fl="dup" title="Duplicate">Copy</button>${fig?'<button data-fl="edit">Edit</button>':''}<span class="sep"></span><button data-fl="del" title="Delete">${ico('trash')}</button>`;
  document.body.appendChild(bar);
  FL={img,ed,frame,bar};
  bar.addEventListener('mousedown',e=>e.preventDefault());
  bar.addEventListener('click',e=>{const b=e.target.closest('[data-fl]');if(!b)return;const k=b.dataset.fl;
    if(k==='del'){img.remove();flDeselect();flCommit(ed);return}
    if(k==='inline'){['fl'].forEach(c=>img.classList.remove(c));['x','y','w','h','r'].forEach(a=>img.removeAttribute('data-'+a));img.removeAttribute('style');flDeselect();flCommit(ed);return}
    if(k==='edit'&&fig){flDeselect();figureDialog(fig.kind,{...fig,img});return}
    if(k==='r0')img.setAttribute('data-r','0');
    if(k==='r15'||k==='r-15')img.setAttribute('data-r',((flNum(img,'r',0)+(k==='r15'?15:-15))%360+360)%360);
    if(k==='ratio')img.removeAttribute('data-h');
    if(k==='front'){const all=[...ed.querySelectorAll('img.fl')];const z=Math.max(0,...all.map(i=>flNum(i,'z',0)))+1;img.setAttribute('data-z',z)}
    if(k==='back'){img.setAttribute('data-z','0');const p=img.parentNode;p.insertBefore(img,p.firstChild)}
    if(k==='dup'){const c=img.cloneNode(true);c.removeAttribute('style');c.setAttribute('data-x',flNum(img,'x',0)+24);c.setAttribute('data-y',flNum(img,'y',0)+24);img.after(c);layoutFloats(ed);flCommit(ed);flSelect(c);return}
    layoutFloats(ed); flPlace(); flCommit(ed);
  });
  frame.addEventListener('pointerdown',e=>{const h=e.target.closest('[data-h]');flDrag(e,h?h.dataset.h:'move')});
  document.addEventListener('keydown',flKey,true);
  requestAnimationFrame(flPlace);
}
function flDrag(e,mode){
  if(!FL)return; e.preventDefault(); e.stopPropagation();
  const img=FL.img, ed=FL.ed, hadH=img.hasAttribute('data-h'), g0=flGeom(img), sx=e.clientX, sy=e.clientY, ratio=g0.h/g0.w;
  const rad=g0.r*Math.PI/180, cos=Math.cos(rad), sin=Math.sin(rad);
  const tgt=e.target; try{tgt.setPointerCapture(e.pointerId)}catch(_){}
  document.body.classList.add('dragging');
  const mv=ev=>{
    const dx=ev.clientX-sx, dy=ev.clientY-sy;
    if(mode==='move'){img.setAttribute('data-x',Math.round(Math.max(-g0.w/2,Math.min(ed.clientWidth-g0.w/2,g0.x+dx))));img.setAttribute('data-y',Math.round(Math.max(0,g0.y+dy)))}
    else if(mode==='rot'){let a=Math.atan2(ev.clientY-g0.cy,ev.clientX-g0.cx)*180/Math.PI+90;if(ev.shiftKey)a=Math.round(a/15)*15;else{const n=Math.round(a/45)*45;if(Math.abs(a-n)<4)a=n}img.setAttribute('data-r',Math.round(((a%360)+360)%360))}
    else{
      const lx=dx*cos+dy*sin, ly=-dx*sin+dy*cos;        // pointer movement in the object's own (unrotated) frame
      const hx=/e/.test(mode)?1:/w/.test(mode)?-1:0, hy=/s/.test(mode)?1:/n/.test(mode)?-1:0;
      let w=g0.w+hx*lx, h=g0.h+hy*ly;
      if(hx&&hy&&!ev.shiftKey){const k=Math.max(w/g0.w,h/g0.h);w=g0.w*k;h=g0.h*k}      // corners keep the proportions (Shift: free)
      if(!hx)w=g0.w; if(!hy)h=g0.h; w=Math.max(FL_MIN,w); h=Math.max(FL_MIN,h);
      // keep the opposite edge or corner where it was
      const dwl=(w-g0.w)/2*hx, dhl=(h-g0.h)/2*hy;
      const ccx=g0.x+g0.w/2+dwl*cos-dhl*sin, ccy=g0.y+g0.h/2+dwl*sin+dhl*cos;
      img.setAttribute('data-w',Math.round(w));
      if(hx&&hy&&!ev.shiftKey&&!hadH)img.removeAttribute('data-h'); else img.setAttribute('data-h',Math.round(h));
      img.setAttribute('data-x',Math.round(ccx-w/2)); img.setAttribute('data-y',Math.round(Math.max(0,ccy-h/2)));
    }
    layoutFloats(ed); flPlace();
  };
  const up=()=>{document.body.classList.remove('dragging');tgt.removeEventListener('pointermove',mv);tgt.removeEventListener('pointerup',up);tgt.removeEventListener('pointercancel',up);flCommit(ed)};
  tgt.addEventListener('pointermove',mv); tgt.addEventListener('pointerup',up); tgt.addEventListener('pointercancel',up);
}
/* clicking or dragging a free object in an editor */
function bindFloatsIn(ed){
  layoutFloats(ed);
  ed.addEventListener('pointerdown',e=>{const img=e.target.closest('img.fl');if(!img)return;e.preventDefault();flSelect(img);flDrag(e,'move')});
  ed.addEventListener('dragstart',e=>{if(e.target.closest&&e.target.closest('img.fl'))e.preventDefault()});
  ed.addEventListener('click',e=>{if(!e.target.closest('img.fl'))flDeselect()});
  ed.addEventListener('input',()=>{if(FL)requestAnimationFrame(flPlace)});
}
document.addEventListener('scroll',()=>{if(FL)flPlace()},{passive:true,capture:true});
window.addEventListener('resize',()=>{if(FL)flPlace()});
document.addEventListener('pointerdown',e=>{if(FL&&!e.target.closest('.flframe,.flbar,img.fl'))flDeselect()},true);

/* ============================================================
   SKETCH PAD: pen, highlighter, erasers, shapes, text, select & move, undo
   Saved as vector strokes (so it stays editable) plus a picture.
   sketch {kind:'sketch', name, courseId, unitId, lectureId, bg, items:[…], png:{id}, w, h, createdAt, updatedAt}
   item: {t:'pen'|'hl'|'erase', c, s, p:[[x,y,pressure]…]} | {t:'line'|'arrow'|'rect'|'ellipse', c, s, f, a:[x1,y1,x2,y2]} | {t:'text', c, s, x, y, text}
   ============================================================ */
const SK_W=1600, SK_H=1000;
const SK_COLORS=['#111827','#2563eb','#dc2626','#16a34a','#ea580c','#9333ea','#0891b2','#ca8a04','#ffffff'];
const SK_TOOLS=[['pen','pen','Pen (P)'],['hl','marker','Highlighter (H)'],['erase','eraser','Eraser: rub out part of a stroke (E)'],['xstroke','scissors','Stroke eraser: remove whole strokes (X)'],['select','hand','Select and move (V)'],['line','sline','Line (L)'],['arrow','sarrow','Arrow (A)'],['rect','srect','Rectangle (R)'],['ellipse','sellipse','Ellipse (O)'],['text','stext','Text (T)']];
const SK_BGS=[['blank','Blank'],['lined','Lined'],['grid','Grid'],['dots','Dots']];
const sketchesAll=()=>docsOf('sketch').sort((a,b)=>(b.updatedAt||b.createdAt||0)-(a.updatedAt||a.createdAt||0));
let SK=null;
function skDrawBg(g,bg,scale){
  g.fillStyle='#ffffff'; g.fillRect(0,0,SK_W,SK_H);
  if(bg==='blank')return;
  g.save(); g.strokeStyle=bg==='dots'?'#9ca3af':'#dbe3f0'; g.fillStyle='#b6c0cf'; g.lineWidth=1;
  if(bg==='lined'){for(let y=80;y<SK_H;y+=40){g.beginPath();g.moveTo(0,y);g.lineTo(SK_W,y);g.stroke()}g.strokeStyle='#f3b4b4';g.beginPath();g.moveTo(110,0);g.lineTo(110,SK_H);g.stroke()}
  if(bg==='grid'){for(let x=40;x<SK_W;x+=40){g.beginPath();g.moveTo(x,0);g.lineTo(x,SK_H);g.stroke()}for(let y=40;y<SK_H;y+=40){g.beginPath();g.moveTo(0,y);g.lineTo(SK_W,y);g.stroke()}}
  if(bg==='dots'){for(let x=40;x<SK_W;x+=40)for(let y=40;y<SK_H;y+=40){g.beginPath();g.arc(x,y,1.6,0,7);g.fill()}}
  g.restore();
}
function skStroke(g,it){
  const P=it.p; if(!P||!P.length)return;
  g.save();
  if(it.t==='erase'){g.globalCompositeOperation='destination-out';g.strokeStyle='#000';g.fillStyle='#000'}
  else{g.strokeStyle=it.c;g.fillStyle=it.c;if(it.t==='hl'){g.globalAlpha=.35;g.globalCompositeOperation='multiply'}}
  g.lineCap=it.t==='hl'?'square':'round'; g.lineJoin='round';
  if(P.length===1){g.beginPath();g.arc(P[0][0],P[0][1],it.s/2,0,7);g.fill();g.restore();return}
  if(it.t==='pen'&&P.some(q=>q[2]&&q[2]!==.5)){
    for(let i=1;i<P.length;i++){const a=P[i-1],b=P[i];g.lineWidth=Math.max(.6,it.s*(.35+(b[2]||.5)*1.3));g.beginPath();g.moveTo(a[0],a[1]);g.lineTo(b[0],b[1]);g.stroke()}
  }else{
    g.lineWidth=it.s; g.beginPath(); g.moveTo(P[0][0],P[0][1]);
    for(let i=1;i<P.length-1;i++){const mx=(P[i][0]+P[i+1][0])/2,my=(P[i][1]+P[i+1][1])/2;g.quadraticCurveTo(P[i][0],P[i][1],mx,my)}
    g.lineTo(P[P.length-1][0],P[P.length-1][1]); g.stroke();
  }
  g.restore();
}
function skShape(g,it){
  const [x1,y1,x2,y2]=it.a; g.save(); g.strokeStyle=it.c; g.lineWidth=it.s; g.lineCap='round'; g.lineJoin='round';
  if(it.f){g.fillStyle=it.c;g.globalAlpha=.18}
  if(it.t==='line'||it.t==='arrow'){g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke();
    if(it.t==='arrow'){const a=Math.atan2(y2-y1,x2-x1),L=Math.max(14,it.s*4);g.beginPath();g.moveTo(x2,y2);g.lineTo(x2-L*Math.cos(a-.45),y2-L*Math.sin(a-.45));g.moveTo(x2,y2);g.lineTo(x2-L*Math.cos(a+.45),y2-L*Math.sin(a+.45));g.stroke()}}
  if(it.t==='rect'){const x=Math.min(x1,x2),y=Math.min(y1,y2),w=Math.abs(x2-x1),h=Math.abs(y2-y1);if(it.f)g.fillRect(x,y,w,h);g.globalAlpha=1;g.strokeRect(x,y,w,h)}
  if(it.t==='ellipse'){g.beginPath();g.ellipse((x1+x2)/2,(y1+y2)/2,Math.abs(x2-x1)/2,Math.abs(y2-y1)/2,0,0,7);if(it.f)g.fill();g.globalAlpha=1;g.stroke()}
  g.restore();

function skText(g,it){g.save();g.fillStyle=it.c;g.font=`${Math.round(it.s*4+10)}px "Segoe UI",Arial,sans-serif`;g.textBaseline='top';String(it.text||'').split('\n').forEach((ln,i)=>g.fillText(ln,it.x,it.y+i*(it.s*4+16)));g.restore()}
function skBox(it){
  if(it.p){const xs=it.p.map(q=>q[0]),ys=it.p.map(q=>q[1]),m=it.s/2;return [Math.min(...xs)-m,Math.min(...ys)-m,Math.max(...xs)+m,Math.max(...ys)+m]}
  if(it.a){const [a,b,c,d]=it.a,m=it.s/2;return [Math.min(a,c)-m,Math.min(b,d)-m,Math.max(a,c)+m,Math.max(b,d)+m]}
  if(it.t==='text'){const fs=it.s*4+10,ls=String(it.text||'').split('\n');return [it.x,it.y,it.x+Math.max(...ls.map(l=>l.length))*fs*.55,it.y+ls.length*(fs+6)]}

function skHit(it,x,y,tol){
  const [a,b,c,d]=skBox(it); if(x<a-tol||x>c+tol||y<b-tol||y>d+tol)return false;
  if(it.p){for(let i=0;i<it.p.length;i++){const q=it.p[i];if(Math.hypot(q[0]-x,q[1]-y)<=tol+it.s/2)return true;if(i){const p0=it.p[i-1];const L=Math.hypot(q[0]-p0[0],q[1]-p0[1])||1;const t=Math.max(0,Math.min(1,((x-p0[0])*(q[0]-p0[0])+(y-p0[1])*(q[1]-p0[1]))/(L*L)));if(Math.hypot(p0[0]+t*(q[0]-p0[0])-x,p0[1]+t*(q[1]-p0[1])-y)<=tol+it.s/2)return true}}return false}
  if(it.t==='line'||it.t==='arrow'){const [x1,y1,x2,y2]=it.a,L=Math.hypot(x2-x1,y2-y1)||1,t=Math.max(0,Math.min(1,((x-x1)*(x2-x1)+(y-y1)*(y2-y1))/(L*L)));return Math.hypot(x1+t*(x2-x1)-x,y1+t*(y2-y1)-y)<=tol+it.s/2}
  return true;

function skMoveItem(it,dx,dy){if(it.p)it.p.forEach(q=>{q[0]+=dx;q[1]+=dy});if(it.a){it.a[0]+=dx;it.a[1]+=dy;it.a[2]+=dx;it.a[3]+=dy}if(it.t==='text'){it.x+=dx;it.y+=dy}}
function skRender(cv,items,bg,sel,extra){
  const g=cv.getContext('2d');
  // strokes on their own layer so the eraser does not erase the paper
  const L=skRender.layer||(skRender.layer=document.createElement('canvas')); L.width=SK_W; L.height=SK_H;
  const lg=L.getContext('2d'); lg.clearRect(0,0,SK_W,SK_H);
  [...items,...(extra?[extra]:[])].forEach(it=>{if(it.p)skStroke(lg,it);else if(it.a)skShape(lg,it);else if(it.t==='text')skText(lg,it)});
  skDrawBg(g,bg); g.drawImage(L,0,0);

}
function openSketch(id,ctx){

  ctx=ctx||{};
  const l=V.view==='lecture'?S.docs[V.lectureId]:null;

    name:ex?ex.name:'',lectureId:ex?ex.lectureId:(ctx.lectureId||(l?V.lectureId:null)),courseId:ex?ex.courseId:(ctx.courseId||(l?l.courseId:null)),unitId:ex?ex.unitId:(ctx.unitId||(l?l.unitId:null))};

      <button class="btn sm" data-sk="clear" title="Clear the page">Clear</button>
      <select class="inp" id="skBg" style="width:auto;padding:6px 8px" aria-label="Paper">${SK_BGS.map(([k,lab])=>`<option value="${k}" ${SK.bg===k?'selected':''}>${lab} paper</option>`).join('')}</select>
      <button class="btn sm" data-sk="png" title="Download as a picture">${ico('download')}PNG</button>
      ${V.view==='lecture'?`<label class="row" style="gap:5px;font-size:13px"><input type="checkbox" id="skIns" ${ex?'':'checked'}> Put in my notes</label>`:''}
      <button class="btn" data-sk="close">Close</button><button class="btn pri" data-sk="save">${ico('check')}Save</button></div>
    <div class="skbody"><div class="sktools" role="toolbar" aria-label="Tools">${SK_TOOLS.map(([k,e,lab])=>`<button class="sktool ${SK.tool===k?'on':''}" data-skt="${k}" title="${lab}" aria-label="${lab}">${ico(e)}</button>`).join('')}
      <hr><div class="skcols">${SK_COLORS.map(c=>`<button class="skcol ${SK.color===c?'on':''}" data-skc="${c}" style="background:${c}" aria-label="Colour ${c}"></button>`).join('')}<label class="skcol skcustom" title="Any colour"><input type="color" id="skCustom" value="${SK.color}"></label></div>
      <hr><label class="sksz" title="Thickness"><span id="skSzL">${SK.size}</span><input type="range" id="skSize" min="1" max="40" value="${SK.size}" orient="vertical"></label>
      <button class="sktool ${SK.fill?'on':''}" data-sk="fill" title="Fill rectangles and ellipses">${ico('sfill')}</button></div>
      <div class="skstage"><canvas id="skCv" width="${SK_W}" height="${SK_H}"></canvas><textarea id="skTxt" class="sktxt" hidden></textarea></div></div>
    <div class="skfoot muted">Pen pressure works with a stylus. Hold <b>Shift</b> for straight lines and perfect squares or circles. Select tool: drag to move, <b>Delete</b> to remove.</div></div>`;
  document.body.appendChild(ov);
  const cv=ov.querySelector('#skCv'), stage=ov.querySelector('.skstage'), txt=ov.querySelector('#skTxt');
  const draw=extra=>skRender(cv,SK.items,SK.bg,SK.sel,extra);
  draw();
  const pt=e=>{const r=cv.getBoundingClientRect();return [(e.clientX-r.left)*SK_W/r.width,(e.clientY-r.top)*SK_H/r.height]};
  const push=()=>{SK.undo.push(JSON.stringify(SK.items));if(SK.undo.length>100)SK.undo.shift();SK.redo=[];SK.dirty=true};
  const setTool=t=>{SK.tool=t;SK.sel=[];ov.querySelectorAll('[data-skt]').forEach(b=>b.classList.toggle('on',b.dataset.skt===t));stage.dataset.tool=t;commitText();draw()};

  let cur=null, start=null, moving=null, textAt=null;
  function commitText(){if(!textAt)return;const v=txt.value.replace(/\s+$/,'');if(v){push();SK.items.push({t:'text',c:SK.color,s:SK.size,x:textAt[0]|0,y:textAt[1]|0,text:v})}textAt=null;txt.hidden=true;txt.value='';draw()}

    commitText();

    if(SK.tool==='xstroke'){push();cur={xs:true};const before=SK.items.length;SK.items=SK.items.filter(it=>!skHit(it,x,y,8));if(SK.items.length===before)SK.undo.pop();draw();return}
    if(['pen','hl','erase'].includes(SK.tool)){cur={t:SK.tool,c:SK.color,s:SK.tool==='erase'?Math.max(12,SK.size*3):SK.tool==='hl'?Math.max(12,SK.size*3):SK.size,p:[[+x.toFixed(1),+y.toFixed(1),+pr.toFixed(2)]]};draw(cur);return}
    start=[x,y]; cur={t:SK.tool,c:SK.color,s:SK.size,f:SK.fill&&(SK.tool==='rect'||SK.tool==='ellipse'),a:[x,y,x,y]};

    if(!cur&&!moving)return; const [x,y]=pt(e);
    if(moving){const dx=x-moving.x,dy=y-moving.y;SK.sel.forEach(it=>skMoveItem(it,dx,dy));moving={x,y};SK.dirty=true;draw();return}
    if(cur.xs){const n=SK.items.length;SK.items=SK.items.filter(it=>!skHit(it,x,y,8));if(SK.items.length!==n)draw();return}
    if(cur.p){const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];evs.forEach(ev=>{const [a,b]=pt(ev);const pr=ev.pointerType==='pen'?(ev.pressure||.5):.5;const L=cur.p[cur.p.length-1];if(Math.hypot(a-L[0],b-L[1])>.8)cur.p.push([+a.toFixed(1),+b.toFixed(1),+pr.toFixed(2)])});draw(cur);return}
    let [x2,y2]=[x,y];
    if(e.shiftKey){if(cur.t==='rect'||cur.t==='ellipse'){const m=Math.max(Math.abs(x2-start[0]),Math.abs(y2-start[1]));x2=start[0]+Math.sign(x2-start[0]||1)*m;y2=start[1]+Math.sign(y2-start[1]||1)*m}else{const a=Math.round(Math.atan2(y2-start[1],x2-start[0])/(Math.PI/4))*(Math.PI/4),L=Math.hypot(x2-start[0],y2-start[1]);x2=start[0]+L*Math.cos(a);y2=start[1]+L*Math.sin(a)}}
    cur.a=[start[0],start[1],x2,y2]; draw(cur);
  });
  const end=()=>{
    if(moving){moving=null;draw();return}
    if(!cur)return;
    if(cur.p||cur.a){const tiny=cur.a&&Math.hypot(cur.a[2]-cur.a[0],cur.a[3]-cur.a[1])<3;if(!tiny){push();if(cur.a)cur.a=cur.a.map(v=>+v.toFixed(1));SK.items.push(cur)}}
    cur=null; start=null; draw();
  };
  cv.addEventListener('pointerup',end); cv.addEventListener('pointercancel',end);
  txt.addEventListener('keydown',e=>{if(e.key==='Escape'){txt.value='';commitText()}if(e.key==='Enter'&&(e.ctrlKey||e.metaKey))commitText()});
  txt.addEventListener('blur',()=>setTimeout(commitText,0));
  const close=()=>{commitText();if(SK.dirty&&!confirm('Close without saving this sketch?'))return;document.removeEventListener('keydown',keys,true);ov.remove();SK=null};
  const keys=e=>{
    if(!SK||e.target===txt||e.target.id==='skName')return;
    const k=e.key.toLowerCase();
    if((e.ctrlKey||e.metaKey)&&k==='z'){e.preventDefault();act(e.shiftKey?'redo':'undo');return}
    if((e.ctrlKey||e.metaKey)&&k==='y'){e.preventDefault();act('redo');return}
    if((e.key==='Delete'||e.key==='Backspace')&&SK.sel.length){e.preventDefault();push();SK.items=SK.items.filter(it=>!SK.sel.includes(it));SK.sel=[];draw();return}
    if(e.key==='Escape'){e.preventDefault();e.stopPropagation();close();return}
    const map={p:'pen',h:'hl',e:'erase',x:'xstroke',v:'select',l:'line',a:'arrow',r:'rect',o:'ellipse',t:'text'};
    if(!e.ctrlKey&&!e.metaKey&&map[k]){e.preventDefault();setTool(map[k])}
  };
  document.addEventListener('keydown',keys,true);
  function act(k){
    if(k==='undo'&&SK.undo.length){SK.redo.push(JSON.stringify(SK.items));SK.items=JSON.parse(SK.undo.pop());SK.sel=[];SK.dirty=true;draw()}
    if(k==='redo'&&SK.redo.length){SK.undo.push(JSON.stringify(SK.items));SK.items=JSON.parse(SK.redo.pop());SK.sel=[];SK.dirty=true;draw()}
    if(k==='clear'&&SK.items.length&&confirm('Clear the whole page?')){push();SK.items=[];SK.sel=[];draw()}
    if(k==='fill'){SK.fill=!SK.fill;ov.querySelector('[data-sk="fill"]').classList.toggle('on',SK.fill)}
    if(k==='png'){commitText();SK.sel=[];draw();cv.toBlob(b=>offerDownload(slug(trim(ov.querySelector('#skName').value)||'sketch')+'.png',b),'image/png')}
    if(k==='close')close();
    if(k==='save')saveSketch(ov,cv);
  }
  ov.addEventListener('click',e=>{const t=e.target.closest('[data-skt]');if(t){setTool(t.dataset.skt);return}const c=e.target.closest('[data-skc]');if(c){SK.color=c.dataset.skc;ov.querySelectorAll('[data-skc]').forEach(z=>z.classList.toggle('on',z===c));keepTool();if(SK.sel.length){push();SK.sel.forEach(it=>it.c=SK.color);draw()}return}const a=e.target.closest('[data-sk]');if(a)act(a.dataset.sk)});
  ov.querySelector('#skCustom').addEventListener('input',e=>{SK.color=e.target.value;ov.querySelectorAll('[data-skc]').forEach(z=>z.classList.remove('on'));keepTool()});
  ov.querySelector('#skSize').addEventListener('input',e=>{SK.size=+e.target.value;ov.querySelector('#skSzL').textContent=SK.size;keepTool()});
  ov.querySelector('#skBg').addEventListener('change',e=>{SK.bg=e.target.value;SK.dirty=true;try{localStorage.setItem('litnotes.skbg',SK.bg)}catch(_){}draw()});
  ov.querySelector('#skName').addEventListener('input',()=>{SK.dirty=true});
}
