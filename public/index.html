async function mountReader(x){
  const token=++R.token, box=$('#rpages'); if(!box)return;
  let doc;
  try{doc=await openPdfDoc(x.pdf)}catch(e){if(token!==R.token)return;box.innerHTML=`<div class="rload">${ico('warn')}<span>The PDF could not be displayed here. <a class="link" href="${esc(pdfUrl(x.pdf))}" target="_blank" rel="noopener">Open it in a new tab</a> instead.</span></div>`;return}
  if(token!==R.token||!$('#rpages'))return;
  await loadPdfjs();
  R.doc=doc; R.pages=[];
  // page sizes at scale 1 (pages can differ in size)
  for(let i=1;i<=doc.numPages;i++){const pg=await doc.getPage(i);const vp=pg.getViewport({scale:1});R.pages.push({n:i,w:vp.width,h:vp.height});if(token!==R.token)return}
  box.innerHTML='';
  if(R.obs)R.obs.disconnect();
  R.vis=new Set();
  R.pages.forEach(p=>{
    const el=document.createElement('div'); el.className='pg'; el.dataset.n=p.n;
    el.innerHTML=`<span class="pgnum">${p.n}</span>`; p.el=el; box.appendChild(el);
  });
  R.obs=new IntersectionObserver(es=>es.forEach(e=>{const n=+e.target.dataset.n;if(e.isIntersecting){R.vis.add(n);renderPage(n)}else R.vis.delete(n)}),{root:box,rootMargin:'500px 0px'});
  const pgObs=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting&&e.intersectionRatio>.3){const g=$('#pgn');if(g)g.textContent=`${e.target.dataset.n} / ${doc.numPages}`}})},{root:box,threshold:[.3]});
  R.pages.forEach(p=>{R.obs.observe(p.el);pgObs.observe(p.el)});
  box.classList.toggle('pan',R.tool==='hand');
  layoutPages(R.mode==='custom'?R.scale:fitScale(R.mode),null,true);
  const g=$('#pgn'); if(g)g.textContent=`1 / ${doc.numPages}`;
  bindViewerGestures(box);
}
function fitScale(mode){
  const box=$('#rpages'); if(!box||!R.pages.length)return R.scale||1;
  const maxW=Math.max(...R.pages.map(p=>p.w)), first=R.pages[0];
  const aw=box.clientWidth-30, ah=box.clientHeight-30;
  const sc=mode==='page'?Math.min(aw/first.w,ah/first.h):aw/maxW;
  return Math.max(.1,sc);
}
function clampScale(sc){return Math.min(5*PDF_PX,Math.max(.25*PDF_PX,sc))}
/* resize page boxes to a new scale, keeping the point under `anchor` (box coords) in place */
function layoutPages(scale,anchor,initial){
  const box=$('#rpages'); if(!box||!R.pages.length)return;
  scale=clampScale(scale);
  const old=R.scale||scale;
  const ax=anchor?anchor.x:box.clientWidth/2, ay=anchor?anchor.y:box.clientHeight/2;
  const fx=(box.scrollLeft+ax)/Math.max(1,box.scrollWidth), fy=(box.scrollTop+ay)/Math.max(1,box.scrollHeight);
  R.scale=scale;
  R.pages.forEach(p=>{p.el.style.width=Math.floor(p.w*scale)+'px';p.el.style.height=Math.floor(p.h*scale)+'px';const tl=p.el.querySelector('.textLayer');if(tl)tl.remove();p.el.dataset.done=''});
  if(!initial&&old!==scale){box.scrollLeft=fx*box.scrollWidth-ax;box.scrollTop=fy*box.scrollHeight-ay}
  updateZoomUI();
  try{localStorage.setItem('litnotes.zoom',scale);localStorage.setItem('litnotes.zmode',R.mode)}catch(e){}
  clearTimeout(R._rr); R._rr=setTimeout(()=>R.vis&&R.vis.forEach(n=>renderPage(n)),initial?0:180);
}
async function renderPage(n){
  const p=R.pages[n-1]; if(!p||!R.doc)return;
  const scale=R.scale, key=String(scale);
  if(p.el.dataset.done===key||p.busy===key)return;
  p.busy=key;
  if(p.task){try{p.task.cancel()}catch(e){}}
  const lib=await loadPdfjs(); const page=await R.doc.getPage(n);
  if(R.scale!==scale){p.busy='';return}
  const vp=page.getViewport({scale});
  const maxPix=16e6, dpr=Math.min(window.devicePixelRatio||1,2,Math.sqrt(maxPix/(vp.width*vp.height)));
  const c=document.createElement('canvas'); c.width=Math.floor(vp.width*dpr); c.height=Math.floor(vp.height*dpr);
  p.task=page.render({canvas:c,canvasContext:c.getContext('2d'),viewport:vp,transform:dpr!==1?[dpr,0,0,dpr,0,0]:null});
  try{await p.task.promise}catch(e){if(p.busy===key)p.busy='';return}
  if(R.scale!==scale){p.busy='';return}
  p.el.querySelectorAll('canvas').forEach(o=>o.remove());
  p.el.insertBefore(c,p.el.firstChild);
  try{
    const tl=document.createElement('div'); tl.className='textLayer'; p.el.appendChild(tl);
    tl.style.setProperty('--scale-factor',scale); tl.style.setProperty('--total-scale-factor',scale); tl.style.setProperty('--user-unit','1');
    await new lib.TextLayer({textContentSource:page.streamTextContent(),container:tl,viewport:vp}).render();
  }catch(e){}

}
function updateZoomUI(){
  const sel=$('#zoomSel'); if(!sel)return;
  const pct=pctOf(R.scale);
  const fw=pctOf(fitScale('width')), fp=pctOf(fitScale('page'));
  let opts=`<option value="width">Fit width · ${fw}%</option><option value="page">Fit page · ${fp}%</option>`;
  const custom=R.mode==='custom'&&!ZOOM_STEPS.includes(pct);
  opts+=ZOOM_STEPS.map(z=>`<option value="${z}">${z}%</option>`).join('');
  if(custom)opts=`<option value="c" hidden>${pct}%</option>`+opts;
  sel.innerHTML=opts;
  sel.value=R.mode==='custom'?(custom?'c':String(pct)):R.mode;
  // the closed select shows a compact label
  const label=R.mode==='custom'?pct+'%':(R.mode==='width'?'Fit width · ':'Fit page · ')+pct+'%';
  sel.title='Zoom: '+label;
}
function setZoom(v,anchor){
  if(!R.pages.length)return;
  if(v==='width'||v==='page'){R.mode=v;layoutPages(fitScale(v),anchor);return}
  R.mode='custom'; layoutPages(v,anchor);
}
function stepZoom(dir){
  const cur=pctOf(R.scale);
  let next=dir>0?ZOOM_STEPS.find(z=>z>cur+0.5):[...ZOOM_STEPS].reverse().find(z=>z<cur-0.5);
  if(next==null)next=dir>0?ZOOM_STEPS[ZOOM_STEPS.length-1]:ZOOM_STEPS[0];
  setZoom(next/100*PDF_PX);
}
function bindViewerGestures(box){
  if(box._bound)return; box._bound=true;
  // mouse / pen drag with the hand tool
  let drag=null;
  box.addEventListener('pointerdown',e=>{
    if(R.tool!=='hand'||e.pointerType==='touch'||e.button!==0)return;
    if(e.target.closest('a,button'))return;
    drag={x:e.clientX,y:e.clientY,l:box.scrollLeft,t:box.scrollTop,id:e.pointerId};
    box.setPointerCapture(e.pointerId); box.classList.add('grabbing'); e.preventDefault();
  });
  box.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.id)return;box.scrollLeft=drag.l-(e.clientX-drag.x);box.scrollTop=drag.t-(e.clientY-drag.y)});
  const end=e=>{if(!drag)return;try{box.releasePointerCapture(drag.id)}catch(_){}drag=null;box.classList.remove('grabbing')};
  box.addEventListener('pointerup',end); box.addEventListener('pointercancel',end); box.addEventListener('lostpointercapture',end);
  // Ctrl + wheel and trackpad pinch (browsers send ctrlKey with pinch gestures)
  box.addEventListener('wheel',e=>{
    if(!e.ctrlKey&&!e.metaKey)return;
    e.preventDefault();
    const r=box.getBoundingClientRect();
    R.mode='custom'; layoutPages(R.scale*Math.exp(-e.deltaY*0.0025),{x:e.clientX-r.left,y:e.clientY-r.top});
  },{passive:false});
  // two-finger pinch on touch screens (one finger scrolls natively)
  let pinch=null;
  const dist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);
  box.addEventListener('touchstart',e=>{
    if(e.touches.length===2){const r=box.getBoundingClientRect();pinch={d:dist(e.touches),s:R.scale,x:(e.touches[0].clientX+e.touches[1].clientX)/2-r.left,y:(e.touches[0].clientY+e.touches[1].clientY)/2-r.top}}
  },{passive:true});
  box.addEventListener('touchmove',e=>{
    if(!pinch||e.touches.length!==2)return;
    e.preventDefault();
    const r=box.getBoundingClientRect();
    const mx=(e.touches[0].clientX+e.touches[1].clientX)/2-r.left, my=(e.touches[0].clientY+e.touches[1].clientY)/2-r.top;
    R.mode='custom'; layoutPages(pinch.s*dist(e.touches)/pinch.d,{x:mx,y:my});
    // two fingers also pan
    box.scrollLeft-=mx-pinch.x; box.scrollTop-=my-pinch.y; pinch.x=mx; pinch.y=my;
  },{passive:false});
  box.addEventListener('touchend',e=>{if(e.touches.length<2)pinch=null});
}

async function askPaper(id,question,show){
  const x=S.docs[id]; if(!x||!x.pdf)return;
  const sample=await getSample();
  if(!sample){toast(unavailable('ai'));return}
  const th=$('#thread'); const turns=R.turns[id]=R.turns[id]||[];
  if(!turns.length&&th) th.innerHTML='';
  turns.push({role:'user',content:question,show});

  const out=th.lastElementChild.querySelector('.mtext'); th.scrollTop=th.scrollHeight;

  R.ctl=new AbortController();

    const {text:paper,pages,truncated}=await pdfText(x.pdf);

    const rules=`You are a research assistant helping a student write a literature review. Answer ONLY from the paper text below.

- Be concise: short paragraphs or bullets, under 220 words unless asked for more. Plain text; **bold** allowed.
- Separate what the authors measured from how they interpret it when relevant.

Paper reference: ${apaText(x.ref)}
${truncated?`(Only the first part of this ${pages}-page paper is included.)\n`:''}
<paper>
${paper}
</paper>`;
    const msgs=[{role:'user',content:rules},...turns.map(t=>({role:t.role,content:t.content}))];
    const {text,truncated:cut}=await sample(msgs,{cache:false,signal:R.ctl.signal,onText:({text})=>{out.innerHTML=md(text);th.scrollTop=th.scrollHeight}});
    turns.push({role:'assistant',content:text});
    out.innerHTML=md(text)+(cut?'<div class="help">(Answer cut short — ask for less at a time.)</div>':'');
    out.parentElement.classList.remove('pending');
    out.insertAdjacentHTML('afterend',`<button class="link mcopy" data-act="copyAns" style="font-size:12.5px">${ico('copy')}Copy</button>`);
  }catch(e){
    turns.pop();

/* ============================================================
   AUTO-FILL REFERENCE DETAILS FROM A PDF
   1) DOI found → CrossRef (self-hosted server)  2) else AI reads page 1  3) else PDF metadata
   ============================================================ */
const DOI_RE=/\b(10\.\d{4,9}\/[^\s"'<>]+)/i;
function cleanDoi(d){return d?d.replace(/[.,;:)\]}>]+$/,'').replace(/^doi:\s*/i,''):''}
async function pdfHead(src){
  const lib=await loadPdfjs();
  const data=src.file?await src.file.arrayBuffer():await (await fetch(src.url)).arrayBuffer();
  const doc=await lib.getDocument({data,isEvalSupported:false}).promise;
  let text='';
  for(let i=1;i<=Math.min(2,doc.numPages);i++){
    const pg=await doc.getPage(i); const tc=await pg.getTextContent();
    text+=`\n[page ${i}]\n`+tc.items.map(it=>it.str+(it.hasEOL?'\n':' ')).join('');
  }
  let info={}; try{info=(await doc.getMetadata()).info||{}}catch(e){}
  doc.destroy&&doc.destroy();
  const m=(text+' '+(info.Subject||'')+' '+(info.Keywords||'')).match(DOI_RE);
  return {text:text.replace(/[ \t]+/g,' ').trim(),info,doi:cleanDoi(m&&m[1])};
}
function normRef(o){
  const r={};
  const t=String(o.type||'').toLowerCase();
  r.type=REF_TYPES[t]?t:'journal';
  const ppl=a=>(Array.isArray(a)?a:[]).map(p=>p&&typeof p==='object'?{family:trim(p.family||p.name),given:trim(p.given),org:!!p.org||(!p.given&&!!p.name&&!p.family)}:null).filter(p=>p&&p.family);
  const au=ppl(o.authors); if(au.length) r.authors=au;
  const ed=ppl(o.editors); if(ed.length) r.editors=ed;
  ['year','month','day','title','journal','volume','issue','pages','articleNo','doi','url','publisher','bookTitle','institution','degree','reportNo','conference','location','edition'].forEach(k=>{const v=o[k];if(v!=null&&String(v).trim())r[k]=String(v).trim()});
  if(r.month&&!/^(1[0-2]|[1-9])$/.test(r.month)){const i=MONTHS.findIndex(m=>m.toLowerCase().startsWith(String(r.month).toLowerCase().slice(0,3)));r.month=i>=0?String(i+1):''}
  if(r.degree&&!REF_FIELDS.degree.options.includes(r.degree)) r.degree=/doct|phd/i.test(r.degree)?'Doctoral dissertation':/master|msc|ma\b/i.test(r.degree)?"Master's thesis":"Bachelor's thesis";
  if(r.doi) r.doi=cleanDoi(r.doi.replace(/^https?:\/\/(dx\.)?doi\.org\//i,''));
  if(r.doi) delete r.url;
  return r;
}
async function autofillRef(src){
  const head=await pdfHead(src);
  // 1) CrossRef through the self-hosted server
  if(head.doi&&LOCAL&&LOCAL.lookup){
    try{const r=await fetch('/api/lookup?doi='+encodeURIComponent(head.doi));if(r.ok){const j=await r.json();if(j&&j.ref&&j.ref.title)return {patch:normRef(j.ref),source:'crossref',doi:head.doi}}}catch(e){}
  }
  // 2) AI reads the first page
  const sample=await getSample();
  if(sample&&head.text.length>80){
    const prompt=`Extract the bibliographic reference of this document from the text of its first pages, for an APA 7 reference.
Reply with ONLY a JSON object with these keys (use "" or [] for anything NOT printed in the text — never guess or use outside knowledge):
{"type": one of "journal","book","chapter","report","conference","thesis","web",
 "authors": [{"family":"Surname","given":"First and middle names"}] in printed order (for an organisation as author: {"family":"Organisation name","org":true}),
 "year":"", "month":"1-12 or empty", "day":"", "title":"full title including subtitle, as printed",
 "journal":"", "volume":"", "issue":"", "pages":"e.g. 105-118", "articleNo":"", "doi":"", "url":"",
 "publisher":"", "bookTitle":"", "editors":[], "institution":"", "degree":"", "reportNo":"", "conference":"", "location":""}
${head.doi?`A DOI appears in the text: ${head.doi}\n`:''}
<text>
${head.text.slice(0,7000)}
</text>`;
    try{
      const o=await sample.json(prompt,{cache:{gcTime:86400000}});
      const patch=normRef(o||{}); if(head.doi&&!patch.doi)patch.doi=head.doi;
      if(patch.title||(patch.authors&&patch.authors.length))return {patch,source:'ai',doi:head.doi};
    }catch(e){if(e&&e.code==='not_granted')throw e}
  }
  // 3) embedded PDF metadata (often incomplete)
  const patch={};
  if(trim(head.info.Title)&&head.info.Title.length>8&&!/^microsoft|untitled|\.docx?$/i.test(head.info.Title))patch.title=trim(head.info.Title);
  const JUNK=/^(anonymous|unknown|user|admin(istrator)?|author|owner|guest|default|none|n\/?a|microsoft.*|.*@.*|.*\.(com|org|net)|.*\d{3,}.*)$/i;
  if(trim(head.info.Author)&&!JUNK.test(trim(head.info.Author))){patch.authors=head.info.Author.split(/;|\band\b|&/).map(s=>trim(s)).filter(n=>n&&!JUNK.test(n)).map(n=>{if(n.includes(','))return {family:trim(n.split(',')[0]),given:trim(n.split(',').slice(1).join(' ')),org:false};const w=n.split(/\s+/);return {family:w.pop(),given:w.join(' '),org:false}})}
  if(head.doi)patch.doi=head.doi;
  if(Object.keys(patch).length)return {patch,source:'pdf',doi:head.doi};
  return null;
}
function applyPatch(w,patch){
  Object.entries(patch).forEach(([k,v])=>{
    if(k==='type'){w.type=v;return}
    if(Array.isArray(v)){if(v.length)w[k]=clone(v);return}
    if(v!==''&&v!=null)w[k]=v;
  });
  if(!w.authors||!w.authors.length)w.authors=[{family:'',given:'',org:false}];
}

/* ============================================================
   RICH-TEXT NOTES  (bold, italic, underline, highlight)
   Stored as cleaned HTML in x.rich[qid]; plain text stays in x.answers[qid]
   so search, Ask, previews and progress keep working on text.
   ============================================================ */
const HL=[['yellow','#fde047',[253,224,71]],['green','#86efac',[134,239,172]],['blue','#93c5fd',[147,197,253]],['pink','#f9a8d4',[249,168,212]],['orange','#fdba74',[253,186,116]]];
function hlFromColor(c){
  const m=String(c||'').match(/rgba?\(\s*(\d+)[ ,]+(\d+)[ ,]+(\d+)(?:[ ,/]+([\d.]+))?/i); if(!m)return null;
  if(m[4]!==undefined&&parseFloat(m[4])===0)return null;
  const rgb=[+m[1],+m[2],+m[3]]; let best=null,bd=1e9;
  HL.forEach(([k,,v])=>{const d=(v[0]-rgb[0])**2+(v[1]-rgb[1])**2+(v[2]-rgb[2])**2;if(d<bd){bd=d;best=k}});
  return bd<9000?best:null;
}
/* whitelist-based cleaner: returns safe HTML using only b, i, u, mark.hl-*, br */
function cleanRich(html){
  const src=document.createElement('template'); src.innerHTML=html||'';

function paperReportBody(x,t,showEmpty,level){
  const h=level||2;
  const ans=q=>{const a=((x.answers||{})[q.id]||'').trim();const c=q.choiceKey?x[q.choiceKey]:'';return {a,c}};
  let html=`${x.ref?`<p class="apa">${apaHTML(x.ref)}</p>`:(x.citation?`<p class="meta">${esc(x.citation)}</p>`:'')}
  <table><tr><th>Date read</th><th>Status</th><th>Verdict</th><th>Support / threat</th></tr><tr><td>${esc(fmtDate(x.dateRead)||'—')}</td><td>${esc(x.status||'Not started')}</td><td>${esc(x.verdict||'—')}</td><td>${esc(x.support||'—')}</td></tr></table>`;
  t.sections.forEach(s=>{
    const qs=t.questions.filter(q=>q.section===s.id);
    const items=qs.map(q=>({q,...ans(q)})).filter(i=>showEmpty||i.a||i.c);
    if(!items.length)return;
    html+=`<h${h+1} style="color:${secColorHex(s)}">${esc(s.title)}</h${h+1}>`;
    items.forEach(i=>{html+=`<h4>${t.questions.indexOf(i.q)+1}. ${esc(i.q.text)}</h4>${i.c?`<p><b>${esc(i.c)}</b></p>`:''}${i.a?`<div class="ans">${answerHTML(x,i.q)}</div>`:(i.c?'':'<p class="na">Not answered</p>')}`});
  });
  return html;
}

  <label class="row" style="gap:7px;font-size:13.5px;font-weight:600"><input type="checkbox" data-act="toggleEmpty" ${V.showEmpty?'checked':''}> Show unanswered</label>
  ${kind==='project'?`<span class="chips"><button class="chip ${V.repLayout==='paper'?'on':''}" data-act="repLayout" data-v="paper">By paper</button><button class="chip ${V.repLayout==='question'?'on':''}" data-act="repLayout" data-v="question">By question</button></span>`:''}
  <span class="spacer"></span>${kind==='project'?`<button class="btn sm" data-act="copyRefs">${ico('list')}Copy reference list</button>`:''}<button class="btn sm" data-act="copyMd" data-kind="${kind}">${ico('copy')}Copy text</button><button class="btn sm" data-act="dl" data-fmt="md" data-kind="${kind}">${ico('download')}.md</button><button class="btn sm pri" data-act="dl" data-fmt="html" data-kind="${kind}">${ico('download')}Word / PDF (.html)</button></div>`;
}
function paperReportView(){

function sortedRefs(pp){
  const key=x=>{const r=x.ref;if(!r)return (x.title||'').toLowerCase();const a=validPeople(r.authors);const lead=a.length?a.map(z=>trim(z.family)+' '+initials(z.given)).join(' '):trim(r.title);return (lead+' '+(trim(r.year)||'0000')).toLowerCase().replace(/^(the|a|an)\s+/,'')};
  return pp.slice().sort((a,b)=>key(a).localeCompare(key(b)));
}
function projectReportHTML(p,pp,t){
  const order=pp.slice().sort((a,b)=>({Core:0,Background:1,Skip:2}[a.verdict]??3)-({Core:0,Background:1,Skip:2}[b.verdict]??3));
  let html=`<h1>${esc(p.name||'Untitled project')}</h1>
  <p class="meta">Literature review notes · ${pp.length} paper${pp.length===1?'':'s'} · generated ${new Date().toLocaleDateString(undefined,{year:'numeric',month:'long',day:'numeric'})}</p>
  ${p.description?`<p>${esc(p.description)}</p>`:''}
  ${p.chain?`<p><b>My causal chain:</b> ${esc(p.chain)}</p>`:''}
  <h2>Overview</h2>
  <table><tr><th>#</th><th>Paper</th><th>Verdict</th><th>Support / threat</th><th>Status</th></tr>
  ${order.map((x,i)=>`<tr><td>${i+1}</td><td><b>${esc(paperTitle(x))}</b><br>${esc(paperMeta(x))}</td><td>${esc(x.verdict||'—')}</td><td>${esc(x.support||'—')}</td><td>${esc(x.status||'Not started')}</td></tr>`).join('')}
  </table>`;
  if(V.repLayout==='question'){
    t.sections.forEach(s=>{
      let sh=`<h2 style="color:${secColorHex(s)}">${esc(s.title)}</h2>`, any=false;
      t.questions.filter(q=>q.section===s.id).forEach(q=>{
        const rows=order.map(x=>({x,a:((x.answers||{})[q.id]||'').trim(),c:q.choiceKey?x[q.choiceKey]:''})).filter(r=>V.showEmpty||r.a||r.c);
        if(!rows.length)return;
        if(!any){html+=sh;any=true}
        html+=`<h3>${t.questions.indexOf(q)+1}. ${esc(q.text)}</h3>`;
        rows.forEach(r=>{html+=`<h4>${esc(paperTitle(r.x))}${r.x.authors||r.x.year?' — '+esc(paperMeta(r.x)):''}</h4>${r.c?`<p><b>${esc(r.c)}</b></p>`:''}${r.a?`<div class="ans">${answerHTML(r.x,q)}</div>`:(r.c?'':'<p class="na">Not answered</p>')}`});
      });

  }else{
    order.forEach((x,i)=>{html+=`<h2>${i+1}. ${esc(paperTitle(x))}</h2><p class="meta">${esc(paperMeta(x))}</p>${paperReportBody(x,t,V.showEmpty,2)}`});

  if(refs.length) html+=`<h2>References</h2>${refs.map(x=>`<p class="apa">${apaHTML(x.ref)}</p>`).join('')}`;
  return html;
}
function projectReportView(p,pp,t){
  if(!pp.length) return `<div class="empty"><div class="ic">${ico('report')}</div><div class="big">No report yet</div><p>Add literature to build the project report.</p></div>`;

/* Markdown export */
function mdPaper(x,t,showEmpty,hl){
  const H=n=>'#'.repeat(n)+' ';
  let s=`${H(hl)}${paperTitle(x)}\n\n`;
  if(paperMeta(x)) s+=`*${paperMeta(x)}*\n\n`;
  if(x.ref) s+=`${apaMd(x.ref)}\n\n`; else if(x.citation) s+=`${x.citation}\n\n`;
  s+=`- **Date read:** ${fmtDate(x.dateRead)||'—'}\n- **Status:** ${x.status||'Not started'}\n- **Verdict:** ${x.verdict||'—'}\n- **Support / threat:** ${x.support||'—'}\n\n`;
  t.sections.forEach(sec=>{
    const items=t.questions.filter(q=>q.section===sec.id).map(q=>({q,a:((x.answers||{})[q.id]||'').trim(),c:q.choiceKey?x[q.choiceKey]:''})).filter(i=>showEmpty||i.a||i.c);
    if(!items.length)return;
    s+=`${H(hl+1)}${sec.title}\n\n`;
    items.forEach(i=>{s+=`**${t.questions.indexOf(i.q)+1}. ${i.q.text}**\n\n${i.c?`*${i.c}*\n\n`:''}${i.a?answerMd(x,i.q):(i.c?'':'_Not answered_')}${i.a||!i.c?'\n\n':''}`});
  });
  return s;
}
function mdProject(p,pp,t){
  const order=pp.slice().sort((a,b)=>({Core:0,Background:1,Skip:2}[a.verdict]??3)-({Core:0,Background:1,Skip:2}[b.verdict]??3));
  let s=`# ${p.name||'Untitled project'}\n\n_${pp.length} papers · generated ${new Date().toISOString().slice(0,10)}_\n\n`;
  if(p.description) s+=p.description+'\n\n';
  if(p.chain) s+=`**My causal chain:** ${p.chain}\n\n`;
  s+=`## Overview\n\n| # | Paper | Verdict | Support / threat | Status |\n|---|---|---|---|---|\n`;
  order.forEach((x,i)=>{s+=`| ${i+1} | ${(paperTitle(x)+(paperMeta(x)?' ('+paperMeta(x)+')':'')).replace(/\|/g,'/')} | ${x.verdict||'—'} | ${x.support||'—'} | ${x.status||'Not started'} |\n`});
  s+='\n';
  if(V.repLayout==='question'){
    t.sections.forEach(sec=>{
      s+=`## ${sec.title}\n\n`;
      t.questions.filter(q=>q.section===sec.id).forEach(q=>{
        const rows=order.map(x=>({x,a:((x.answers||{})[q.id]||'').trim(),c:q.choiceKey?x[q.choiceKey]:''})).filter(r=>V.showEmpty||r.a||r.c);
        if(!rows.length)return;
        s+=`### ${t.questions.indexOf(q)+1}. ${q.text}\n\n`;
        rows.forEach(r=>{s+=`- **${paperTitle(r.x)}**${r.c?` — *${r.c}*`:''}: ${(r.a?answerMd(r.x,q):(r.c?'':'_Not answered_')).replace(/\n/g,'\n  ')}\n`});
        s+='\n';
      });
    });
  }else order.forEach(x=>{s+=mdPaper(x,t,V.showEmpty,2)});
  const refs=sortedRefs(pp).filter(x=>x.ref);
  if(refs.length) s+=`## References\n\n`+refs.map(x=>apaMd(x.ref)).join('\n\n')+'\n';
  return s;
}
function currentReport(kind){

const slug=s=>(s||'notes').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,60)||'notes';
async function offerDownload(filename,data,fallbackText){
  let dl=null; try{dl=window.claude?await window.claude.use('downloads'):null}catch(e){}
  if(dl){
    try{await dl.save({filename,data});toast('Saved '+filename);return}
    catch(e){ if(e&&e.code==='declined')return; }
  }
  if(!window.claude){ // standalone copy opened from disk: a normal browser download works
    try{const u=URL.createObjectURL(data instanceof Blob?data:new Blob([data],{type:'application/octet-stream'}));const a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);toast('Saved '+filename);return}catch(e){}
  }
  copyText(fallbackText||data,'Downloads are not available here — copied to clipboard instead.');
}

    ov.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>{const i=work.questions.findIndex(z=>z.id===b.dataset.up);const sec=work.questions[i].section;for(let j=i-1;j>=0;j--){if(work.questions[j].section===sec){const tmp=work.questions[j];work.questions[j]=work.questions[i];work.questions[i]=tmp;break}}draw()});
    ov.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{const sec=b.dataset.add;let last=-1;work.questions.forEach((z,i)=>{if(z.section===sec)last=i});work.questions.splice(last+1,0,{id:uid('c'),section:sec,text:'New question',where:'',how:''});draw()});

function restoreData(o){
  const docs=(o&&o.docs)||o;let n=0;
  Object.entries(docs||{}).forEach(([k,v])=>{if(v&&(v.kind==='project'||v.kind==='paper')&&/^[A-Za-z0-9_\-.~:@+]+$/.test(k)){S.docs[k]=v;save(k);n++}});
  if(!n)throw new Error('empty');
  toast(`Restored ${n} item${n===1?'':'s'}`);render();
}

}

      if(qid)setTimeout(()=>openToQuestion(qid),60);break}
    case 'toggleSec': {const s=b.closest('.sect');s.classList.toggle('open');V.openSec[id]=s.classList.contains('open');break}
    case 'toggleQ': {const q=b.closest('.q');q.classList.toggle('open');V.openQ[V.paperId+':'+id]=q.classList.contains('open');if(q.classList.contains('open')){const ta=q.querySelector('.rte');if(ta)ta.focus()}break}
    case 'expandAll': document.querySelectorAll('#paperEditor .sect, #paperEditor .q').forEach(el=>el.classList.add('open'));tpl(S.docs[V.paperId].projectId).questions.forEach(q=>V.openQ[V.paperId+':'+q.id]=true);V.openSec={};document.querySelectorAll('#paperEditor textarea').forEach(autosize);break;
    case 'collapseAll': document.querySelectorAll('#paperEditor .q').forEach(el=>el.classList.remove('open'));Object.keys(V.openQ).forEach(k=>{if(k.startsWith(V.paperId+':'))delete V.openQ[k]});break;
    case 'nextEmpty': {const x=S.docs[V.paperId],t=tpl(x.projectId);const q=t.questions.find(z=>!answered(x,z));if(!q){toast('Every question is answered 🎉');break}
      const sec=document.querySelector(`[data-sec="${q.section}"]`);sec.classList.add('open');V.openSec[q.section]=true;const el=document.querySelector(`[data-q="${q.id}"]`);el.classList.add('open');V.openQ[V.paperId+':'+q.id]=true;el.scrollIntoView({behavior:'smooth',block:'center'});const ta=el.querySelector('.rte');if(ta)setTimeout(()=>ta.focus({preventScroll:true}),300);break}
    case 'choose': {const x=S.docs[V.paperId];const k=b.dataset.key;x[k]=x[k]===b.dataset.v?'':b.dataset.v;b.parentElement.querySelectorAll('button').forEach(z=>z.classList.toggle('on',z.dataset.v===x[k]));updateQState(b.dataset.q);
      // Q5 verdict changes dim state of passes 2-3
      if(k==='verdict'){['pass2','pass3'].forEach(s=>{const el=document.querySelector(`[data-sec="${s}"]`);if(el)el.classList.toggle('dim',x.verdict==='Skip')})}
      save(V.paperId);flashSave();break}
    case 'paperReport': go({view:'paperReport'});break;
    case 'editRef': {const id0=V.paperId,x=S.docs[id0];refEditor(x.ref||newRef(),{heading:'Edit reference',okLabel:'Save reference',pdf:{current:x.pdf},onSave:(ref,file)=>{x.ref=ref;delete x.oldCitation;syncFromRef(x);save(id0);renderMain();if(file)attachPdf(id0,file)}});break}
    case 'pickPdf': {const id0=V.paperId;pickFile(f=>attachPdf(id0,f));break}
    case 'removePdf': {const id0=V.paperId;confirmBox('Remove the attached PDF? Your notes stay.','Remove PDF',async()=>{const x=S.docs[id0];await removePdfAsset(x);delete x.pdf;save(id0);refreshPdfUI(id0);toast('PDF removed')});break}
    case 'copyRef': {const r=S.docs[V.paperId].ref;copyRich(`<p style="padding-left:.5in;text-indent:-.5in">${apaHTML(r)}</p>`,apaText(r),'Reference copied');break}
    case 'copyInText': {const it=inText(S.docs[V.paperId].ref);const d=document.createElement('div');d.innerHTML=it.paren;copyRich(it.paren,d.textContent,'In-text citation copied');break}
    case 'copyRefs': {const pp=sortedRefs(papersOf(V.pid));copyRich(pp.map(x=>`<p style="padding-left:.5in;text-indent:-.5in">${apaHTML(x.ref)}</p>`).join(''),pp.map(x=>apaText(x.ref)).join('\n\n'),'Reference list copied');break}
    case 'deletePaper': confirmBox('This deletes the paper, its notes and any attached PDF.','Delete paper',()=>{const pid=S.docs[V.paperId].projectId;removePdfAsset(S.docs[V.paperId]);remove(V.paperId);go({view:'project',pid,tab:'lit'})});break;
    case 'deleteProject': {const n=papersOf(V.pid).length;confirmBox(`This deletes the project and ${n} paper${n===1?'':'s'} with all notes.`,'Delete project',()=>{papersOf(V.pid).forEach(x=>{removePdfAsset(x);remove(x.id)});remove(V.pid);go({view:'projects',pid:null})});break}
    case 'editTemplate': editTemplate();break;
    case 'resetTemplate': confirmBox('Questions go back to the original 24 from your note sheet. Answers to custom questions will be hidden.','Reset questions',()=>{S.docs[V.pid].template=defaultTemplate();save(V.pid);renderMain();toast('Questions reset')});break;
    case 'repLayout': V.repLayout=b.dataset.v;renderMain();break;
    case 'copyMd': copyText(currentReport(b.dataset.kind).md);break;
    case 'dl': {const r=currentReport(b.dataset.kind);const fn=slug(r.name)+'-notes.'+b.dataset.fmt;offerDownload(fn,b.dataset.fmt==='md'?r.md:standaloneHTML(r.name,r.html),r.md);break}
    case 'backup': backup();break;
    case 'restore': $('#restoreFile').click();break;
  }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.wr){WR[t.dataset.wr]=t.type==='checkbox'?t.checked:t.value;saveWR();toast('Writing settings saved')}
  if(t.dataset.act==='cmpQ'){V.cmpQ=t.value;renderMain()}
  if(t.dataset.act==='zoomSel'){const v=t.value;if(v==='width'||v==='page')setZoom(v);else if(v!=='c')setZoom(+v/100*PDF_PX)}
  if(t.dataset.act==='libProj'){V.lib.proj=t.value;persistView();renderMain()}
  if(t.dataset.act==='libSort'){V.lib.sort=t.value;persistView();renderMain()}
  if(t.dataset.act==='toggleEmpty'){V.showEmpty=t.checked;renderMain()}
  if(t.id==='restoreFile'&&t.files[0]){restore(t.files[0]);t.value=''}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.pf&&S.docs[V.pid]){S.docs[V.pid][t.dataset.pf]=t.value;if(t.tagName==='TEXTAREA')autosize(t);save(V.pid,800);if(t.dataset.pf==='name')renderSide()}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){const o=document.querySelector('.ov');if(o){o.remove();return}if(V.focus&&V.view==='paper'&&!e.target.isContentEditable&&!['input','textarea','select'].includes((e.target.tagName||'').toLowerCase())){setFocus(false);return}closeSearch();$('#q').blur()}
  const tag=(e.target.tagName||'').toLowerCase();
  if(e.key==='/'&&!e.target.isContentEditable&&!['input','textarea','select'].includes(tag)&&!document.querySelector('.ov')){e.preventDefault();$('#q').focus()}
});
/* ---------- focus mode & resizable panes ---------- */
function paneWidth(){let v=52;try{v=parseFloat(localStorage.getItem('litnotes.lw'))||52}catch(e){}return Math.min(80,Math.max(20,v))}
function setPaneWidth(v,persist){
  v=Math.round(Math.min(80,Math.max(20,v))*10)/10;
  const pe=$('#pe'); if(pe)pe.style.setProperty('--lw',v+'%');
  const g=$('#gutter'); if(g)g.setAttribute('aria-valuenow',Math.round(v));
  if(persist){try{localStorage.setItem('litnotes.lw',v)}catch(e){}refitReader()}
}
let _refit;function refitReader(){clearTimeout(_refit);_refit=setTimeout(()=>{const x=S.docs[V.paperId];if(V.view==='paper'&&V.split&&x&&x.pdf&&R.pages.length){if(R.mode!=='custom')layoutPages(fitScale(R.mode));else updateZoomUI()}},120)}
function bindGutter(){
  const g=$('#gutter'),pe=$('#pe'); if(!g||!pe)return;
  const pctAt=clientX=>{const r=pe.getBoundingClientRect();let p=(clientX-r.left)/r.width*100;return p};
  g.addEventListener('pointerdown',e=>{
    e.preventDefault(); g.setPointerCapture(e.pointerId); g.classList.add('drag'); document.body.classList.add('dragging');
    const move=ev=>setPaneWidth(pctAt(ev.clientX),false);
    const up=ev=>{g.releasePointerCapture(e.pointerId);g.classList.remove('drag');document.body.classList.remove('dragging');g.removeEventListener('pointermove',move);g.removeEventListener('pointerup',up);g.removeEventListener('pointercancel',up);setPaneWidth(pctAt(ev.clientX),true)};
    g.addEventListener('pointermove',move); g.addEventListener('pointerup',up); g.addEventListener('pointercancel',up);
  });
  g.addEventListener('dblclick',()=>setPaneWidth(52,true));
  g.addEventListener('keydown',e=>{
    const cur=parseFloat(getComputedStyle(pe).getPropertyValue('--lw'))||paneWidth();
    if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();setPaneWidth(cur+(e.key==='ArrowRight'?3:-3),true)}
    if(e.key==='Home'){e.preventDefault();setPaneWidth(20,true)} if(e.key==='End'){e.preventDefault();setPaneWidth(80,true)}
  });
}
let _fsByUs=false;
function enterFullscreen(){try{const el=document.documentElement;if(!document.fullscreenElement&&el.requestFullscreen){el.requestFullscreen({navigationUI:'hide'}).then(()=>{_fsByUs=true}).catch(()=>{})}}catch(e){}}
function leaveFullscreen(){try{if(document.fullscreenElement&&_fsByUs&&document.exitFullscreen)document.exitFullscreen().catch(()=>{})}catch(e){}_fsByUs=false}
function setFocus(on){
  V.focus=!!on; persistView();
  if(on)enterFullscreen(); else leaveFullscreen();
  renderMain(); window.scrollTo(0,0);
}
document.addEventListener('fullscreenchange',()=>{ if(!document.fullscreenElement&&_fsByUs){_fsByUs=false; if(V.focus)setFocus(false)} });
function switchRTab(t){
  R.tab=t;
  document.querySelectorAll('.seg button').forEach(z=>z.classList.toggle('on',z.dataset.v===t));
  const pg=$('#rpages'),ak=$('#rask'),rp=document.querySelector('.rpdf');
  if(pg)pg.classList.toggle('hide',t!=='pdf'); if(ak)ak.classList.toggle('hide',t!=='ask'); if(rp)rp.classList.toggle('hide',t!=='pdf');
  const tool=$('#pdfTool'); if(tool)tool.innerHTML=pdfToolHTML(S.docs[V.paperId]);
  if(t==='ask'){const i=$('#askIn');if(i)setTimeout(()=>i.focus(),50)}
  if(t==='pdf'&&R.pages.length)setTimeout(()=>{if(R.mode!=='custom')layoutPages(fitScale(R.mode));else updateZoomUI()},30);
}
function openAsk(then){
  if(!V.split){V.split=true;R.tab='ask';persistView();renderMain();setTimeout(then,30);return}
  switchRTab('ask');then();
}
let _rz;window.addEventListener('resize',()=>{clearTimeout(_rz);_rz=setTimeout(()=>{if(V.view==='paper'&&V.split&&R.pages.length&&$('#rpages')){if(R.mode!=='custom')layoutPages(fitScale(R.mode));else updateZoomUI()}},200)});
function closeSearch(){const b=$('#sres');if(b){b.classList.remove('show')}}
$('#q').addEventListener('input',e=>runSearch(e.target.value));
$('#q').addEventListener('focus',e=>{if(e.target.value.trim().length>1)runSearch(e.target.value)});
$('#q').addEventListener('keydown',e=>{
  const items=[...document.querySelectorAll('#sres button')];if(!items.length)return;
  let i=items.findIndex(z=>z.classList.contains('sel'));
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();items.forEach(z=>z.classList.remove('sel'));i=e.key==='ArrowDown'?(i+1)%items.length:(i<=0?items.length-1:i-1);items[i].classList.add('sel');items[i].scrollIntoView({block:'nearest'})}
  if(e.key==='Enter'){e.preventDefault();(items[i>=0?i:0]).click();$('#q').value='';$('#q').blur()}
});
document.addEventListener('mousedown',e=>{if(!e.target.closest('.search'))closeSearch()});
function quickAdd(){
  const ps=projects();
  if(!ps.length){newProject();return}
  const cur=V.pid&&S.docs[V.pid]?V.pid:null;
  if(cur||ps.length===1){V.pid=cur||ps[0].id;newPaper();return}
  const ov=modal(`<h3>Add paper to which project?</h3><div class="field"><label>Project</label><select class="inp" id="qaP">${ps.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div><div class="mfoot"><button class="btn" data-x>Cancel</button><button class="btn pri" data-ok>Continue</button></div>`);
  ov.querySelector('[data-x]').onclick=()=>ov.remove();
  ov.querySelector('[data-ok]').onclick=()=>{V.pid=ov.querySelector('#qaP').value;ov.remove();newPaper()};
}
window.addEventListener('beforeunload',()=>{Object.keys(S.timers).forEach(id=>{clearTimeout(S.timers[id]);if(S.pending.has(id))queueWrite(id)})});

renderThemeSw(); setStatus(); renderSide(); renderMain(); initStore(); if(LOCAL&&LOCAL.updates)setTimeout(()=>checkUpdates(false),2500);getSample();getAssets().then(()=>{if(V.view==='paper'){const b=$('#pdfBox');if(b&&S.docs[V.paperId])b.innerHTML=pdfBoxHTML(S.docs[V.paperId])}});
