  {id:'concept',name:'Concepts & variables',color:'#0ea5e9',hint:'Key constructs and how they are measured'},
  {id:'gap',name:'Gaps',color:'#d64545',hint:'What is missing — material for your contribution'}
];
const STANCES=[['supports','Supports','#22a06b'],['challenges','Challenges','#d64545'],['mixed','Mixed','#c98a12']];
const dimsOf=pid=>DEFAULT_DIMS.concat(((S.docs[pid]||{}).dims)||[]);
const dimById=(pid,id)=>dimsOf(pid).find(d=>d.id===id);
const tagsOf=(pid,dim)=>(((S.docs[pid]||{}).tags)||[]).filter(t=>!dim||t.dim===dim);
const tagById=(pid,id)=>(((S.docs[pid]||{}).tags)||[]).find(t=>t.id===id);
function codingsFor(pid,tagId){
  const out=[];
  papersOf(pid).forEach(x=>(x.codes||[]).forEach(c=>{if(c.tag===tagId)out.push({x,c})}));
  return out;
}
function tagCount(pid,tagId){return codingsFor(pid,tagId).length}
function questionOf(pid,qid){return tpl(pid).questions.find(q=>q.id===qid)}
function codeBodyHTML(x,c,pid){
  if(c.text) return `<p class="excerpt">“${esc(c.text)}”</p>`;
  const q=questionOf(pid,c.qid); return q?`<div class="ans">${answerHTML(x,q)}</div>`:'';
}
function codeBodyText(x,c,pid){
  if(c.text) return c.text;
  const q=questionOf(pid,c.qid); return q?((x.answers||{})[q.id]||''):'';
}
const qLabel=(pid,qid)=>{const t=tpl(pid);const q=t.questions.find(z=>z.id===qid);return q?`Q${t.questions.indexOf(q)+1} ${q.text}`:''};
const cite=x=>inText(x.ref).paren.replace(/<[^>]+>/g,'').replace(/&amp;/g,'&');

/* ---------- chips under each answer ---------- */
function codesRowHTML(x,q){
  const pid=x.projectId, list=(x.codes||[]).filter(c=>c.qid===q.id);
  const chips=list.map(c=>{const t=tagById(pid,c.tag);if(!t)return '';const d=dimById(pid,t.dim)||{};const st=STANCES.find(s=>s[0]===c.stance);
    return `<span class="code-chip" style="--x:${d.color||'var(--accent)'}" title="${esc(d.name||'')}${c.text?' · passage: '+esc(c.text):' · whole answer'}"><i></i><b>${esc(t.name)}</b>${st?`<em style="--s:${st[2]}">${st[1]}</em>`:''}${c.text?`<span class="cx">“${esc(c.text.length>46?c.text.slice(0,44)+'…':c.text)}”</span>`:''}<button data-uncode="${c.id}" aria-label="Remove tag">×</button></span>`}).join('');
  return `<div class="codes" data-codes="${q.id}">${chips}<button class="btn sm ghost tagbtn" data-tagq="${q.id}" title="Tag the selected passage, or the whole answer if nothing is selected">${ico('tag')}Tag</button></div>`;
}
function refreshCodes(qid){
  const x=S.docs[V.paperId]; const el=document.querySelector(`[data-codes="${qid}"]`); if(!x||!el)return;
  const q=tpl(x.projectId).questions.find(z=>z.id===qid); el.outerHTML=codesRowHTML(x,q);
}
function selectionIn(ed){
  const s=getSelection(); if(!s.rangeCount||s.isCollapsed)return '';
  const r=s.getRangeAt(0); if(!ed.contains(r.commonAncestorContainer))return '';
  return s.toString().replace(/\s+/g,' ').trim();
}

/* ---------- the tag dialog ---------- */
function openTagDialog(qid,passage){
  const x=S.docs[V.paperId]; if(!x)return; const pid=x.projectId;
  let dim=(V.lastDim&&dimById(pid,V.lastDim))?V.lastDim:'theme', stance='supports', filter='';
  const ov=modal('',false);
  const draw=()=>{
    const d=dimById(pid,dim), tags=tagsOf(pid,dim).filter(t=>t.name.toLowerCase().includes(filter.toLowerCase()));
    const exact=tagsOf(pid,dim).some(t=>t.name.toLowerCase()===filter.trim().toLowerCase());
    ov.querySelector('.modal').innerHTML=`<h3>Tag ${passage?'this passage':'this answer'}</h3>
      <div class="hint" style="margin-bottom:12px"><b>${passage?'Passage':'Whole answer'} · ${esc(qLabel(pid,qid))}</b>${passage?esc(passage.length>220?passage.slice(0,218)+'…':passage):'Tip: select words in your note first to tag just that passage.'}</div>
      <div class="chips" style="margin-bottom:10px">${dimsOf(pid).map(z=>`<button class="chip ${z.id===dim?'on':''}" data-dim="${z.id}" style="${z.id===dim?`border-color:${z.color};color:${z.color}`:''}">${esc(z.name)}</button>`).join('')}</div>
      <p class="help" style="margin:0 0 8px">${esc(d.hint||'')}</p>
      <input class="inp" id="tagFind" placeholder="${d.debate?'Find or create a debate, e.g. Does enforcement change behaviour?':'Find or create a '+esc(d.name.toLowerCase().replace(/s$/,''))+'…'}" value="${esc(filter)}">
      <div class="taglist">${tags.map(t=>`<button class="tagopt" data-pick="${t.id}"><span>${esc(t.name)}</span><small>${tagCount(pid,t.id)} note${tagCount(pid,t.id)===1?'':'s'}</small></button>`).join('')}
        ${filter.trim()&&!exact?`<button class="tagopt new" data-create="1">${ico('plus')}<span>Create “${esc(filter.trim())}”</span></button>`:''}
        ${!tags.length&&!filter.trim()?`<div class="help" style="padding:8px 2px">No ${esc(d.name.toLowerCase())} yet — type one above.</div>`:''}</div>
      ${d.debate?`<div class="field" style="margin:12px 0 0"><label>This note…</label><div class="choice">${STANCES.map(([k,l,c])=>`<button class="${stance===k?'on':''}" data-stance="${k}" style="${stance===k?`background:${c};border-color:${c}`:''}">${l}</button>`).join('')}</div></div>`:''}
      <div class="mfoot"><button class="btn" data-x>Close</button></div>`;
    const f=ov.querySelector('#tagFind'); f.focus(); f.setSelectionRange(f.value.length,f.value.length);
    f.oninput=()=>{filter=f.value;draw()};
    f.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();const first=ov.querySelector('[data-pick],[data-create]');if(first)first.click()}};
    ov.querySelectorAll('[data-dim]').forEach(b=>b.onclick=()=>{dim=b.dataset.dim;V.lastDim=dim;filter='';draw()});
    ov.querySelectorAll('[data-stance]').forEach(b=>b.onclick=()=>{stance=b.dataset.stance;draw()});
    ov.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>apply(b.dataset.pick));
    const cr=ov.querySelector('[data-create]'); if(cr) cr.onclick=()=>{
      const p=S.docs[pid]; p.tags=p.tags||[]; const t={id:uid('tag_'),dim,name:filter.trim()}; p.tags.push(t); save(pid); apply(t.id);
    };
    ov.querySelector('[data-x]').onclick=()=>ov.remove();
  };
  const apply=tagId=>{
    const d=dimById(pid,dim); x.codes=x.codes||[];
    const dup=x.codes.find(c=>c.tag===tagId&&c.qid===qid&&(c.text||'')===(passage||''));
    if(dup){if(d.debate){dup.stance=stance;save(V.paperId);refreshCodes(qid)}toast('Already tagged');ov.remove();return}
    x.codes.push({id:uid('c'),tag:tagId,qid,text:passage||null,stance:d.debate?stance:undefined,at:Date.now()});
    save(V.paperId); refreshCodes(qid); ov.remove(); toast(`Tagged: ${tagById(pid,tagId).name}`);
  };
  draw();
}

document.addEventListener('click',e=>{

/* ============================================================
   SYNTHESIS REPORTS
   ============================================================ */
function layoutOptions(pid){
  return [['paper','By paper'],['question','By question'],...dimsOf(pid).map(d=>['dim:'+d.id,'By '+d.name.toLowerCase()]),...dimsOf(pid).filter(d=>!d.debate).slice(0,1).map(d=>['matrix:'+d.id,'Matrix: papers × '+d.name.toLowerCase()]),['matrix:debate','Matrix: papers × debates']];
}
function sortedTags(pid,dim){return tagsOf(pid,dim).map(t=>({t,n:tagCount(pid,t.id)})).filter(o=>o.n).sort((a,b)=>b.n-a.n||a.t.name.localeCompare(b.t.name))}
function dimReportHTML(p,pp,dimId){
  const pid=V.pid,d=dimById(pid,dimId); if(!d)return '';
  const tags=sortedTags(pid,dimId);
  if(!tags.length)return `<h2>${esc(d.name)}</h2><p class="na">No notes are tagged with ${esc(d.name.toLowerCase())} yet. Use the Tag button under any answer while taking notes.</p>`;
  let html=`<h2>${esc(d.name)}</h2><p class="meta">${tags.length} ${esc(d.name.toLowerCase())} · ${tags.reduce((a,o)=>a+o.n,0)} tagged notes</p>`;
  const item=({x,c})=>`<div class="syn-item"><h4>${esc(cite(x))} <span style="font-weight:400;color:#6b6f76">· ${esc(paperTitle(x))} · ${esc(qLabel(pid,c.qid))}</span></h4>${codeBodyHTML(x,c,pid)}</div>`;
  tags.forEach(({t})=>{
    const rows=codingsFor(pid,t.id);
    html+=`<h3>${esc(t.name)} <span style="font-weight:400;color:#6b6f76;font-size:15px">(${new Set(rows.map(r=>r.x.id)).size} paper${new Set(rows.map(r=>r.x.id)).size===1?'':'s'})</span></h3>`;
    if(d.debate){
      STANCES.forEach(([k,l,col])=>{const g=rows.filter(r=>(r.c.stance||'mixed')===k);if(!g.length)return;html+=`<h4 style="color:${col};text-transform:uppercase;letter-spacing:.06em;font-size:12.5px;margin-top:14px">${l} (${g.length})</h4>`+g.map(item).join('')});
    }else html+=rows.map(item).join('');
  });
  return html;
}
function matrixHTML(p,pp,dimId){
  const pid=V.pid,d=dimById(pid,dimId); const tags=sortedTags(pid,dimId).map(o=>o.t);
  if(!tags.length)return `<h2>${esc(d.name)} matrix</h2><p class="na">Nothing tagged with ${esc(d.name.toLowerCase())} yet.</p>`;
  const cell=(x,t)=>{const cs=(x.codes||[]).filter(c=>c.tag===t.id);if(!cs.length)return '';
    if(d.debate){const by=k=>cs.filter(c=>(c.stance||'mixed')===k).length;return STANCES.map(([k,l,col])=>by(k)?`<span style="color:${col};font-weight:700" title="${l}">${k==='supports'?'▲':k==='challenges'?'▼':'◆'}${by(k)>1?by(k):''}</span>`:'').join(' ')}
    return `<b>✓</b>${cs.length>1?` <span style="color:#6b6f76">${cs.length}</span>`:''}`};
  return `<h2>${esc(d.name)} matrix</h2><p class="meta">${d.debate?'▲ supports · ▼ challenges · ◆ mixed. ':''}Empty cells show where a paper says nothing on that ${esc(d.name.toLowerCase().replace(/s$/,''))} — possible gaps.</p>
  <div style="overflow:auto"><table class="matrix"><tr><th>Paper</th>${tags.map(t=>`<th>${esc(t.name)}</th>`).join('')}</tr>
  ${pp.map(x=>`<tr><td><b>${esc(cite(x))}</b><br><span style="color:#6b6f76">${esc(paperTitle(x))}</span></td>${tags.map(t=>`<td style="text-align:center">${cell(x,t)}</td>`).join('')}</tr>`).join('')}
  <tr><td><i>Papers</i></td>${tags.map(t=>`<td style="text-align:center"><i>${new Set(codingsFor(pid,t.id).map(r=>r.x.id)).size}</i></td>`).join('')}</tr></table></div>`;
}
function dimReportMd(p,pp,dimId){
  const pid=V.pid,d=dimById(pid,dimId); const tags=sortedTags(pid,dimId); let s=`## ${d.name}\n\n`;
  if(!tags.length)return s+'_Nothing tagged yet._\n\n';
  const item=({x,c})=>`- **${cite(x)}** (${qLabel(pid,c.qid)}): ${(c.text?'“'+c.text+'”':codeBodyText(x,c,pid)).replace(/\n/g,'\n  ')}\n`;
  tags.forEach(({t})=>{const rows=codingsFor(pid,t.id);s+=`### ${t.name}\n\n`;
    if(d.debate)STANCES.forEach(([k,l])=>{const g=rows.filter(r=>(r.c.stance||'mixed')===k);if(g.length)s+=`**${l}**\n\n`+g.map(item).join('')+'\n'});
    else s+=rows.map(item).join('')+'\n'});
  return s;
}
function matrixMd(p,pp,dimId){
  const pid=V.pid,d=dimById(pid,dimId); const tags=sortedTags(pid,dimId).map(o=>o.t); if(!tags.length)return `## ${d.name} matrix\n\n_Nothing tagged yet._\n\n`;
  let s=`## ${d.name} matrix\n\n| Paper | ${tags.map(t=>t.name.replace(/\|/g,'/')).join(' | ')} |\n|---|${tags.map(()=>':-:').join('|')}|\n`;
  pp.forEach(x=>{s+=`| ${cite(x)} | ${tags.map(t=>{const cs=(x.codes||[]).filter(c=>c.tag===t.id);if(!cs.length)return '';return d.debate?cs.map(c=>c.stance==='supports'?'▲':c.stance==='challenges'?'▼':'◆').join(''):'✓'}).join(' | ')} |\n`});
  return s+'\n';
}

    if(kind==='fs'&&f.getAttribute('size')==='7')span.classList.add('fs-'+value);
    const face=(f.getAttribute('face')||'').match(/^lnff-([a-z]+)$/); if(face)span.classList.add('ff-'+face[1]);
    const c=hlColorClass(f.getAttribute('color')); if(c)span.classList.add(c);
    // nested spans of the same kind lose the old value
    span.querySelectorAll&&0;
    while(f.firstChild)span.appendChild(f.firstChild);
    if(span.classList.length){
      const pre=kind==='fs'?'fs-':kind==='ff'?'ff-':'tc-';
      span.querySelectorAll('span').forEach(inner=>[...inner.classList].forEach(c2=>{if(c2.startsWith(pre))inner.classList.remove(c2)}));
      f.replaceWith(span);
    }else f.replaceWith(...span.childNodes);
  });
}

const CH_COLORS=['#5b6bd6','#e07a5f','#2f9e7a','#d4a017','#a855c7','#0ea5e9','#d64545','#64748b'];
function parseChartData(txt){
  const lines=String(txt||'').split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  if(lines.length<2)return null;
  const split=l=>l.split(/\t|;|,(?=(?:[^"]*"[^"]*")*[^"]*$)/).map(x=>x.trim().replace(/^"|"$/g,''));

    g.textAlign='left'; g.font=`26px ${font}`;

}

/* ============================================================
   ABBREVIATIONS & ACRONYMS (per project)
   project.abbrs        : [{short, full}]
   project.abbrIgnore   : ['PDF', …]   things that look like abbreviations but are not to be listed
   ============================================================ */
const abbrsOf=pid=>(((S.docs[pid]||{}).abbrs)||[]).slice().sort((a,b)=>a.short.localeCompare(b.short,undefined,{sensitivity:'base'}));
const abbrIgnored=pid=>new Set(((S.docs[pid]||{}).abbrIgnore)||[]);
const ABBR_STOP=new Set(['of','and','the','for','in','on','to','at','by','with','a','an','de','des','du','la','le','les','et','en','d','l','&']);
function initialsMatch(words,abbr){
  const letters=abbr.replace(/s$/,'').replace(/[^A-Za-z0-9]/g,'').toLowerCase();
  const parts=words.flatMap(w=>w.split(/[-–\/]/)).filter(w=>w&&!ABBR_STOP.has(w.toLowerCase()));
  const ini=parts.map(w=>w[0].toLowerCase()).join('');
  if(ini===letters)return true;
  // allow a word to give two letters (e.g. "Moto-Taxi" → MT, "UNICEF"-style blends): letters must appear in order, every word used
  let i=0; for(const w of parts){const lw=w.toLowerCase();if(lw[0]!==letters[i])return false;i++;let j=1;while(i<letters.length&&j<lw.length&&lw[j]===letters[i]&&parts.indexOf(w)===parts.length-1){i++;j++}}
  return i===letters.length&&parts.length>=2;
}
/* "World Health Organization (WHO)" and "WHO (World Health Organization)" */
function singular(short,full){
  if(!/^[A-Z0-9&-]{2,}s$/.test(short))return {short,full};
  const f=full.replace(/ies$/,'y').replace(/(ss|us|is)$/,'$1').replace(/([^s])s$/,'$1');
  return {short:short.slice(0,-1),full:f};
}
function findDefinitions(text){
  const out=[]; const seen=new Set();
  const re1=/((?:[\p{L}][\p{L}'’-]*[ \t]+){1,9}?[\p{L}][\p{L}'’-]*)\s*\(\s*([A-Z][A-Za-z0-9&-]{1,11})\s*\)/gu;
  let m;
  while((m=re1.exec(text))){
    const words=m[1].trim().split(/\s+/), abbr=m[2];
    if((abbr.match(/[A-Z]/g)||[]).length<2)continue;
    for(let k=1;k<=words.length;k++){const cand=words.slice(-k);if(initialsMatch(cand,abbr)){const full=cand.join(' ');const d=singular(abbr,full.charAt(0).toUpperCase()+full.slice(1));if(!seen.has(d.short)){seen.add(d.short);out.push(d)}break}}
  }
  const re2=/\b([A-Z][A-Za-z0-9&-]{1,11})\s*\(\s*([\p{L}][^()]{3,90}?)\s*\)/gu;
  while((m=re2.exec(text))){
    const abbr=m[1], words=m[2].trim().split(/\s+/);
    if((abbr.match(/[A-Z]/g)||[]).length<2||seen.has(abbr)||seen.has(abbr.replace(/s$/,'')))continue;
    if(initialsMatch(words,abbr)){const d=singular(abbr,m[2].trim());if(!seen.has(d.short)){seen.add(d.short);out.push(d)}}
  }
  return out;
}
function abbrTokens(text){
  const out=new Map();
  (String(text||'').match(/\b[A-Z][A-Za-z0-9&]*(?:-[A-Z0-9]+)?\b/g)||[]).forEach(t=>{
    const caps=(t.match(/[A-Z]/g)||[]).length; if(caps<2||t.length>12)return;
    if(/^[A-Z][a-z]+[A-Z][a-z]+$/.test(t))return;                 // CamelCase names (McDonald)
    const base=/^[A-Z0-9&-]+s$/.test(t)&&t.length>3?t.slice(0,-1):t;  // plural: RTIs → RTI
    out.set(base,(out.get(base)||0)+1);
  });
  return out;
}
function projectTexts(pid){
  const texts=[];
  papersOf(pid).forEach(x=>Object.values(x.answers||{}).forEach(a=>texts.push(a)));
  draftsOf(pid).forEach(d=>texts.push(d.text||''));
  return texts.join('\n');
}
function undefinedAbbrs(pid){
  const defined=new Set(abbrsOf(pid).map(a=>a.short)), ign=abbrIgnored(pid);
  return [...abbrTokens(projectTexts(pid)).entries()].filter(([t])=>!defined.has(t)&&!ign.has(t)).sort((a,b)=>b[1]-a[1]).map(([short,n])=>({short,n}));
}
function upsertAbbr(pid,short,full){
  short=trim(short); full=trim(full); if(!short||!full)return false;
  if(/^[A-Z0-9&-]{2,}s$/.test(short)){const d=singular(short,full);short=d.short;full=d.full}
  const p=S.docs[pid]; p.abbrs=p.abbrs||[];
  const ex=p.abbrs.find(a=>a.short===short); if(ex)ex.full=full; else p.abbrs.push({short,full});
  p.abbrIgnore=(p.abbrIgnore||[]).filter(x=>x!==short);
  save(pid); return true;
}

/* ============================================================
   PDF HIGHLIGHTS & QUOTES
   paper.highlights : [{id, page, color, rects:[[x1,y1,x2,y2] in PDF points], text, at}]
   paper.hlDirty    : highlights changed since they were last written into the PDF file
   paper.pdfOrig    : the untouched PDF once a highlighted copy has been saved (paper.pdf is then the copy)
   Quotes live in the notes as  “text” (Author, Year, p. 5)
   ============================================================ */
const HLC=[['yellow','#ffd60a',[1,0.84,0.04]],['green','#4fd65a',[0.31,0.84,0.35]],['blue','#4aa8ff',[0.29,0.66,1]],['pink','#ff6fb5',[1,0.44,0.71]]];
const vpPt=(vp,x,y)=>{const [a,b,c,d,e,f]=vp.transform;return [a*x+c*y+e,b*x+d*y+f]};
const pdfPt=(vp,x,y)=>{const [a,b,c,d,e,f]=vp.transform,det=a*d-b*c;return [(d*(x-e)-c*(y-f))/det,(a*(y-f)-b*(x-e))/det]};
const hlHex=c=>(HLC.find(z=>z[0]===c)||HLC[0])[1];
const PDFLIB_URL=(LOCAL&&LOCAL.pdflibUrl)||'https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js';
let _pdflib=null;
function loadPdfLib(){
  if(window.PDFLib)return Promise.resolve(window.PDFLib);
  if(_pdflib)return _pdflib;
  _pdflib=new Promise((res,rej)=>{const s=document.createElement('script');s.src=PDFLIB_URL;s.onload=()=>window.PDFLib?res(window.PDFLib):rej(new Error('pdf-lib'));s.onerror=()=>{_pdflib=null;rej(new Error('pdf-lib'))};document.head.appendChild(s)});
  return _pdflib;
}
const curPaper=()=>V.view==='paper'&&S.docs[V.paperId]?S.docs[V.paperId]:null;
const citeCore=x=>cite(x).replace(/^\(|\)$/g,'');
const pageStr=pg=>/[–-]/.test(String(pg))?'pp. '+String(pg).replace(/\s*[-–]\s*/,'–'):'p. '+pg;
const quoteText=(x,text,pg)=>`“${text}” (${citeCore(x)}, ${pageStr(pg)})`;

/* printed page number: the PDF's own page labels, else the first page in the reference */
function printedPage(x,n){
  const lab=R.labels&&R.labels[n-1];
  if(lab&&/^[0-9ivxlcdm]+$/i.test(lab.trim()))return lab.trim();
  const m=String((x.ref||{}).pages||'').match(/(\d+)\s*[-–]\s*(\d+)/);
  if(m&&R.doc){const a=+m[1],b=+m[2],len=b-a+1;if(len===R.doc.numPages)return String(a+n-1);if(len===R.doc.numPages-1&&n>1)return String(a+n-2)}
  return String(n);
}
function cleanSelText(t){
  return String(t||'').replace(/([a-z])-\s*\n\s*([a-z])/g,'$1$2').replace(/\s+/g,' ').replace(/^[\s“"']+|[\s”"']+$/g,'').trim();
}

/* ---------- drawing highlights over the pages ---------- */
function hlLayer(p){let l=p.el.querySelector('.hlLayer');if(!l){l=document.createElement('div');l.className='hlLayer';p.el.appendChild(l)}return l}
function drawHighlights(n){
  const x=curPaper(); if(!x||!R.pages.length)return;
  const pages=n?[R.pages[n-1]]:R.pages;
  pages.forEach(p=>{
    if(!p||!p.vp1)return;
    const l=hlLayer(p);
    l.innerHTML=(x.highlights||[]).filter(h=>h.page===p.n).map(h=>h.rects.map(r=>{
      const [a,b]=vpPt(p.vp1,r[0],r[1]),[c,d]=vpPt(p.vp1,r[2],r[3]); const L=Math.min(a,c),T=Math.min(b,d),W=Math.abs(c-a),H=Math.abs(d-b);
      return `<i data-hl="${h.id}" style="left:${L/p.w*100}%;top:${T/p.h*100}%;width:${W/p.w*100}%;height:${H/p.h*100}%;background:${hlHex(h.color)}"></i>`}).join('')).join('');
  });
}

/* ---------- reading the selection ---------- */
function selectionInPdf(){
  const s=getSelection(); if(!s||s.isCollapsed||!s.rangeCount)return null;
  const r=s.getRangeAt(0), box=$('#rpages'); if(!box||!box.contains(r.commonAncestorContainer))return null;
  const text=cleanSelText(s.toString()); if(text.length<2)return null;
  const byPage={};
  const all=[...r.getClientRects()].filter(c=>c.width>1&&c.height>2);
  const hs=all.map(c=>c.height).sort((a,b)=>a-b), med=hs[Math.floor(hs.length/2)]||12;
  all.filter(c=>c.height<med*2.6).forEach(c=>{
    const el=document.elementsFromPoint(c.left+c.width/2,c.top+c.height/2).find(e=>e.classList&&e.classList.contains('pg'))
      ||R.pages.map(p=>p.el).find(pe=>{const b=pe.getBoundingClientRect();return c.top+c.height/2>=b.top&&c.top+c.height/2<=b.bottom});
    if(!el)return; const p=R.pages[+el.dataset.n-1]; if(!p||!p.vp1)return;
    const b=el.getBoundingClientRect(), k=b.width/p.w;
    const x1=(c.left-b.left)/k, x2=(c.right-b.left)/k, y1=(c.top-b.top)/k, y2=(c.bottom-b.top)/k;
    (byPage[p.n]=byPage[p.n]||[]).push([x1,y1,x2,y2]);
  });
  const pages=Object.keys(byPage).map(Number).sort((a,b)=>a-b); if(!pages.length)return null;
  // merge rectangles on the same line, then convert to PDF points
  const out={};
  pages.forEach(n=>{
    const rs=byPage[n].sort((a,b)=>a[1]-b[1]||a[0]-b[0]), lines=[];
    rs.forEach(q=>{const L=lines.find(l=>Math.abs((l[1]+l[3])/2-(q[1]+q[3])/2)<Math.min(l[3]-l[1],q[3]-q[1])*.5&&q[0]<=l[2]+6&&q[2]>=l[0]-6);
      if(L){L[0]=Math.min(L[0],q[0]);L[1]=Math.min(L[1],q[1]);L[2]=Math.max(L[2],q[2]);L[3]=Math.max(L[3],q[3])}else lines.push(q.slice())});
    const vp=R.pages[n-1].vp1;
    out[n]=lines.map(([a,b,c,d])=>{const [px1,py1]=pdfPt(vp,a,b),[px2,py2]=pdfPt(vp,c,d);return [Math.min(px1,px2),Math.min(py1,py2),Math.max(px1,px2),Math.max(py1,py2)].map(v=>Math.round(v*100)/100)});
  });
  const last=all[all.length-1]||r.getBoundingClientRect();
  return {text,byPage:out,pages,anchor:{x:last.right,y:last.bottom,top:(all[0]||last).top}};
}

/* ---------- the pop-up ---------- */
let POP=null, QUOTE_Q=null;
try{QUOTE_Q=localStorage.getItem('litnotes.quoteQ')}catch(e){}
function defaultQuoteQ(x){
  const t=tpl(x.projectId), qs=t.questions;
  if(QUOTE_Q&&qs.some(q=>q.id===QUOTE_Q))return QUOTE_Q;
  return (qs.find(q=>/quot/i.test(q.text))||qs.find(q=>/finding|evidence|result|claim/i.test(q.text))||qs[0]||{}).id;
}
function hidePop(){const p=$('#selpop');if(p)p.remove();POP=null}
function showPop(info,hl){
  const x=curPaper(); if(!x)return;
  hidePop(); POP={...info,hl};
  const t=tpl(x.projectId), first=info.pages[0], lastP=info.pages[info.pages.length-1];
  const pg=first===lastP?printedPage(x,first):`${printedPage(x,first)}–${printedPage(x,lastP)}`;
  const qsel=defaultQuoteQ(x);
  const host=$('#reader'); if(!host)return;
  const el=document.createElement('div'); el.id='selpop'; el.className='selpop'; el.setAttribute('role','dialog'); el.setAttribute('aria-label','Selected text');
  if(info.loading){el.innerHTML=`<div class="sprow"><span class="spin"></span><span>Reading the text in the box…</span><button class="spx" data-spx aria-label="Close">×</button></div>`;host.appendChild(el);placePop(el,info,host);el.querySelector('[data-spx]').onclick=hidePop;return}
  el.innerHTML=`${info.ocr?`<div class="sprow" style="align-items:flex-start"><textarea class="inp" id="spText" rows="3" aria-label="Recognised text — correct it if needed">${esc(info.text)}</textarea><button class="spx" data-spx aria-label="Close">×</button></div><div class="help" style="margin:-4px 0 0;font-size:12px">Read from the scan — check it against the page and correct any mistakes before adding.</div>`:`<div class="sptext">“${esc(info.text.length>110?info.text.slice(0,108)+'…':info.text)}”<button class="spx" data-spx aria-label="Close">×</button></div>`}
    <div class="sprow"><span class="spl">Highlight</span>${HLC.map(([k,hex])=>`<button class="hlc ${hl&&hl.color===k?'on':''}" data-hlc="${k}" style="background:${hex}" title="${hl?'Change to':'Highlight in'} ${k}" aria-label="${k}"></button>`).join('')}${hl?`<button class="btn sm ghost danger" data-hldel title="Remove this highlight">${ico('trash')}Remove</button>`:''}</div>
    <div class="sprow"><span class="spl">Quote to</span><select class="inp" id="spQ" aria-label="Question to add the quote to">${t.questions.map((q,i)=>`<option value="${q.id}" ${q.id===qsel?'selected':''}>Q${i+1} · ${esc(q.text.length>46?q.text.slice(0,44)+'…':q.text)}</option>`).join('')}</select></div>
    <div class="sprow"><span class="spl">Page</span><input class="inp" id="spPg" value="${esc(pg)}" style="width:76px" aria-label="Page number for the citation" title="Printed page number used in the citation. PDF page ${first}${first!==lastP?'–'+lastP:''}."><span class="muted" style="font-size:12px;flex:1">${esc(citeCore(x))}, ${esc(pageStr(pg))}</span><button class="btn sm" data-spidea title="Save a thought about this passage as an idea">${ico('bulb')}Idea</button><button class="btn sm pri" data-spquote>${ico('plus')}Add quote</button></div>`;
  host.appendChild(el); placePop(el,info,host);
  el.querySelector('[data-spx]').onclick=()=>{hidePop();getSelection().removeAllRanges()};
  const spText=el.querySelector('#spText'); if(spText){spText.addEventListener('input',()=>{POP.text=spText.value.trim()});setTimeout(()=>spText.focus(),30)}
  const pgI=el.querySelector('#spPg'), lab=el.querySelector('.sprow:last-child .muted');
  pgI.addEventListener('input',()=>{lab.textContent=`${citeCore(x)}, ${pageStr(pgI.value.trim()||'?')}`});
  el.addEventListener('mousedown',e=>{if(!e.target.closest('input,select,textarea'))e.preventDefault()});
  el.addEventListener('keydown',e=>{if(e.key==='Escape'){hidePop();e.stopPropagation()}if(e.key==='Enter'&&e.target.id==='spPg'){e.preventDefault();el.querySelector('[data-spquote]').click()}});
  el.querySelectorAll('[data-hlc]').forEach(b=>b.onclick=()=>{if(!POP.text){toast('There is no text to highlight');return}hl?recolorHighlight(hl.id,b.dataset.hlc):addHighlight(POP,b.dataset.hlc);hidePop();getSelection().removeAllRanges()});
  const del=el.querySelector('[data-hldel]'); if(del)del.onclick=()=>{removeHighlight(hl.id);hidePop()};
  el.querySelector('[data-spidea]').onclick=()=>{const text=(POP.text||'').trim();const page=pgI.value.trim();hidePop();getSelection().removeAllRanges();openIdeaDialog({text:text?`“${text}”\n\n`:'',page})};
  el.querySelector('[data-spquote]').onclick=()=>{
    const text=(POP.text||'').trim(); if(!text){toast('There is no text to quote');return}
    const qid=el.querySelector('#spQ').value, page=pgI.value.trim()||String(first);
    QUOTE_Q=qid; try{localStorage.setItem('litnotes.quoteQ',qid)}catch(e){}
    addQuoteToNotes(x,qid,text,page); hidePop(); getSelection().removeAllRanges();
  };
}
function placePop(el,info,host){
  // dock inside the visible part of the reader, away from the selected text (and from browser add-ons that pop up beside it)
  const rp=$('#rpages'), hr=host.getBoundingClientRect(), pr=rp.getBoundingClientRect();
  const visTop=Math.max(pr.top,0), visBot=Math.min(pr.bottom,window.innerHeight), eh=el.offsetHeight;
  const selTop=info.anchor.top, selBot=info.anchor.y;
  const atTop=!(selTop<visTop+eh+24&&selBot>visTop-4);
  el.style.top=((atTop?visTop+10:visBot-eh-10)-hr.top)+'px';
}

/* ---------- highlights ---------- */
function addHighlight(info,color){
  const x=curPaper(); if(!x)return;
  x.highlights=x.highlights||[];
  info.pages.forEach(n=>x.highlights.push({id:uid('hl_'),page:n,color,rects:info.byPage[n],text:info.text,at:Date.now()}));
  x.hlDirty=true; save(V.paperId); info.pages.forEach(n=>drawHighlights(n)); updateHlBar(true);
}
function recolorHighlight(id,color){const x=curPaper();const h=(x.highlights||[]).find(z=>z.id===id);if(!h)return;h.color=color;x.hlDirty=true;save(V.paperId);drawHighlights(h.page);updateHlBar()}
function removeHighlight(id){const x=curPaper();const h=(x.highlights||[]).find(z=>z.id===id);if(!h)return;x.highlights=x.highlights.filter(z=>z.id!==id);x.hlDirty=true;save(V.paperId);drawHighlights(h.page);updateHlBar();toast('Highlight removed')}
function hlAt(clientX,clientY){
  const el=document.elementsFromPoint(clientX,clientY).find(e=>e.classList&&e.classList.contains('pg')); if(!el)return null;
  const p=R.pages[+el.dataset.n-1], x=curPaper(); if(!p||!p.vp1||!x)return null;
  const b=el.getBoundingClientRect(), k=b.width/p.w; const [px,py]=pdfPt(p.vp1,(clientX-b.left)/k,(clientY-b.top)/k);
  return (x.highlights||[]).find(h=>h.page===p.n&&h.rects.some(([a,c,d,e])=>px>=a-1&&px<=d+1&&py>=c-1&&py<=e+1))||null;
}

/* ---------- "save into the PDF" bar ---------- */
function updateHlBar(justAdded){
  const bar=$('#hlsave'), x=curPaper(); if(!bar||!x)return;
  const n=(x.highlights||[]).length;
  if(!x.hlDirty){bar.hidden=true;return}
  bar.hidden=false;
  bar.innerHTML=`<span>${ico('pen')}<b>Save highlights into the PDF?</b> <span class="muted">${n} highlight${n===1?'':'s'} — saving creates a new copy of the PDF with them, so they show in any PDF reader.</span></span><span class="spacer"></span><button class="btn sm ghost" data-hllater>Later</button><button class="btn sm pri" data-hlsavepdf>Save PDF</button>`;
  bar.querySelector('[data-hllater]').onclick=()=>{bar.hidden=true};
  bar.querySelector('[data-hlsavepdf]').onclick=()=>saveHighlightsToPdf(V.paperId);
  if(justAdded)bar.classList.remove('pulse'),void bar.offsetWidth,bar.classList.add('pulse');
}
async function saveHighlightsToPdf(id){
  const x=S.docs[id]; if(!x||!x.pdf)return;
  const bar=$('#hlsave'); if(bar)bar.innerHTML=`<span class="spin"></span><span>Saving the highlighted PDF…</span>`;
  try{
    const a=await getAssets(); if(!a)throw new Error('assets');
    const orig=x.pdfOrig||x.pdf;
    const [PDFLib,buf]=await Promise.all([loadPdfLib(),fetch(pdfUrl(orig)).then(r=>{if(!r.ok)throw new Error('fetch');return r.arrayBuffer()})]);
    const {PDFDocument,PDFName,PDFHexString,PDFString,PDFNumber}=PDFLib;
    const doc=await PDFDocument.load(buf,{ignoreEncryption:true,updateMetadata:false});
    const ctx=doc.context, pages=doc.getPages();
    (x.highlights||[]).forEach(h=>{
      const page=pages[h.page-1]; if(!page||!h.rects.length)return;
      const col=(HLC.find(z=>z[0]===h.color)||HLC[0])[2];
      const bb=[Math.min(...h.rects.map(r=>r[0])),Math.min(...h.rects.map(r=>r[1])),Math.max(...h.rects.map(r=>r[2])),Math.max(...h.rects.map(r=>r[3]))];
      const quads=h.rects.flatMap(([x1,y1,x2,y2])=>[x1,y2,x2,y2,x1,y1,x2,y1]);
      const ops=`/GS0 gs ${col.map(v=>v.toFixed(3)).join(' ')} rg `+h.rects.map(([x1,y1,x2,y2])=>`${(x1-bb[0]).toFixed(2)} ${(y1-bb[1]).toFixed(2)} ${(x2-x1).toFixed(2)} ${(y2-y1).toFixed(2)} re`).join(' ')+' f';
      const gs=ctx.obj({Type:'ExtGState',BM:'Multiply',ca:1,CA:1});
      const ap=ctx.stream(ops,{Type:'XObject',Subtype:'Form',BBox:[0,0,bb[2]-bb[0],bb[3]-bb[1]],Matrix:[1,0,0,1,bb[0],bb[1]],Resources:{ExtGState:{GS0:gs}}});
      const annot=ctx.obj({Type:'Annot',Subtype:'Highlight',Rect:bb,QuadPoints:quads,C:col,CA:1,F:4,
        Contents:PDFHexString.fromText(h.text.slice(0,2000)),T:PDFHexString.fromText('Literature Notes'),NM:PDFString.of(h.id),M:PDFString.fromDate(new Date(h.at||Date.now())),
        AP:{N:ctx.register(ap)}});
      page.node.addAnnot(ctx.register(annot));
    });
    const bytes=await doc.save();
    const name=(orig.name||'paper.pdf').replace(/(\.pdf)?$/i,'')+'.pdf';
    const file=new File([bytes],name,{type:'application/pdf'});
    let res;
    try{res=await a.upload(file,{type:'application/pdf'})}catch(e){if(e&&e.code==='store_unavailable'){await new Promise(r=>setTimeout(r,1200));res=await a.upload(file,{type:'application/pdf'})}else throw e}
    const x2=S.docs[id]; if(!x2){a.delete(res.id).catch(()=>{});return}
    const prev=x2.pdfOrig?x2.pdf:null;
    if(!x2.pdfOrig)x2.pdfOrig=x2.pdf;
    x2.pdf={id:res.id,name,size:res.sizeBytes||bytes.length,addedAt:Date.now(),highlights:(x2.highlights||[]).length};
    x2.hlDirty=false; save(id);
    if(prev&&prev.id&&prev.id!==res.id&&prev.id!==x2.pdfOrig.id)a.delete(prev.id).catch(()=>{});
    delete TEXT[res.id];
    updateHlBar(); refreshPdfBox(id);
    const link=document.querySelector('#reader a[target="_blank"]'); if(link)link.href=pdfUrl(x2.pdf);
    toast('Saved — the PDF now opens with your highlights');
  }catch(e){
    console.warn(e); toast(e&&e.code?assetErr(e):'Could not save the highlighted PDF — try again'); updateHlBar();
  }
}
function refreshPdfBox(id){if(V.view==='paper'&&V.paperId===id){const b=$('#pdfBox');if(b)b.innerHTML=pdfBoxHTML(S.docs[id])}}

/* ---------- quotes into notes ---------- */
function addQuoteToNotes(x,qid,text,page){
  const q=quoteText(x,text,page);
  const ed=document.querySelector(`.rte[data-ans="${qid}"]`);
  if(ed&&ed.closest('#app,body')){
    if(ed.textContent.trim()){const d=document.createElement('div');d.textContent=q;ed.appendChild(d)}else ed.textContent=q;
    rteCommit(ed);
    const el=ed.closest('.q'), sec=el&&el.closest('.sect');
    if(sec){sec.classList.add('open');V.openSec[sec.dataset.sec]=true}
    if(el){el.classList.add('open');V.openQ[V.paperId+':'+qid]=true;el.scrollIntoView({behavior:'smooth',block:'nearest'});el.classList.remove('flash');void el.offsetWidth;el.classList.add('flash')}
  }else{
    x.answers=x.answers||{}; x.answers[qid]=((x.answers[qid]||'').trim()?x.answers[qid].replace(/\s+$/,'')+'\n':'')+q;
    if(x.rich&&x.rich[qid])x.rich[qid]+=`<div>${esc(q)}</div>`;
    save(V.paperId);
  }
  const t=tpl(x.projectId); toast(`Quote added to Q${t.questions.findIndex(z=>z.id===qid)+1} with ${citeCore(x)}, ${pageStr(page)}`);
}
/* quotes found in a paper's notes */
function quotesOf(x){
  const core=citeCore(x), out=[], seen=new Set();
  const re=/“([^”]{2,})”\s*\(([^()]+?),\s*(pp?\.\s*[^)]+)\)/g;
  Object.entries(x.answers||{}).forEach(([qid,a])=>{let m;while((m=re.exec(a||''))){if(m[2].trim()!==core)continue;const k=m[1]+'|'+m[3];if(seen.has(k))continue;seen.add(k);out.push({qid,text:m[1],page:m[3].trim(),full:m[0]})}});
  return out;
}
const endsWithOwnCite=(x,txt)=>new RegExp(citeCore(x).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+',\\s*pp?\\.\\s*[^)]+\\)\\s*\\.?\\s*$').test(txt);

/* ---------- wiring into the reader ---------- */
function bindQuotes(box){
  if(box._qbound)return; box._qbound=true;
  let down=null;
  box.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY};SEL_DRAG=true;hidePop()});
  window.addEventListener('pointerup',()=>{setTimeout(()=>{SEL_DRAG=false},0)},true);
  box.addEventListener('pointerup',e=>{
    const moved=down&&Math.hypot(e.clientX-down.x,e.clientY-down.y)>4;
    setTimeout(()=>{
      const info=selectionInPdf();
      if(info){if(!(POP&&!POP.hl&&POP.text===info.text))showPop(info);return}
      if(!moved){const h=hlAt(e.clientX,e.clientY);if(h){showPop({text:h.text,byPage:{[h.page]:h.rects},pages:[h.page],anchor:{x:e.clientX,y:e.clientY,top:e.clientY}},h)}}
    },10);
  });
}
let _selT, SEL_DRAG=false;
document.addEventListener('selectionchange',()=>{
  if(!$('#rpages')){if(POP)hidePop();return}
  clearTimeout(_selT); _selT=setTimeout(()=>{
    if(SEL_DRAG)return;
    if(document.activeElement&&document.activeElement.closest&&document.activeElement.closest('#selpop'))return;
    const info=selectionInPdf();
    if(info){if(!POP||POP.text!==info.text||POP.hl)showPop(info)}
    else if(POP&&!POP.hl&&!POP.ocr)hidePop();
  },450);
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&POP)hidePop()});

/* ============================================================
   SCANNED PAGES: draw a box with the Area tool, the app reads the text
   Self-hosted: Tesseract on the server (/api/ocr). Online: Claude reads the image.
   ============================================================ */
const AREA_ICON='<svg class="i" viewBox="0 0 24 24"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/><path d="M8 10h8M8 14h5"/></svg>';
function setReaderTool(t){
  R.tool=t; try{localStorage.setItem('litnotes.tool',t)}catch(e){}
  document.querySelectorAll('.seg.tools button').forEach(z=>z.classList.toggle('on',z.dataset.v===t));
  const bx=$('#rpages'); if(bx){bx.classList.toggle('pan',t==='hand');bx.classList.toggle('area',t==='area')}
  updateScanHint();
}
async function ocrAvailable(){
  if(LOCAL&&LOCAL.ocr)return 'server';
  const smp=await getSample(); if(!smp||typeof smp.limits!=='function')return '';
  try{const l=await smp.limits();return l&&l.images?'claude':''}catch(e){return ''}
}
async function ocrImage(blob){
  const how=await ocrAvailable();
  if(how==='server'){
    const r=await fetch('/api/ocr?psm=6',{method:'POST',headers:{'Content-Type':'image/png'},body:blob});
    const j=await r.json().catch(()=>({})); if(!r.ok)throw Object.assign(new Error(j.message||'ocr'),{code:j.code||'ocr_failed'});
    return j.text||'';
  }
  if(how==='claude'){
    const smp=await getSample();
    const r=await smp('This image is a cropped passage from a scanned academic paper. Transcribe its text exactly as printed, in reading order. Join lines that belong to the same paragraph, and rejoin words split by a hyphen at a line break. Do not add, explain, summarise or correct anything. Reply with the text only.',{images:[blob],modelTier:'quick',cache:false});
    return (r&&r.text||'').trim();
  }
  throw Object.assign(new Error('no ocr'),{code:'no_ocr'});
}
/* render the boxed part of a page sharply (about 300 dpi) and return a PNG */
async function cropPage(n,[x1,y1,x2,y2]){
  const p=R.pages[n-1], page=await R.doc.getPage(n);
  const sc=Math.max(1,Math.min(300/72,Math.sqrt(36e6/(p.w*p.h))));
  const vp=page.getViewport({scale:sc});
  const c=document.createElement('canvas'); c.width=Math.ceil(vp.width); c.height=Math.ceil(vp.height);
  await page.render({canvas:c,canvasContext:c.getContext('2d'),viewport:vp}).promise;
  const pad=4, sx=Math.max(0,Math.floor(x1*sc)-pad), sy=Math.max(0,Math.floor(y1*sc)-pad);
  const w=Math.min(c.width-sx,Math.ceil((x2-x1)*sc)+pad*2), h=Math.min(c.height-sy,Math.ceil((y2-y1)*sc)+pad*2);
  const o=document.createElement('canvas'); o.width=w; o.height=h;
  const g=o.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,w,h); g.drawImage(c,sx,sy,w,h,0,0,w,h);
  c.width=c.height=0;
  return await new Promise(res=>o.toBlob(res,'image/png'));
}
async function readArea(n,r1){
  const p=R.pages[n-1]; if(!p||!p.vp1)return;
  const [ax,ay]=pdfPt(p.vp1,r1[0],r1[1]),[bx,by]=pdfPt(p.vp1,r1[2],r1[3]);
  const pdfRect=[Math.min(ax,bx),Math.min(ay,by),Math.max(ax,bx),Math.max(ay,by)].map(v=>Math.round(v*100)/100);
  const b=p.el.getBoundingClientRect(), k=b.width/p.w;
  const anchor={x:b.left+r1[2]*k,y:b.top+r1[3]*k,top:b.top+r1[1]*k};
  const info={text:'',byPage:{[n]:[pdfRect]},pages:[n],anchor,ocr:true,loading:true,tok:Math.random()};
  showPop(info);
  try{
    const blob=await cropPage(n,r1);
    const text=cleanSelText(await ocrImage(blob));
    if(!POP||POP.tok!==info.tok)return;   // closed meanwhile
    showPop({...info,loading:false,text:text||''});
    if(!text)toast('No text found in that area — try a slightly larger box');
  }catch(e){
    hidePop();
    toast(e&&e.code==='no_ocr'?(LOCAL?'Text recognition is not installed on this server — update the app to get it':'Reading scanned pages needs Claude access for this page — reload and choose Allow'):(e&&e.code?sampleErr(e)!=='Something went wrong — please try again.'?sampleErr(e):'Could not read the text in that area — try again':'Could not read the text in that area — try again'));
  }
}
function bindArea(box){
  if(box._abound)return; box._abound=true;
  let st=null;
  box.addEventListener('pointerdown',e=>{
    if(R.tool!=='area'||e.button!==0)return;
    const el=e.target.closest('.pg'); if(!el)return;
    e.preventDefault();
    const b=el.getBoundingClientRect();
    const d=document.createElement('div'); d.className='areabox'; el.appendChild(d);
    st={el,b,x:e.clientX-b.left,y:e.clientY-b.top,d,id:e.pointerId};
    box.setPointerCapture(e.pointerId);
    Object.assign(d.style,{left:st.x+'px',top:st.y+'px',width:'0px',height:'0px'});
  });
  box.addEventListener('pointermove',e=>{
    if(!st||e.pointerId!==st.id)return;
    const x=Math.min(Math.max(e.clientX-st.b.left,0),st.b.width), y=Math.min(Math.max(e.clientY-st.b.top,0),st.b.height);
    Object.assign(st.d.style,{left:Math.min(x,st.x)+'px',top:Math.min(y,st.y)+'px',width:Math.abs(x-st.x)+'px',height:Math.abs(y-st.y)+'px'});
  });
  const end=e=>{
    if(!st||e.pointerId!==st.id)return;
    const s0=st; st=null; try{box.releasePointerCapture(e.pointerId)}catch(_){}
    const L=parseFloat(s0.d.style.left),T=parseFloat(s0.d.style.top),W=parseFloat(s0.d.style.width),H=parseFloat(s0.d.style.height);
    setTimeout(()=>s0.d.remove(),e.type==='pointerup'&&W>10&&H>8?1200:0);
    if(e.type!=='pointerup'||W<=10||H<=8)return;
    const n=+s0.el.dataset.n, p=R.pages[n-1], k=s0.b.width/p.w;
    readArea(n,[L/k,T/k,(L+W)/k,(T+H)/k]);
  };
  box.addEventListener('pointerup',end); box.addEventListener('pointercancel',end);
}

function paperReportBody(x,t,showEmpty,level){
  const h=level||2;
  const ans=q=>{const a=((x.answers||{})[q.id]||'').trim();const c=q.choiceKey?x[q.choiceKey]:'';return {a,c}};
  let html=`${x.ref?`<p class="apa">${apaHTML(x.ref)}</p>`:(x.citation?`<p class="meta">${esc(x.citation)}</p>`:'')}
  <table><tr><th>Date read</th><th>Status</th><th>Verdict</th><th>Support / threat</th></tr><tr><td>${esc(fmtDate(x.dateRead)||'—')}</td><td>${esc(x.status||'Not started')}</td><td>${esc(x.verdict||'—')}</td><td>${esc(x.support||'—')}</td></tr></table>`;
  t.sections.forEach(s=>{
    const qs=t.questions.filter(q=>q.section===s.id);
    const items=qs.map(q=>({q,...ans(q)})).filter(i=>showEmpty||i.a||i.c);
    if(!items.length)return;
    html+=`<h${h+1} style="color:${secColorHex(s)}">${esc(s.title)}</h${h+1}>`;
    items.forEach(i=>{html+=`<h4>${t.questions.indexOf(i.q)+1}. ${esc(i.q.text)}</h4>${i.c?`<p><b>${esc(i.c)}</b></p>`:''}${i.a?`<div class="ans">${answerHTML(x,i.q)}</div>`:(i.c?'':'<p class="na">Not answered</p>')}`});
  });
  return html;
}

  <label class="row" style="gap:7px;font-size:13.5px;font-weight:600"><input type="checkbox" data-act="toggleEmpty" ${V.showEmpty?'checked':''}> Show unanswered</label>
  ${kind==='project'?`<label class="row" style="gap:8px;font-size:13.5px;font-weight:600">Organise by <select class="inp" data-act="repLayoutSel" style="width:auto;border-radius:999px;padding:6px 12px">${layoutOptions(V.pid).map(([v,l])=>`<option value="${v}" ${V.repLayout===v?'selected':''}>${esc(l)}</option>`).join('')}</select></label>`:''}
  <span class="spacer"></span>${kind==='project'?`<button class="btn sm" data-act="copyRefs">${ico('list')}Copy reference list</button>`:''}<button class="btn sm" data-act="copyMd" data-kind="${kind}">${ico('copy')}Copy text</button><button class="btn sm" data-act="dl" data-fmt="md" data-kind="${kind}">${ico('download')}.md</button><button class="btn sm pri" data-act="dl" data-fmt="html" data-kind="${kind}">${ico('download')}Word / PDF (.html)</button></div>`;

function paperIdeas(pid){return ideasAll().filter(i=>i.paperId===pid)}
function paperIdeasHTML(pid){const l=paperIdeas(pid);if(!l.length)return '';return `<h2>Ideas</h2>`+l.map(i=>`<p>${(i.tags||[]).length?`<b>${esc(i.tags.map(t=>ideaLabel(i,t)).join(' · '))}:</b> `:''}${esc(i.text).replace(/\n/g,'<br>')}${i.page?` (${esc(pageStr(i.page))})`:''}</p>`).join('')}
function paperIdeasMd(pid){const l=paperIdeas(pid);if(!l.length)return '';return '## Ideas\n\n'+l.map(i=>'- '+((i.tags||[]).length?`**${i.tags.map(t=>ideaLabel(i,t)).join(' · ')}:** `:'')+i.text.replace(/\n+/g,' ')+(i.page?` (${pageStr(i.page)})`:'')).join('\n')+'\n'}
function sortedRefs(pp){
  const key=x=>{const r=x.ref;if(!r)return (x.title||'').toLowerCase();const a=validPeople(r.authors);const lead=a.length?a.map(z=>trim(z.family)+' '+initials(z.given)).join(' '):trim(r.title);return (lead+' '+(trim(r.year)||'0000')).toLowerCase().replace(/^(the|a|an)\s+/,'')};
  return pp.slice().sort((a,b)=>key(a).localeCompare(key(b)));
}
function projectReportHTML(p,pp,t){
  const order=pp.slice().sort((a,b)=>({Core:0,Background:1,Skip:2}[a.verdict]??3)-({Core:0,Background:1,Skip:2}[b.verdict]??3));
  let html=`<h1>${esc(p.name||'Untitled project')}</h1>
  <p class="meta">Literature review notes · ${pp.length} paper${pp.length===1?'':'s'} · generated ${new Date().toLocaleDateString(undefined,{year:'numeric',month:'long',day:'numeric'})}</p>
  ${p.description?`<p>${esc(p.description)}</p>`:''}
  ${p.chain?`<p><b>My causal chain:</b> ${esc(p.chain)}</p>`:''}
  <h2>Overview</h2>
  <table><tr><th>#</th><th>Paper</th><th>Verdict</th><th>Support / threat</th><th>Status</th></tr>
  ${order.map((x,i)=>`<tr><td>${i+1}</td><td><b>${esc(paperTitle(x))}</b><br>${esc(paperMeta(x))}</td><td>${esc(x.verdict||'—')}</td><td>${esc(x.support||'—')}</td><td>${esc(x.status||'Not started')}</td></tr>`).join('')}
  </table>`;
  if(V.repLayout.startsWith('dim:')) html+=dimReportHTML(p,order,V.repLayout.slice(4));
  else if(V.repLayout.startsWith('matrix:')) html+=matrixHTML(p,order,V.repLayout.slice(7));
  else if(V.repLayout==='question'){
    t.sections.forEach(s=>{
      let sh=`<h2 style="color:${secColorHex(s)}">${esc(s.title)}</h2>`, any=false;
      t.questions.filter(q=>q.section===s.id).forEach(q=>{
        const rows=order.map(x=>({x,a:((x.answers||{})[q.id]||'').trim(),c:q.choiceKey?x[q.choiceKey]:''})).filter(r=>V.showEmpty||r.a||r.c);
        if(!rows.length)return;
        if(!any){html+=sh;any=true}
        html+=`<h3>${t.questions.indexOf(q)+1}. ${esc(q.text)}</h3>`;
        rows.forEach(r=>{html+=`<h4>${esc(paperTitle(r.x))}${r.x.authors||r.x.year?' — '+esc(paperMeta(r.x)):''}</h4>${r.c?`<p><b>${esc(r.c)}</b></p>`:''}${r.a?`<div class="ans">${answerHTML(r.x,q)}</div>`:(r.c?'':'<p class="na">Not answered</p>')}`});
      });
    });
  }else{
    order.forEach((x,i)=>{html+=`<h2>${i+1}. ${esc(paperTitle(x))}</h2><p class="meta">${esc(paperMeta(x))}</p>${paperReportBody(x,t,V.showEmpty,2)}`});
  }
  const pidR=p.id||V.pid, idl=ideasAll().filter(i=>i.projectId===pidR);
  if(idl.length){const tagsR=[...new Set(idl.flatMap(i=>(i.tags||[]).length?i.tags.map(t=>ideaLabel(i,t)):['Untagged']))].sort();html+=`<h2>Ideas</h2>`+tagsR.map(t=>`<h3>${esc(t)}</h3>`+idl.filter(i=>t==='Untagged'?!(i.tags||[]).length:(i.tags||[]).some(z=>ideaLabel(i,z)===t)).map(i=>{const src=ideaSource(i);return `<p>${esc(i.text).replace(/\n/g,'<br>')}${src?` (${esc(src.cite)})`:''}</p>`}).join('')).join('')}
  const abl=abbrsOf(p.id||V.pid);
  if(abl.length) html+=`<h2>Abbreviations</h2><table><tr><th>Abbreviation</th><th>Full form</th></tr>${abl.map(a=>`<tr><td><b>${esc(a.short)}</b></td><td>${esc(a.full)}</td></tr>`).join('')}</table>`;
  const refs=sortedRefs(pp).filter(x=>x.ref);
  if(refs.length) html+=`<h2>References</h2>${refs.map(x=>`<p class="apa">${apaHTML(x.ref)}</p>`).join('')}`;
  return html;
}

/* Markdown export */
function mdPaper(x,t,showEmpty,hl){
  const H=n=>'#'.repeat(n)+' ';
  let s=`${H(hl)}${paperTitle(x)}\n\n`;
  if(paperMeta(x)) s+=`*${paperMeta(x)}*\n\n`;
  if(x.ref) s+=`${apaMd(x.ref)}\n\n`; else if(x.citation) s+=`${x.citation}\n\n`;
  s+=`- **Date read:** ${fmtDate(x.dateRead)||'—'}\n- **Status:** ${x.status||'Not started'}\n- **Verdict:** ${x.verdict||'—'}\n- **Support / threat:** ${x.support||'—'}\n\n`;
  t.sections.forEach(sec=>{
    const items=t.questions.filter(q=>q.section===sec.id).map(q=>({q,a:((x.answers||{})[q.id]||'').trim(),c:q.choiceKey?x[q.choiceKey]:''})).filter(i=>showEmpty||i.a||i.c);
    if(!items.length)return;
    s+=`${H(hl+1)}${sec.title}\n\n`;
    items.forEach(i=>{s+=`**${t.questions.indexOf(i.q)+1}. ${i.q.text}**\n\n${i.c?`*${i.c}*\n\n`:''}${i.a?answerMd(x,i.q):(i.c?'':'_Not answered_')}${i.a||!i.c?'\n\n':''}`});
  });
  return s;
}
function mdProject(p,pp,t){
  const order=pp.slice().sort((a,b)=>({Core:0,Background:1,Skip:2}[a.verdict]??3)-({Core:0,Background:1,Skip:2}[b.verdict]??3));
  let s=`# ${p.name||'Untitled project'}\n\n_${pp.length} papers · generated ${new Date().toISOString().slice(0,10)}_\n\n`;
  if(p.description) s+=p.description+'\n\n';
  if(p.chain) s+=`**My causal chain:** ${p.chain}\n\n`;
  s+=`## Overview\n\n| # | Paper | Verdict | Support / threat | Status |\n|---|---|---|---|---|\n`;
  order.forEach((x,i)=>{s+=`| ${i+1} | ${(paperTitle(x)+(paperMeta(x)?' ('+paperMeta(x)+')':'')).replace(/\|/g,'/')} | ${x.verdict||'—'} | ${x.support||'—'} | ${x.status||'Not started'} |\n`});
  s+='\n';
  if(V.repLayout.startsWith('dim:')) s+=dimReportMd(p,order,V.repLayout.slice(4));
  else if(V.repLayout.startsWith('matrix:')) s+=matrixMd(p,order,V.repLayout.slice(7));
  else if(V.repLayout==='question'){
    t.sections.forEach(sec=>{
      s+=`## ${sec.title}\n\n`;
      t.questions.filter(q=>q.section===sec.id).forEach(q=>{
        const rows=order.map(x=>({x,a:((x.answers||{})[q.id]||'').trim(),c:q.choiceKey?x[q.choiceKey]:''})).filter(r=>V.showEmpty||r.a||r.c);
        if(!rows.length)return;
        s+=`### ${t.questions.indexOf(q)+1}. ${q.text}\n\n`;
        rows.forEach(r=>{s+=`- **${paperTitle(r.x)}**${r.c?` — *${r.c}*`:''}: ${(r.a?answerMd(r.x,q):(r.c?'':'_Not answered_')).replace(/\n/g,'\n  ')}\n`});
        s+='\n';
      });
    });
  }else order.forEach(x=>{s+=mdPaper(x,t,V.showEmpty,2)});
  const pidM=p.id||V.pid, idm=ideasAll().filter(i=>i.projectId===pidM);
  if(idm.length){const tagsM=[...new Set(idm.flatMap(i=>(i.tags||[]).length?i.tags.map(t=>ideaLabel(i,t)):['Untagged']))].sort();s+='## Ideas\n\n'+tagsM.map(t=>`### ${t}\n\n`+idm.filter(i=>t==='Untagged'?!(i.tags||[]).length:(i.tags||[]).some(z=>ideaLabel(i,z)===t)).map(i=>{const src=ideaSource(i);return '- '+i.text.replace(/\n+/g,' ')+(src?` (${src.cite})`:'')}).join('\n')+'\n\n').join('')}
  const abl=abbrsOf(p.id||V.pid);
  if(abl.length) s+=`## Abbreviations\n\n| Abbreviation | Full form |\n|---|---|\n`+abl.map(a=>`| ${a.short.replace(/\|/g,'/')} | ${a.full.replace(/\|/g,'/')} |`).join('\n')+'\n\n';
  const refs=sortedRefs(pp).filter(x=>x.ref);
  if(refs.length) s+=`## References\n\n`+refs.map(x=>apaMd(x.ref)).join('\n\n')+'\n';
  return s;
}

const slug=s=>(s||'notes').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,60)||'notes';
async function offerDownload(filename,data,fallbackText){
  let dl=null; try{dl=window.claude?await window.claude.use('downloads'):null}catch(e){}
  if(dl){
    try{await dl.save({filename,data});toast('Saved '+filename);return}
    catch(e){ if(e&&e.code==='declined')return; }
  }
  if(!window.claude){ // standalone copy opened from disk: a normal browser download works
    try{const u=URL.createObjectURL(data instanceof Blob?data:new Blob([data],{type:'application/octet-stream'}));const a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);toast('Saved '+filename);return}catch(e){}
  }
  copyText(fallbackText||data,'Downloads are not available here — copied to clipboard instead.');
}
async function copyText(txt,msg){
  try{await navigator.clipboard.writeText(txt);toast(msg||'Copied to clipboard')}
  catch(e){const ov=modal(`<h3>Copy your text</h3><p class="sub">Select all and copy.</p><textarea class="inp" style="min-height:300px">${esc(txt)}</textarea><div class="row" style="justify-content:flex-end;margin-top:10px"><button class="btn" data-x>Close</button></div>`,true);ov.querySelector('[data-x]').onclick=()=>ov.remove();ov.querySelector('textarea').select()}
}

      </div>`).join('')}

    ov.querySelectorAll('[data-tq] input').forEach(el=>el.addEventListener('input',()=>{const q=work.questions.find(z=>z.id===el.closest('[data-tq]').dataset.tq);q[el.dataset.k]=el.value}));
    ov.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{work.questions=work.questions.filter(z=>z.id!==b.dataset.del);draw()});
    ov.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>{const i=work.questions.findIndex(z=>z.id===b.dataset.up);const sec=work.questions[i].section;for(let j=i-1;j>=0;j--){if(work.questions[j].section===sec){const tmp=work.questions[j];work.questions[j]=work.questions[i];work.questions[i]=tmp;break}}draw()});
    ov.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{const sec=b.dataset.add;let last=-1;work.questions.forEach((z,i)=>{if(z.section===sec)last=i});work.questions.splice(last+1,0,{id:uid('c'),section:sec,text:'New question',where:'',how:''});draw()});
    ov.querySelector('[data-x]').onclick=()=>ov.remove();

  };

}

function restoreData(o){
  const docs=(o&&o.docs)||o;let n=0;
  Object.entries(docs||{}).forEach(([k,v])=>{if(v&&(v.kind==='project'||v.kind==='paper'||v.kind==='draft')&&/^[A-Za-z0-9_\-.~:@+]+$/.test(k)){S.docs[k]=v;save(k);n++}});

}
function restore(file){

}

/* ---------- focus mode & resizable panes ---------- */
function paneWidth(){let v=52;try{v=parseFloat(localStorage.getItem('litnotes.lw'))||52}catch(e){}return Math.min(80,Math.max(20,v))}
function setPaneWidth(v,persist){
  v=Math.round(Math.min(80,Math.max(20,v))*10)/10;
  const pe=$('#pe'); if(pe)pe.style.setProperty('--lw',v+'%');
  const g=$('#gutter'); if(g)g.setAttribute('aria-valuenow',Math.round(v));
  if(persist){try{localStorage.setItem('litnotes.lw',v)}catch(e){}refitReader()}
}
let _refit;function refitReader(){clearTimeout(_refit);_refit=setTimeout(()=>{const x=S.docs[V.paperId];if(V.view==='paper'&&V.split&&x&&x.pdf&&R.pages.length){if(R.mode!=='custom')layoutPages(fitScale(R.mode));else updateZoomUI()}},120)}
function bindGutter(){
  const g=$('#gutter'),pe=$('#pe'); if(!g||!pe)return;
  const pctAt=clientX=>{const r=pe.getBoundingClientRect();let p=(clientX-r.left)/r.width*100;return p};
  g.addEventListener('pointerdown',e=>{
    e.preventDefault(); g.setPointerCapture(e.pointerId); g.classList.add('drag'); document.body.classList.add('dragging');
    const move=ev=>setPaneWidth(pctAt(ev.clientX),false);
    const up=ev=>{g.releasePointerCapture(e.pointerId);g.classList.remove('drag');document.body.classList.remove('dragging');g.removeEventListener('pointermove',move);g.removeEventListener('pointerup',up);g.removeEventListener('pointercancel',up);setPaneWidth(pctAt(ev.clientX),true)};
    g.addEventListener('pointermove',move); g.addEventListener('pointerup',up); g.addEventListener('pointercancel',up);
  });
  g.addEventListener('dblclick',()=>setPaneWidth(52,true));
  g.addEventListener('keydown',e=>{
    const cur=parseFloat(getComputedStyle(pe).getPropertyValue('--lw'))||paneWidth();
    if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();setPaneWidth(cur+(e.key==='ArrowRight'?3:-3),true)}
    if(e.key==='Home'){e.preventDefault();setPaneWidth(20,true)} if(e.key==='End'){e.preventDefault();setPaneWidth(80,true)}
  });
}
