<head>

<title>Literature Notes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,600&display=swap" rel="stylesheet">

<style>
/* =========================================================
   DESIGN TOKENS — calm (default), calm dark, and three older themes
   ========================================================= */
:root{
  --r:14px; --r-sm:10px; --r-lg:22px;
  --serif:'Newsreader','Newsreader Variable',Georgia,serif;
  --ease:cubic-bezier(.2,.7,.2,1);
  --success:#22a06b; --warn:#c98a12; --danger:#d64545;
}

/* ---------- 0. CALM (default): quiet neutral surfaces, one ink-blue accent, highlighter for "selected" ---------- */
[data-theme="calm"]{
  color-scheme:light;
  --font:'Inter','Inter Variable',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; --font-head:'Inter','Inter Variable',system-ui,-apple-system,'Segoe UI',sans-serif; --head-w:650; --head-ls:-.022em;
  --r:12px; --r-sm:8px; --r-lg:16px;
  --bg:#f5f6f8; --wash:none;
  --panel:#ffffff; --panel-solid:#ffffff; --panel-2:#f2f4f7; --hover:#eceff3;
  --line:#e2e5ea; --line-2:#cdd2da;
  --ink:#1e2531; --ink-2:#3d4655; --muted:#687384;
  --accent:#3346c2; --accent-2:#283a9f; --accent-ink:#fff; --grad:linear-gradient(#3346c2,#3346c2);
  --hl:#f6e49b; --hl-ink:#4d3b00;
  --banner:#ffffff; --banner-ink:#1e2531;
  --glow:none; --shadow:0 1px 2px rgba(30,37,49,.05);
  --glass:none;
  --side-bg:#fafbfc; --side-active:linear-gradient(100deg,transparent 1.5%,var(--hl) 3.5%,var(--hl) 96.5%,transparent 98.5%); --side-active-ink:#1e2531;
  --input:#ffffff; --focus:rgba(51,70,194,.25);
  --c-pass1:#3346c2; --c-pass2:#178a6b; --c-pass3:#c2620f; --c-research:#7a4fc2; --c-paper:#4b5563;
  --y:#e0b21b; --coral:#d9485f;
}
[data-theme="calmdark"]{
  color-scheme:dark;
  --font:'Inter','Inter Variable',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; --font-head:'Inter','Inter Variable',system-ui,-apple-system,'Segoe UI',sans-serif; --head-w:650; --head-ls:-.022em;
  --r:12px; --r-sm:8px; --r-lg:16px;
  --bg:#14171c; --wash:none;
  --panel:#1b1f26; --panel-solid:#1b1f26; --panel-2:#222731; --hover:#262c36;
  --line:#2b313c; --line-2:#3b4351;
  --ink:#e8ebf1; --ink-2:#c4cad5; --muted:#949dad;
  --accent:#8ea0f7; --accent-2:#a7b5fa; --accent-ink:#0f1320; --grad:linear-gradient(#5266e3,#5266e3);
  --hl:#5c4b14; --hl-ink:#fbe8a6;
  --banner:#1b1f26; --banner-ink:#e8ebf1;
  --glow:none; --shadow:0 1px 2px rgba(0,0,0,.35);
  --glass:none;
  --side-bg:#171a20; --side-active:linear-gradient(100deg,transparent 1.5%,var(--hl) 3.5%,var(--hl) 96.5%,transparent 98.5%); --side-active-ink:#fbe8a6;
  --input:#1b1f26; --focus:rgba(142,160,247,.35);
  --c-pass1:#8ea0f7; --c-pass2:#4cc79f; --c-pass3:#f0a35e; --c-research:#c49bf2; --c-paper:#a3abb9;
  --y:#f2c94c; --coral:#f07a8c;
}
/* ---------- 1. MIDNIGHT ---------- */
[data-theme="midnight"]{
  color-scheme:dark;
  --font:'Inter','Inter Variable',system-ui,sans-serif; --font-head:'Sora','Sora Variable','Inter','Inter Variable',sans-serif; --head-w:600; --head-ls:-.02em;
  --bg:#08081a;
  --wash:radial-gradient(900px 520px at 8% -8%,rgba(124,92,255,.28),transparent 62%),radial-gradient(800px 480px at 105% 4%,rgba(255,79,163,.16),transparent 60%),radial-gradient(700px 500px at 50% 120%,rgba(56,189,248,.08),transparent 60%);
  --panel:rgba(255,255,255,.045); --panel-solid:#14142b; --panel-2:rgba(255,255,255,.07); --hover:rgba(255,255,255,.06);
  --line:rgba(255,255,255,.09); --line-2:rgba(255,255,255,.16);
  --ink:#ecebff; --ink-2:#c9c7ec; --muted:#9592bd;
  --accent:#8b6cff; --accent-ink:#fff; --grad:linear-gradient(120deg,#7c5cff 0%,#c04bff 50%,#ff4fa3 100%);
  --banner:linear-gradient(125deg,rgba(124,92,255,.55),rgba(192,75,255,.35) 45%,rgba(255,79,163,.35)),rgba(255,255,255,.03); --banner-ink:#fff;
  --glow:0 0 0 1px rgba(255,255,255,.06),0 20px 50px -20px rgba(124,92,255,.45);
  --shadow:0 1px 0 rgba(255,255,255,.04) inset,0 10px 30px -12px rgba(0,0,0,.6);
  --glass:blur(16px) saturate(140%);
  --side-bg:rgba(10,10,28,.6); --side-active:rgba(139,108,255,.18); --side-active-ink:#fff;
  --input:rgba(255,255,255,.05); --focus:rgba(139,108,255,.55);
  --c-pass1:#7b93ff; --c-pass2:#34d399; --c-pass3:#fbbf24; --c-research:#d08bff; --c-paper:#a5a3c9;
  --y:#fbbf24; --coral:#ff6b8b;
}
/* ---------- 2. VIBRANT ACADEMY ---------- */
[data-theme="vibrant"]{
  color-scheme:light;
  --font:'Plus Jakarta Sans','Plus Jakarta Sans Variable',system-ui,sans-serif; --font-head:'Plus Jakarta Sans','Plus Jakarta Sans Variable',sans-serif; --head-w:800; --head-ls:-.025em;
  --r:18px; --r-sm:12px; --r-lg:26px;
  --bg:#f2f6fc; --wash:radial-gradient(700px 400px at 100% -10%,rgba(20,184,166,.10),transparent 60%),radial-gradient(600px 400px at -10% 30%,rgba(251,191,36,.10),transparent 60%);
  --panel:#ffffff; --panel-solid:#ffffff; --panel-2:#f5f8fd; --hover:#f1f5fd;
  --line:#e3e9f4; --line-2:#cfd9ea;
  --ink:#0f1b3d; --ink-2:#34426a; --muted:#6a7695;
  --accent:#2563eb; --accent-ink:#fff; --grad:linear-gradient(120deg,#2563eb 0%,#0ea5e9 55%,#14b8a6 100%);
  --banner:linear-gradient(120deg,#2563eb 0%,#0ea5e9 55%,#14b8a6 100%); --banner-ink:#fff;
  --glow:0 14px 34px -14px rgba(37,99,235,.45);
  --shadow:0 1px 2px rgba(15,27,61,.04),0 8px 24px -10px rgba(15,27,61,.10);
  --glass:none;
  --side-bg:#ffffff; --side-active:#eaf1ff; --side-active-ink:#1d4ed8;
  --input:#ffffff; --focus:rgba(37,99,235,.35);
  --c-pass1:#2563eb; --c-pass2:#10b981; --c-pass3:#f97316; --c-research:#8b5cf6; --c-paper:#334155;
  --y:#fbbf24; --coral:#fb7185;
}
/* ---------- 3. AURORA ---------- */
[data-theme="aurora"]{
  color-scheme:light;
  --font:'Manrope','Manrope Variable',system-ui,sans-serif; --font-head:'Fraunces','Fraunces Variable',Georgia,serif; --head-w:600; --head-ls:-.015em;
  --r:16px; --r-sm:11px; --r-lg:24px;
  --bg:#fbf9ff;
  --wash:radial-gradient(900px 520px at 0% -10%,rgba(167,139,250,.22),transparent 60%),radial-gradient(800px 520px at 100% 0%,rgba(244,114,182,.16),transparent 60%),radial-gradient(900px 600px at 60% 110%,rgba(129,140,248,.10),transparent 60%);
  --panel:rgba(255,255,255,.86); --panel-solid:#ffffff; --panel-2:#f7f3fe; --hover:#f6f1fd;
  --line:#ece6f6; --line-2:#ddd3ee;
  --ink:#231a3a; --ink-2:#463c62; --muted:#7a7193;
  --accent:#8b5cf6; --accent-ink:#fff; --grad:linear-gradient(120deg,#8b5cf6 0%,#c058e6 50%,#ec4899 100%);
  --banner:linear-gradient(125deg,#f3ecff 0%,#fbe9f5 60%,#ffeef3 100%); --banner-ink:#231a3a;
  --glow:0 18px 40px -18px rgba(139,92,246,.45);
  --shadow:0 1px 2px rgba(60,30,110,.04),0 14px 36px -16px rgba(80,40,140,.16);
  --glass:blur(10px);
  --side-bg:rgba(255,255,255,.7); --side-active:linear-gradient(120deg,rgba(139,92,246,.14),rgba(236,72,153,.10)); --side-active-ink:#5b21b6;
  --input:#ffffff; --focus:rgba(139,92,246,.35);
  --c-pass1:#5b6bd6; --c-pass2:#2f9e7a; --c-pass3:#d97745; --c-research:#a855c7; --c-paper:#5b5670;
  --y:#f5b73b; --coral:#f0718f;
}

/* =========================================================
   BASE
   ========================================================= */
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
body{font-family:var(--font);color:var(--ink);background:var(--bg);background-image:var(--wash);background-attachment:fixed;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;transition:background-color .3s var(--ease),color .3s var(--ease)}
button{font:inherit;cursor:pointer;color:inherit}
input,textarea,select{font:inherit;color:inherit}
::selection{background:color-mix(in srgb,var(--accent) 30%,transparent)}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
h1,h2,h3{font-family:var(--font-head);font-weight:var(--head-w);letter-spacing:var(--head-ls);margin:0}
h1{font-size:clamp(26px,3vw,34px);line-height:1.15}
h2{font-size:20px;line-height:1.25}
.muted,.sub{color:var(--muted)}
.sub{margin:0 0 14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}

/* layout */
.app{display:grid;grid-template-columns:268px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow:auto;padding:18px 14px;display:flex;flex-direction:column;gap:18px;background:var(--side-bg);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);border-right:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:11px;padding:4px 8px}
.logo .mark{width:36px;height:36px;border-radius:11px;background:var(--grad);display:grid;place-items:center;color:#fff;box-shadow:var(--glow)}
.logo .mark svg{width:20px;height:20px;stroke:#fff}
.logo b{font-family:var(--font-head);font-weight:var(--head-w);font-size:16px;letter-spacing:var(--head-ls);line-height:1.1;display:block}
.logo small{font-size:11.5px;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:2px}
.nv{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:var(--r-sm);border:0;background:none;color:var(--ink-2);text-align:left;font-weight:500;transition:background .15s,color .15s}
.nv:hover{background:var(--hover);color:var(--ink)}
.nv.on{background:var(--side-active);color:var(--side-active-ink);font-weight:600}
.nv.on svg{stroke:var(--side-active-ink)}
.nv .k{margin-left:auto;font-size:11px;color:var(--muted);font-weight:500}
.nvfold{display:grid;place-items:center;width:20px;height:20px;margin:-4px -6px -4px 2px;border-radius:6px;flex:none}
.nv .k+.nvfold{margin-left:2px}.nv>span:nth-child(2)+.nvfold{margin-left:auto}
.nvfold:hover{background:var(--hover)}
.nvfold svg{width:13px;height:13px;transition:transform .15s}.nvfold.open svg{transform:rotate(90deg)}
.nvsubs{display:flex;flex-direction:column;gap:1px;margin:2px 0 4px 22px;padding-left:10px;border-left:1px solid var(--line)}
.nvsub{display:flex;align-items:center;gap:8px;padding:6px 10px;border:0;background:none;border-radius:var(--r-sm);color:var(--ink-2);font-size:13px;text-align:left;min-width:0}
.nvsub span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nvsub i{width:7px;height:7px;border-radius:50%;flex:none;background:var(--muted);opacity:.7}
.nvsub:hover{background:var(--hover);color:var(--ink)}
.nvsub.on{color:var(--ink);font-weight:600;background:var(--hover)}
.nvsubs.deep{margin:0 0 1px 7px;padding-left:3px}
.nav-tree>.nvsubs{margin-left:14px;padding-left:4px}
.nvsubs.deep .nvsub,.nav-tree .nvsub{padding:5px 6px;gap:5px}
.nvsub .tl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nvsub em{font-style:normal;font-size:11px;color:var(--muted);flex:none}
.nvsub .tchev,.nvsub .tsp{width:16px;height:16px;flex:none;display:grid;place-items:center;border-radius:4px;margin-left:-6px}
.nvsub .tchev:hover{background:var(--panel-2)}
.nvsub .tchev svg{width:12px;height:12px;transition:transform .15s}.nvsub .tchev.open svg{transform:rotate(90deg)}
.nvsub>svg.i{width:14px;height:14px;flex:none;opacity:.75}
.nvsub.add{color:var(--accent);font-size:12.5px}.nvsub.add>svg.i{opacity:1}
.nvsub.planned .tl{font-style:italic}
#nav{overflow-y:auto;min-height:0}
.ptag{font-size:11px;font-weight:700;color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent);border-radius:999px;padding:1px 8px;margin-left:6px;vertical-align:middle}
.mgrp{margin-top:8px}
.lecpick{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}.lecpick .chip{cursor:pointer}.lecpick input{display:none}
.lecextra summary{font-size:13px;cursor:pointer}.mgh{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:700;color:var(--ink-2);text-transform:uppercase;letter-spacing:.04em}
.mgh .btn{text-transform:none;letter-spacing:0;font-weight:600}.mnone{font-size:12px;padding:2px 0 4px}
.slabel{font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:0 12px;margin-bottom:-8px}
.cur{border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
.cur .ttl{font-weight:700;font-size:14px;line-height:1.3;margin-bottom:2px}
.cur .sm{font-size:12px;color:var(--muted)}
.cur ul{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:2px}
.cur li button{display:flex;gap:9px;align-items:center;width:100%;border:0;background:none;padding:6px 6px;border-radius:8px;text-align:left;font-size:13px;color:var(--ink-2)}
.cur li button:hover{background:var(--hover);color:var(--ink)}
.cur li span.t{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.mini{width:18px;height:18px;flex:none}
.side-foot{margin-top:auto;font-size:12px;color:var(--muted);padding:0 8px;display:flex;align-items:center;gap:7px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--success);flex:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--success) 20%,transparent)}
.dot.warn{background:var(--warn);box-shadow:0 0 0 3px color-mix(in srgb,var(--warn) 20%,transparent)}
.dot.off{background:var(--danger)}

.shell{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:14px clamp(16px,3vw,36px);background:color-mix(in srgb,var(--bg) 72%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.search{position:relative;flex:1;max-width:680px}
.search input{width:100%;height:44px;border-radius:999px;border:1px solid var(--line);background:var(--input);padding:0 52px 0 44px;box-shadow:var(--shadow);transition:border-color .15s,box-shadow .15s}
.search input:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 4px var(--focus)}
.search>svg{position:absolute;left:16px;top:13px;color:var(--muted)}
.search kbd{position:absolute;right:14px;top:11px;font:600 11px var(--font);color:var(--muted);border:1px solid var(--line-2);border-radius:6px;padding:2px 7px}
.sres{position:absolute;left:0;right:0;top:52px;background:var(--panel-solid);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 24px 60px -20px rgba(0,0,0,.35);padding:6px;display:none;max-height:70vh;overflow:auto}
.sres.show{display:block}
.sres .h{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:8px 10px 4px}
.sres button{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 10px;border-radius:10px}
.sres button:hover,.sres button.sel{background:var(--hover)}
.sres .t{font-weight:600;font-size:14px}
.sres .s{font-size:12.5px;color:var(--muted);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.sres mark{background:color-mix(in srgb,var(--y) 45%,transparent);color:inherit;border-radius:3px;padding:0 1px}
.themes{display:flex;gap:3px;padding:4px;border-radius:999px;border:1px solid var(--line);background:var(--panel);box-shadow:var(--shadow)}
.themes button{display:flex;align-items:center;gap:7px;border:0;background:none;padding:6px 12px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted)}
.themes button.on{background:var(--ink);color:var(--bg)}
.sw{width:12px;height:12px;border-radius:50%;flex:none;border:1px solid rgba(255,255,255,.4)}
.sw.midnight{background:linear-gradient(135deg,#1b1640,#7c5cff 60%,#ff4fa3)}
.sw.vibrant{background:linear-gradient(135deg,#2563eb,#14b8a6 60%,#fbbf24)}
.sw.aurora{background:linear-gradient(135deg,#ede4ff,#c4a6ff 50%,#f9a8d4)}
.main{padding:28px clamp(16px,3vw,36px) 90px;max-width:1240px;width:100%}
.top .menu-btn{display:none}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:8px 15px;font-weight:600;font-size:14px;color:var(--ink);transition:transform .12s var(--ease),border-color .15s,background .15s,box-shadow .15s;white-space:nowrap}
.btn:hover{border-color:var(--line-2);background:var(--hover)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--grad);border-color:transparent;color:#fff;box-shadow:var(--glow)}
.btn.pri:hover{filter:brightness(1.06)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--hover);color:var(--ink)}
.btn.danger{color:var(--danger)}
.btn.sm{padding:6px 12px;font-size:13px}
.btn.icon{padding:8px;border-radius:12px}
.btn[disabled]{opacity:.4;pointer-events:none}
.link{border:0;background:none;padding:0;color:var(--accent);font-weight:600}
.link:hover{text-decoration:underline}

/* cards & surfaces */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;box-shadow:var(--shadow);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass)}
.sec-title{display:flex;align-items:end;gap:12px;margin:34px 0 14px}
.sec-title h2{flex:1}
.crumbs{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted);margin-bottom:10px}
.crumbs button{border:0;background:none;padding:0;color:var(--muted);font-weight:500}
.crumbs button:hover{color:var(--accent)}
.page-head{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;margin-bottom:6px}
.page-head .grow{flex:1;min-width:260px}
.lede{color:var(--muted);margin:6px 0 0;max-width:72ch}

/* banner */
.banner{position:relative;overflow:hidden;border-radius:var(--r-lg);padding:30px clamp(20px,3vw,36px);background:var(--banner);color:var(--banner-ink);display:grid;grid-template-columns:1fr auto;gap:24px;align-items:center;box-shadow:var(--shadow);border:1px solid var(--line)}
[data-theme="vibrant"] .banner::after{content:"";position:absolute;right:-60px;top:-60px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(251,191,36,.55),transparent 70%)}
[data-theme="vibrant"] .banner::before{content:"";position:absolute;left:38%;bottom:-90px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(251,113,133,.45),transparent 70%)}
[data-theme="aurora"] .banner::after{content:"";position:absolute;right:8%;top:-80px;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,rgba(192,132,252,.35),transparent 70%)}
[data-theme="midnight"] .banner{backdrop-filter:var(--glass)}
.banner>*{position:relative;z-index:1}
.banner .eyebrow{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;opacity:.8}
.banner h1{margin:6px 0 8px;font-size:clamp(26px,3.2vw,38px)}
.banner p{margin:0 0 18px;opacity:.88;max-width:58ch}
.banner .btn{border-color:rgba(255,255,255,.35)}
[data-theme="midnight"] .banner .btn:not(.pri),[data-theme="vibrant"] .banner .btn:not(.pri){background:rgba(255,255,255,.14);color:#fff}
[data-theme="vibrant"] .banner .btn.pri{background:#fff;color:#1d4ed8;box-shadow:0 10px 24px -10px rgba(0,0,0,.35)}
[data-theme="aurora"] .banner .btn:not(.pri){background:rgba(255,255,255,.7)}
.ring{position:relative;width:132px;height:132px}
.ring svg{width:132px;height:132px;transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.1}
.ring .v b{font-family:var(--font-head);font-size:30px;font-weight:var(--head-w);display:block}
.ring .v small{font-size:11px;opacity:.8;max-width:80px;display:block}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:18px}
.stat{display:flex;gap:14px;align-items:center}
.stat .ic{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--x) 16%,transparent);color:var(--x)}
.stat .ic svg{width:21px;height:21px}
.stat b{font-family:var(--font-head);font-size:24px;font-weight:var(--head-w);line-height:1;display:block}
.stat span{font-size:13px;color:var(--muted)}

/* tags & badges */
.tag{--x:var(--accent);display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:3px 9px;border-radius:999px;background:color-mix(in srgb,var(--x) 15%,transparent);color:color-mix(in srgb,var(--x) 82%,var(--ink))}
.badge{--x:var(--muted);display:inline-flex;align-items:center;font-size:12px;font-weight:700;border-radius:999px;padding:2px 10px;background:color-mix(in srgb,var(--x) 15%,transparent);color:color-mix(in srgb,var(--x) 80%,var(--ink));white-space:nowrap}
.b-Core{--x:var(--c-pass1)}.b-Background{--x:var(--muted)}.b-Skip{--x:var(--danger)}
.b-Supports{--x:var(--success)}.b-Threatens{--x:var(--danger)}.b-Mixed{--x:var(--warn)}.b-Neutral{--x:var(--muted)}

/* task cards */
.tasks{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.task{display:flex;flex-direction:column;gap:10px;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow);backdrop-filter:var(--glass);transition:transform .18s var(--ease),box-shadow .18s,border-color .18s;position:relative;overflow:hidden}
.task::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--x,var(--accent))}
.task:hover{transform:translateY(-2px);border-color:var(--line-2);box-shadow:var(--glow)}
.task .t{font-weight:700;font-size:15.5px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.task .m{font-size:12.5px;color:var(--muted)}
.task .f{display:flex;align-items:center;gap:10px;margin-top:auto;font-size:12.5px;color:var(--muted)}
.bar{flex:1;height:6px;border-radius:99px;background:var(--panel-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--grad)}
.go{display:inline-flex;align-items:center;gap:4px;color:var(--accent);font-weight:700}

/* project cards */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.pc{display:flex;flex-direction:column;gap:12px;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:18px 20px;box-shadow:var(--shadow);backdrop-filter:var(--glass);transition:transform .18s var(--ease),box-shadow .18s}
.pc:hover{transform:translateY(-2px);box-shadow:var(--glow)}
.pc .hd{display:flex;gap:12px;align-items:center}
.pc .av{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-family:var(--font-head);font-weight:700;color:#fff;background:var(--grad);flex:none;font-size:16px}
.pc .t{font-weight:700;font-size:16px;line-height:1.25}
.pc .d{font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:1em}
.pc .nums{display:flex;gap:16px;font-size:12.5px;color:var(--muted)}
.pc .nums b{color:var(--ink);font-size:15px;margin-right:3px}
.pc.add{align-items:center;justify-content:center;border-style:dashed;color:var(--muted);min-height:150px;box-shadow:none;background:transparent}
.pc.add:hover{color:var(--accent);border-color:var(--accent)}

/* tabs, chips, fields */
.tabs{display:inline-flex;gap:4px;padding:4px;border-radius:999px;background:var(--panel);border:1px solid var(--line);margin:18px 0 20px;box-shadow:var(--shadow);flex-wrap:wrap}
.tab{display:inline-flex;align-items:center;gap:7px;border:0;background:none;padding:8px 16px;border-radius:999px;color:var(--muted);font-weight:600;font-size:14px}
.tab:hover{color:var(--ink)}
.tab.on{background:var(--ink);color:var(--bg)}
.subtabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:4px 0 20px;overflow-x:auto}
.subtabs button{border:0;background:none;padding:10px 14px;font:inherit;font-weight:600;font-size:14px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.subtabs button:hover{color:var(--ink)}.subtabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
.subtabs .bdot{width:7px;height:7px;border-radius:50%;background:var(--accent)}
.stabbody>.sec-title:first-child{margin-top:0}
.mwrap{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 6px);z-index:50;min-width:230px;background:var(--panel-solid,var(--panel));border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 36px rgba(0,0,0,.2);padding:6px;display:grid}
.menu[hidden]{display:none}
.menu button{display:flex;align-items:center;gap:10px;border:0;background:none;padding:9px 10px;border-radius:8px;font:inherit;font-size:14px;color:var(--ink);text-align:left;cursor:pointer}
.menu button:hover{background:var(--panel-2)}.menu button.danger{color:var(--danger)}.menu .i{width:16px;height:16px}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 2px}
.curbtn{display:block;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer}.curbtn:hover{border-color:var(--accent)}
.minis{display:flex;gap:16px;flex-wrap:wrap;margin-top:14px;font-size:13px;color:var(--muted)}.minis span{display:inline-flex;align-items:center;gap:6px}.minis b{color:var(--ink)}.minis .i{width:15px;height:15px}
.tab svg{width:16px;height:16px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;color:var(--muted)}
.chip:hover{color:var(--ink)}
.chip.on{background:color-mix(in srgb,var(--accent) 14%,transparent);border-color:color-mix(in srgb,var(--accent) 40%,transparent);color:color-mix(in srgb,var(--accent) 80%,var(--ink))}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field>label{font-size:11.5px;font-weight:700;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.inp{width:100%;border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;background:var(--input);transition:border-color .15s,box-shadow .15s}

select.inp{appearance:auto}
[data-theme="midnight"] select.inp option,[data-theme="midnight"] select.inp optgroup{background:#14142b}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.help{font-size:12.5px;color:var(--muted)}

/* empty states */
.empty{border:1.5px dashed var(--line-2);border-radius:var(--r-lg);padding:44px 24px;text-align:center;color:var(--muted)}
.empty .big{font-family:var(--font-head);font-weight:var(--head-w);font-size:22px;color:var(--ink);margin:10px 0 6px}
.empty .ic{width:56px;height:56px;border-radius:16px;display:inline-grid;place-items:center;background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
.empty .ic svg{width:26px;height:26px}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:22px;text-align:left}
.steps div{border:1px solid var(--line);border-radius:var(--r);padding:14px;background:var(--panel)}
.steps b{display:block;font-size:13px;color:var(--ink);margin:6px 0 2px}
.steps span{font-size:12.5px}
.num{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-weight:800;font-size:13px;background:var(--grad);color:#fff}

/* library table */
.tbl{width:100%;border-collapse:separate;border-spacing:0;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.tbl th,.tbl td{padding:12px 14px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle;font-size:14px}
.tbl tr:last-child td{border-bottom:0}
.tbl th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--panel-2);font-weight:700}
.tbl tbody tr{cursor:pointer;transition:background .12s}
.tbl tbody tr:hover{background:var(--hover)}
.tbl .t{font-weight:700}
.tbl .m{font-size:12.5px;color:var(--muted)}
.tbl td.a{white-space:pre-wrap;cursor:default}
.tbl.static tbody tr{cursor:default}
.tbl.static tbody tr:hover{background:none}

/* paper editor */
.pe{display:grid;grid-template-columns:230px minmax(0,1fr);gap:26px;align-items:start}
.outline{position:sticky;top:140px;max-height:calc(100vh - 160px);overflow:auto;padding-right:4px}
.outline .grp{margin-bottom:14px}
.outline .gh{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--x);margin:0 0 4px;padding:0 8px}
.outline .gh i{flex:1}
.outline .gh small{font-weight:600;letter-spacing:0;color:var(--muted)}
.outline button{display:flex;gap:8px;align-items:flex-start;width:100%;border:0;background:none;text-align:left;font-size:12.5px;padding:5px 8px;border-radius:8px;color:var(--ink-2);line-height:1.35}
.outline button:hover{background:var(--hover);color:var(--ink)}
.outline .od{width:7px;height:7px;border-radius:50%;border:1.5px solid var(--line-2);flex:none;margin-top:5px}
.outline .od.done{background:var(--x);border-color:var(--x)}
.ptoolbar{position:sticky;top:73px;z-index:10;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 0;margin-bottom:6px;background:linear-gradient(var(--bg) 70%,transparent)}
[data-theme="midnight"] .ptoolbar{background:linear-gradient(#0b0b1e 70%,transparent)}
.save{font-size:12.5px;color:var(--muted);display:inline-flex;align-items:center;gap:6px;min-width:140px;justify-content:flex-end;white-space:nowrap}
.save .dot,.side-foot .dot{transition:background-color .3s}
.refcard{margin-bottom:16px}
.refcol .i{transform:rotate(90deg);transition:transform .2s}
.refcard.min .refcol .i{transform:none}
.refmini,.refmini2{display:none}
.refcard.min{padding-top:10px;padding-bottom:10px}
.refcard.min>*:not(.refhead){display:none}
.refcard.min .refhead{margin-bottom:0!important;flex-wrap:nowrap}
.refcard.min .reffull,.refcard.min [data-act="copyRef"]{display:none}
.refcard.min .refmini{display:block;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13.5px;color:var(--ink-2)}
.refcard.min .refmini2{display:inline-flex;flex:none;margin:0}
.refcard .apa-big{font-family:var(--serif);font-size:17.5px;line-height:1.55;padding-left:2em;text-indent:-2em;margin:4px 0 8px}
.intext{display:flex;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.intext code{font-family:var(--font);background:var(--panel-2);border:1px solid var(--line);border-radius:7px;padding:2px 8px;color:var(--ink-2)}
.warnline{font-size:13px;color:var(--warn);margin-top:6px;display:flex;gap:6px;align-items:flex-start}
.sect{--x:var(--accent);border:1px solid var(--line);border-radius:var(--r);background:var(--panel);margin-bottom:14px;box-shadow:var(--shadow);overflow:clip;backdrop-filter:var(--glass);scroll-margin-top:140px}
.shead{display:flex;align-items:center;gap:14px;width:100%;border:0;padding:15px 18px;text-align:left;background:linear-gradient(90deg,color-mix(in srgb,var(--x) 13%,transparent),transparent 70%)}
.shead .si{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--x);color:#fff;font-weight:800;font-size:14px;flex:none;box-shadow:0 8px 18px -8px var(--x)}
.shead .tx{flex:1;min-width:0}
.shead .st{font-weight:800;font-size:15px;display:block}
.shead .sd{font-size:12.5px;color:var(--muted);display:block}
.shead .sp{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:color-mix(in srgb,var(--x) 15%,transparent);color:color-mix(in srgb,var(--x) 80%,var(--ink));white-space:nowrap}
.chev{transition:transform .2s var(--ease);color:var(--muted)}
.sect.open>.shead .chev,.q.open>.qhead .chev{transform:rotate(90deg)}
.sbody{display:none;border-top:1px solid var(--line)}
.sect.open>.sbody{display:block}
.qnav{position:sticky;top:122px;z-index:8;display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:8px;margin:0 0 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel-solid,var(--panel));box-shadow:var(--shadow)}

.qnav [data-v="-1"] .i{transform:rotate(180deg)}

.qnav-tools{display:flex;gap:4px;margin-left:auto}
.qnav .tg{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:none;border-radius:999px;padding:5px 10px;font:inherit;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer}
.qnav .tg.on{color:var(--ink);background:var(--panel-2)}
.qnav .tg:hover{border-color:var(--accent)}
.notescol.single .sect{display:none}

.notescol .rtebar{position:sticky;top:var(--rtetop,180px);z-index:7;background:linear-gradient(var(--panel-2),var(--panel-2)),var(--panel-solid,var(--bg));box-shadow:0 -8px 0 0 var(--panel-solid,var(--bg))}

.outline button.on{background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--ink);font-weight:600}

.snote{margin:12px 18px 0;font-size:13px;color:var(--muted);background:var(--panel-2);border-radius:10px;padding:9px 12px}
.q{border-top:1px solid var(--line);scroll-margin-top:150px}

.hints{display:block;margin-bottom:8px}.hints:not(:has(.hint:not([hidden]))){display:none}

/* ---------- courses ---------- */
.slabel.nvsep{margin:14px 0 6px}.nvgap{height:1px;background:var(--line);margin:14px 6px 10px}

.tdue.warn{border-color:color-mix(in srgb,#e0a100 55%,var(--line))}.tdue.late{border-color:var(--danger)}.tdue.late span{color:var(--danger)}

.cmeta{font-size:12.5px;color:var(--muted)}

@keyframes sp{to{transform:rotate(360deg)}}

/* reader & ask */

.pe.split{grid-template-columns:minmax(0,var(--lw,52%)) 14px minmax(0,1fr);gap:0}

.gutter{display:none}

.gutter::before{content:"";width:4px;height:56px;border-radius:4px;background:var(--line-2);transition:background .15s,height .15s}

.ftitle{display:none}

body.focus .pe.split>.reader,body.focus .pe.split>.gutter{position:relative;top:0;height:100%}
body.focus .pe.split>.notescol{height:100%;overflow:auto;padding:0 6px 60px 2px;overscroll-behavior:contain}
body.focus .pe:not(.split){grid-template-columns:1fr;max-width:940px;margin:0 auto}
body.focus .sect,body.focus .q{scroll-margin-top:12px}
.pe.split .outline{display:none}
.reader{position:sticky;top:130px;height:calc(100vh - 146px);display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);background:var(--panel-solid);overflow:hidden;box-shadow:var(--shadow)}
.rbar{display:flex;gap:6px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.rpdf{display:inline-flex;gap:4px;align-items:center}
.pgn{font-size:12.5px;font-weight:700;color:var(--muted);padding:0 6px;font-variant-numeric:tabular-nums}

.seg button{border:0;background:none;padding:5px 12px;border-radius:999px;font-size:13px;font-weight:700;color:var(--muted);display:inline-flex;gap:6px;align-items:center}

.seg svg{width:15px;height:15px}
.btn.icon.sm{padding:6px;border-radius:10px;min-width:32px;justify-content:center}
.rbody{flex:1;overflow:auto;background:color-mix(in srgb,var(--ink) 12%,var(--bg));padding:14px;display:flex;flex-direction:column;align-items:flex-start;gap:12px;touch-action:pan-x pan-y;overscroll-behavior:contain}
.rbody .pg{margin-inline:auto}
.rbody.pan{cursor:grab}.rbody.pan.grabbing{cursor:grabbing}
.rbody.pan .textLayer{pointer-events:none}
.rbody.pan .textLayer span{cursor:inherit}
.pg canvas{width:100%;height:100%}
.zoomctl{display:inline-flex;align-items:center;gap:3px}
.zsel{appearance:none;-webkit-appearance:none;border:1px solid var(--line);background:var(--input);border-radius:9px;padding:5px 8px;font-size:12.5px;font-weight:700;color:var(--ink);min-width:66px;text-align:center;text-align-last:center;cursor:pointer}
.zsel:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px var(--focus)}
.seg.tools button{padding:5px 8px}.seg.tools svg{width:16px;height:16px}
[data-theme="midnight"] .rbody{background:#05050f}
.pg{position:relative;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.22);flex:none}

.hide{display:none!important}
.rload{display:flex;gap:10px;align-items:center;color:var(--muted);padding:40px 20px;font-size:14px;align-self:stretch;justify-content:center;background:var(--panel-solid);border-radius:12px}
.rask{flex:1;display:flex;flex-direction:column;min-height:0;padding:14px}

.qask{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;margin:0 0 10px}.qask svg{width:15px;height:15px}
@media (max-width:1100px){.pe.split,body.focus .pe.split{grid-template-columns:1fr;height:auto}.pe.split>.gutter{display:none}.reader,body.focus .pe.split>.reader{position:relative;top:0;height:72vh}body.focus .pe.split>.notescol{height:auto;overflow:visible}}

/* auto-fill note */
.fillnote{display:flex;gap:10px;align-items:flex-start;margin-top:8px;font-size:13px;line-height:1.45;padding:9px 12px;border-radius:10px;background:var(--panel-2);border:1px solid var(--line);color:var(--ink-2)}

.fillnote .spin{width:15px;height:15px}

/* report */
.report{background:#fffefb;color:#1f2328;border:1px solid var(--line);border-radius:var(--r);padding:clamp(22px,5vw,60px);font-family:var(--serif);font-size:17px;line-height:1.6;box-shadow:var(--shadow)}

.report h3{font-size:19px;margin:22px 0 4px}
.report h4{font-family:Arial,Helvetica,sans-serif;font-size:14px;margin:16px 0 3px;color:#33363b}

.report .meta{font-family:Arial,Helvetica,sans-serif;font-size:14px;color:#6b6f76}

/* document ribbon */
.ribbon{border:1px solid var(--line);border-bottom:0;border-radius:var(--r-sm) var(--r-sm) 0 0;background:linear-gradient(var(--panel-2),var(--panel-2)),var(--panel-solid,var(--bg));position:sticky;top:var(--ribtop,73px);z-index:9}
.ribbon .rtabs{display:flex;align-items:center;gap:2px;padding:4px 6px 0;border-bottom:1px solid var(--line)}
.ribbon .rtabs button{border:0;background:none;padding:7px 14px 8px;font-size:13px;font-weight:700;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.ribbon .rtabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
.ribbon .rtabs .rcol{padding:4px 8px}.ribbon .rtabs .rcol svg{width:16px;height:16px;transition:transform .2s}
.ribbon.collapsed .rtabs .rcol svg{transform:rotate(180deg)}
.ribbon.collapsed .rtabs{border-bottom:0}
.ribbon.collapsed .rpane{display:none}
.ribbon .rtebar{border:0;border-radius:0;background:none}
.rgroups{display:flex;flex-wrap:wrap;gap:4px 0;padding:6px 4px}
.rg{display:flex;flex-direction:column;padding:0 10px;border-right:1px solid var(--line)}

.rgl{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:center;order:2;margin-top:2px}

.rbig svg{width:22px;height:22px}
.tcs{display:inline-flex;gap:1px;margin-left:4px}.tcs button{border:0;background:none;width:24px;height:30px;border-radius:6px;display:grid;place-items:center}

.floatbar{position:fixed;z-index:40;display:flex;align-items:center;gap:2px;padding:4px;border-radius:10px;background:var(--panel-solid);border:1px solid var(--line);box-shadow:0 10px 30px -10px rgba(0,0,0,.35)}
.floatbar button{border:0;background:none;padding:5px 9px;border-radius:7px;font-size:12.5px;font-weight:700;color:var(--ink-2)}
.floatbar button:hover{background:var(--hover)}.floatbar button.on{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}
.floatbar svg{width:15px;height:15px}.floatbar .sep{width:1px;height:18px;background:var(--line-2);margin:0 3px}
.swbtn{width:30px;height:30px;border-radius:8px;border:3px solid}.swbtn.on{outline:2px solid var(--accent);outline-offset:2px}
/* document content */
.rte.draft{font-family:var(--dfont,var(--serif));font-size:var(--dsize,17.5px);line-height:var(--dlh,1.75)}
.rte .al-center,.report .al-center{text-align:center}.rte .al-right,.report .al-right{text-align:right}.rte .al-justify,.report .al-justify{text-align:justify}

.img-s{width:30%}.img-m{width:55%}.img-l{width:80%}.img-full{width:100%}
.rte img:hover{outline:2px solid color-mix(in srgb,var(--accent) 50%,transparent)}
.rte p.cap,.report p.cap{font-size:.88em;font-style:italic;color:var(--muted);margin-top:-4px}
table.dtable{border-collapse:collapse;width:100%;margin:8px 0 12px;font-size:.92em}

/* synthesis: tags */
.codes{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}

.code-chip em{font-style:normal;font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:#fff;background:var(--s);border-radius:999px;padding:1px 7px}

.code-chip button{border:0;background:none;color:var(--muted);width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:14px;padding:0}

.tagbtn svg{width:15px;height:15px}

.tagopt.new{color:var(--accent);font-weight:700;justify-content:flex-start}.tagopt.new svg{width:15px;height:15px}
/* write */
.wr{display:grid;grid-template-columns:minmax(0,var(--ww,60%)) 14px minmax(0,1fr);align-items:start}
.wr>.gutter{display:flex;align-self:stretch;align-items:center;justify-content:center;cursor:col-resize;touch-action:none;position:sticky;top:130px;height:calc(100vh - 146px)}
.wcol{min-width:0}
.dtitle{width:100%;border:0;background:none;font-family:var(--font-head);font-weight:var(--head-w);letter-spacing:var(--head-ls);font-size:clamp(24px,2.6vw,32px);padding:4px 2px 12px;outline:0}
.dtitle:focus{box-shadow:inset 0 -2px 0 var(--accent)}
.rte.draft{min-height:62vh;font-family:var(--serif);font-size:17.5px;line-height:1.75;padding:22px 28px}
.rte h2{font-family:var(--font-head);font-size:22px;margin:18px 0 6px;line-height:1.3}
.rte h3{font-family:var(--font-head);font-size:18px;margin:14px 0 4px;line-height:1.3}
.rte.draft h2:first-child{margin-top:0}
.rte p{margin:0 0 10px}
.report .ans p,.ncard p{margin:0 0 6px}
.refs{margin-top:18px;padding:18px 22px;border:1px dashed var(--line-2);border-radius:var(--r)}
.refs h3{font-size:16px;margin-bottom:8px}.refs .apa{font-family:var(--serif);font-size:15.5px;margin:0 0 6px}
.nbrowse{position:sticky;top:130px;max-height:calc(100vh - 146px);display:flex;flex-direction:column;gap:8px;padding:14px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);box-shadow:var(--shadow);overflow:hidden}
.nbhead{display:flex;gap:10px;align-items:center}.nbhead b{white-space:nowrap}.nbhead select{flex:1}
.nlist{overflow:auto;display:flex;flex-direction:column;gap:8px;padding-right:2px;min-height:0}
.ncard{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--panel-2)}
.ncard .nh{display:flex;gap:6px;flex-wrap:wrap;font-size:12.5px;margin-bottom:4px}.ncard .nh span{color:var(--muted)}
.ncard .nb{font-size:14px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}
.ncard .nb .excerpt,.ncard .nb .ans{margin:0}
.ncard .na-row{display:flex;gap:6px;margin-top:8px}
.stance{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin:6px 2px 0}
body.focus .wr{height:calc(100vh - 60px)}
body.focus .wr>.wcol{height:100%;overflow:auto;padding-right:6px}
body.focus .wr>.gutter,body.focus .nbrowse{position:relative;top:0;height:100%;max-height:none}
@media (max-width:1100px){.wr{grid-template-columns:1fr}.wr>.gutter{display:none}.nbrowse{position:relative;top:0;max-height:70vh;margin-top:16px}body.focus .wr{height:auto}body.focus .wr>.wcol{height:auto}}
/* writing assistant */
.rtebar .chk{display:inline-flex;gap:5px;align-items:center;font-size:12.5px;font-weight:700;color:var(--accent);padding:0 9px}
.abbrsug{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px}.abbrsug[hidden]{display:none}
.abchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel-2);border-radius:999px;padding:3px 4px 3px 10px}
.abchip button{border:0;background:none;color:var(--accent);font-weight:700;cursor:pointer;padding:2px 6px;border-radius:999px;font:inherit}.abchip button:hover{background:var(--panel)}
.rbody.area .textLayer{pointer-events:none}.rbody.area .pg{cursor:crosshair}
.areabox{position:absolute;z-index:3;border:2px dashed var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent);border-radius:3px;pointer-events:none}
.scanhint{background:color-mix(in srgb,var(--warn,#e0a100) 12%,var(--panel))}
.selpop textarea.inp{flex:1;min-height:64px;font-size:13px;line-height:1.4;padding:7px 9px;resize:vertical}
.hlLayer{position:absolute;inset:0;z-index:0;pointer-events:none;mix-blend-mode:multiply}
.hlLayer i{position:absolute;display:block;border-radius:2px}
.selpop{position:absolute;z-index:30;left:50%;transform:translateX(-50%);background:var(--panel-solid,var(--panel));color:var(--ink);border:1px solid var(--line);border-radius:14px;box-shadow:0 14px 40px rgba(0,0,0,.3);padding:10px 12px;display:grid;gap:8px;width:min(420px,calc(100% - 24px));font-size:13px;animation:spIn .15s ease}
@keyframes spIn{from{opacity:0;transform:translate(-50%,8px)}}
.selpop .sptext{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;color:var(--muted);font-style:italic;line-height:1.35}
.selpop .spx{margin-left:auto;border:0;background:none;color:var(--muted);font-size:18px;line-height:1;cursor:pointer;padding:0 2px;font-style:normal}
.selpop .sprow{display:flex;align-items:center;gap:8px}
.selpop .spl{font-weight:700;font-size:12px;min-width:62px;color:var(--muted)}
.selpop select.inp{flex:1;min-width:0;padding:6px 8px;font-size:13px}.selpop input.inp{padding:6px 8px;font-size:13px}
.hlc{width:28px;height:28px;border-radius:50%;border:2px solid rgba(0,0,0,.25);box-shadow:0 1px 3px rgba(0,0,0,.25);cursor:pointer;padding:0}.hlc:hover{transform:scale(1.12)}.hlc.on{outline:2px solid var(--accent);outline-offset:2px}
.hlsave{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 12px;background:color-mix(in srgb,var(--accent) 10%,var(--panel));border-bottom:1px solid var(--line);font-size:13px}
.hlsave[hidden]{display:none}.hlsave .i{width:15px;height:15px;vertical-align:-3px;margin-right:4px}
.hlsave.pulse{animation:hlp 1.2s ease}@keyframes hlp{0%{background:color-mix(in srgb,var(--accent) 35%,var(--panel))}100%{}}
.q.flash{animation:qflash 1.6s ease}@keyframes qflash{0%,30%{box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 45%,transparent)}100%{box-shadow:none}}
.gsug{margin-top:8px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--panel-2);overflow:hidden}
.gs-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:9px 12px;font-size:13px}
.gs-head svg{width:16px;height:16px}.gs-head.ok svg{color:var(--success)}.gs-head.warn svg{color:var(--warn)}
.gs-head .spin{width:15px;height:15px}
.gs-item{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:9px 12px;border-top:1px solid var(--line);font-size:13.5px}
.gs-txt{flex:1;min-width:200px}
.gs-old{text-decoration:line-through;text-decoration-color:var(--danger);color:var(--muted)}
.gs-new{font-weight:700;color:var(--success)}
.gs-why{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.gs-type{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:999px;background:color-mix(in srgb,var(--c-pass1) 14%,transparent);color:color-mix(in srgb,var(--c-pass1) 80%,var(--ink))}
.gs-type.t-spelling{background:color-mix(in srgb,var(--danger) 13%,transparent);color:color-mix(in srgb,var(--danger) 80%,var(--ink))}
.gs-type.t-punctuation{background:color-mix(in srgb,var(--warn) 15%,transparent);color:color-mix(in srgb,var(--warn) 80%,var(--ink))}
.gs-type.t-capitalisation{background:color-mix(in srgb,var(--c-research) 14%,transparent);color:color-mix(in srgb,var(--c-research) 80%,var(--ink))}
/* rich-text notes */
.rtebar{display:flex;align-items:center;gap:2px;flex-wrap:wrap;padding:4px;border:1px solid var(--line);border-bottom:0;border-radius:var(--r-sm) var(--r-sm) 0 0;background:var(--panel-2)}
.rtebar button{border:0;background:none;min-width:30px;height:30px;border-radius:8px;display:inline-grid;place-items:center;color:var(--ink-2);font-size:14px;padding:0 6px}
.rtebar button:hover{background:var(--hover);color:var(--ink)}
.rtebar button.on{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}
.rtebar .sep{width:1px;height:20px;background:var(--line-2);margin:0 4px}
.rtebar .swc{width:18px;height:18px;border-radius:50%;border:1.5px solid rgba(0,0,0,.12);display:block}
.rtebar .lbl{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin:0 4px 0 2px}
.rte{min-height:96px;border:1px solid var(--line);border-radius:0 0 var(--r-sm) var(--r-sm);padding:10px 12px;background:var(--input);line-height:1.65;outline:0;white-space:pre-wrap;overflow-wrap:anywhere;transition:border-color .15s,box-shadow .15s}
.rte:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--focus)}
.rte:empty::before{content:attr(data-ph);color:var(--muted);pointer-events:none}
.rte b,.rte strong{font-weight:700}
.rte ul,.rte ol,.tbl td.a ul,.tbl td.a ol{margin:2px 0;padding-left:24px;white-space:normal}
.rte li,.tbl td.a li{margin:2px 0;white-space:pre-wrap}
.tbl td.a ul,.tbl td.a ol{margin:4px 0}
.report .ans{margin:0 0 9px}
.report .excerpt{margin:0 0 9px;font-style:italic}
.report .syn-item{margin-bottom:6px}
.report table.matrix th{font-size:12.5px}
.report table.matrix td{font-size:13px}
.report .ans ul,.report .ans ol{margin:4px 0 6px;padding-left:26px}
.report .ans li{margin:2px 0}
mark.hl-yellow,mark.hl-green,mark.hl-blue,mark.hl-pink,mark.hl-orange{color:inherit;border-radius:3px;padding:0 1px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
mark.hl-yellow{background:rgba(250,204,21,.42)}mark.hl-green{background:rgba(74,222,128,.38)}mark.hl-blue{background:rgba(96,165,250,.38)}mark.hl-pink{background:rgba(244,114,182,.38)}mark.hl-orange{background:rgba(251,146,60,.42)}
.swc.hl-yellow{background:#facc15}.swc.hl-green{background:#4ade80}.swc.hl-blue{background:#60a5fa}.swc.hl-pink{background:#f472b6}.swc.hl-orange{background:#fb923c}
.report table{border-collapse:collapse;width:100%;font-family:Arial,Helvetica,sans-serif;font-size:14px;margin:10px 0 18px}
.report td,.report th{border:1px solid #e3ddd0;padding:7px 9px;text-align:left;vertical-align:top}
.report th{background:#f6f3ec}
.report p.apa,.apa{padding-left:2em;text-indent:-2em;white-space:normal}
.na{color:var(--muted);font-style:italic}

/* modal, toast */
.ov{position:fixed;inset:0;background:rgba(10,8,25,.5);backdrop-filter:blur(4px);display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px;z-index:50;overflow:auto;animation:fade .15s}
.modal{background:var(--panel-solid);border:1px solid var(--line);border-radius:var(--r-lg);padding:26px;max-width:580px;width:100%;box-shadow:0 30px 80px -20px rgba(0,0,0,.45)}
.modal.wide{max-width:880px}
.modal h3{font-family:var(--font-head);font-weight:var(--head-w);letter-spacing:var(--head-ls);font-size:24px;margin:0 0 16px}
.modal .card{box-shadow:none}
.mfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;position:sticky;bottom:-26px;background:var(--panel-solid);padding:12px 0 6px;border-top:1px solid var(--line)}
.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,10px);background:var(--ink);color:var(--bg);border-radius:999px;padding:10px 18px;font-size:14px;font-weight:600;z-index:60;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;box-shadow:0 14px 30px -10px rgba(0,0,0,.4)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.tq{border:1px solid var(--line);border-radius:var(--r-sm);padding:12px;margin-bottom:8px;background:var(--panel-2)}
.tq .row{margin-bottom:8px}

/* appearance previews */
.looks{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.look{border:2px solid var(--line);border-radius:var(--r);padding:0;overflow:hidden;background:var(--panel);text-align:left;transition:border-color .15s,transform .15s}
.look:hover{transform:translateY(-2px)}
.look.on{border-color:var(--accent);box-shadow:var(--glow)}
.look .pv{height:150px;padding:14px;display:flex;flex-direction:column;gap:8px}
.look .pv .bn{height:52px;border-radius:12px}
.look .pv .cd{display:flex;gap:8px;flex:1}.look .pv .cd i{flex:1;border-radius:10px}
.look .lb{padding:12px 14px}
.look .lb b{display:block;font-size:15px}
.look .lb span{font-size:12.5px;color:var(--muted)}
.pv-midnight{background:radial-gradient(200px 120px at 0 0,rgba(124,92,255,.5),transparent),#0a0a1c}
.pv-midnight .bn{background:linear-gradient(120deg,#7c5cff,#ff4fa3)}.pv-midnight .cd i{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1)}
.pv-calm{background:#f5f6f8}.pv-calm .bn{background:#fff;border:1px solid #e2e5ea;box-shadow:inset 0 -10px 0 -4px #f6e49b}.pv-calm .cd i{background:#fff;border:1px solid #e2e5ea}
.pv-calmdark{background:#14171c}.pv-calmdark .bn{background:#1b1f26;border:1px solid #2b313c;box-shadow:inset 0 -10px 0 -4px #5c4b14}.pv-calmdark .cd i{background:#1b1f26;border:1px solid #2b313c}
.pv-vibrant{background:#f2f6fc}.pv-vibrant .bn{background:linear-gradient(120deg,#2563eb,#14b8a6)}.pv-vibrant .cd i{background:#fff;border-left:4px solid #fbbf24}.pv-vibrant .cd i+i{border-left-color:#fb7185}
.pv-aurora{background:radial-gradient(180px 120px at 0 0,#e9ddff,transparent),radial-gradient(180px 120px at 100% 0,#fde2f1,transparent),#fbf9ff}.pv-aurora .bn{background:linear-gradient(120deg,#f1e8ff,#fde6f3)}.pv-aurora .cd i{background:#fff;box-shadow:0 6px 16px -8px rgba(80,40,140,.3)}

/* responsive */
@media (max-width:1100px){.stats{grid-template-columns:repeat(2,1fr)}.pe{grid-template-columns:1fr}.outline{display:none}.steps{grid-template-columns:1fr 1fr}}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:270px;z-index:45;transform:translateX(-102%);transition:transform .25s var(--ease);background:var(--panel-solid)}
  .side.show{transform:none;box-shadow:20px 0 60px rgba(0,0,0,.3)}
  .top .menu-btn{display:inline-flex}
  .ptoolbar{position:static;background:none}
  .themes button span{display:none}
  .top .addlbl{display:none}
  .banner{grid-template-columns:1fr}
  .grid2,.hints,.looks{grid-template-columns:1fr}
  .qbody{padding-left:18px}
  .search kbd{display:none}
}
@media (max-width:560px){.stats{grid-template-columns:1fr}.steps{grid-template-columns:1fr}.tbl .hide-s{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* =========================================================
   CALM LAYER — quieter controls, one main button per screen,
   sentence-case labels, highlighter for what is selected
   ========================================================= */
[data-theme^="calm"]{--serif:var(--font-head)}
[data-theme^="calm"] :is(.webdoc,.rte.draft){--serif:'Newsreader','Newsreader Variable',Georgia,serif}
[data-theme^="calm"] body{background-image:none}
[data-theme^="calm"] h1{font-size:clamp(23px,2.3vw,28px);line-height:1.2}
[data-theme^="calm"] h2{font-size:18px}
[data-theme^="calm"] .btn{box-shadow:none}
[data-theme^="calm"] .btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:none}
[data-theme="calmdark"] .btn.pri{background:#5266e3;border-color:#5266e3}
[data-theme^="calm"] .btn.pri:hover{background:var(--accent-2);border-color:var(--accent-2)}
[data-theme="calmdark"] .btn.pri:hover{background:#6274ea}
[data-theme^="calm"] .btn.pri svg{stroke:#fff}
[data-theme^="calm"] .logo .mark{background:var(--ink);box-shadow:none;border-radius:9px;width:32px;height:32px}
[data-theme^="calm"] .logo .mark svg{stroke:var(--bg)}
[data-theme^="calm"] .side{gap:14px;padding:16px 12px}
[data-theme^="calm"] .nv{gap:10px;padding:7px 10px;font-size:14.5px;border-radius:7px}
[data-theme^="calm"] .nv.on{background:var(--side-active);color:var(--side-active-ink);font-weight:600}
[data-theme^="calm"] .nv.on svg{stroke:currentColor}
[data-theme^="calm"] .nvsub.on{background:var(--side-active);color:var(--side-active-ink)}
[data-theme^="calm"] .card{box-shadow:var(--shadow)}
[data-theme^="calm"] .banner{border:1px solid var(--line);box-shadow:none}
[data-theme^="calm"] .banner::before,[data-theme^="calm"] .banner::after{display:none}
[data-theme^="calm"] .top{background:var(--bg);backdrop-filter:none;-webkit-backdrop-filter:none;border-bottom:1px solid var(--line)}
[data-theme^="calm"] .subtabs button.on{color:var(--ink);border-bottom-color:transparent;box-shadow:inset 0 -8px 0 -1px var(--hl)}
[data-theme^="calm"] .tabs{box-shadow:none;background:var(--panel-2);border-color:transparent}
[data-theme^="calm"] .tabs button.on,[data-theme^="calm"] .tabs .on{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
[data-theme^="calm"] .chip.on{background:var(--hl);border-color:transparent;color:var(--hl-ink)}
[data-theme^="calm"] :is(.slabel,.tag,.sres .h,.banner .eyebrow,.field>label,.tbl th,.outline .gh,.tlab,.ccode,.cdate,.calweek,.crview h3,.clab,.webdoc .website,.hint b,.rgl,.stance,.rtebar .lbl,.mgh){text-transform:none;letter-spacing:0}
[data-theme^="calm"] .field>label{font-size:13px;color:var(--ink-2);font-weight:600}
[data-theme^="calm"] .mgh{font-size:13px}
[data-theme^="calm"] .slabel{font-size:12.5px;font-weight:600}
[data-theme^="calm"] .tag{letter-spacing:.02em}
[data-theme^="calm"] .inp:focus,[data-theme^="calm"] .btn:focus-visible{outline:none;box-shadow:0 0 0 3px var(--focus)}
[data-theme^="calm"] ::selection{background:color-mix(in srgb,var(--hl) 80%,transparent)}
[data-theme^="calm"] .matfab{box-shadow:none;font-size:13.5px;padding:7px 12px}
[data-theme^="calm"] .crumbs{font-size:13px}
.lmeta{gap:6px!important;color:var(--muted)}
.lmeta input{border:1px solid transparent;border-radius:6px;padding:3px 6px;background:none;color:var(--ink-2);font:inherit;font-size:13.5px}
.lmeta input:hover,.lmeta input:focus{border-color:var(--line);background:var(--panel)}
.lmeta input::-webkit-calendar-picker-indicator{opacity:.35;cursor:pointer}
.lmeta input:hover::-webkit-calendar-picker-indicator{opacity:.8}
.lmeta svg{width:15px;height:15px}
/* scrollbars */
[data-theme^="calm"] *{scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}

/* ---------- workspace switch ---------- */
.nv.in{color:var(--ink);font-weight:600}
/* focus mode on a lecture starts at the toolbar: no breadcrumbs, date or topic header */
body.focus #lectureView>.crumbs,body.focus #lectureView>.lhead,body.focus #lectureView>.fillnote{display:none}
/* an empty subtopic stays out of the way; it appears when you work on the header */
.lhead .lsub:placeholder-shown{display:none}
.lhead:hover .lsub:placeholder-shown,.lhead:focus-within .lsub:placeholder-shown{display:block}
/* ---------- reading vs class notes ---------- */
.ptoolbar{container-type:inline-size}
@container (max-width:1240px){.ptoolbar .bl{display:none}}
@container (max-width:1180px){.ptoolbar .mkb span{display:none}.ptoolbar .mkb{padding-left:7px;padding-right:7px}#lectureView .ptoolbar #saveNote>span:last-child{display:none}}
.lmodebar{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:0 0 10px}
.lmodebar button{display:flex;align-items:center;gap:10px;background:none;border:0;border-bottom:2.5px solid transparent;margin-bottom:-1px;padding:8px 16px 9px 6px;cursor:pointer;color:var(--muted);text-align:left}
.lmodebar button .i{width:20px;height:20px}.lmodebar button span{display:flex;flex-direction:column;line-height:1.2}.lmodebar b{font-size:14px;font-weight:650}.lmodebar small{font-size:11.5px}
.lmodebar button:hover{color:var(--ink)}.lmodebar button.on{color:var(--ink);border-bottom-color:var(--accent)}.lmodebar button.on .i{color:var(--accent)}
body.focus .lmodebar{margin-top:-4px}
/* reading in focus mode starts at the section buttons */
body.focus #lectureView.rmode .lmodebar,body.focus #lectureView.rmode .ptoolbar.rtool,body.focus #lectureView.rmode .rnhead{display:none}
body.focus #lectureView.rmode .rnchips{padding-top:2px}
body.focus #lectureView.rmode .split{margin-top:46px}body.focus #lectureView.rmode .rnsolo{padding-top:40px}
.crlayout.map{grid-template-columns:minmax(0,1fr)}.crlayout.map>*{min-width:0}.imwrap{min-width:0;max-width:100%}.crlayout.map .crside{position:static;display:flex;flex-direction:row;flex-wrap:wrap;gap:10px;align-items:stretch}.crlayout.map .crtabs button{padding:6px 14px}
.crlayout.map .crside>.crblock{margin:0}.crlayout.map .crside>.crblock:first-child{display:flex;gap:10px;flex:2 1 420px}.crlayout.map .crside>.crblock:first-child .field{flex:1;margin:0}
