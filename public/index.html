<!DOCTYPE html>
<html lang="en" data-theme="aurora">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Literature Notes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,600&display=swap" rel="stylesheet">
<script>try{document.documentElement.dataset.theme=localStorage.getItem('litnotes.theme')||'aurora'}catch(e){}</script>
<style>
/* =========================================================
   DESIGN TOKENS — three themes
   ========================================================= */
:root{
  --r:14px; --r-sm:10px; --r-lg:22px;
  --serif:'Newsreader','Newsreader Variable',Georgia,serif;
  --ease:cubic-bezier(.2,.7,.2,1);
  --success:#22a06b; --warn:#c98a12; --danger:#d64545;
}
/* ---------- 1. MIDNIGHT ---------- */
[data-theme="midnight"]{
  color-scheme:dark;
  --font:'Inter','Inter Variable',system-ui,sans-serif; --font-head:'Sora','Sora Variable','Inter','Inter Variable',sans-serif; --head-w:600; --head-ls:-.02em;
  --bg:#08081a;
  --wash:radial-gradient(900px 520px at 8% -8%,rgba(124,92,255,.28),transparent 62%),radial-gradient(800px 480px at 105% 4%,rgba(255,79,163,.16),transparent 60%),radial-gradient(700px 500px at 50% 120%,rgba(56,189,248,.08),transparent 60%);
  --panel:rgba(255,255,255,.045); --panel-solid:#14142b; --panel-2:rgba(255,255,255,.07); --hover:rgba(255,255,255,.06);
  --line:rgba(255,255,255,.09); --line-2:rgba(255,255,255,.16);
  --ink:#ecebff; --ink-2:#c9c7ec; --muted:#9592bd;
  --accent:#8b6cff; --accent-ink:#fff; --grad:linear-gradient(120deg,#7c5cff 0%,#c04bff 50%,#ff4fa3 100%);
  --banner:linear-gradient(125deg,rgba(124,92,255,.55),rgba(192,75,255,.35) 45%,rgba(255,79,163,.35)),rgba(255,255,255,.03); --banner-ink:#fff;
  --glow:0 0 0 1px rgba(255,255,255,.06),0 20px 50px -20px rgba(124,92,255,.45);
  --shadow:0 1px 0 rgba(255,255,255,.04) inset,0 10px 30px -12px rgba(0,0,0,.6);
  --glass:blur(16px) saturate(140%);
  --side-bg:rgba(10,10,28,.6); --side-active:rgba(139,108,255,.18); --side-active-ink:#fff;
  --input:rgba(255,255,255,.05); --focus:rgba(139,108,255,.55);
  --c-pass1:#7b93ff; --c-pass2:#34d399; --c-pass3:#fbbf24; --c-research:#d08bff; --c-paper:#a5a3c9;
  --y:#fbbf24; --coral:#ff6b8b;
}
/* ---------- 2. VIBRANT ACADEMY ---------- */
[data-theme="vibrant"]{
  color-scheme:light;
  --font:'Plus Jakarta Sans','Plus Jakarta Sans Variable',system-ui,sans-serif; --font-head:'Plus Jakarta Sans','Plus Jakarta Sans Variable',sans-serif; --head-w:800; --head-ls:-.025em;
  --r:18px; --r-sm:12px; --r-lg:26px;
  --bg:#f2f6fc; --wash:radial-gradient(700px 400px at 100% -10%,rgba(20,184,166,.10),transparent 60%),radial-gradient(600px 400px at -10% 30%,rgba(251,191,36,.10),transparent 60%);
  --panel:#ffffff; --panel-solid:#ffffff; --panel-2:#f5f8fd; --hover:#f1f5fd;
  --line:#e3e9f4; --line-2:#cfd9ea;
  --ink:#0f1b3d; --ink-2:#34426a; --muted:#6a7695;
  --accent:#2563eb; --accent-ink:#fff; --grad:linear-gradient(120deg,#2563eb 0%,#0ea5e9 55%,#14b8a6 100%);
  --banner:linear-gradient(120deg,#2563eb 0%,#0ea5e9 55%,#14b8a6 100%); --banner-ink:#fff;
  --glow:0 14px 34px -14px rgba(37,99,235,.45);
  --shadow:0 1px 2px rgba(15,27,61,.04),0 8px 24px -10px rgba(15,27,61,.10);
  --glass:none;
  --side-bg:#ffffff; --side-active:#eaf1ff; --side-active-ink:#1d4ed8;
  --input:#ffffff; --focus:rgba(37,99,235,.35);
  --c-pass1:#2563eb; --c-pass2:#10b981; --c-pass3:#f97316; --c-research:#8b5cf6; --c-paper:#334155;
  --y:#fbbf24; --coral:#fb7185;
}
/* ---------- 3. AURORA ---------- */
[data-theme="aurora"]{
  color-scheme:light;
  --font:'Manrope','Manrope Variable',system-ui,sans-serif; --font-head:'Fraunces','Fraunces Variable',Georgia,serif; --head-w:600; --head-ls:-.015em;
  --r:16px; --r-sm:11px; --r-lg:24px;
  --bg:#fbf9ff;
  --wash:radial-gradient(900px 520px at 0% -10%,rgba(167,139,250,.22),transparent 60%),radial-gradient(800px 520px at 100% 0%,rgba(244,114,182,.16),transparent 60%),radial-gradient(900px 600px at 60% 110%,rgba(129,140,248,.10),transparent 60%);
  --panel:rgba(255,255,255,.86); --panel-solid:#ffffff; --panel-2:#f7f3fe; --hover:#f6f1fd;
  --line:#ece6f6; --line-2:#ddd3ee;
  --ink:#231a3a; --ink-2:#463c62; --muted:#7a7193;
  --accent:#8b5cf6; --accent-ink:#fff; --grad:linear-gradient(120deg,#8b5cf6 0%,#c058e6 50%,#ec4899 100%);
  --banner:linear-gradient(125deg,#f3ecff 0%,#fbe9f5 60%,#ffeef3 100%); --banner-ink:#231a3a;
  --glow:0 18px 40px -18px rgba(139,92,246,.45);
  --shadow:0 1px 2px rgba(60,30,110,.04),0 14px 36px -16px rgba(80,40,140,.16);
  --glass:blur(10px);
  --side-bg:rgba(255,255,255,.7); --side-active:linear-gradient(120deg,rgba(139,92,246,.14),rgba(236,72,153,.10)); --side-active-ink:#5b21b6;
  --input:#ffffff; --focus:rgba(139,92,246,.35);
  --c-pass1:#5b6bd6; --c-pass2:#2f9e7a; --c-pass3:#d97745; --c-research:#a855c7; --c-paper:#5b5670;
  --y:#f5b73b; --coral:#f0718f;
}

/* =========================================================
   BASE
   ========================================================= */
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
body{font-family:var(--font);color:var(--ink);background:var(--bg);background-image:var(--wash);background-attachment:fixed;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;transition:background-color .3s var(--ease),color .3s var(--ease)}
button{font:inherit;cursor:pointer;color:inherit}
input,textarea,select{font:inherit;color:inherit}
::selection{background:color-mix(in srgb,var(--accent) 30%,transparent)}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
h1,h2,h3{font-family:var(--font-head);font-weight:var(--head-w);letter-spacing:var(--head-ls);margin:0}
h1{font-size:clamp(26px,3vw,34px);line-height:1.15}
h2{font-size:20px;line-height:1.25}
.muted,.sub{color:var(--muted)}
.sub{margin:0 0 14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}

/* layout */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow:auto;padding:18px 14px;display:flex;flex-direction:column;gap:18px;background:var(--side-bg);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass);border-right:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:11px;padding:4px 8px}
.logo .mark{width:36px;height:36px;border-radius:11px;background:var(--grad);display:grid;place-items:center;color:#fff;box-shadow:var(--glow)}
.logo .mark svg{width:20px;height:20px;stroke:#fff}
.logo b{font-family:var(--font-head);font-weight:var(--head-w);font-size:16px;letter-spacing:var(--head-ls);line-height:1.1;display:block}
.logo small{font-size:11.5px;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:2px}
.nv{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:var(--r-sm);border:0;background:none;color:var(--ink-2);text-align:left;font-weight:500;transition:background .15s,color .15s}
.nv:hover{background:var(--hover);color:var(--ink)}
.nv.on{background:var(--side-active);color:var(--side-active-ink);font-weight:600}
.nv.on svg{stroke:var(--side-active-ink)}
.nv .k{margin-left:auto;font-size:11px;color:var(--muted);font-weight:500}
.slabel{font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:0 12px;margin-bottom:-8px}
.cur{border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
.cur .ttl{font-weight:700;font-size:14px;line-height:1.3;margin-bottom:2px}
.cur .sm{font-size:12px;color:var(--muted)}
.cur ul{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:2px}
.cur li button{display:flex;gap:9px;align-items:center;width:100%;border:0;background:none;padding:6px 6px;border-radius:8px;text-align:left;font-size:13px;color:var(--ink-2)}
.cur li button:hover{background:var(--hover);color:var(--ink)}
.cur li span.t{flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.mini{width:18px;height:18px;flex:none}
.side-foot{margin-top:auto;font-size:12px;color:var(--muted);padding:0 8px;display:flex;align-items:center;gap:7px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--success);flex:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--success) 20%,transparent)}
.dot.warn{background:var(--warn);box-shadow:0 0 0 3px color-mix(in srgb,var(--warn) 20%,transparent)}
.dot.off{background:var(--danger)}

.shell{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:14px clamp(16px,3vw,36px);background:color-mix(in srgb,var(--bg) 72%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.search{position:relative;flex:1;max-width:680px}
.search input{width:100%;height:44px;border-radius:999px;border:1px solid var(--line);background:var(--input);padding:0 52px 0 44px;box-shadow:var(--shadow);transition:border-color .15s,box-shadow .15s}
.search input:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 4px var(--focus)}
.search>svg{position:absolute;left:16px;top:13px;color:var(--muted)}
.search kbd{position:absolute;right:14px;top:11px;font:600 11px var(--font);color:var(--muted);border:1px solid var(--line-2);border-radius:6px;padding:2px 7px}
.sres{position:absolute;left:0;right:0;top:52px;background:var(--panel-solid);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 24px 60px -20px rgba(0,0,0,.35);padding:6px;display:none;max-height:70vh;overflow:auto}
.sres.show{display:block}
.sres .h{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:8px 10px 4px}
.sres button{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 10px;border-radius:10px}
.sres button:hover,.sres button.sel{background:var(--hover)}
.sres .t{font-weight:600;font-size:14px}
.sres .s{font-size:12.5px;color:var(--muted);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.sres mark{background:color-mix(in srgb,var(--y) 45%,transparent);color:inherit;border-radius:3px;padding:0 1px}
.themes{display:flex;gap:3px;padding:4px;border-radius:999px;border:1px solid var(--line);background:var(--panel);box-shadow:var(--shadow)}
.themes button{display:flex;align-items:center;gap:7px;border:0;background:none;padding:6px 12px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted)}
.themes button.on{background:var(--ink);color:var(--bg)}
.sw{width:12px;height:12px;border-radius:50%;flex:none;border:1px solid rgba(255,255,255,.4)}
.sw.midnight{background:linear-gradient(135deg,#1b1640,#7c5cff 60%,#ff4fa3)}
.sw.vibrant{background:linear-gradient(135deg,#2563eb,#14b8a6 60%,#fbbf24)}
.sw.aurora{background:linear-gradient(135deg,#ede4ff,#c4a6ff 50%,#f9a8d4)}
.main{padding:28px clamp(16px,3vw,36px) 90px;max-width:1240px;width:100%}
.top .menu-btn{display:none}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:8px 15px;font-weight:600;font-size:14px;color:var(--ink);transition:transform .12s var(--ease),border-color .15s,background .15s,box-shadow .15s;white-space:nowrap}
.btn:hover{border-color:var(--line-2);background:var(--hover)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--grad);border-color:transparent;color:#fff;box-shadow:var(--glow)}
.btn.pri:hover{filter:brightness(1.06)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--hover);color:var(--ink)}
.btn.danger{color:var(--danger)}
.btn.sm{padding:6px 12px;font-size:13px}
.btn.icon{padding:8px;border-radius:12px}
.btn[disabled]{opacity:.4;pointer-events:none}
.link{border:0;background:none;padding:0;color:var(--accent);font-weight:600}
.link:hover{text-decoration:underline}

/* cards & surfaces */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;box-shadow:var(--shadow);backdrop-filter:var(--glass);-webkit-backdrop-filter:var(--glass)}
.sec-title{display:flex;align-items:end;gap:12px;margin:34px 0 14px}
.sec-title h2{flex:1}
.crumbs{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted);margin-bottom:10px}
.crumbs button{border:0;background:none;padding:0;color:var(--muted);font-weight:500}
.crumbs button:hover{color:var(--accent)}
.page-head{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;margin-bottom:6px}
.page-head .grow{flex:1;min-width:260px}
.lede{color:var(--muted);margin:6px 0 0;max-width:72ch}

/* banner */
.banner{position:relative;overflow:hidden;border-radius:var(--r-lg);padding:30px clamp(20px,3vw,36px);background:var(--banner);color:var(--banner-ink);display:grid;grid-template-columns:1fr auto;gap:24px;align-items:center;box-shadow:var(--shadow);border:1px solid var(--line)}
[data-theme="vibrant"] .banner::after{content:"";position:absolute;right:-60px;top:-60px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(251,191,36,.55),transparent 70%)}
[data-theme="vibrant"] .banner::before{content:"";position:absolute;left:38%;bottom:-90px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(251,113,133,.45),transparent 70%)}
[data-theme="aurora"] .banner::after{content:"";position:absolute;right:8%;top:-80px;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,rgba(192,132,252,.35),transparent 70%)}
[data-theme="midnight"] .banner{backdrop-filter:var(--glass)}
.banner>*{position:relative;z-index:1}
.banner .eyebrow{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;opacity:.8}
.banner h1{margin:6px 0 8px;font-size:clamp(26px,3.2vw,38px)}
.banner p{margin:0 0 18px;opacity:.88;max-width:58ch}
.banner .btn{border-color:rgba(255,255,255,.35)}
[data-theme="midnight"] .banner .btn:not(.pri),[data-theme="vibrant"] .banner .btn:not(.pri){background:rgba(255,255,255,.14);color:#fff}
[data-theme="vibrant"] .banner .btn.pri{background:#fff;color:#1d4ed8;box-shadow:0 10px 24px -10px rgba(0,0,0,.35)}
[data-theme="aurora"] .banner .btn:not(.pri){background:rgba(255,255,255,.7)}
.ring{position:relative;width:132px;height:132px}
.ring svg{width:132px;height:132px;transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.1}
.ring .v b{font-family:var(--font-head);font-size:30px;font-weight:var(--head-w);display:block}
.ring .v small{font-size:11px;opacity:.8;max-width:80px;display:block}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:18px}
.stat{display:flex;gap:14px;align-items:center}
.stat .ic{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--x) 16%,transparent);color:var(--x)}
.stat .ic svg{width:21px;height:21px}
.stat b{font-family:var(--font-head);font-size:24px;font-weight:var(--head-w);line-height:1;display:block}
.stat span{font-size:13px;color:var(--muted)}

/* tags & badges */
.tag{--x:var(--accent);display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:3px 9px;border-radius:999px;background:color-mix(in srgb,var(--x) 15%,transparent);color:color-mix(in srgb,var(--x) 82%,var(--ink))}
.badge{--x:var(--muted);display:inline-flex;align-items:center;font-size:12px;font-weight:700;border-radius:999px;padding:2px 10px;background:color-mix(in srgb,var(--x) 15%,transparent);color:color-mix(in srgb,var(--x) 80%,var(--ink));white-space:nowrap}
.b-Core{--x:var(--c-pass1)}.b-Background{--x:var(--muted)}.b-Skip{--x:var(--danger)}
.b-Supports{--x:var(--success)}.b-Threatens{--x:var(--danger)}.b-Mixed{--x:var(--warn)}.b-Neutral{--x:var(--muted)}

/* task cards */
.tasks{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.task{display:flex;flex-direction:column;gap:10px;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow);backdrop-filter:var(--glass);transition:transform .18s var(--ease),box-shadow .18s,border-color .18s;position:relative;overflow:hidden}
.task::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--x,var(--accent))}
.task:hover{transform:translateY(-2px);border-color:var(--line-2);box-shadow:var(--glow)}
.task .t{font-weight:700;font-size:15.5px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.task .m{font-size:12.5px;color:var(--muted)}
.task .f{display:flex;align-items:center;gap:10px;margin-top:auto;font-size:12.5px;color:var(--muted)}
.bar{flex:1;height:6px;border-radius:99px;background:var(--panel-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--grad)}
.go{display:inline-flex;align-items:center;gap:4px;color:var(--accent);font-weight:700}

/* project cards */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.pc{display:flex;flex-direction:column;gap:12px;text-align:left;border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:18px 20px;box-shadow:var(--shadow);backdrop-filter:var(--glass);transition:transform .18s var(--ease),box-shadow .18s}
.pc:hover{transform:translateY(-2px);box-shadow:var(--glow)}
.pc .hd{display:flex;gap:12px;align-items:center}
.pc .av{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-family:var(--font-head);font-weight:700;color:#fff;background:var(--grad);flex:none;font-size:16px}
.pc .t{font-weight:700;font-size:16px;line-height:1.25}
.pc .d{font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:1em}
.pc .nums{display:flex;gap:16px;font-size:12.5px;color:var(--muted)}
.pc .nums b{color:var(--ink);font-size:15px;margin-right:3px}
.pc.add{align-items:center;justify-content:center;border-style:dashed;color:var(--muted);min-height:150px;box-shadow:none;background:transparent}
.pc.add:hover{color:var(--accent);border-color:var(--accent)}

/* tabs, chips, fields */
.tabs{display:inline-flex;gap:4px;padding:4px;border-radius:999px;background:var(--panel);border:1px solid var(--line);margin:18px 0 20px;box-shadow:var(--shadow);flex-wrap:wrap}
.tab{display:inline-flex;align-items:center;gap:7px;border:0;background:none;padding:8px 16px;border-radius:999px;color:var(--muted);font-weight:600;font-size:14px}
.tab:hover{color:var(--ink)}
.tab.on{background:var(--ink);color:var(--bg)}
.subtabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:4px 0 20px;overflow-x:auto}
.subtabs button{border:0;background:none;padding:10px 14px;font:inherit;font-weight:600;font-size:14px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.subtabs button:hover{color:var(--ink)}.subtabs button.on{color:var(--accent);border-bottom-color:var(--accent)}

.snote{margin:12px 18px 0;font-size:13px;color:var(--muted);background:var(--panel-2);border-radius:10px;padding:9px 12px}

.hints{display:block;margin-bottom:8px}.hints:not(:has(.hint:not([hidden]))){display:none}

/* reader & ask */

.gutter::before{content:"";width:4px;height:56px;border-radius:4px;background:var(--line-2);transition:background .15s,height .15s}

.ftitle{display:none}
/* focus mode */

body.focus .sect,body.focus .q{scroll-margin-top:12px}
.pe.split .outline{display:none}
.reader{position:sticky;top:130px;height:calc(100vh - 146px);display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);background:var(--panel-solid);overflow:hidden;box-shadow:var(--shadow)}
.rbar{display:flex;gap:6px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.rpdf{display:inline-flex;gap:4px;align-items:center}
.pgn{font-size:12.5px;font-weight:700;color:var(--muted);padding:0 6px;font-variant-numeric:tabular-nums}
.seg{display:inline-flex;padding:3px;border-radius:999px;background:var(--panel-2);border:1px solid var(--line)}
.seg button{border:0;background:none;padding:5px 12px;border-radius:999px;font-size:13px;font-weight:700;color:var(--muted);display:inline-flex;gap:6px;align-items:center}

.rbody{flex:1;overflow:auto;background:color-mix(in srgb,var(--ink) 12%,var(--bg));padding:14px;display:flex;flex-direction:column;align-items:flex-start;gap:12px;touch-action:pan-x pan-y;overscroll-behavior:contain}

.pg canvas{width:100%;height:100%}

.pg{position:relative;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,.22);flex:none}

/* modal, toast */

.modal{background:var(--panel-solid);border:1px solid var(--line);border-radius:var(--r-lg);padding:26px;max-width:580px;width:100%;box-shadow:0 30px 80px -20px rgba(0,0,0,.45)}

.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,10px);background:var(--ink);color:var(--bg);border-radius:999px;padding:10px 18px;font-size:14px;font-weight:600;z-index:60;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;box-shadow:0 14px 30px -10px rgba(0,0,0,.4)}

.tq{border:1px solid var(--line);border-radius:var(--r-sm);padding:12px;margin-bottom:8px;background:var(--panel-2)}
.tq .row{margin-bottom:8px}

/* appearance previews */
.looks{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.look{border:2px solid var(--line);border-radius:var(--r);padding:0;overflow:hidden;background:var(--panel);text-align:left;transition:border-color .15s,transform .15s}

.look .pv{height:150px;padding:14px;display:flex;flex-direction:column;gap:8px}
.look .pv .bn{height:52px;border-radius:12px}

.look .lb{padding:12px 14px}

.pv-midnight{background:radial-gradient(200px 120px at 0 0,rgba(124,92,255,.5),transparent),#0a0a1c}
.pv-midnight .bn{background:linear-gradient(120deg,#7c5cff,#ff4fa3)}.pv-midnight .cd i{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1)}
.pv-vibrant{background:#f2f6fc}.pv-vibrant .bn{background:linear-gradient(120deg,#2563eb,#14b8a6)}.pv-vibrant .cd i{background:#fff;border-left:4px solid #fbbf24}.pv-vibrant .cd i+i{border-left-color:#fb7185}
.pv-aurora{background:radial-gradient(180px 120px at 0 0,#e9ddff,transparent),radial-gradient(180px 120px at 100% 0,#fde2f1,transparent),#fbf9ff}.pv-aurora .bn{background:linear-gradient(120deg,#f1e8ff,#fde6f3)}.pv-aurora .cd i{background:#fff;box-shadow:0 6px 16px -8px rgba(80,40,140,.3)}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<script>
/* ============================================================
   QUESTION TEMPLATE  (from Paper_Reading_Notes.xlsx)
   ============================================================ */
const LOCAL=window.LITNOTES_CONFIG||null;            // set when served by the self-hosted server
const AIN=(LOCAL&&LOCAL.ai&&LOCAL.ai.label)||'Claude';
function unavailable(what){return LOCAL?(what==='ai'?'The Ask feature is off. Set ANTHROPIC_API_KEY or OLLAMA_URL on the server to turn it on.':'PDF uploads are not available on this server.'):(what==='ai'?'Ask Claude is available when you open the app in Claude while signed in.':'PDF uploads are available when you open the app in Claude while signed in.')}
const DEFAULT_SECTIONS = [
  {id:'pass1', title:'Pass 1 · Triage', color:'#1F4E79', desc:'10–15 min: abstract, end of intro, headings, conclusion only. Then decide Core / Background / Skip.'},
  {id:'pass2', title:'Pass 2 · Argument', color:'#375623', desc:'About 1 hour: theory, data, methods, main results.'},
  {id:'pass3', title:'Pass 3 · Critique', color:'#7F3F00', desc:'Only for Core papers. Robustness, limitations, over-reaching conclusions.'},
  {id:'research', title:'My Research', color:'#4B2C6F', desc:"Always fill this, even for Background papers. If you can't, you haven't read it for research yet."}
];
const DEFAULT_QUESTIONS = [
 {id:'q1',section:'pass1',text:'What question does the paper answer?',where:"Abstract; last 1–2 paragraphs of the introduction (look for 'This paper…', 'We investigate…', 'This study asks…')",how:"Write it AS A QUESTION, one sentence: 'Does X affect Y?'",ex:'Does providing free school meals increase attendance among primary pupils in rural Kenya?'},
 {id:'q2',section:'pass1',text:'Where, when, and at what unit?',where:"Abstract; intro; footnotes on page 1; start of the Methods/Data section ('study area', 'participants', 'study period')",how:'Country/region/setting · STUDY PERIOD (when the data were collected, not the publication year) · unit of analysis (people, households, schools, firms, districts, countries…) and time step, if any',ex:'Northern Uganda · data collected 2016–2018 (published 2021) · 1,200 households in 60 villages, surveyed once a year.'},
 {id:'q3',section:'pass1',text:'Main findings',where:"Abstract; intro paragraph starting 'We find…' / 'Our results show…'; first paragraph of Conclusion",how:'2–4 short points in your own words. Keep separate findings separate.',ex:'• Savings groups raised household savings by about a third. • No effect on starting a business. • Effects were larger where groups met weekly.'},
 {id:'q4',section:'pass1',text:'What do the authors claim is new?',where:"Intro paragraph with 'contribute', 'we add to', 'in contrast to previous studies'. Often names one specific earlier paper.",how:'List each contribution (papers often have 2–3). Note which earlier paper they argue against.',ex:'1) First study of this policy outside Asia. 2) Uses official records instead of self-reports. Argues against Smith (2015), who found no effect.'},
 {id:'q5',section:'pass1',text:'Verdict: Core / Background / Skip — why?',where:'Your judgment after steps 1–4',how:'Pick a verdict, then justify in one sentence.',choices:['Core','Background','Skip'],choiceKey:'verdict',ex:'Core — same outcome and region as my study, and a design I could use.'},
 {id:'q6',section:'pass2',text:'Theory: what mechanism or framework explains the relationship?',where:'Literature review / theory / \'conceptual framework\' section; hypotheses; Discussion of results',how:'Name each mechanism, theory or concept the paper relies on + one sentence each. Which one do the authors favour?',ex:'Social learning: people copy what their neighbours do. Cost: the programme makes the service cheaper. The authors favour social learning, because non-participants changed too.'},
 {id:'q7',section:'pass2',text:'Key concepts: how are they defined and grouped?',where:'Introduction and literature review; Methods/Data section where the main concepts or variables are defined; footnotes',how:'List the key concepts or categories and how each is defined. Are different types analysed SEPARATELY or lumped together? Does the definition match how others use it?',ex:'\'Informal work\' = any job without a written contract or social security. Street vendors and domestic workers are analysed separately; transport workers are lumped into \'other services\'.'},
 {id:'q8',section:'pass2',text:'Outcome: what is being explained, and how is it measured?',where:'Methods/Data section (\'outcome\', \'dependent variable\', \'measures\'); survey questions or interview guide; codebook citations',how:'Source (survey, interviews, records, observation, existing dataset…) · what exactly is measured or observed · how it is coded (yes/no, count, scale, themes) · do categories overlap?',ex:'Road traffic injuries from hospital records, 2015–2020 · counted per district per month · injuries and deaths reported separately · minor injuries are probably under-recorded.'},
 {id:'q9',section:'pass2',text:'Main explanatory factor',where:'Methods section; hypotheses; the model or comparison and the sentences that explain it',how:'What varies or is compared (a policy, an intervention, a group, an exposure, a context…)? Write it in plain words.',ex:'Whether a district introduced a new policy in 2017 (yes/no), compared with districts that did not.'},
 {id:'q10',section:'pass2',text:'Method: how do they build their argument or show cause and effect?',where:'\'Methods\' / \'Research design\' / \'Empirical strategy\' section; sampling description',how:'Design (experiment, survey, panel, case study, interviews, ethnography, mixed methods…) and sample. Why do they think the result is causal or credible? Where might that fail?',ex:'Before-and-after comparison of districts with and without the policy (difference-in-differences). Credible if both groups followed the same trend beforehand, which they show in a figure. Could fail if the policy went first to districts that were already improving.'},
 {id:'q11',section:'pass2',text:'Data sources',where:'Methods/Data section; table/figure notes (\'Source:\'); appendix; acknowledgements',how:'Name each source (dataset, survey, interviews, documents) + what it provides. Could I get or use it too?',ex:'National Demographic and Health Survey 2018 (health outcomes; free after registration) · 40 interviews with nurses (not public).'},
 {id:'q12',section:'pass2',text:'Key results in plain words',where:'Main results tables or figures + the results text; for qualitative work, the main themes and quotes',how:'The main numbers or themes → what they mean in plain words → compared to a baseline, average or other group where possible. How certain are they (significance, sample size, saturation)?',ex:'Children in the programme were 8 percentage points more likely to be fully vaccinated (from 60% to 68%, about +13%). Statistically significant, 2,400 children.'},
 {id:'q13',section:'pass2',text:'Measured vs interpreted',where:"Results discussion: sentences with 'suggests', 'we interpret', 'likely', 'consistent with'",how:'What did they actually MEASURE? What do they only INFER (story about why)? Keep these apart.',ex:'Measured: fewer injuries after the law. Inferred only: that people wore helmets more — helmet use itself was never observed.'},
 {id:'q14',section:'pass3',text:'Robustness and credibility checks',where:'\'Robustness\' / \'Sensitivity\' section; Appendix; for qualitative work, triangulation or validation',how:'Checks done (other samples or models, sensitivity tests, triangulation, member checking…). What did NOT change the results?',ex:'Results hold when the capital city is dropped, with a second data source and with extra controls. The effect halves in the shorter time window.'},
 {id:'q15',section:'pass3',text:'Limitations the authors admit',where:"Conclusion; footnotes; phrases 'one might argue', 'a caveat', 'we cannot', 'future research'",how:'List them in your words',ex:'Income is self-reported; only urban schools; another reform happened in the same year.'},
 {id:'q16',section:'pass3',text:'Limitations I see',where:'Your own thinking. Check: measurement, missing data, reporting bias, overlapping categories, alternative explanations, can results generalise?',how:"At least 2. Ask: 'What else could explain this result?'",ex:'1) The clinics that joined may already have been better run. 2) Only 6 months of follow-up — the effect may fade.'},
 {id:'q17',section:'pass3',text:'Do conclusions go beyond the evidence?',where:'Compare the Conclusion/Recommendations section with the actual results',how:'Yes/No + where they over-reach',ex:'Yes — they recommend a national roll-out, but the study covered only two towns.'},
 {id:'q18',section:'research',text:'Which part of my framework does this inform?',where:'Your own thinking — compare with your conceptual framework or causal chain (set in the project).',how:'Name the part(s) and what the paper says about them',showChain:true,ex:'The \'enforcement → behaviour change\' link: enforcement raised compliance, but only near checkpoints.'},
 {id:'q19',section:'research',text:'Support or threat to my contribution?',where:'Compare their Q1, Q4 and Q7 with your project',how:'Pick one, then one sentence: does it leave room for my study or already do it?',choices:['Supports','Threatens','Mixed','Neutral'],choiceKey:'support',ex:'Supports — same mechanism, but in another country, so my setting is still open.'},
 {id:'q20',section:'research',text:'Gap: what is left for me?',where:'Conclusion (\'future research\'); their limitations (Q15–16); how they define key concepts (Q7)',how:'One sentence you could put in your own paper: \'However, X has not…\'',ex:'However, no study has examined how this policy affects women-led households in francophone West Africa.'},
 {id:'q21',section:'research',text:'What can I borrow?',where:'Data, Methods, Robustness sections',how:'Data source, questionnaire or instrument, concept definition, unit of analysis, method or model, a check — and cite the paper for it',ex:'Their 12-item trust scale (Appendix B) and the way they coded interview themes.'},
 {id:'q22',section:'research',text:'References to chase',where:'Intro + literature review citations; reference list at the end',how:'Only the 2–5 most relevant. Note why each matters.',ex:'Okafor (2019) — original source of the trust scale. Mensah and Ali (2021) — same question, opposite finding.'},
 {id:'q23',section:'research',text:'Key facts or quotes (with page)',where:'Anywhere — often footnotes and the context section',how:'Short, with page number. Cite the ORIGINAL source if the paper is quoting someone else.',ex:'“Only 38 percent of respondents reported doing this every time” (Author, 2022, p. 14).'},
 {id:'q24',section:'research',text:"What I didn't understand",where:'Anywhere',how:"Terms, methods, steps you couldn't follow. Bring these to your supervisor, a colleague or your next reading session.",ex:'What \'clustered standard errors\' means; why they dropped the 2019 survey round.'}
];
const OLD_CHAIN = 'World price shock → value of mine output rises → can armed groups capture rents? (depends on hidden vs bulky) → rent-extraction strategy → type of violence';
const DEFAULT_CHAIN = 'e.g. Cause → mechanism → intermediate outcome → final outcome';
/* earlier versions copied a topic-specific (minerals → violence) wording; update any question the user never changed */
const OLD_Q={q2:['Where, when, and at what unit?','Abstract; intro; footnotes on page 1; start of Data section (\'units of observation\', \'study period\')','Country/region · STUDY PERIOD (years of data, not publication year) · unit (village, grid cell, district, country) and time step (month, year)'],q17:['Do conclusions go beyond the evidence?','Compare Conclusion/Policy section with the actual results tables','Yes/No + where they over-reach'],q21:['What can I borrow?','Data, Methods, Robustness sections','Data source, variable definition, unit of analysis, equation, robustness check — and cite the paper for it'],q24:['What I didn\'t understand','Anywhere','Terms, methods, steps you couldn\'t follow. Bring these to our sessions.'],q6:['Theory: what mechanism links minerals to violence?',"Literature review / theory / 'conceptual framework' section; hypotheses; Discussion of results",'Name each mechanism (e.g. rapacity, opportunity cost, taxation, bandits) + one sentence each. Which one do the authors favour?'],q7:['Which minerals, and how are they grouped?','Data section (mining/resources); definition of the main explanatory variable; text right after the equation; footnotes','List minerals. Are they analysed SEPARATELY or POOLED into one variable? Is gold separated from coltan/cassiterite/wolframite?'],q8:['Outcome: how is violence measured?',"Data section ('Conflict', 'Dependent variable'); footnotes; codebook citations",'Dataset (ACLED, UCDP, survey…) · violence types (battles, violence against civilians, looting, riots, taxation…) · how each is coded · incidence (yes/no) or counts? Do categories overlap?'],q9:['Main explanatory variable','Data section; the equation and the sentences that explain each term','What varies? (price × mine presence, new permits, a law…) Write it in plain words.'],q10:['Method and identification: why do they think it is causal?',"'Empirical strategy' / 'Identification' section; paragraph starting 'The identifying assumption…'","Design (panel with fixed effects, IV, diff-in-diff…) + their argument for why the variation is 'outside' the conflict. Any mineral/period where they admit it may fail?"],q11:['Data sources',"Data section; table/figure notes ('Source:'); acknowledgements",'Name each dataset + what it provides. Could I get it too?'],q12:['Key numbers in plain words',"Main results tables + the results text ('a one standard deviation increase…'); summary statistics table for the baseline average",'Coefficient → what it means (e.g. +0.4 percentage points) → compared to the average (e.g. +26%). Note significance (stars).'],q14:['Robustness checks',"'Robustness' section; Appendix; footnotes in results",'List checks done (other standard errors, dropping minerals/periods, lags, controls…). What did NOT change the results?'],q18:['Which link in my chain does this inform?','Your own thinking — compare with your causal chain (set in the project).','Name the link(s) and what the paper says about them'],q20:['Gap: what is left for me?',"Conclusion ('future research'); their limitations (Q15–16); how they group minerals (Q7)","One sentence you could put in your own paper: 'However, X has not…'"]};
function migrateTemplate(pid){
  const p=S.docs[pid]; if(!p||p.kind!=='project'||(p._qv||0)>=3)return;
  let changed=false;
  if(p.template&&p.template.questions){
    const D=Object.fromEntries(DEFAULT_QUESTIONS.map(q=>[q.id,q]));
    p.template.questions.forEach(q=>{const o=OLD_Q[q.id];if(!o)return;
      if(q.text===o[0]){q.text=D[q.id].text;changed=true}
      if(q.where===o[1]){q.where=D[q.id].where;changed=true}
      if(q.how===o[2]){q.how=D[q.id].how;changed=true}});
    p.template.questions.forEach(q=>{const d=D[q.id];if(d&&d.ex&&q.ex===undefined&&q.text===d.text){q.ex=d.ex;changed=true}});
  }
  if(p.template&&p.template.sections){const s2=p.template.sections.find(z=>z.id==='pass2');if(s2&&s2.desc==='About 1 hour: theory, data, methods, main results tables.'){s2.desc='About 1 hour: theory, data, methods, main results.';changed=true}}
  if(p.chain===OLD_CHAIN){p.chain='';changed=true}
  p._qv=3; delete p._genericQ; if(changed)save(pid);
}

const STATUSES = ['Not started','Pass 1 done','Pass 2 done','Pass 3 done'];
function defaultTemplate(){return {sections:JSON.parse(JSON.stringify(DEFAULT_SECTIONS)),questions:JSON.parse(JSON.stringify(DEFAULT_QUESTIONS))};}

/* ============================================================
   APA 7 REFERENCE BUILDER
   ============================================================ */
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const REF_TYPES={
  journal:{label:'Journal article',fields:['journal','volume','issue','pages','articleNo','doi','url'],req:['journal','volume'],date:'year'},
  book:{label:'Book (whole book)',fields:['edition','publisher','doi','url'],req:['publisher'],date:'year'},
  chapter:{label:'Chapter in an edited book',fields:['editors','bookTitle','edition','pages','publisher','doi','url'],req:['editors','bookTitle','pages','publisher'],date:'year'},
  report:{label:'Report (government, NGO, organisation)',fields:['reportNo','publisher','doi','url'],req:['url'],date:'full'},
  conference:{label:'Conference paper / presentation',fields:['presType','conference','location','url'],req:['conference','location'],date:'range'},
  thesis:{label:'Thesis or dissertation',fields:['degree','institution','published','database','url'],req:['institution'],date:'year'},
  web:{label:'Webpage / online document',fields:['site','url','retrieved'],req:['url'],date:'full'}
};
const REF_FIELDS={
  journal:{label:'Journal name',ph:'e.g. Accident Analysis & Prevention',hint:'Full journal name, as printed (title case).'},
  volume:{label:'Volume',ph:'e.g. 152'},
  issue:{label:'Issue',ph:'e.g. 3'},
  pages:{label:'Pages',ph:'e.g. 105–118'},
  articleNo:{label:'Article number',ph:'e.g. 105981',hint:'Use instead of pages for online-only articles.'},
  doi:{label:'DOI',ph:'e.g. 10.1016/j.aap.2021.105981',hint:'Paste it in any form; it is formatted as https://doi.org/…'},
  url:{label:'URL',ph:'https://…',hint:'APA uses the URL only when there is no DOI.'},
  edition:{label:'Edition',ph:'e.g. 2  (leave empty for 1st)'},
  publisher:{label:'Publisher',ph:'e.g. Routledge',hint:'Left out automatically when it is the same as the author.'},
  bookTitle:{label:'Book title',ph:'Title of the edited book'},
  reportNo:{label:'Report number',ph:'e.g. Report No. 123'},
  presType:{label:'Type',options:['Paper presentation','Poster presentation','Conference session','Keynote address']},
  conference:{label:'Conference name',ph:'e.g. Transport Research Arena 2024'},
  location:{label:'Location',ph:'e.g. Dublin, Ireland'},
  degree:{label:'Degree type',options:["Doctoral dissertation","Master's thesis","Bachelor's thesis"]},
  institution:{label:'University / institution',ph:'e.g. University of Buea'},
  published:{label:'Published in a database or archive',check:true},
  database:{label:'Database or archive name',ph:'e.g. ProQuest Dissertations and Theses Global'},
  site:{label:'Website name',ph:'e.g. World Health Organization',hint:'Left out automatically when it is the same as the author.'},
  retrieved:{label:'Retrieved on (only for pages designed to change)',type:'date'}
};
function newRef(){return {type:'journal',authors:[{family:'',given:'',org:false}],editors:[],year:'',month:'',day:'',dayEnd:'',title:'',presType:'Paper presentation',degree:"Doctoral dissertation",published:true}}
const trim=s=>(s||'').trim();
const endDot=s=>{s=trim(s);return !s?'':/[.?!]$/.test(s)?s:s+'.'};
function initials(given){
  return trim(given).split(/\s+/).filter(Boolean).map(tok=>tok.split('-').map(p=>{p=p.replace(/\./g,'');return p?p[0].toUpperCase()+'.':''}).filter(Boolean).join('-')).join(' ');
}
const validPeople=list=>(list||[]).filter(a=>trim(a.family));
function personRef(a){if(a.org)return trim(a.family);const i=initials(a.given);return trim(a.family)+(i?', '+i:'')}
function personEd(a){if(a.org)return trim(a.family);const i=initials(a.given);return (i?i+' ':'')+trim(a.family)}
function joinApa(arr,amp){
  if(arr.length===0)return '';
  if(arr.length===1)return arr[0];
  if(arr.length===2)return amp==='ref'?`${arr[0]}, & ${arr[1]}`:`${arr[0]} & ${arr[1]}`;
  return arr.slice(0,-1).join(', ')+', & '+arr[arr.length-1];
}
function authorList(list){
  const p=validPeople(list).map(personRef);
  if(p.length>=21) return p.slice(0,19).join(', ')+', . . . '+p[p.length-1];
  return joinApa(p,'ref');
}
function doiUrl(d){d=trim(d);if(!d)return '';d=d.replace(/^(https?:\/\/)?(dx\.)?doi\.org\//i,'').replace(/^doi:\s*/i,'');return 'https://doi.org/'+d}
const dash=s=>trim(s).replace(/\s*[-–—]+\s*/g,'–');
function ordinal(n){const v=parseInt(n,10);if(!v)return trim(n);const s=['th','st','nd','rd'],m=v%100;return v+(s[(m-20)%10]||s[m]||s[0])}
function edition(e){e=trim(e);if(!e||/^1(st)?$/i.test(e))return '';if(/^\d+$/.test(e))return ordinal(e)+' ed.';return e.replace(/\s*edition$/i,' ed.')}
function refDate(r){
  const y=trim(r.year)||'n.d.';
  const kind=(REF_TYPES[r.type]||{}).date;
  const m=parseInt(r.month,10);
  if((kind==='full'||kind==='range')&&m&&y!=='n.d.'){
    let s=`${y}, ${MONTHS[m-1]}`;
    if(trim(r.day)) s+=' '+trim(r.day)+(kind==='range'&&trim(r.dayEnd)?'–'+trim(r.dayEnd):'');
    return s;
  }
  return y;
}
const H=s=>esc(s);
const I=s=>s?`<i>${esc(s)}</i>`:'';
function sameAsAuthor(r,name){const a=validPeople(r.authors);return a.length===1&&a[0].org&&trim(a[0].family).toLowerCase()===trim(name).toLowerCase()}
function link(r){const d=doiUrl(r.doi);if(d)return H(d);return trim(r.url)?H(trim(r.url)):''}
/* returns HTML with <i> for italics */
function apaHTML(r){
  if(!r)return '';
  const t=REF_TYPES[r.type]?r.type:'journal';
  const auth=authorList(r.authors);
  const date=`(${H(refDate(r))}).`;
  const italicTitle=['book','report','conference','thesis','web'].includes(t);
  let titlePart='';
  // title + bracketed / parenthetical descriptors
  if(t==='journal'||t==='chapter'){ titlePart=H(endDot(r.title)); }
  else if(t==='book'){ const ed=edition(r.edition); titlePart=I(trim(r.title))+(ed?` (${H(ed)})`:'')+'.'; }
  else if(t==='report'){ titlePart=I(trim(r.title))+(trim(r.reportNo)?` (${H(trim(r.reportNo))})`:'')+'.'; }
  else if(t==='conference'){ titlePart=I(trim(r.title))+` [${H(r.presType||'Paper presentation')}].`; }
  else if(t==='thesis'){ const deg=r.degree||'Doctoral dissertation';const inst=trim(r.institution);
    const label=r.published===false?'Unpublished '+deg.charAt(0).toLowerCase()+deg.slice(1):deg;
    titlePart=I(trim(r.title))+` [${H(label)}${inst?', '+H(inst):''}].`; }
  else if(t==='web'){ titlePart=I(trim(r.title))+'.'; }
  if(t!=='journal'&&t!=='chapter'&&!trim(r.title)) titlePart='';
  // source
  let src='';
  if(t==='journal'){
    const j=trim(r.journal),v=trim(r.volume),i=trim(r.issue),pg=trim(r.pages)?dash(r.pages):(trim(r.articleNo)?'Article '+trim(r.articleNo):'');
    let s=j?I(j):'';
    if(v) s+=(s?', ':'')+I(v)+(i?`(${H(i)})`:'');
    else if(i) s+=(s?', ':'')+`(${H(i)})`;
    if(pg) s+=(s?', ':'')+H(pg);
    src=s?s+'.':'';
  }else if(t==='book'){
    const p=trim(r.publisher); src=p&&!sameAsAuthor(r,p)?H(endDot(p)):'';
  }else if(t==='chapter'){
    const eds=validPeople(r.editors);
    const edStr=eds.length?`In ${H(joinApa(eds.map(personEd),'in'))} (${eds.length>1?'Eds.':'Ed.'}), `:'In ';
    const ed=edition(r.edition);const pg=trim(r.pages);
    const paren=[ed,pg?(pg.match(/[-–—]/)?'pp. ':'p. ')+dash(pg):''].filter(Boolean).join(', ');
    src=edStr+I(trim(r.bookTitle))+(paren?` (${H(paren)})`:'')+'.';
    const p=trim(r.publisher); if(p) src+=' '+H(endDot(p));
  }else if(t==='report'){
    const p=trim(r.publisher); src=p&&!sameAsAuthor(r,p)?H(endDot(p)):'';
  }else if(t==='conference'){
    src=[trim(r.conference),trim(r.location)].filter(Boolean).map(H).join(', '); src=src?src+'.':'';
  }else if(t==='thesis'){
    src=r.published!==false&&trim(r.database)?H(endDot(r.database)):'';
  }else if(t==='web'){
    const s=trim(r.site); src=s&&!sameAsAuthor(r,s)?H(endDot(s)):'';
  }
  // link
  let lk=link(r);
  if(t==='web'&&trim(r.retrieved)&&trim(r.url)){ const d=new Date(r.retrieved+'T00:00:00'); lk=`Retrieved ${MONTHS[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}, from ${H(trim(r.url))}`; }
  // assemble (no author → title moves to the front)
  const parts=[];
  if(auth){ parts.push(H(endDot(auth)),date,titlePart); }
  else { parts.push(titlePart||'[Untitled].',date); }
  parts.push(src,lk);
  return parts.filter(Boolean).join(' ').replace(/\s+/g,' ').trim();
}
const apaText=r=>{const d=document.createElement('div');d.innerHTML=apaHTML(r);return d.textContent};
const apaMd=r=>apaHTML(r).replace(/<i>(.*?)<\/i>/g,'*$1*').replace(/<[^>]+>/g,'').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'");
function shortTitle(r){const w=trim(r.title).split(/\s+/);return w.slice(0,4).join(' ')+(w.length>4?'…':'')}
function inText(r){
  if(!r)return {paren:'',narr:''};
  const a=validPeople(r.authors), y=trim(r.year)||'n.d.';
  let p,n;
  if(!a.length){const st=shortTitle(r);const q=['journal','chapter'].includes(r.type)?`"${st}"`:`<i>${esc(st)}</i>`;p=n=q}
  else if(a.length===1){p=n=esc(trim(a[0].family))}
  else if(a.length===2){p=`${esc(trim(a[0].family))} &amp; ${esc(trim(a[1].family))}`;n=`${esc(trim(a[0].family))} and ${esc(trim(a[1].family))}`}
  else {p=n=`${esc(trim(a[0].family))} et al.`}
  return {paren:`(${p}, ${esc(y)})`,narr:`${n} (${esc(y)})`};
}
function missingFields(r){
  const miss=[];
  if(!validPeople(r.authors).length) miss.push('author (or leave empty only if there truly is none)');
  validPeople(r.authors).concat(validPeople(r.editors)).filter(a=>!a.org&&!trim(a.given)).forEach(a=>miss.push('first name(s) of '+trim(a.family)));
  if(!trim(r.year)) miss.push('year (otherwise shown as n.d.)');
  if(!trim(r.title)) miss.push('title');
  (REF_TYPES[r.type]||REF_TYPES.journal).req.forEach(f=>{
    if(f==='editors'){ if(!validPeople(r.editors).length) miss.push('editor(s)'); }
    else if(f==='url'&&r.type==='report'){ if(!trim(r.url)&&!trim(r.doi)) miss.push('DOI or URL'); }
    else if(!trim(r[f])) miss.push(REF_FIELDS[f].label.toLowerCase());
  });
  if(r.type==='journal'&&!trim(r.pages)&&!trim(r.articleNo)) miss.push('pages or article number');
  if(r.type==='journal'&&!trim(r.doi)&&!trim(r.url)) miss.push('DOI (if the article has one)');
  if(r.type==='thesis'&&r.published!==false&&!trim(r.database)&&!trim(r.url)) miss.push('database or URL');
  return miss;
}
function sentenceCase(s){
  let first=true;
  return (s||'').split(/(\s+)/).map(w=>{
    if(/^\s+$/.test(w)||!w)return w;
    let out=w;
    const isAcr=/^[A-Z0-9][A-Z0-9\-&]+[,:;.?!]?$/.test(w)&&/[A-Z]/.test(w.replace(/^[A-Z]/,''));
    if(!isAcr) out=first?w.charAt(0).toUpperCase()+w.slice(1).toLowerCase():w.toLowerCase();
    first=/[:?!]$/.test(w)||/^[-–—]$/.test(w);
    return out;
  }).join('');
}
/* sync the short display fields used across the app */
function syncFromRef(x){
  const r=x.ref; if(!r)return;
  x.title=trim(r.title);
  const a=validPeople(r.authors);
  x.authors=!a.length?'':a.length===1?trim(a[0].family):a.length===2?`${trim(a[0].family)} & ${trim(a[1].family)}`:`${trim(a[0].family)} et al.`;
  x.year=trim(r.year);
  x.citation=apaText(r);
}
function migrateRef(x){
  if(x.ref)return;
  x.ref=newRef(); x.ref.title=x.title||''; x.ref.year=x.year||'';
  if(trim(x.authors)) x.ref.authors=[{family:trim(x.authors),given:'',org:true}];
  x.oldCitation=x.citation||'';
}

/* ---------- PDF attachments (stored as artifact assets) ---------- */
const PDF_MAX=((window.LITNOTES_CONFIG&&window.LITNOTES_CONFIG.maxUploadMb)||20)*1024*1024;
let _assets, PDF_OK; const UP=new Set();
async function getAssets(){
  if(_assets!==undefined)return _assets;
  try{for(let i=0;i<30&&!(window.claude&&window.claude.use);i++)await new Promise(r=>setTimeout(r,100));_assets=window.claude?await window.claude.use('assets'):null}catch(e){_assets=null}
  PDF_OK=!!_assets; return _assets;
}
const fmtSize=b=>!b?'':b<1024*1024?Math.max(1,Math.round(b/1024))+' KB':(b/1024/1024).toFixed(1)+' MB';
const pdfUrl=p=>'/_blob/'+p.id;
function checkPdf(f){
  if(!f)return 'No file selected.';
  if(!(f.type==='application/pdf'||/\.pdf$/i.test(f.name)))return 'Please choose a PDF file.';
  if(f.size>PDF_MAX)return `This PDF is ${fmtSize(f.size)} — the limit is ${Math.round(PDF_MAX/1048576)} MB.`;
  return '';
}
function assetErr(e){
  return ({too_large:'This PDF is larger than 20 MB.',unsupported_type:'That file is not a valid PDF.',quota_or_state:'PDF storage is full — remove some PDFs and try again.',rate_limited:'Too many uploads at once — try again in a moment.',upstream_auth:'Please reload the page and try again.',not_granted:'PDF uploads are not available in this view.',capability_disabled:'PDF uploads are not available in this view.'})[e&&e.code]||'Upload failed — please try again.';
}
function refreshPdfUI(id){ if(V.view==='paper'&&V.paperId===id){if(V.split&&!(S.docs[id]&&S.docs[id].pdf)){V.split=false;persistView();renderMain();return}const b=$('#pdfBox');if(b)b.innerHTML=pdfBoxHTML(S.docs[id]);const t=$('#pdfTool');if(t)t.innerHTML=pdfToolHTML(S.docs[id])} renderSide(); }
async function attachPdf(id,file){
  const err=checkPdf(file); if(err){toast(err);return}
  const a=await getAssets(); if(!a){toast(unavailable('pdf'));return}
  UP.add(id); refreshPdfUI(id);
  try{
    let res;
    try{res=await a.upload(file,{type:'application/pdf'})}
    catch(e){if(e&&e.code==='store_unavailable'){await new Promise(r=>setTimeout(r,1200));res=await a.upload(file,{type:'application/pdf'})}else throw e}
    const x=S.docs[id]; if(!x){a.delete(res.id).catch(()=>{});return}
    const old=x.pdf;
    if(x.pdfOrig){a.delete(x.pdfOrig.id).catch(()=>{});delete x.pdfOrig}
    if((x.highlights||[]).length){x.highlights=[];x.hlDirty=false}
    x.pdf={id:res.id,name:file.name,size:res.sizeBytes||file.size,addedAt:Date.now()};
    save(id); toast(old?'PDF replaced':'PDF attached');
    if(old&&old.id&&old.id!==res.id) a.delete(old.id).catch(()=>{}); // replaced by the user's own action
  }catch(e){toast(assetErr(e))}
  finally{UP.delete(id);refreshPdfUI(id);if(V.view!=='paper')renderMain()}
}
async function removePdfAsset(x){ if(!x||!x.pdf)return; const a=await getAssets(); if(a){try{await a.delete(x.pdf.id)}catch(e){}if(x.pdfOrig){try{await a.delete(x.pdfOrig.id)}catch(e){}}} }
function pdfBoxHTML(x){
  if(UP.has(V.paperId)) return `<div class="pdfrow"><span class="spin"></span><div class="nm"><b>Uploading PDF…</b><span>Keep this page open until it finishes.</span></div></div>`;
  if(x.pdf) return `<div class="pdfrow"><span class="pdfic">PDF</span><div class="nm"><b title="${esc(x.pdf.name)}">${esc(x.pdf.name)}</b><span>${fmtSize(x.pdf.size)} · ${x.pdfOrig?`saved with ${x.pdf.highlights||0} highlight${x.pdf.highlights===1?'':'s'} ${esc(ago(x.pdf.addedAt))}`:'added '+esc(ago(x.pdf.addedAt))}</span></div>
    <a class="btn sm pri" href="${esc(pdfUrl(x.pdf))}" target="_blank" rel="noopener">${ico('doc')}Open PDF</a><button class="btn sm" data-act="pickPdf">${ico('upload')}Replace</button><button class="btn sm ghost danger" data-act="removePdf">${ico('trash')}</button></div>`;

function pdfToolHTML(x){
  if(!x||!x.pdf||UP.has(V.paperId))return '';

  return `<button class="btn sm ${on&&R.tab==='pdf'?'pri':''}" data-act="${on&&R.tab==='pdf'?'closeSplit':'openSplit'}" data-v="pdf">${ico('split')}${on&&R.tab==='pdf'?'Close reader':'Read side by side'}</button><button class="btn sm ${on&&R.tab==='ask'?'pri':''}" data-act="openSplit" data-v="ask">${ico('spark')}Ask ${AIN}</button>`;

function pickFile(cb){
  const inp=document.createElement('input');inp.type='file';inp.accept='application/pdf,.pdf';inp.style.display='none';
  inp.onchange=()=>{const f=inp.files[0];inp.remove();if(f)cb(f)};document.body.appendChild(inp);inp.click();

function bindDrop(el,cb){
  if(!el)return;
  ['dragenter','dragover'].forEach(t=>el.addEventListener(t,e=>{e.preventDefault();el.classList.add('over')}));
  ['dragleave','dragend'].forEach(t=>el.addEventListener(t,()=>el.classList.remove('over')));
  el.addEventListener('drop',e=>{e.preventDefault();el.classList.remove('over');const f=e.dataTransfer.files&&e.dataTransfer.files[0];if(f)cb(f)});
}

      const cl=z.querySelector('[data-pdfclear]'); if(cl) cl.onclick=()=>{pdfFile=null;z.innerHTML=pdfZone();bindPdf()};
    };

    ov.querySelector('[data-ok]').onclick=()=>{
      const T=REF_TYPES[w.type];
      // keep only fields relevant to the chosen type (plus core ones)
      const keep=new Set(['type','authors','year','month','day','dayEnd','title',...T.fields]);
      Object.keys(w).forEach(k=>{if(!keep.has(k))delete w[k]});

   STORAGE  (account db when available, else this browser)
   ============================================================ */
const S = {mode:'loading', docs:{}, pending:new Set(), col:null, chains:{}, timers:{}};
const LKEY='litnotes.v1';
function lsGet(){try{return JSON.parse(localStorage.getItem(LKEY)||'{}')}catch(e){return {}}}
function lsSet(o){try{localStorage.setItem(LKEY,JSON.stringify(o));return true}catch(e){return false}}
const clone=o=>JSON.parse(JSON.stringify(o));
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,7);

function setStatus(){
  const el=document.getElementById('storeStatus'); if(!el)return;
  const pend=S.pending.size;
  let h;
  if(S.mode==='db') h=`<span class="dot ${pend?'warn':''}"></span>${LOCAL?'Saved on your server':'Synced to your account'}`;
  else if(S.mode==='local') h=`<span class="dot warn"></span>Saved in this browser only`;
  else if(S.mode==='loading') h=`<span class="dot warn"></span>Connecting…`;
  else h=`<span class="dot off"></span>Offline — back up your data`;
  setHTML(el,h);
}
async function initStore(){
  let db=null,user=null;
  const loadTimer=setTimeout(()=>{ if(S.mode==='loading'){ useLocal(); toast('Could not reach your account yet — using this browser.'); } },10000);
  try{
    for(let i=0;i<30&&!(window.claude&&typeof window.claude.use==='function');i++) await new Promise(r=>setTimeout(r,100));
    if(window.claude && typeof window.claude.use==='function'){
      [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    }
  }catch(e){db=null}
  let id=null;
  if(db&&user){try{id=await user.id()}catch(e){id=null}}
  if(!db||!id){clearTimeout(loadTimer);useLocal();return}
  S.col=db.collection('data/users/'+id);
  S.col.onSnapshot(snap=>{
    clearTimeout(loadTimer);
    if(S.mode!=='db'){
      // first contact: if we had fallen back to local, migrate local docs up
      const wasLocal=S.mode==='local'; S.mode='db';
      if(wasLocal){ const loc=lsGet(); Object.keys(loc).forEach(k=>{ if(!snap.docs.find(d=>d.id===k)){S.docs[k]=loc[k];queueWrite(k)} }); }
    }
    const seen=new Set();
    snap.docs.forEach(d=>{seen.add(d.id); if(!S.pending.has(d.id)) S.docs[d.id]=clone(d.data());});
    Object.keys(S.docs).forEach(k=>{ if(!seen.has(k)&&!S.pending.has(k)) delete S.docs[k]; });
    setStatus(); onData();
  },err=>{
    clearTimeout(loadTimer);
    if(S.mode==='loading'){useLocal()} else {S.mode='off';setStatus();toast('Lost connection to storage. Back up your data.')}
  });
}
function useLocal(){
  if(S.mode==='db')return;
  S.mode='local'; S.docs=Object.assign(lsGet(),S.docs); setStatus(); onData();
}
function queueWrite(id){
  S.pending.add(id); setStatus();
  const prev=S.chains[id]||Promise.resolve();
  S.chains[id]=prev.then(async()=>{
    const data=S.docs[id];
    try{
      if(S.mode==='db'&&S.col){
        const ref=S.col.doc(id);
        if(data) await ref.set(data); else await ref.delete();
      }else{
        const all=lsGet(); if(data) all[id]=data; else delete all[id];
        if(!lsSet(all)) throw {code:'local'};
      }
    }catch(e){
      if(e&&e.code==='unavailable'){ await new Promise(r=>setTimeout(r,800+Math.random()*800)); try{ const ref=S.col.doc(id); if(data) await ref.set(data); else await ref.delete(); }catch(e2){toast('Save failed — please back up your data.')} }
      else if(e&&e.code==='quota_exceeded') toast('Storage is full — delete some items or back up.');
      else toast('Save failed — please back up your data.');
    }
  }).finally(()=>{ if(S.chains[id]===p) {S.pending.delete(id); setStatus();} });
  const p=S.chains[id];
}
function save(id,delay){
  if(S.docs[id]) S.docs[id].updatedAt=Date.now();
  clearTimeout(S.timers[id]);
  S.pending.add(id); setStatus();
  if(delay){ S.timers[id]=setTimeout(()=>queueWrite(id),delay); } else queueWrite(id);
}
function remove(id){ delete S.docs[id]; clearTimeout(S.timers[id]); queueWrite(id); }

  setHTML($('#nav'),`<div class="slabel" style="margin-bottom:6px">Workspace</div>`+items.map(([k,i,l,c])=>`<button class="nv ${n===k?'on':''}" data-act="nav" data-v="${k}" ${n===k?'aria-current="page"':''}>${ico(i)}<span>${l}</span>${c!=null?`<span class="k" ${c==='●'?'style="color:var(--accent);font-size:14px" title="Update available"':''}>${c}</span>`:''}</button>`).join(''));
  // current project card
  const p=V.pid&&S.docs[V.pid]&&S.docs[V.pid].kind==='project'?{id:V.pid,...S.docs[V.pid]}:projects().slice(-1)[0];
  if(!p){setHTML($('#curProj'),'');return}
  const t=tpl(p.id), pp=papersOf(p.id);
  const open=pp.filter(x=>nextStage(x,t)).sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0)).slice(0,5);
  const tot=pp.reduce((a,x)=>{const g=progress(x,t);return [a[0]+g.n,a[1]+g.total]},[0,0]);
  const pct=tot[1]?Math.round(tot[0]*100/tot[1]):0;
  setHTML($('#curProj'),`<div class="slabel" style="margin-bottom:8px">Current project</div><button class="cur curbtn" data-act="openProject" data-id="${p.id}" title="Open ${esc(p.name||'project')}">
    <div class="row" style="gap:10px;flex-wrap:nowrap"><div style="position:relative;width:38px;height:38px;flex:none">${ring(pct,38,4)}<span style="position:absolute;inset:0;display:grid;place-items:center;font-size:10px;font-weight:800">${pct}%</span></div>
    <div style="min-width:0"><div class="ttl">${esc(p.name||'Untitled project')}</div><div class="sm">${pp.length} paper${pp.length===1?'':'s'} · ${open.length?open.length+' in progress':'all caught up'}</div></div></div>
    </button>`);
}

function render(){renderSide();renderMain()}
function renderMain(soft){
  const m=$('#main');
  if(S.mode==='loading'){m.innerHTML=`<div class="card" style="display:flex;gap:12px;align-items:center"><span class="dot warn"></span>Loading your notes…</div>`;return}
  let html;
  if(V.view==='project'&&S.docs[V.pid]) html=projectView();
  else if(V.view==='paper'&&S.docs[V.paperId]) html=paperView();
  else if(V.view==='paperReport'&&S.docs[V.paperId]) html=paperReportView();
  else if(V.view==='draft'&&S.docs[V.draftId]) html=draftView();
  else if(V.view==='projects') html=projectsView();
  else if(V.view==='library') html=libraryView();
  else if(V.view==='settings') html=appSettingsView();
  else if(V.view==='ideas') html=ideasView();
  else {V.view='home';html=homeView()}
  if(soft&&m._html===html)return;
  m.innerHTML=html; m._html=html;
  if(V.view!=='draft')hideFloat();
  if(V.view!=='paper'&&V.view!=='draft'){document.body.classList.remove('wide','focus');if(V.focus){V.focus=false;persistView();leaveFullscreen()}}
  if(V.view==='paper')bindPaper();
  if(V.view==='draft')bindDraft();
  if(V.view==='project'&&V.tab==='ask')bindProjectAsk();
  m.querySelectorAll('textarea.inp').forEach(autosize);
}

function compareView(pp,t){

function hl(text,q){const i=text.toLowerCase().indexOf(q.toLowerCase());if(i<0)return esc(text.slice(0,120));const s=Math.max(0,i-40);return (s?'…':'')+esc(text.slice(s,i))+'<mark>'+esc(text.slice(i,i+q.length))+'</mark>'+esc(text.slice(i+q.length,i+q.length+80))}

  projects().forEach(p=>{if((p.name+' '+(p.description||'')).toLowerCase().includes(ql))out.push({k:'Projects',html:`<button data-act="openProject" data-id="${p.id}"><div class="t">${hl(p.name||'',q)}</div><div class="s">${papersOf(p.id).length} papers</div></button>`})});
  allPapers().forEach(x=>{
    const t=tpl(x.projectId); const meta=[x.title,x.authors,x.year,x.citation].join(' ');
    if(meta.toLowerCase().includes(ql)) out.push({k:'Papers',html:`<button data-act="openPaper" data-id="${x.id}"><div class="t">${hl(paperTitle(x),q)}</div><div class="s">${hl(x.citation||paperMeta(x)||'',q)}</div></button>`});

  });

const PDFJS_BASE=(LOCAL&&LOCAL.pdfjsBase)||'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/5.4.149/';
let _pdfjs=null;
function loadPdfjs(){
  if(_pdfjs)return _pdfjs;
  _pdfjs=(async()=>{
    const lib=await import(PDFJS_BASE+'pdf.min.mjs');
    await import(PDFJS_BASE+'pdf.worker.min.mjs');          // registers globalThis.pdfjsWorker → parsing runs on the page
    lib.GlobalWorkerOptions.workerSrc=PDFJS_BASE+'pdf.worker.min.mjs';
    return lib;
  })();
  _pdfjs.catch(()=>{_pdfjs=null});
  return _pdfjs;
}
const DOCS={};      // asset id -> Promise<PDFDocumentProxy>
const TEXT={};      // asset id -> Promise<{text,pages,truncated}>
function openPdfDoc(p){
  if(!DOCS[p.id]) DOCS[p.id]=(async()=>{const lib=await loadPdfjs();const r=await fetch(pdfUrl(p));if(!r.ok)throw new Error('missing');const buf=await r.arrayBuffer();return lib.getDocument({data:buf,isEvalSupported:false}).promise})();
  DOCS[p.id].catch(()=>{delete DOCS[p.id]});
  return DOCS[p.id];
}
const TEXT_MAX=170000;
function pdfText(p){
  if(!TEXT[p.id]) TEXT[p.id]=(async()=>{
    const doc=await openPdfDoc(p); let out='',truncated=false;
    for(let i=1;i<=doc.numPages;i++){
      const pg=await doc.getPage(i); const tc=await pg.getTextContent();
      let line=''; tc.items.forEach(it=>{line+=it.str+(it.hasEOL?'\n':' ')});
      out+=`\n[page ${i}]\n`+line.replace(/[ \t]+/g,' ').replace(/\n{3,}/g,'\n\n');
      if(out.length>TEXT_MAX){out=out.slice(0,TEXT_MAX);truncated=true;break}
    }
    return {text:out.trim(),pages:doc.numPages,truncated};
  })();
  TEXT[p.id].catch(()=>{delete TEXT[p.id]});
  return TEXT[p.id];
}

}
function fitScale(mode){
  const box=$('#rpages'); if(!box||!R.pages.length)return R.scale||1;
  const maxW=Math.max(...R.pages.map(p=>p.w)), first=R.pages[0];
  const aw=box.clientWidth-30, ah=box.clientHeight-30;
  const sc=mode==='page'?Math.min(aw/first.w,ah/first.h):aw/maxW;
  return Math.max(.1,sc);
}
function clampScale(sc){return Math.min(5*PDF_PX,Math.max(.25*PDF_PX,sc))}
/* resize page boxes to a new scale, keeping the point under `anchor` (box coords) in place */
function layoutPages(scale,anchor,initial){
  const box=$('#rpages'); if(!box||!R.pages.length)return;
  scale=clampScale(scale);
  const old=R.scale||scale;
  const ax=anchor?anchor.x:box.clientWidth/2, ay=anchor?anchor.y:box.clientHeight/2;
  const fx=(box.scrollLeft+ax)/Math.max(1,box.scrollWidth), fy=(box.scrollTop+ay)/Math.max(1,box.scrollHeight);
  R.scale=scale;
  R.pages.forEach(p=>{p.el.style.width=Math.floor(p.w*scale)+'px';p.el.style.height=Math.floor(p.h*scale)+'px';const tl=p.el.querySelector('.textLayer');if(tl)tl.remove();p.el.dataset.done=''});
  if(!initial&&old!==scale){box.scrollLeft=fx*box.scrollWidth-ax;box.scrollTop=fy*box.scrollHeight-ay}
  updateZoomUI();
  try{localStorage.setItem('litnotes.zoom',scale);localStorage.setItem('litnotes.zmode',R.mode)}catch(e){}
  clearTimeout(R._rr); R._rr=setTimeout(()=>R.vis&&R.vis.forEach(n=>renderPage(n)),initial?0:180);
}
async function renderPage(n){
  const p=R.pages[n-1]; if(!p||!R.doc)return;
  const scale=R.scale, key=String(scale);
  if(p.el.dataset.done===key||p.busy===key)return;
  p.busy=key;
  if(p.task){try{p.task.cancel()}catch(e){}}
  const lib=await loadPdfjs(); const page=await R.doc.getPage(n);
  if(R.scale!==scale){p.busy='';return}
  const vp=page.getViewport({scale});
  const maxPix=16e6, dpr=Math.min(window.devicePixelRatio||1,2,Math.sqrt(maxPix/(vp.width*vp.height)));
  const c=document.createElement('canvas'); c.width=Math.floor(vp.width*dpr); c.height=Math.floor(vp.height*dpr);
  p.task=page.render({canvas:c,canvasContext:c.getContext('2d'),viewport:vp,transform:dpr!==1?[dpr,0,0,dpr,0,0]:null});
  try{await p.task.promise}catch(e){if(p.busy===key)p.busy='';return}
  if(R.scale!==scale){p.busy='';return}
  p.el.querySelectorAll('canvas').forEach(o=>o.remove());
  p.el.insertBefore(c,p.el.firstChild);
  try{
    const tl=document.createElement('div'); tl.className='textLayer'; p.el.appendChild(tl);
    tl.style.setProperty('--scale-factor',scale); tl.style.setProperty('--total-scale-factor',scale); tl.style.setProperty('--user-unit','1');
    await new lib.TextLayer({textContentSource:page.streamTextContent(),container:tl,viewport:vp}).render();
    const was=p.scanned; p.scanned=!tl.textContent.replace(/\s/g,'').length; if(was!==p.scanned)updateScanHint();
  }catch(e){}
  p.el.dataset.done=key; p.busy='';
}
function updateZoomUI(){
  const sel=$('#zoomSel'); if(!sel)return;
  const pct=pctOf(R.scale);
  const fw=pctOf(fitScale('width')), fp=pctOf(fitScale('page'));
  let opts=`<option value="width">Fit width · ${fw}%</option><option value="page">Fit page · ${fp}%</option>`;
  const custom=R.mode==='custom'&&!ZOOM_STEPS.includes(pct);
  opts+=ZOOM_STEPS.map(z=>`<option value="${z}">${z}%</option>`).join('');
  if(custom)opts=`<option value="c" hidden>${pct}%</option>`+opts;
  sel.innerHTML=opts;
  sel.value=R.mode==='custom'?(custom?'c':String(pct)):R.mode;
  // the closed select shows a compact label
  const label=R.mode==='custom'?pct+'%':(R.mode==='width'?'Fit width · ':'Fit page · ')+pct+'%';
  sel.title='Zoom: '+label;
}
function setZoom(v,anchor){
  if(!R.pages.length)return;
  if(v==='width'||v==='page'){R.mode=v;layoutPages(fitScale(v),anchor);return}
  R.mode='custom'; layoutPages(v,anchor);
}
function stepZoom(dir){
  const cur=pctOf(R.scale);
  let next=dir>0?ZOOM_STEPS.find(z=>z>cur+0.5):[...ZOOM_STEPS].reverse().find(z=>z<cur-0.5);
  if(next==null)next=dir>0?ZOOM_STEPS[ZOOM_STEPS.length-1]:ZOOM_STEPS[0];
  setZoom(next/100*PDF_PX);
}
function bindViewerGestures(box){
  if(box._bound)return; box._bound=true;
  // mouse / pen drag with the hand tool
  let drag=null;
  box.addEventListener('pointerdown',e=>{
    if(R.tool!=='hand'||e.pointerType==='touch'||e.button!==0)return;
    if(e.target.closest('a,button'))return;
    drag={x:e.clientX,y:e.clientY,l:box.scrollLeft,t:box.scrollTop,id:e.pointerId};
    box.setPointerCapture(e.pointerId); box.classList.add('grabbing'); e.preventDefault();
  });
  box.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.id)return;box.scrollLeft=drag.l-(e.clientX-drag.x);box.scrollTop=drag.t-(e.clientY-drag.y)});
  const end=e=>{if(!drag)return;try{box.releasePointerCapture(drag.id)}catch(_){}drag=null;box.classList.remove('grabbing')};
  box.addEventListener('pointerup',end); box.addEventListener('pointercancel',end); box.addEventListener('lostpointercapture',end);
  // Ctrl + wheel and trackpad pinch (browsers send ctrlKey with pinch gestures)
  box.addEventListener('wheel',e=>{
    if(!e.ctrlKey&&!e.metaKey)return;
    e.preventDefault();
    const r=box.getBoundingClientRect();
    R.mode='custom'; layoutPages(R.scale*Math.exp(-e.deltaY*0.0025),{x:e.clientX-r.left,y:e.clientY-r.top});
  },{passive:false});
  // two-finger pinch on touch screens (one finger scrolls natively)
  let pinch=null;
  const dist=t=>Math.hypot(t[0].clientX-t[1].clientX,t[0].clientY-t[1].clientY);
  box.addEventListener('touchstart',e=>{
    if(e.touches.length===2){const r=box.getBoundingClientRect();pinch={d:dist(e.touches),s:R.scale,x:(e.touches[0].clientX+e.touches[1].clientX)/2-r.left,y:(e.touches[0].clientY+e.touches[1].clientY)/2-r.top}}
  },{passive:true});
  box.addEventListener('touchmove',e=>{
    if(!pinch||e.touches.length!==2)return;
    e.preventDefault();
    const r=box.getBoundingClientRect();
    const mx=(e.touches[0].clientX+e.touches[1].clientX)/2-r.left, my=(e.touches[0].clientY+e.touches[1].clientY)/2-r.top;
    R.mode='custom'; layoutPages(pinch.s*dist(e.touches)/pinch.d,{x:mx,y:my});
    // two fingers also pan
    box.scrollLeft-=mx-pinch.x; box.scrollTop-=my-pinch.y; pinch.x=mx; pinch.y=my;
  },{passive:false});
  box.addEventListener('touchend',e=>{if(e.touches.length<2)pinch=null});
}

/* ============================================================
   AUTO-FILL REFERENCE DETAILS FROM A PDF
   1) DOI found → CrossRef (self-hosted server)  2) else AI reads page 1  3) else PDF metadata
   ============================================================ */
const DOI_RE=/\b(10\.\d{4,9}\/[^\s"'<>]+)/i;
function cleanDoi(d){return d?d.replace(/[.,;:)\]}>]+$/,'').replace(/^doi:\s*/i,''):''}
async function pdfHead(src){
  const lib=await loadPdfjs();
  const data=src.file?await src.file.arrayBuffer():await (await fetch(src.url)).arrayBuffer();
  const doc=await lib.getDocument({data,isEvalSupported:false}).promise;
  let text='';
  for(let i=1;i<=Math.min(2,doc.numPages);i++){
    const pg=await doc.getPage(i); const tc=await pg.getTextContent();
    text+=`\n[page ${i}]\n`+tc.items.map(it=>it.str+(it.hasEOL?'\n':' ')).join('');
  }
  let info={}; try{info=(await doc.getMetadata()).info||{}}catch(e){}
  doc.destroy&&doc.destroy();
  const m=(text+' '+(info.Subject||'')+' '+(info.Keywords||'')).match(DOI_RE);
  return {text:text.replace(/[ \t]+/g,' ').trim(),info,doi:cleanDoi(m&&m[1])};
}
function normRef(o){
  const r={};
  const t=String(o.type||'').toLowerCase();
  r.type=REF_TYPES[t]?t:'journal';
  const ppl=a=>(Array.isArray(a)?a:[]).map(p=>p&&typeof p==='object'?{family:trim(p.family||p.name),given:trim(p.given),org:!!p.org||(!p.given&&!!p.name&&!p.family)}:null).filter(p=>p&&p.family);
  const au=ppl(o.authors); if(au.length) r.authors=au;
  const ed=ppl(o.editors); if(ed.length) r.editors=ed;
  ['year','month','day','title','journal','volume','issue','pages','articleNo','doi','url','publisher','bookTitle','institution','degree','reportNo','conference','location','edition'].forEach(k=>{const v=o[k];if(v!=null&&String(v).trim())r[k]=String(v).trim()});
  if(r.month&&!/^(1[0-2]|[1-9])$/.test(r.month)){const i=MONTHS.findIndex(m=>m.toLowerCase().startsWith(String(r.month).toLowerCase().slice(0,3)));r.month=i>=0?String(i+1):''}
  if(r.degree&&!REF_FIELDS.degree.options.includes(r.degree)) r.degree=/doct|phd/i.test(r.degree)?'Doctoral dissertation':/master|msc|ma\b/i.test(r.degree)?"Master's thesis":"Bachelor's thesis";
  if(r.doi) r.doi=cleanDoi(r.doi.replace(/^https?:\/\/(dx\.)?doi\.org\//i,''));
  if(r.doi) delete r.url;
  return r;
}
async function autofillRef(src){
  const head=await pdfHead(src);
  // 1) CrossRef through the self-hosted server
  if(head.doi&&LOCAL&&LOCAL.lookup){
    try{const r=await fetch('/api/lookup?doi='+encodeURIComponent(head.doi));if(r.ok){const j=await r.json();if(j&&j.ref&&j.ref.title)return {patch:normRef(j.ref),source:'crossref',doi:head.doi}}}catch(e){}
  }
  // 2) AI reads the first page
  const sample=await getSample();
  if(sample&&head.text.length>80){
    const prompt=`Extract the bibliographic reference of this document from the text of its first pages, for an APA 7 reference.
Reply with ONLY a JSON object with these keys (use "" or [] for anything NOT printed in the text — never guess or use outside knowledge):

  const start=Date.now(); let wentDown=false;
  const poll=async()=>{
    if(Date.now()-start>8*60*1000){ov.querySelector('#updMsg').innerHTML='This is taking longer than expected. Check Docker Desktop, then reload this page.';UPD.updating=false;return}
    try{const r=await fetch('/healthz',{cache:'no-store'});const j=await r.json();

}

  if(!block)return null;

function atSentenceStart(ed){

  if(!t.trim()||/\n\s*$/.test(t))return true;                  // start of note, line or list item
  const m=t.match(/([^\s]*)([.!?])["'”’)\]]*\s+$/); if(!m)return false;
  if(m[2]==='.'&&ABBR.test(' '+t.replace(/["'”’)\]]*\s+$/,'')))return false;   // e.g. / et al. / p. 4
  if(m[2]==='.'&&/(^|\s)[A-Za-z]\.$/.test(t.replace(/\s+$/,'')))return false;  // initials: "G. T. Mbah"

function autoCap(ed,e){

  if(!/\p{Ll}/u.test(e.data)||!getSelection().isCollapsed)return false;

}
function undoAutoCap(ed,e){
  if(e.key!=='Backspace'||!lastAuto||lastAuto.ed!==ed)return false;

/* ---- spelling & grammar check: proposals you accept or ignore ---- */
const GS={};   // qid -> issues
async function checkWriting(qid){
  const ed=document.querySelector(`.rte[data-ans="${qid}"]`), box=document.querySelector(`[data-sug="${qid}"]`); if(!ed||!box)return;
  const text=richToText(cleanRich(ed.innerHTML)).trim();
  if(!text){toast('Write something first, then check it');return}
  const sample=await getSample();
  if(!sample){toast(LOCAL?'The grammar check uses the Ask model — set ANTHROPIC_API_KEY or OLLAMA_URL on the server to turn it on.':'The grammar check is available when you open the app in Claude while signed in.');return}
  box.hidden=false; box.innerHTML=`<div class="gs-head"><span class="spin"></span>Checking spelling and grammar…</div>`;
  const variety=(LANGS.find(l=>l[0]===WR.lang)||LANGS[0])[1];
  const prompt=`You are a careful proofreader for a student's research notes (written in ${variety==='No spell check'?'English':variety}).
Find ONLY clear spelling, grammar, punctuation and capitalisation errors. Do not rewrite style, do not change meaning, technical terms, abbreviations, citations, numbers or names, and do not "improve" wording that is already correct. Notes can be short and fragmentary: fragments and bullet points are fine.
Reply with ONLY JSON: {"issues":[{"original":"exact text copied from the notes, 1-8 words, long enough to be unique","suggestion":"the corrected text for exactly that span","type":"spelling|grammar|punctuation|capitalisation","why":"under 10 words"}]}
Use {"issues":[]} if there is nothing to fix. At most 25 issues.
<notes>
${text.slice(0,12000)}
</notes>`;
  let res;
  try{res=await sample.json(prompt,{cache:false,modelTier:'quick'})}
  catch(e){box.innerHTML=`<div class="gs-head warn">${ico('warn')}<span>${esc(sampleErr(e))}</span><button class="link" data-gsclose="${qid}">Close</button></div>`;return}
  const issues=((res&&res.issues)||[]).filter(i=>i&&typeof i.original==='string'&&typeof i.suggestion==='string'&&i.original&&i.original!==i.suggestion&&text.includes(i.original)).slice(0,25);

function renderSug(qid){

  const done=(GS[qid]||[]).length-list.length;

  if(!list.length){box.innerHTML=`<div class="gs-head ok">${ico('check')}<span>All suggestions handled.</span><button class="link" data-gsclose="${qid}">Close</button></div>`;return}
  box.innerHTML=`<div class="gs-head"><b>${list.length} suggestion${list.length===1?'':'s'}</b>${done?`<span class="muted">· ${done} handled</span>`:''}<span style="flex:1"></span><button class="btn sm" data-gsall="${qid}">${ico('check')}Accept all</button><button class="btn sm ghost" data-gsclose="${qid}">Dismiss</button></div>

/* replace the first occurrence of `from` in the editor's text, even across formatting, keeping undo */
function replaceInEditor(ed,from,to){
